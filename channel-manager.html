<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📡 مركز التوزيع</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg, #0a0a2a, #000);
    color: #fff;
    min-height: 100vh;
    padding: 10px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}
.container {
    max-width: 650px;
    width: 100%;
    background: rgba(10,10,30,0.95);
    border-radius: 16px;
    padding: 14px;
    border: 1px solid rgba(139,92,246,0.2);
    max-height: 98vh;
    overflow-y: auto;
}
h1 { color: #ffd700; font-size: 17px; text-align: center; }
.subtitle { text-align: center; color: #888; font-size: 10px; margin-bottom: 8px; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
.online { background: #4ade80; }
.offline { background: #f87171; }
.waiting { background: #fbbf24; }
.section {
    background: rgba(255,255,255,0.03);
    border-radius: 8px;
    padding: 8px;
    margin-bottom: 6px;
    border: 1px solid rgba(255,255,255,0.06);
}
.section-title { color: #a78bfa; font-size: 11px; font-weight: 700; margin-bottom: 4px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
.grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 4px; }
label { color: #888; font-size: 9px; display: block; margin-bottom: 1px; font-weight: 600; }
input, select {
    width: 100%;
    padding: 3px 6px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: #fff;
    font-size: 10px;
    font-family: inherit;
}
input:focus, select:focus { outline: none; border-color: rgba(139,92,246,0.3); }
input[type="file"] { padding: 2px; }
.btn {
    padding: 3px 8px;
    border-radius: 4px;
    border: none;
    font-weight: 700;
    font-size: 9px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.3s;
    text-align: center;
}
.btn-primary { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff; }
.btn-primary:hover { transform: translateY(-1px); }
.btn-success { background: linear-gradient(135deg, #4ade80, #22c55e); color: #111; }
.btn-success:hover { transform: translateY(-1px); }
.btn-warning { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #111; }
.btn-warning:hover { transform: translateY(-1px); }
.btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
.btn-danger:hover { transform: translateY(-1px); }
.btn-secondary { background: rgba(255,255,255,0.06); color: #aaa; }
.btn-secondary:hover { background: rgba(255,255,255,0.12); color: #fff; }
.actions { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 3px; }
.actions .btn { flex: 1; min-width: 40px; text-align: center; }
.status-box {
    background: rgba(0,0,0,0.3);
    border-radius: 4px;
    padding: 4px;
    font-size: 9px;
    color: #aaa;
    max-height: 80px;
    overflow-y: auto;
    font-family: monospace;
    line-height: 1.6;
}
.status-box .success { color: #4ade80; }
.status-box .error { color: #f87171; }
.status-box .info { color: #60a5fa; }
.status-box .gold { color: #ffd700; }
.status-box .warn { color: #fbbf24; }
.file-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 100px;
    overflow-y: auto;
}
.file-item {
    background: rgba(255,255,255,0.03);
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 9px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-left: 2px solid #8b5cf6;
}
.file-item .name { color: #fff; }
.file-item .type { color: #888; font-size: 8px; }
.file-item .coords { color: #fbbf24; font-size: 8px; }
.receiver-item {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 2px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 9px;
}
.receiver-item .coords { color: #888; font-size: 8px; margin-right: auto; }
.receiver-item .del-btn {
    background: rgba(239,68,68,0.15);
    color: #f87171;
    border: none;
    border-radius: 3px;
    padding: 1px 5px;
    cursor: pointer;
    font-size: 8px;
}
.world-select {
    background: rgba(139,92,246,0.06);
    border: 1px solid rgba(139,92,246,0.15);
    border-radius: 6px;
    padding: 6px;
}
.world-select select { font-size: 11px; padding: 4px; background: rgba(0,0,0,0.3); }
</style>
</head>
<body>
<div class="container">
    <h1>📡 مركز التوزيع</h1>
    <div class="subtitle">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">جاري التهيئة...</span>
        <span style="color:#666;margin:0 6px;">|</span>
        <span id="file-count">0 ملف</span>
        <span style="color:#666;margin:0 6px;">|</span>
        <span id="dist-count">0 منشور</span>
    </div>

    <div class="section">
        <div class="section-title">🌍 اختيار العالم</div>
        <div class="world-select">
            <select id="target-world"><option value="main">🏠 العالم الرئيسي</option></select>
        </div>
        <div class="actions">
            <button class="btn btn-secondary btn-sm" onclick="refreshWorlds()">🔄 تحديث</button>
            <button class="btn btn-primary btn-sm" onclick="goToWorld()">🚀 دخول</button>
        </div>
    </div>

    <div class="section">
        <div class="section-title">📥 استقبال</div>
        <div class="grid-4">
            <label><input type="checkbox" id="src-local" checked> 💻 محلي</label>
            <label><input type="checkbox" id="src-telegram" checked> 📡 تلجرام</label>
            <label><input type="checkbox" id="src-clipboard"> 📋 حافظة</label>
            <label><input type="checkbox" id="src-upload"> 📤 رفع</label>
        </div>
        <div class="actions">
            <button class="btn btn-primary" onclick="receiveAll()">📥 استقبال</button>
            <button class="btn btn-warning" onclick="syncTelegram()">🔄 مزامنة</button>
        </div>
    </div>

    <div class="section">
        <div class="section-title">📤 رفع ملف</div>
        <div class="grid-2">
            <div><label>📁 ملف</label><input type="file" id="file-upload" onchange="handleFile(event)"></div>
            <div><label>🏷️ الاسم</label><input type="text" id="file-name"></div>
        </div>
        <div class="grid-3">
            <div><label>📍 صف</label><input type="number" id="target-row" value="3" min="0" max="11"></div>
            <div><label>📍 عمود</label><input type="number" id="target-col" value="5" min="0" max="11"></div>
            <div><label>📂 نوع</label>
                <select id="file-type">
                    <option value="image">🖼️ صورة</option>
                    <option value="video">🎬 فيديو</option>
                    <option value="pdf">📄 PDF</option>
                    <option value="audio">🎵 صوت</option>
                    <option value="text">📝 نص</option>
                    <option value="html">🌐 HTML</option>
                    <option value="other">📦 أخرى</option>
                </select>
            </div>
        </div>
        <div class="actions">
            <button class="btn btn-success" onclick="publishFile()">📤 نشر</button>
            <button class="btn btn-secondary" onclick="clearFile()">🗑️ مسح</button>
        </div>
        <div id="file-preview" style="display:none;margin-top:3px;background:rgba(0,0,0,0.3);border-radius:4px;padding:4px;font-size:9px;color:#aaa;"></div>
    </div>

    <div class="section">
        <div class="section-title">📍 المعالم</div>
        <div id="receivers-list"></div>
        <div class="actions">
            <button class="btn btn-secondary btn-sm" onclick="addReceiver()">➕ إضافة</button>
            <button class="btn btn-danger btn-sm" onclick="clearReceivers()">🗑️ مسح</button>
        </div>
    </div>

    <div class="section">
        <div class="section-title">📤 التوزيع</div>
        <div class="actions">
            <button class="btn btn-primary" onclick="distributeToReceivers()">📤 معالم</button>
            <button class="btn btn-warning" onclick="distributeToWorlds()">🌍 عوالم</button>
            <button class="btn btn-success" onclick="distributeAll()">📤 الكل</button>
        </div>
        <div class="actions">
            <button class="btn btn-secondary btn-sm" onclick="saveToGame()">💾 حفظ</button>
            <button class="btn btn-secondary btn-sm" onclick="loadFromGame()">🔄 جلب</button>
            <button class="btn btn-danger btn-sm" onclick="resetAll()">🗑️ إعادة</button>
        </div>
    </div>

    <div class="section">
        <div class="section-title">📂 الملفات (<span id="file-count2">0</span>)</div>
        <div class="file-list" id="file-list"><div style="color:#666;text-align:center;padding:6px;font-size:9px;">لا توجد ملفات</div></div>
    </div>

    <div class="section">
        <div class="section-title">📍 المنشورات (<span id="pub-count2">0</span>)</div>
        <div class="file-list" id="published-list"><div style="color:#666;text-align:center;padding:6px;font-size:9px;">لا توجد منشورات</div></div>
    </div>

    <div class="section">
        <div class="section-title">📊 الحالة</div>
        <div class="status-box" id="status-box">⏳ جاري التحميل...</div>
    </div>
</div>

<script>
// ============================================================
//  مركز التوزيع - يعمل في أي مربع، بدون تغيير في الملف الرئيسي
// ============================================================

let parentGame = null;
let isConnected = false;
let fileCounter = 0;
let pendingFile = null;
let worldsList = [];
let hubData = {
    files: [],
    published: [],
    receivers: [
        { id: 'images', name: '📸 صور', type: 'image', row: 3, col: 5 },
        { id: 'videos', name: '🎬 فيديو', type: 'video', row: 3, col: 6 },
        { id: 'pdfs', name: '📄 PDF', type: 'pdf', row: 4, col: 5 },
        { id: 'audio', name: '🎵 صوت', type: 'audio', row: 4, col: 6 },
        { id: 'texts', name: '📝 نص', type: 'text', row: 5, col: 5 },
        { id: 'htmls', name: '🌐 HTML', type: 'html', row: 5, col: 6 }
    ],
    worldReceivers: [
        { id: 'world_fight', name: '⚔️ القتال' },
        { id: 'world_360', name: '🌐 360' },
        { id: 'world_gallery', name: '🖼️ المعرض' }
    ]
};

// ============================================================
//  الاتصال باللعبة الأم
// ============================================================

function connectToGame() {
    try {
        const parent = window.parent || window.opener;
        if (!parent) { setStatus('offline', '⚠️ لا يوجد اتصال'); return; }
        if (parent.getWorld && parent.buildWorld) {
            parentGame = parent;
            isConnected = true;
            setStatus('online', '✅ متصل');
            loadFromGame();
            refreshWorlds();
            return;
        }
        setStatus('offline', '⚠️ غير مدعوم');
    } catch(e) { setStatus('offline', '❌ فشل'); }
}

function setStatus(state, text) {
    document.getElementById('status-dot').className = 'status-dot ' + state;
    document.getElementById('status-text').textContent = text;
}

// ============================================================
//  العوالم
// ============================================================

function refreshWorlds() {
    if (!parentGame) return;
    try {
        const select = document.getElementById('target-world');
        const current = select.value;
        select.innerHTML = '';
        if (parentGame.worlds) {
            worldsList = parentGame.worlds;
        } else {
            const main = parentGame.getWorld('main');
            if (main) {
                worldsList = [main];
                if (main.items) {
                    for (const item of main.items) {
                        if (item.targetWorld) {
                            const w = parentGame.getWorld(item.targetWorld);
                            if (w && !worldsList.find(x => x.id === w.id)) worldsList.push(w);
                        }
                    }
                }
            }
        }
        for (const w of worldsList) {
            const opt = document.createElement('option');
            opt.value = w.id;
            opt.textContent = w.name || w.id;
            if (w.id === current) opt.selected = true;
            select.appendChild(opt);
        }
        if (!select.value && select.options.length > 0) select.selectedIndex = 0;
    } catch(e) {}
}

function goToWorld() {
    const id = document.getElementById('target-world').value;
    if (!parentGame) return;
    if (parentGame.enterWorldById) { parentGame.enterWorldById(id); addStatus('🚀 دخول: ' + id, 'success'); }
}

// ============================================================
//  التحميل والحفظ
// ============================================================

function loadFromGame() {
    if (!parentGame) return;
    try {
        const world = parentGame.getWorld('main');
        if (!world || !world.items) return;
        const hub = world.items.find(item => item.isHub === true || item.type === 'channel');
        if (hub) {
            hubData.files = hub.files || [];
            hubData.published = hub.published || [];
            hubData.receivers = hub.receivers || hubData.receivers;
            hubData.worldReceivers = hub.worldReceivers || hubData.worldReceivers;
            updateUI();
            addStatus('📡 تم التحميل', 'success');
        }
    } catch(e) {}
}

function saveToGame() {
    if (!parentGame) { addStatus('⚠️ لا يوجد اتصال', 'warn'); return; }
    try {
        const world = parentGame.getWorld('main');
        if (!world) return;
        let hub = world.items.find(item => item.isHub === true || item.type === 'channel');
        if (!hub) {
            hub = { id: 'hub_' + Date.now(), type: 'channel', isHub: true, title: '📡 مركز التوزيع', emoji: '📡', row: 0, col: 0, files: [], published: [], receivers: [], worldReceivers: [] };
            world.items.push(hub);
        }
        hub.files = hubData.files;
        hub.published = hubData.published;
        hub.receivers = hubData.receivers;
        hub.worldReceivers = hubData.worldReceivers;
        hub.lastUpdate = Date.now();
        hub.title = '📡 مركز التوزيع (' + hubData.files.length + ' ملف)';
        if (parentGame.buildWorld) parentGame.buildWorld('main');
        saveLocal();
        addStatus('🔄 تم الحفظ', 'success');
    } catch(e) { addStatus('❌ فشل الحفظ', 'error'); }
}

function saveLocal() { try { localStorage.setItem('hub_data', JSON.stringify(hubData)); } catch(e) {} }
function loadLocal() { try { const d = JSON.parse(localStorage.getItem('hub_data')); if (d) { hubData = d; updateUI(); } } catch(e) {} }

// ============================================================
//  استقبال
// ============================================================

async function receiveAll() {
    addStatus('📥 استقبال...', 'info');
    let allFiles = [];
    if (document.getElementById('src-local').checked) {
        try { const local = JSON.parse(localStorage.getItem('local_files') || '[]');
        local.forEach(f => { if (!f.type) f.type = detectType(f.name); });
        allFiles = allFiles.concat(local);
        if (local.length > 0) addStatus('💻 محلي: ' + local.length, 'success');
        } catch(e) {}
    }
    if (document.getElementById('src-telegram').checked && parentGame && parentGame.TelegramManager) {
        try { const tg = await parentGame.TelegramManager.syncChannelFiles();
        tg.forEach(f => { if (!f.type) f.type = detectType(f.filename || f.name); });
        allFiles = allFiles.concat(tg);
        if (tg.length > 0) addStatus('📡 تلجرام: ' + tg.length, 'success');
        } catch(e) { addStatus('⚠️ تلجرام: ' + e.message, 'warn'); }
    }
    if (document.getElementById('src-clipboard').checked) {
        try { const clip = JSON.parse(localStorage.getItem('clipboard_files') || '[]');
        clip.forEach(f => { if (!f.type) f.type = detectType(f.name); });
        allFiles = allFiles.concat(clip);
        if (clip.length > 0) addStatus('📋 حافظة: ' + clip.length, 'success');
        } catch(e) {}
    }
    if (document.getElementById('src-upload').checked && pendingFile) {
        allFiles.push({ id: 'upload_' + Date.now(), name: pendingFile.name, type: detectType(pendingFile.name), size: pendingFile.size, file: pendingFile });
        addStatus('📤 رفع: ' + pendingFile.name, 'success');
    }
    const unique = []; const seen = new Set();
    for (const f of allFiles) { const id = f.file_id || f.id || f.name; if (!seen.has(id)) { seen.add(id); unique.push(f); } }
    if (unique.length > 0) { hubData.files = unique; saveLocal(); saveToGame(); updateUI(); addStatus('✅ ' + unique.length + ' ملف', 'success'); }
    else { addStatus('ℹ️ لا توجد ملفات جديدة', 'info'); }
}

function detectType(name) {
    const ext = (name || '').split('.').pop().toLowerCase();
    const map = { 'jpg':'image','jpeg':'image','png':'image','gif':'image','webp':'image','svg':'image',
        'mp4':'video','webm':'video','mov':'video','avi':'video',
        'mp3':'audio','wav':'audio','ogg':'audio','pdf':'pdf','txt':'text','md':'text','html':'html','htm':'html','json':'json' };
    return map[ext] || 'other';
}

async function syncTelegram() {
    if (!parentGame || !parentGame.TelegramManager) { addStatus('⚠️ لا يوجد تلجرام', 'warn'); return; }
    addStatus('🔄 مزامنة...', 'info');
    try {
        const files = await parentGame.TelegramManager.syncChannelFiles();
        let added = 0;
        for (const f of files) {
            if (!f.type) f.type = detectType(f.filename || f.name);
            const exists = hubData.files.some(e => (e.file_id || e.id) === (f.file_id || f.id));
            if (!exists) { hubData.files.push(f); added++; }
        }
        if (added > 0) { saveLocal(); saveToGame(); updateUI(); }
        addStatus('📡 ' + added + ' ملف جديد', 'success');
    } catch(e) { addStatus('❌ فشل: ' + e.message, 'error'); }
}

// ============================================================
//  رفع ونشر
// ============================================================

function handleFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    pendingFile = file;
    document.getElementById('file-type').value = detectType(file.name);
    document.getElementById('file-name').value = file.name;
    document.getElementById('file-preview').style.display = 'block';
    document.getElementById('file-preview').innerHTML = '📁 ' + file.name + ' (' + (file.size/1024).toFixed(1) + ' KB)';
}

function clearFile() {
    document.getElementById('file-upload').value = '';
    document.getElementById('file-name').value = '';
    document.getElementById('file-preview').style.display = 'none';
    pendingFile = null;
}

function publishFile() {
    if (!pendingFile) { addStatus('⚠️ اختر ملفاً', 'warn'); return; }
    const name = document.getElementById('file-name').value.trim() || pendingFile.name;
    const row = parseInt(document.getElementById('target-row').value) || 3;
    const col = parseInt(document.getElementById('target-col').value) || 5;
    const type = document.getElementById('file-type').value;
    const reader = new FileReader();
    reader.onload = function(e) {
        const entry = { id: 'file_' + Date.now() + '_' + fileCounter++, name, type, size: pendingFile.size, content: e.target.result, originalName: pendingFile.name, uploadedAt: Date.now() };
        hubData.files.push(entry);
        hubData.published.push({ id: 'pub_' + Date.now(), fileId: entry.id, name, type, row, col, content: e.target.result, publishedAt: Date.now() });
        saveLocal(); saveToGame(); updateUI(); clearFile();
        addStatus('✅ نشر "' + name + '" في (' + row + ',' + col + ')', 'success');
    };
    reader.readAsDataURL(pendingFile);
}

// ============================================================
//  المعالم
// ============================================================

function renderReceivers() {
    const list = document.getElementById('receivers-list');
    list.innerHTML = '';
    hubData.receivers.forEach((r, i) => {
        const div = document.createElement('div');
        div.className = 'receiver-item';
        div.innerHTML = `<span>${r.name}</span><span style="color:#666;font-size:8px;">${r.type}</span><span class="coords">(${r.row},${r.col})</span><button class="del-btn" onclick="removeReceiver(${i})">✖</button>`;
        list.appendChild(div);
    });
}

function addReceiver() {
    const types = ['image','video','pdf','audio','text','html'];
    const emojis = ['📸','🎬','📄','🎵','📝','🌐'];
    const names = ['صور','فيديو','PDF','صوت','نص','HTML'];
    const idx = hubData.receivers.length % types.length;
    hubData.receivers.push({ id: 'rec_' + Date.now(), name: emojis[idx] + ' ' + names[idx], type: types[idx], row: 1 + Math.floor(Math.random()*9), col: 1 + Math.floor(Math.random()*9) });
    renderReceivers(); saveLocal(); saveToGame();
}
function removeReceiver(i) { hubData.receivers.splice(i,1); renderReceivers(); saveLocal(); saveToGame(); }
function clearReceivers() { if (!confirm('مسح الكل؟')) return; hubData.receivers = []; renderReceivers(); saveLocal(); saveToGame(); }

// ============================================================
//  التوزيع
// ============================================================

function distributeToReceivers() {
    if (hubData.files.length === 0) { addStatus('⚠️ لا توجد ملفات', 'warn'); return; }
    if (!parentGame) { addStatus('⚠️ لا يوجد اتصال', 'warn'); return; }
    const worldId = document.getElementById('target-world').value || 'main';
    const world = parentGame.getWorld(worldId);
    if (!world) { addStatus('⚠️ العالم غير موجود', 'warn'); return; }
    let total = 0;
    for (const receiver of hubData.receivers) {
        const filtered = hubData.files.filter(f => f.type === receiver.type);
        if (filtered.length === 0) continue;
        world.items = world.items.filter(item => !(item.row === receiver.row && item.col === receiver.col));
        world.items.push({
            id: 'tile_' + receiver.type + '_' + Date.now(),
            type: 'gallery',
            title: receiver.name + ' (' + filtered.length + ' ملف)',
            emoji: receiver.type === 'image' ? '📸' : receiver.type === 'video' ? '🎬' : receiver.type === 'pdf' ? '📄' : receiver.type === 'audio' ? '🎵' : receiver.type === 'html' ? '🌐' : '📝',
            row: receiver.row, col: receiver.col,
            files: filtered.map(f => ({ file_id: f.file_id || f.id, filename: f.filename || f.name || 'ملف', type: f.type })),
            source: 'hub', lastUpdate: Date.now()
        });
        total += filtered.length;
        addStatus('📦 ' + filtered.length + ' → ' + receiver.name, 'success');
    }
    if (parentGame.buildWorld) parentGame.buildWorld(worldId);
    addStatus('✅ تم توزيع ' + total + ' ملف', 'success');
}

function distributeToWorlds() {
    if (hubData.files.length === 0) { addStatus('⚠️ لا توجد ملفات', 'warn'); return; }
    if (!parentGame) { addStatus('⚠️ لا يوجد اتصال', 'warn'); return; }
    let total = 0;
    for (const receiver of hubData.worldReceivers) {
        const world = parentGame.getWorld(receiver.id);
        if (!world) continue;
        let count = 0;
        for (const file of hubData.files) {
            let found = false;
            for (let r = 0; r < 12 && !found; r++) {
                for (let c = 0; c < 12 && !found; c++) {
                    if (!world.items.find(item => item.row === r && item.col === c)) {
                        world.items.push({
                            id: 'dist_' + (file.file_id || file.id || 'file_' + Date.now() + '_' + count),
                            type: 'telegram_file',
                            title: file.filename || file.name || 'ملف',
                            emoji: file.type === 'image' ? '🖼️' : file.type === 'video' ? '🎬' : file.type === 'pdf' ? '📄' : file.type === 'audio' ? '🎵' : file.type === 'html' ? '🌐' : '📄',
                            row: r, col: c,
                            file_id: file.file_id || file.id,
                            filename: file.filename || file.name || 'ملف',
                            source: 'hub_distribution'
                        });
                        found = true; count++;
                    }
                }
            }
        }
        total += count;
        if (count > 0) addStatus('🌍 ' + count + ' → ' + receiver.name, 'success');
    }
    addStatus('✅ تم توزيع ' + total + ' ملف على العوالم', 'success');
}

function distributeAll() {
    distributeToReceivers();
    distributeToWorlds();
    addStatus('✅ تم التوزيع الكامل', 'success');
}

// ============================================================
//  الواجهة
// ============================================================

function updateUI() {
    document.getElementById('file-count').textContent = hubData.files.length + ' ملف';
    document.getElementById('dist-count').textContent = hubData.published.length + ' منشور';
    document.getElementById('file-count2').textContent = hubData.files.length;
    document.getElementById('pub-count2').textContent = hubData.published.length;
    const fl = document.getElementById('file-list');
    if (hubData.files.length === 0) { fl.innerHTML = '<div style="color:#666;text-align:center;padding:6px;font-size:9px;">لا توجد ملفات</div>'; }
    else {
        fl.innerHTML = '';
        hubData.files.forEach((f, i) => {
            const div = document.createElement('div');
            div.className = 'file-item';
            div.innerHTML = `<span class="name">${f.name || f.filename || 'ملف'}</span><span><span class="type">${f.type || 'file'}</span></span>`;
            fl.appendChild(div);
        });
    }
    const pl = document.getElementById('published-list');
    if (hubData.published.length === 0) { pl.innerHTML = '<div style="color:#666;text-align:center;padding:6px;font-size:9px;">لا توجد منشورات</div>'; }
    else {
        pl.innerHTML = '';
        hubData.published.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = 'file-item';
            div.innerHTML = `<span class="name">${p.name}</span><span><span class="coords">(${p.row},${p.col})</span><span class="type">${p.type}</span></span>`;
            pl.appendChild(div);
        });
    }
    renderReceivers();
}

function resetAll() {
    if (!confirm('🗑️ إعادة تعيين؟')) return;
    hubData.files = []; hubData.published = [];
    saveLocal(); saveToGame(); updateUI();
    addStatus('🗑️ تم إعادة التعيين', 'info');
}

function addStatus(msg, type) {
    const box = document.getElementById('status-box');
    const div = document.createElement('div');
    div.className = type || 'info';
    div.textContent = '• ' + msg;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    while (box.children.length > 30) box.removeChild(box.firstChild);
}

// ============================================================
//  التهيئة
// ============================================================

document.addEventListener('DOMContentLoaded', function() {
    loadLocal();
    renderReceivers();
    updateUI();
    setTimeout(connectToGame, 500);
    setInterval(() => { if (!isConnected) connectToGame(); }, 10000);
    addStatus('📡 مركز التوزيع جاهز', 'success');
});

console.log('📡 مركز التوزيع يعمل في المربع الذي وضعته فيه!');
</script>

<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📡 مركز التوزيع</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0a0a2a, #000);
    color: #fff;
    min-height: 100vh;
    padding: 10px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}
.container {
    max-width: 650px;
    width: 100%;
    background: rgba(10,10,30,0.95);
    border-radius: 16px;
    padding: 14px;
    border: 1px solid rgba(139,92,246,0.2);
    max-height: 98vh;
    overflow-y: auto;
}
h1 { color: #ffd700; font-size: 17px; text-align: center; }
.subtitle { text-align: center; color: #888; font-size: 10px; margin-bottom: 8px; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 4px; }
.online { background: #4ade80; }
.offline { background: #f87171; }
.waiting { background: #fbbf24; }
.section {
    background: rgba(255,255,255,0.03);
    border-radius: 8px;
    padding: 8px;
    margin-bottom: 6px;
    border: 1px solid rgba(255,255,255,0.06);
}
.section-title { color: #a78bfa; font-size: 11px; font-weight: 700; margin-bottom: 4px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
label { color: #888; font-size: 9px; display: block; margin-bottom: 1px; font-weight: 600; }
input, select {
    width: 100%;
    padding: 3px 6px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: #fff;
    font-size: 10px;
    font-family: inherit;
}
input:focus, select:focus { outline: none; border-color: rgba(139,92,246,0.3); }
input[type="file"] { padding: 2px; }
.btn {
    padding: 3px 8px;
    border-radius: 4px;
    border: none;
    font-weight: 700;
    font-size: 9px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.3s;
    text-align: center;
}
.btn-primary { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff; }
.btn-primary:hover { transform: translateY(-1px); }
.btn-success { background: linear-gradient(135deg, #4ade80, #22c55e); color: #111; }
.btn-success:hover { transform: translateY(-1px); }
.btn-warning { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #111; }
.btn-warning:hover { transform: translateY(-1px); }
.btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
.btn-danger:hover { transform: translateY(-1px); }
.btn-secondary { background: rgba(255,255,255,0.06); color: #aaa; }
.btn-secondary:hover { background: rgba(255,255,255,0.12); color: #fff; }
.actions { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 3px; }
.actions .btn { flex: 1; min-width: 40px; text-align: center; }
.status-box {
    background: rgba(0,0,0,0.3);
    border-radius: 4px;
    padding: 4px;
    font-size: 9px;
    color: #aaa;
    max-height: 120px;
    overflow-y: auto;
    font-family: monospace;
    line-height: 1.6;
}
.status-box .success { color: #4ade80; }
.status-box .error { color: #f87171; }
.status-box .info { color: #60a5fa; }
.status-box .gold { color: #ffd700; }
.status-box .warn { color: #fbbf24; }
.file-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 100px;
    overflow-y: auto;
}
.file-item {
    background: rgba(255,255,255,0.03);
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 9px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-right: 2px solid #8b5cf6;
}
.file-item .name { color: #fff; }
.file-item .type { color: #888; font-size: 8px; }
.file-item .coords { color: #fbbf24; font-size: 8px; }
#file-preview {
    display: none;
    margin-top: 3px;
    background: rgba(0,0,0,0.3);
    border-radius: 4px;
    padding: 4px;
    font-size: 9px;
    color: #aaa;
}
</style>
</head>
<body>
<div class="container">
    <h1>📡 مركز التوزيع</h1>
    <div class="subtitle">
        <span class="status-dot offline" id="status-dot"></span>
        <span id="status-text">في انتظار اللعبة...</span>
        <span style="color:#666;margin:0 6px;">|</span>
        <span id="worlds-count">0 عالم</span>
    </div>

    <!-- 🌍 اختيار العالم -->
    <div class="section">
        <div class="section-title">🌍 اختيار العالم</div>
        <select id="target-world" style="font-size:11px;padding:4px;">
            <option value="">⏳ جاري جلب العوالم...</option>
        </select>
        <div style="font-size:8px;color:#888;margin-top:2px;">ℹ️ اختر العالم الهدف ثم حدد المربع</div>
        <div class="actions">
            <button class="btn btn-secondary" onclick="refreshWorlds()">🔄 تحديث</button>
            <button class="btn btn-primary" onclick="openGame()">🚀 فتح اللعبة</button>
        </div>
        <div id="worlds-status" style="color:#888;font-size:8px;margin-top:2px;">⚠️ افتح اللعبة أولاً</div>
    </div>

    <!-- 📤 إضافة ملف -->
    <div class="section">
        <div class="section-title">📤 إضافة ملف إلى مربع</div>
        <div class="grid-2">
            <div><label>📁 اختر ملف (اختياري)</label><input type="file" id="file-upload" onchange="handleFile(event)"></div>
            <div><label>🏷️ عنوان المربع</label><input type="text" id="file-name" placeholder="مثال: فيديو تعليمي"></div>
        </div>
        <div class="grid-3">
            <div><label>📍 الصف (0-11)</label><input type="number" id="target-row" value="3" min="0" max="11"></div>
            <div><label>📍 العمود (0-11)</label><input type="number" id="target-col" value="5" min="0" max="11"></div>
            <div><label>📂 نوع المحتوى</label>
                <select id="file-type">
                    <option value="image">🖼️ صورة</option>
                    <option value="video">🎬 فيديو</option>
                    <option value="pdf">📄 PDF</option>
                    <option value="audio">🎵 صوت</option>
                    <option value="text">📝 نص</option>
                    <option value="html">🌐 HTML/موقع</option>
                    <option value="other">📦 أخرى</option>
                </select>
            </div>
        </div>
        <div id="file-preview"></div>
        <div class="actions">
            <button class="btn btn-success" onclick="publishFile()">📤 نشر في المربع</button>
            <button class="btn btn-secondary" onclick="clearForm()">🗑️ مسح</button>
        </div>
    </div>

    <!-- 📊 الحالة -->
    <div class="section">
        <div class="section-title">📊 الحالة</div>
        <div class="status-box" id="status-box">⏳ جاري التحميل...</div>
    </div>
</div>

<script>
// ============================================================
//  مركز التوزيع - جسر localStorage مع اللعبة
// ============================================================

let worldsList = [];
let pendingFileData = null;

const EMOJIS = {
    image: '🖼️', video: '🎬', pdf: '📄', audio: '🎵',
    text: '📝', html: '🌐', other: '📦'
};

// ─── جلب العوالم من اللعبة ───
function refreshWorlds() {
    try {
        const data = JSON.parse(localStorage.getItem('spherical_bridge_worlds') || '{}');
        if (data.worlds && data.worlds.length > 0) {
            worldsList = data.worlds;
            updateWorldSelect();
            const timeStr = data.time ? new Date(data.time).toLocaleTimeString() : 'الآن';
            document.getElementById('worlds-status').textContent = 
                '✅ متصل | ' + worldsList.length + ' عالم | آخر تحديث: ' + timeStr;
            document.getElementById('status-dot').className = 'status-dot online';
            document.getElementById('status-text').textContent = '✅ متصل باللعبة';
            addStatus('✅ تم جلب ' + worldsList.length + ' عالم', 'success');
        } else {
            document.getElementById('worlds-status').textContent = 
                '⚠️ لا توجد بيانات. تأكد من فتح اللعبة (index.html) في نافذة أخرى';
            document.getElementById('status-dot').className = 'status-dot offline';
            document.getElementById('status-text').textContent = '❌ غير متصل';
        }
    } catch(e) {
        document.getElementById('worlds-status').textContent = '❌ خطأ: ' + e.message;
        addStatus('❌ خطأ في القراءة: ' + e.message, 'error');
    }
}

function updateWorldSelect() {
    const select = document.getElementById('target-world');
    select.innerHTML = '';
    worldsList.forEach(function(w) {
        const opt = document.createElement('option');
        opt.value = w.id;
        opt.textContent = (w.name || w.id) + ' (' + (w.grid || 12) + '×' + (w.grid || 12) + ')';
        select.appendChild(opt);
    });
    if (select.options.length === 0) {
        select.innerHTML = '<option value="">⏳ لا توجد عوالم</option>';
    }
    document.getElementById('worlds-count').textContent = worldsList.length + ' عالم';
}

// ─── إرسال ملف إلى اللعبة ───
function publishFile() {
    const worldId = document.getElementById('target-world').value;
    const row = parseInt(document.getElementById('target-row').value);
    const col = parseInt(document.getElementById('target-col').value);
    const title = document.getElementById('file-name').value.trim();
    const type = document.getElementById('file-type').value;

    if (!worldId) {
        addStatus('❌ اختر عالماً أولاً (اضغط تحديث)', 'error');
        return;
    }
    if (isNaN(row) || isNaN(col) || row < 0 || col < 0) {
        addStatus('❌ إحداثيات غير صالحة', 'error');
        return;
    }
    if (!title) {
        addStatus('❌ أدخل عنواناً للمربع', 'error');
        return;
    }

    // إذا كان هناك ملف مرفوع
    const fileInput = document.getElementById('file-upload');
    if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            sendCommand({
                action: 'add_file',
                worldId: worldId,
                row: row,
                col: col,
                title: title,
                fileType: type,
                emoji: EMOJIS[type] || '📦',
                content: e.target.result
            });
        };
        reader.onerror = function() {
            addStatus('❌ فشل قراءة الملف', 'error');
        };
        reader.readAsDataURL(fileInput.files[0]);
    } else {
        // بدون ملف (أيقونة فقط)
        sendCommand({
            action: 'add_file',
            worldId: worldId,
            row: row,
            col: col,
            title: title,
            fileType: type,
            emoji: EMOJIS[type] || '📦',
            content: null
        });
    }
}

function sendCommand(cmd) {
    localStorage.setItem('spherical_hub_command', JSON.stringify(cmd));
    addStatus('📤 أُرسل: ' + cmd.title + ' ➜ ' + cmd.worldId + ' [' + cmd.row + ',' + cmd.col + ']', 'info');

    // انتظر التأكيد من اللعبة
    setTimeout(function() {
        try {
            const conf = JSON.parse(localStorage.getItem('spherical_hub_confirm') || '{}');
            if (conf.status === 'done' && conf.title === cmd.title) {
                addStatus('✅ اللعبة استلمت: ' + conf.title, 'success');
            } else {
                addStatus('⏳ في انتظار اللعبة... (تأكد من فتحها)', 'warn');
            }
        } catch(e) {}
    }, 800);
}

// ─── استقبال أوامر من اللعبة (تأكيدات) ───
window.addEventListener('storage', function(e) {
    if (e.key === 'spherical_hub_confirm') {
        try {
            const conf = JSON.parse(e.newValue || '{}');
            if (conf.status === 'done') {
                addStatus('✅ تأكيد اللعبة: ' + conf.title, 'success');
            }
        } catch(err) {}
    }
});

// ─── دوال مساعدة ───
function handleFile(e) {
    const f = e.target.files[0];
    if (!f) return;
    pendingFileData = f;
    document.getElementById('file-name').value = f.name;
    const preview = document.getElementById('file-preview');
    preview.style.display = 'block';
    preview.textContent = '📁 ' + f.name + ' (' + (f.size / 1024).toFixed(1) + ' KB)';

    // تخمين النوع تلقائياً
    const ext = f.name.split('.').pop().toLowerCase();
    const map = {jpg:'image',jpeg:'image',png:'image',gif:'image',webp:'image',mp4:'video',webm:'video',mov:'video',mp3:'audio',wav:'audio',ogg:'audio',pdf:'pdf',txt:'text',html:'html',htm:'html'};
    if (map[ext]) document.getElementById('file-type').value = map[ext];
}

function clearForm() {
    document.getElementById('file-upload').value = '';
    document.getElementById('file-name').value = '';
    document.getElementById('target-row').value = '3';
    document.getElementById('target-col').value = '5';
    document.getElementById('file-type').value = 'image';
    document.getElementById('file-preview').style.display = 'none';
    pendingFileData = null;
}

function openGame() {
    window.open('index.html', 'game', 'width=1200,height=900');
    addStatus('🚀 تم فتح اللعبة في نافذة جديدة', 'info');
}

function addStatus(msg, type) {
    const box = document.getElementById('status-box');
    const d = document.createElement('div');
    d.className = type || 'info';
    d.textContent = '• ' + msg;
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
    while (box.children.length > 50) box.removeChild(box.firstChild);
}

// ─── التهيئة ───
document.addEventListener('DOMContentLoaded', function() {
    addStatus('📡 مركز التوزيع جاهز', 'info');
    addStatus('⏳ اضغط "🔄 تحديث" بعد فتح اللعبة', 'info');
    refreshWorlds();
    // تحديث تلقائي كل 3 ثواني
    setInterval(refreshWorlds, 3000);
});
</script>
</body>
</html>

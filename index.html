<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏆  Style - العالم النهائي</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Cairo',sans-serif; background:#050510; color:#fff; overflow:hidden; }

#start-screen {
  position:fixed; inset:0; z-index:2000;
  background:linear-gradient(135deg,#0a0a2a,#000);
  display:flex; flex-direction:column; justify-content:center; align-items:center; gap:20px;
}
.start-logo { font-size:42px; font-weight:900; color:#ffd700; animation:float 3s ease-in-out infinite; }
.start-subtitle { font-size:15px; color:#666; text-align:center; max-width:380px; line-height:1.6; }
.start-btn {
  border:2px solid #00f2ff; color:#00f2ff; padding:16px 50px;
  background:rgba(0,242,255,0.08); border-radius:60px; font-size:20px;
  cursor:pointer; transition:all .3s; font-weight:700; font-family:inherit;
}
.start-btn:hover { transform:scale(1.05); background:#00f2ff; color:#000; box-shadow:0 0 50px rgba(0,242,255,0.4); }
.user-info { color:#00f2ff; font-size:13px; background:rgba(0,0,0,0.6); padding:8px 24px; border-radius:30px; }
.version-tag { position:absolute; bottom:15px; font-size:11px; color:#444; }
@keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }

#game-container { position:fixed; inset:0; display:none; background:#0a0a1a; }
#game-canvas { display:block; width:100%; height:100%; }

.hud {
  position:fixed; top:0; left:0; right:0; padding:6px 12px;
  display:flex; justify-content:space-between; align-items:center;
  pointer-events:none; z-index:100;
  background:rgba(0,0,0,0.6); backdrop-filter:blur(8px);
}
.hud .title { color:#ffd700; font-size:13px; font-weight:700; }
.hud .info { color:#aaa; font-size:11px; }

.dpad {
  position:fixed; bottom:20px; left:16px;
  width:120px; height:120px; z-index:200;
}
.dpad-btn {
  position:absolute; width:40px; height:40px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; color:rgba(255,255,255,0.4);
  cursor:pointer; transition:all .1s;
}
.dpad-btn:active { background:rgba(139,92,246,0.2); border-color:#8b5cf6; color:#8b5cf6; transform:scale(0.88); }
.dpad-up { top:0; left:40px; }
.dpad-down { bottom:0; left:40px; }
.dpad-left { top:40px; left:0; }
.dpad-right { top:40px; right:0; }

.tg-toggle {
  position:fixed; bottom:155px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.6); border:1px solid rgba(255,215,0,0.1);
  border-radius:20px; padding:3px 14px;
  z-index:210; font-size:11px; color:#888; cursor:pointer; display:none;
}
.tg-toggle:hover { color:#ffd700; }

.tg-dropdown {
  position:fixed; bottom:170px; left:50%; transform:translateX(-50%);
  background:rgba(10,10,30,0.95); border:1px solid rgba(255,215,0,0.15);
  border-radius:14px; padding:10px 14px; z-index:250;
  min-width:320px; max-width:92%; display:none; backdrop-filter:blur(12px);
  max-height:350px; overflow-y:auto;
}
.tg-dropdown.show { display:block; }
.tg-dropdown .row { display:flex; gap:5px; margin-bottom:6px; flex-wrap:wrap; }
.tg-dropdown input[type="text"] {
  flex:1; padding:6px 10px; border-radius:8px;
  border:1px solid rgba(255,215,0,0.15); background:#0a0a1a;
  color:#fff; font-size:11px; font-family:inherit; min-width:50px;
}
.tg-dropdown input[type="text"]::placeholder { color:#555; }
.tg-dropdown .btn {
  padding:6px 12px; border:none; border-radius:8px;
  font-weight:700; font-size:11px; cursor:pointer; font-family:inherit;
  transition:all .2s;
}
.tg-dropdown .btn:hover { transform:scale(1.05); }
.btn-accent { background:#00f2ff; color:#111; }
.btn-purple { background:#8b5cf6; color:#fff; }
.btn-gold { background:#ffd700; color:#111; }
.btn-green { background:#4ade80; color:#111; }
.btn-red { background:#f87171; color:#fff; }
.btn-pink { background:#ec4899; color:#fff; }
.btn-blue { background:#3b82f6; color:#fff; }
.btn-orange { background:#fb923c; color:#111; }
#tg-status { font-size:10px; color:#888; margin-top:4px; text-align:center; }

#minimap-frame {
  position:fixed; top:50px; left:10px;
  width:140px; height:140px;
  border:2px solid #ffd700; border-radius:12px;
  overflow:hidden; pointer-events:none; z-index:90;
  background:rgba(5,5,16,0.6);
  display:none;
}
#minimap-label {
  position:fixed; top:52px; left:12px; z-index:91;
  font-size:8px; color:#ffd700; background:rgba(0,0,0,0.6);
  padding:1px 6px; border-radius:4px; pointer-events:none; display:none;
}

.toast-container {
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
  z-index:700; display:flex; flex-direction:column; gap:5px; pointer-events:none;
  align-items:center;
}
.toast {
  background:rgba(0,0,0,0.9); padding:6px 16px; border-radius:30px;
  font-size:11px; border:1px solid rgba(255,255,255,0.06);
  animation:toastIn .3s,toastOut .3s 2.7s forwards;
}
.toast.success { border-color:#4ade80; color:#4ade80; }
.toast.error { border-color:#f87171; color:#f87171; }
.toast.info { border-color:#60a5fa; color:#60a5fa; }
.toast.warn { border-color:#fb923c; color:#fb923c; }
@keyframes toastIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
@keyframes toastOut { from { opacity:1; transform:translateY(0); } to { opacity:0; transform:translateY(-20px); } }

#video-input, #sticker-input { display:none; }
#status-bar {
  position:fixed; bottom:140px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.7); padding:4px 16px;
  border-radius:12px; font-size:10px; color:#4ade80;
  z-index:95; border:1px solid rgba(74,222,128,0.2);
  display:none; text-align:center;
}
#tile-info {
  position:fixed; top:36px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.7); padding:3px 14px;
  border-radius:12px; font-size:10px; color:#ffd700;
  z-index:95; border:1px solid rgba(255,215,0,0.2);
  display:none;
}
</style>
</head>
<body>

<!-- شاشة البداية -->
<div id="start-screen">
  <div class="start-logo">🏆 PUBG Style</div>
  <div class="start-subtitle">أرضية فيديو · معالم ملصقات · شخصية متحركة</div>
  <div class="user-info" id="userInfoDisplay">🔄 جاري التحميل...</div>
  <button class="start-btn" id="start-btn" onclick="enterApp()" style="display:none;">🚀 دخول</button>
  <div class="version-tag">v57.0 | النهائي</div>
</div>

<!-- اللعبة -->
<div id="game-container">
  <canvas id="game-canvas"></canvas>

  <div id="minimap-frame"></div>
  <div id="minimap-label">🗺️</div>

  <div id="tile-info">🧩 المربع: -</div>
  <div id="status-bar">🌍 جاري التحميل...</div>

  <div class="hud">
    <div class="title">🏆 PUBG Style</div>
    <div class="info" id="char-name">جاري التحميل...</div>
  </div>

  <div id="controls" style="position:fixed;bottom:160px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:210;flex-wrap:wrap;justify-content:center;">
    <button onclick="generateMap()">🗺️ خريطة</button>
    <button onclick="toggleGrid()">📐 شبكة</button>
    <button onclick="resetCamera()">🔄 إعادة</button>
    <button onclick="document.getElementById('video-input').click()">📁 فيديو</button>
    <button onclick="document.getElementById('sticker-input').click()">📌 ملصق</button>
  </div>

  <button class="tg-toggle" id="tg-toggle" onclick="toggleTG()">📡 القناة</button>

  <div class="tg-dropdown" id="tg-dropdown">
    <div class="row">
      <input type="text" id="bot-token" placeholder="Bot Token">
      <input type="text" id="chat-id" placeholder="Channel ID">
    </div>
    <div class="row">
      <button class="btn btn-accent" onclick="testTelegram()">🔗 اتصال</button>
      <button class="btn btn-purple" onclick="addChannel()">➕ إضافة قناة</button>
      <button class="btn btn-gold" onclick="fetchVideoFromTelegram()">🎬 جلب فيديو</button>
      <button class="btn btn-pink" onclick="fetchStickerFromTelegram()">📌 جلب ملصق</button>
      <button class="btn btn-red" onclick="toggleTG()">✖</button>
    </div>
    <div id="tg-status">⭕ غير متصل</div>
  </div>

  <input type="file" id="video-input" accept="video/*,.webm,.mp4,.mov" onchange="handleVideo(event)">
  <input type="file" id="sticker-input" accept="image/*,.webp,.png,.jpg,.gif" onchange="handleSticker(event)">

  <div class="dpad" id="dpad">
    <div class="dpad-btn dpad-up" data-dir="up">▲</div>
    <div class="dpad-btn dpad-down" data-dir="down">▼</div>
    <div class="dpad-btn dpad-left" data-dir="left">◀</div>
    <div class="dpad-btn dpad-right" data-dir="right">▶</div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
// ============================================================
//  🏆 الملف النهائي - كل نقاط التفوق
// ============================================================

// ============================================================
//  1. التهيئة + Telegram
// ============================================================

const tg = window.Telegram?.WebApp;
let userData = null;
let botToken = '', connected = false, lastUpdateId = 0;
let channels = [];
let loadedVideos = {};
let loadedStickers = {};

function initTelegram() {
  try {
    if (tg) { tg.ready(); tg.expand(); }
    userData = tg?.initDataUnsafe?.user || { id: Math.floor(Math.random()*100000), first_name: 'مستخدم' };
    document.getElementById('userInfoDisplay').innerHTML = '👤 ' + (userData.first_name || 'مستخدم');
  } catch(e) {
    userData = { id: Math.floor(Math.random()*100000), first_name: 'مستخدم' };
    document.getElementById('userInfoDisplay').innerHTML = '👤 مستخدم';
  }
  loadChannels();
}

function loadChannels() {
  try {
    const saved = localStorage.getItem('channels_v57');
    if (saved) { channels = JSON.parse(saved); }
  } catch(e) {}
}

function saveChannels() {
  try { localStorage.setItem('channels_v57', JSON.stringify(channels)); } catch(e) {}
}

function addChannel() {
  const id = document.getElementById('chat-id').value.trim();
  if (!id) { showToast('⚠️ ادخل معرف القناة', 'error'); return; }
  if (channels.some(c => c.id === id)) { showToast('⚠️ القناة مضافة', 'error'); return; }
  channels.push({ id: id, name: 'قناة #' + (channels.length + 1) });
  saveChannels();
  document.getElementById('chat-id').value = '';
  showToast('✅ تم إضافة القناة', 'success');
}

async function testTelegram() {
  botToken = document.getElementById('bot-token').value.trim();
  if (!botToken) { setTGStatus('❌ ادخل Token', 'error'); return; }
  setTGStatus('🔄 جاري...', '');
  try {
    const res = await fetch('https://api.telegram.org/bot' + botToken + '/getMe');
    const data = await res.json();
    if (data.ok) {
      connected = true;
      setTGStatus('✅ متصل بـ @' + data.result.username, 'success');
      localStorage.setItem('bot_token', botToken);
      showToast('✅ تم الاتصال!', 'success');
    } else {
      setTGStatus('❌ ' + data.description, 'error');
    }
  } catch(e) {
    setTGStatus('❌ فشل الاتصال (CORS)', 'error');
  }
}

function setTGStatus(msg, type) {
  const el = document.getElementById('tg-status');
  el.textContent = msg;
  el.style.color = type === 'success' ? '#4ade80' : type === 'error' ? '#f87171' : '#888';
}

function toggleTG() {
  document.getElementById('tg-dropdown').classList.toggle('show');
}

// ============================================================
//  2. جلب فيديو من Telegram
// ============================================================

async function fetchVideoFromTelegram() {
  if (!connected) { showToast('⚠️ اتصل أولاً', 'error'); return; }
  if (channels.length === 0) { showToast('⚠️ أضف قناة', 'error'); return; }

  setTGStatus('🔍 جاري البحث عن فيديو...', '');
  showToast('📥 جاري جلب الفيديو...', 'info');

  try {
    const res = await fetch('https://api.telegram.org/bot' + botToken + '/getUpdates?limit=50&offset=' + (lastUpdateId + 1));
    const data = await res.json();
    if (!data.ok) { setTGStatus('❌ ' + data.description, 'error'); return; }

    for (const update of (data.result || [])) {
      lastUpdateId = Math.max(lastUpdateId, update.update_id);
      const msg = update.channel_post || update.message;
      if (!msg) continue;

      const msgChannelId = msg.chat.id.toString();
      if (!channels.some(c => c.id === msgChannelId)) continue;

      let fileId = null, name = 'فيديو';

      if (msg.sticker && msg.sticker.is_video) {
        fileId = msg.sticker.file_id;
        const caption = msg.caption || '';
        const nameMatch = caption.match(/(?:اسم|name|Name)[\s:]*([^\n]+)/i);
        name = nameMatch ? nameMatch[1].trim() : 'ملصق WebM';
      }

      if (!fileId && msg.video) {
        fileId = msg.video.file_id;
        const caption = msg.caption || '';
        const nameMatch = caption.match(/(?:اسم|name|Name)[\s:]*([^\n]+)/i);
        name = nameMatch ? nameMatch[1].trim() : 'فيديو';
      }

      if (!fileId) continue;

      const fileRes = await fetch('https://api.telegram.org/bot' + botToken + '/getFile?file_id=' + fileId);
      const fileData = await fileRes.json();

      if (fileData.ok && fileData.result.file_path) {
        const url = 'https://api.telegram.org/file/bot' + botToken + '/' + fileData.result.file_path;
        try {
          const videoRes = await fetch(url);
          const blob = await videoRes.blob();
          const blobUrl = URL.createObjectURL(blob);
          loadedVideos[name] = blobUrl;
          showToast('✅ فيديو جاهز: ' + name, 'success');
          setTGStatus('✅ تم جلب: ' + name, 'success');
          rebuildMapWithContent();
          return;
        } catch (e) {
          setTGStatus('⚠️ فشل التحميل', 'warn');
          showToast('⚠️ فشل تحميل الفيديو', 'warn');
        }
      }
    }
    setTGStatus('📭 لا يوجد فيديو', '');
  } catch (e) {
    setTGStatus('❌ خطأ', 'error');
  }
}

// ============================================================
//  3. جلب ملصق من Telegram
// ============================================================

async function fetchStickerFromTelegram() {
  if (!connected) { showToast('⚠️ اتصل أولاً', 'error'); return; }
  if (channels.length === 0) { showToast('⚠️ أضف قناة', 'error'); return; }

  setTGStatus('🔍 جاري البحث عن ملصق...', '');
  showToast('📥 جاري جلب الملصق...', 'info');

  try {
    const res = await fetch('https://api.telegram.org/bot' + botToken + '/getUpdates?limit=50&offset=' + (lastUpdateId + 1));
    const data = await res.json();
    if (!data.ok) { setTGStatus('❌ ' + data.description, 'error'); return; }

    for (const update of (data.result || [])) {
      lastUpdateId = Math.max(lastUpdateId, update.update_id);
      const msg = update.channel_post || update.message;
      if (!msg) continue;

      const msgChannelId = msg.chat.id.toString();
      if (!channels.some(c => c.id === msgChannelId)) continue;

      let fileId = null, name = 'ملصق';

      // ملصق عادي (صورة)
      if (msg.sticker && !msg.sticker.is_animated && !msg.sticker.is_video) {
        fileId = msg.sticker.file_id;
        const caption = msg.caption || '';
        const nameMatch = caption.match(/(?:اسم|name|Name)[\s:]*([^\n]+)/i);
        name = nameMatch ? nameMatch[1].trim() : 'ملصق';
      }

      if (!fileId && msg.photo) {
        fileId = msg.photo[msg.photo.length - 1].file_id;
        const caption = msg.caption || '';
        const nameMatch = caption.match(/(?:اسم|name|Name)[\s:]*([^\n]+)/i);
        name = nameMatch ? nameMatch[1].trim() : 'صورة';
      }

      if (!fileId) continue;

      const fileRes = await fetch('https://api.telegram.org/bot' + botToken + '/getFile?file_id=' + fileId);
      const fileData = await fileRes.json();

      if (fileData.ok && fileData.result.file_path) {
        const url = 'https://api.telegram.org/file/bot' + botToken + '/' + fileData.result.file_path;
        try {
          const imgRes = await fetch(url);
          const blob = await imgRes.blob();
          const blobUrl = URL.createObjectURL(blob);
          loadedStickers[name] = blobUrl;
          showToast('✅ ملصق جاهز: ' + name, 'success');
          setTGStatus('✅ تم جلب: ' + name, 'success');
          rebuildMapWithContent();
          return;
        } catch (e) {
          setTGStatus('⚠️ فشل التحميل', 'warn');
        }
      }
    }
    setTGStatus('📭 لا يوجد ملصق', '');
  } catch (e) {
    setTGStatus('❌ خطأ', 'error');
  }
}

// ============================================================
//  4. رفع فيديو وملصق محلي
// ============================================================

function handleVideo(event) {
  const file = event.target.files[0];
  if (!file || !file.type.startsWith('video/')) {
    showToast('❌ ملف غير صالح', 'error');
    return;
  }
  const url = URL.createObjectURL(file);
  const name = file.name.replace(/\.[^/.]+$/, '') || 'فيديو محلي';
  loadedVideos[name] = url;
  showToast('📁 تم رفع فيديو: ' + name, 'success');
  rebuildMapWithContent();
  event.target.value = '';
}

function handleSticker(event) {
  const file = event.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const name = file.name.replace(/\.[^/.]+$/, '') || 'ملصق محلي';
  loadedStickers[name] = url;
  showToast('📌 تم رفع ملصق: ' + name, 'success');
  rebuildMapWithContent();
  event.target.value = '';
}

// ============================================================
//  5. إعادة بناء الخريطة بالمحتوى
// ============================================================

function rebuildMapWithContent() {
  if (Object.keys(loadedVideos).length > 0 || Object.keys(loadedStickers).length > 0) {
    generateMap();
    showToast('🗺️ تم تحديث الخريطة بالمحتوى الجديد', 'success');
  }
}

// ============================================================
//  6. Three.js - المحرك الأساسي
// ============================================================

let scene, camera, renderer;
let playerGroup, tileGroup;
let tileMeshes = [];
let gridHelper = null;
let gridVisible = true;
let isReady = false;

const GRID = 12;
const TILE_SIZE = 3;
const WORLD_SIZE = GRID * TILE_SIZE;
const HALF = WORLD_SIZE / 2;
const PLAYER_SPEED = 0.12;
let touchDirs = { up: false, down: false, left: false, right: false };
let minimapCtx;

function initThree() {
  const canvas = document.getElementById('game-canvas');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a1a);
  scene.fog = new THREE.Fog(0x0a0a1a, 20, 50);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 6, 10);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  // إضاءة
  const ambient = new THREE.AmbientLight(0x8b5cf6, 0.4);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xffeedd, 1.0);
  dirLight.position.set(10, 20, 10);
  dirLight.castShadow = true;
  scene.add(dirLight);

  const fillLight = new THREE.DirectionalLight(0x4466ff, 0.3);
  fillLight.position.set(-10, 10, -10);
  scene.add(fillLight);

  // شخصية PUBG
  playerGroup = new THREE.Group();
  scene.add(playerGroup);

  // جسم
  const bodyGeo = new THREE.CylinderGeometry(0.35, 0.4, 0.8, 8);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0x8b5cf6, emissive: 0x6d28d9, emissiveIntensity: 0.2,
    roughness: 0.4, metalness: 0.3
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.4;
  body.castShadow = true;
  playerGroup.add(body);

  // رأس
  const headGeo = new THREE.SphereGeometry(0.2, 8, 8);
  const headMat = new THREE.MeshStandardMaterial({
    color: 0x8b5cf6, roughness: 0.3, metalness: 0.2
  });
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.y = 0.9;
  head.castShadow = true;
  playerGroup.add(head);

  // ظل
  const shadowGeo = new THREE.PlaneGeometry(0.8, 0.8);
  const shadowMat = new THREE.MeshBasicMaterial({
    color: 0x000000, transparent: true, opacity: 0.2
  });
  const shadow = new THREE.Mesh(shadowGeo, shadowMat);
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.02;
  playerGroup.add(shadow);

  // تاج
  const crownGeo = new THREE.ConeGeometry(0.15, 0.2, 6);
  const crownMat = new THREE.MeshStandardMaterial({
    color: 0xffd700, emissive: 0xffa500, emissiveIntensity: 0.2, metalness: 0.9
  });
  const crown = new THREE.Mesh(crownGeo, crownMat);
  crown.position.y = 1.1;
  playerGroup.add(crown);

  playerGroup.position.set(0, 0, 0);

  tileGroup = new THREE.Group();
  scene.add(tileGroup);

  setupMinimap();
  animate();
}

// ============================================================
//  7. توليد الخريطة
// ============================================================

function generateMap() {
  tileMeshes.forEach(mesh => {
    if (mesh.parent) mesh.parent.remove(mesh);
    if (mesh.material) {
      if (mesh.material.map) mesh.material.map.dispose();
      mesh.material.dispose();
    }
    if (mesh.geometry) mesh.geometry.dispose();
  });
  tileMeshes = [];

  // استخدام فيديوهات محملة أو إنشاء فيديو تجريبي
  const videoSources = Object.values(loadedVideos);
  const stickerSources = Object.values(loadedStickers);

  for (let row = 0; row < GRID; row++) {
    for (let col = 0; col < GRID; col++) {
      let texture;

      // اختيار محتوى عشوائي
      const useVideo = videoSources.length > 0 && Math.random() > 0.3;
      const useSticker = stickerSources.length > 0 && !useVideo;

      if (useVideo) {
        const src = videoSources[Math.floor(Math.random() * videoSources.length)];
        const video = document.createElement('video');
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        video.src = src;
        video.onloadeddata = function() { video.play().catch(() => {}); };
        video.load();
        texture = new THREE.VideoTexture(video);
      } else if (useSticker) {
        const src = stickerSources[Math.floor(Math.random() * stickerSources.length)];
        const img = new Image();
        img.src = src;
        texture = new THREE.CanvasTexture(img);
      } else {
        // فيديو تجريبي
        const canvas = createTestTile(col, row);
        const stream = canvas.captureStream(30);
        const video = document.createElement('video');
        video.muted = true;
        video.loop = true;
        video.srcObject = stream;
        video.onloadeddata = function() { video.play().catch(() => {}); };
        video.load();
        texture = new THREE.VideoTexture(video);
      }

      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;

      const geometry = new THREE.PlaneGeometry(TILE_SIZE * 0.95, TILE_SIZE * 0.95);
      const material = new THREE.MeshStandardMaterial({
        map: texture,
        side: THREE.DoubleSide,
        transparent: true,
        roughness: 0.3,
        metalness: 0.1
      });

      const mesh = new THREE.Mesh(geometry, material);
      const posX = col * TILE_SIZE - HALF + TILE_SIZE / 2;
      const posZ = row * TILE_SIZE - HALF + TILE_SIZE / 2;
      mesh.position.set(posX, 0, posZ);
      mesh.rotation.x = -Math.PI / 2;
      mesh.receiveShadow = true;
      mesh.userData = { row, col, index: row * GRID + col };

      tileGroup.add(mesh);
      tileMeshes.push(mesh);
    }
  }

  addGrid();
  isReady = true;
  document.getElementById('status-bar').style.display = 'none';
  document.getElementById('char-name').textContent = '🎯 ' + GRID + '×' + GRID + ' = ' + (GRID * GRID) + ' مربع';
  document.getElementById('tile-info').style.display = 'block';
  document.getElementById('tile-info').textContent = '🧩 خريطة ' + GRID + '×' + GRID + ' مع ' + (Object.keys(loadedVideos).length + Object.keys(loadedStickers).length) + ' محتوى';
  showToast('✅ خريطة ' + GRID + '×' + GRID + ' جاهزة', 'success');
}

function createTestTile(col, row) {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');
  const colors = ['#1a1a2e', '#16213e', '#0f3460', '#533483', '#e94560'];
  const c = colors[(col + row) % colors.length];
  ctx.fillStyle = c;
  ctx.fillRect(0, 0, 256, 256);
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  ctx.font = '20px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('(' + col + ',' + row + ')', 128, 128);
  return canvas;
}

// ============================================================
//  8. شبكة
// ============================================================

function addGrid() {
  if (gridHelper) {
    tileGroup.remove(gridHelper);
    gridHelper = null;
  }
  gridHelper = new THREE.GridHelper(WORLD_SIZE, GRID, 0x8b5cf6, 0x2a2a4a);
  gridHelper.position.y = 0.05;
  gridHelper.material.transparent = true;
  gridHelper.material.opacity = gridVisible ? 0.15 : 0;
  tileGroup.add(gridHelper);
}

function toggleGrid() {
  gridVisible = !gridVisible;
  if (gridHelper) {
    gridHelper.material.opacity = gridVisible ? 0.15 : 0;
  }
  showToast(gridVisible ? '📐 شبكة ظاهرة' : '📐 شبكة مخفية', 'info');
}

// ============================================================
//  9. حركة الشخصية
// ============================================================

function updatePlayer() {
  let dx = 0, dz = 0;
  if (touchDirs.up) dz = -PLAYER_SPEED;
  if (touchDirs.down) dz = PLAYER_SPEED;
  if (touchDirs.left) dx = -PLAYER_SPEED;
  if (touchDirs.right) dx = PLAYER_SPEED;

  const newX = playerGroup.position.x + dx;
  const newZ = playerGroup.position.z + dz;
  const limit = HALF - TILE_SIZE/2;

  playerGroup.position.x = Math.max(-limit, Math.min(limit, newX));
  playerGroup.position.z = Math.max(-limit, Math.min(limit, newZ));

  if (dx !== 0 || dz !== 0) {
    const angle = Math.atan2(dx, dz);
    playerGroup.rotation.y = angle;
  }

  // تحديث المربع النشط
  updateActiveTile();

  // سرعة الفيديو
  const speed = Math.sqrt(dx*dx + dz*dz);
  tileMeshes.forEach(mesh => {
    if (mesh.material && mesh.material.map && mesh.material.map.isVideoTexture) {
      // محاولة تغيير السرعة (إذا كان فيديو)
    }
  });
}

function updateActiveTile() {
  const px = playerGroup.position.x + HALF;
  const pz = playerGroup.position.z + HALF;
  const col = Math.floor(px / TILE_SIZE);
  const row = Math.floor(pz / TILE_SIZE);

  tileMeshes.forEach((mesh, i) => {
    const r = Math.floor(i / GRID);
    const c = i % GRID;
    if (r === row && c === col) {
      mesh.material.emissive = new THREE.Color(0x8b5cf6);
      mesh.material.emissiveIntensity = 0.15;
    } else {
      mesh.material.emissive = new THREE.Color(0x000000);
      mesh.material.emissiveIntensity = 0;
    }
  });

  if (col >= 0 && col < GRID && row >= 0 && row < GRID) {
    document.getElementById('tile-info').textContent = '🧩 (' + col + ', ' + row + ')';
  }
}

// ============================================================
//  10. كاميرا PUBG
// ============================================================

function updateCamera() {
  const target = playerGroup.position.clone();
  const angle = playerGroup.rotation.y;
  const distance = 8;
  const height = 5;

  const camX = target.x - Math.sin(angle) * distance;
  const camZ = target.z - Math.cos(angle) * distance;
  const camY = target.y + height;

  camera.position.x += (camX - camera.position.x) * 0.08;
  camera.position.z += (camZ - camera.position.z) * 0.08;
  camera.position.y += (camY - camera.position.y) * 0.08;

  camera.lookAt(target.x, target.y + 1, target.z);
}

function resetCamera() {
  camera.position.set(0, 6, 10);
  camera.lookAt(0, 0, 0);
  playerGroup.position.set(0, 0, 0);
}

// ============================================================
//  11. خريطة مصغرة
// ============================================================

function setupMinimap() {
  const frame = document.getElementById('minimap-frame');
  const canvas = document.createElement('canvas');
  canvas.width = 140;
  canvas.height = 140;
  frame.appendChild(canvas);
  minimapCtx = canvas.getContext('2d');
}

function updateMinimap() {
  if (!minimapCtx) return;
  const ctx = minimapCtx;
  const w = 140, h = 140;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(10,10,26,0.9)';
  ctx.fillRect(0, 0, w, h);

  const scale = w / WORLD_SIZE;

  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const px = x * TILE_SIZE * scale;
      const py = y * TILE_SIZE * scale;
      const size = TILE_SIZE * scale * 0.9;
      ctx.fillStyle = ((x + y) % 2 === 0) ? '#2a2a4a' : '#1a1a2e';
      ctx.fillRect(px, py, size, size);
    }
  }

  const px = (playerGroup.position.x + HALF) * scale;
  const py = (playerGroup.position.z + HALF) * scale;

  ctx.fillStyle = '#8b5cf6';
  ctx.shadowColor = '#8b5cf6';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(px, py, 4, 0, Math.PI * 2);
  ctx.fill();

  const angle = playerGroup.rotation.y;
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px + Math.sin(angle) * 10, py - Math.cos(angle) * 10);
  ctx.stroke();

  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(0, 0, w, h);
}

// ============================================================
//  12. حلقة الرسم
// ============================================================

function animate() {
  requestAnimationFrame(animate);

  updatePlayer();
  updateCamera();
  updateMinimap();

  renderer.render(scene, camera);
}

// ============================================================
//  13. تحكم
// ============================================================

function setupTouchControls() {
  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const dir = btn.getAttribute('data-dir');
    btn.addEventListener('touchstart', e => {
      e.preventDefault();
      touchDirs[dir] = true;
      btn.style.background = 'rgba(139,92,246,0.2)';
      btn.style.borderColor = '#8b5cf6';
    }, { passive: false });
    btn.addEventListener('touchend', e => {
      e.preventDefault();
      touchDirs[dir] = false;
      btn.style.background = '';
      btn.style.borderColor = '';
    }, { passive: false });
    btn.addEventListener('touchcancel', () => {
      touchDirs[dir] = false;
      btn.style.background = '';
      btn.style.borderColor = '';
    });
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') touchDirs.up = true;
  if (e.key === 'ArrowDown') touchDirs.down = true;
  if (e.key === 'ArrowLeft') touchDirs.left = true;
  if (e.key === 'ArrowRight') touchDirs.right = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowUp') touchDirs.up = false;
  if (e.key === 'ArrowDown') touchDirs.down = false;
  if (e.key === 'ArrowLeft') touchDirs.left = false;
  if (e.key === 'ArrowRight') touchDirs.right = false;
});

function showToast(message, type) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast ' + (type || '');
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

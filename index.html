<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚔️ لعبة البقاء</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Cairo',sans-serif; background:#050510; color:#fff; overflow:hidden; }

canvas { display:block; width:100%; height:100%; }

#start-screen {
  position:fixed; inset:0; z-index:2000;
  background:linear-gradient(135deg,#0a0a2a,#000);
  display:flex; flex-direction:column; justify-content:center; align-items:center; gap:20px;
}
.start-logo { font-size:42px; font-weight:900; color:#ffd700; animation:float 3s ease-in-out infinite; }
.start-btn {
  border:2px solid #00f2ff; color:#00f2ff; padding:16px 50px;
  background:rgba(0,242,255,0.08); border-radius:60px; font-size:20px;
  cursor:pointer; transition:all .3s; font-weight:700; font-family:inherit;
}
.start-btn:hover { transform:scale(1.05); background:#00f2ff; color:#000; box-shadow:0 0 50px rgba(0,242,255,0.4); }
.version-tag { position:absolute; bottom:15px; font-size:11px; color:#444; }
@keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }

#hud {
  position:fixed; top:10px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.8); padding:6px 16px; border-radius:14px;
  z-index:100; display:flex; gap:15px; font-size:12px;
  border:1px solid rgba(255,255,255,0.05);
}
#hud .stat { text-align:center; }
#hud .stat .val { font-weight:bold; }
#hud .stat .health { color:#4ade80; }
#hud .stat .kills { color:#ffd700; }
#hud .stat .label { font-size:8px; color:#666; display:block; }

#health-bar-container {
  position:fixed; bottom:130px; left:50%; transform:translateX(-50%);
  width:200px; height:6px; background:rgba(255,255,255,0.05);
  border-radius:3px; z-index:100; overflow:hidden;
}
#health-bar { height:100%; width:100%; background:linear-gradient(90deg,#4ade80,#22d3ee); border-radius:3px; transition:width 0.3s; }

#game-message {
  position:fixed; bottom:160px; left:50%; transform:translateX(-50%);
  color:#ffd700; font-size:16px; font-weight:bold; z-index:100;
  opacity:0; transition:opacity 0.5s;
}
#game-message.show { opacity:1; }

#controls {
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
  display:flex; gap:6px; z-index:100; flex-wrap:wrap; justify-content:center;
}
#controls button {
  background:rgba(139,92,246,0.18); color:#fff; border:1px solid rgba(139,92,246,0.3);
  padding:5px 12px; border-radius:12px; cursor:pointer; font-size:10px; font-family:inherit;
  transition:all 0.3s;
}
#controls button:hover { background:rgba(139,92,246,0.35); }

.dpad {
  position:fixed; bottom:80px; left:16px; width:100px; height:100px; z-index:200;
}
.dpad-btn {
  position:absolute; width:34px; height:34px; border-radius:50%;
  background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.1);
  display:flex; align-items:center; justify-content:center; font-size:14px;
  color:rgba(255,255,255,0.35); cursor:pointer;
}
.dpad-btn:active { background:rgba(139,92,246,0.3); color:#c4b5fd; transform:scale(0.9); }
.dpad-up { top:0; left:33px; }
.dpad-down { bottom:0; left:33px; }
.dpad-left { top:33px; left:0; }
.dpad-right { top:33px; right:0; }

#fire-btn {
  position:fixed; bottom:90px; right:20px;
  width:60px; height:60px; border-radius:50%;
  background:rgba(255,68,68,0.2); border:2px solid rgba(255,68,68,0.4);
  color:#ff4444; font-size:24px; cursor:pointer; z-index:200;
  display:flex; align-items:center; justify-content:center;
}
#fire-btn:active { transform:scale(0.85); background:rgba(255,68,68,0.4); }

#game-over {
  position:fixed; inset:0; z-index:500;
  background:rgba(0,0,0,0.9); display:none;
  justify-content:center; align-items:center; flex-direction:column; gap:15px;
}
#game-over h1 { font-size:36px; }
#game-over .final-stats { color:#aaa; font-size:14px; text-align:center; line-height:1.8; }
#game-over button {
  padding:10px 35px; border-radius:25px; border:none;
  background:#ffd700; color:#111; font-size:16px; font-weight:bold;
  cursor:pointer; font-family:inherit;
}
</style>
</head>
<body>

<!-- شاشة البداية -->
<div id="start-screen">
  <div class="start-logo">⚔️ لعبة البقاء</div>
  <button class="start-btn" onclick="startGame()">🚀 ابدأ</button>
  <div class="version-tag">v64.0 | يعمل 100%</div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="stat"><span class="val health" id="health-display">100</span><span class="label">❤️ صحة</span></div>
  <div class="stat"><span class="val kills" id="kills-display">0</span><span class="label">💀 قتلى</span></div>
  <div class="stat"><span class="val" id="score-display" style="color:#ffd700;">0</span><span class="label">🏆 نقاط</span></div>
  <div class="stat"><span class="val" id="level-display" style="color:#60a5fa;">1</span><span class="label">⭐ مستوى</span></div>
</div>

<div id="health-bar-container"><div id="health-bar"></div></div>
<div id="game-message">⚔️ ابدأ المعركة!</div>

<div id="controls">
  <button onclick="spawnEnemy()">👾 عدو</button>
  <button onclick="healPlayer()">💚 شفاء</button>
  <button onclick="resetGame()">🔄 إعادة</button>
</div>

<div class="dpad" id="dpad">
  <div class="dpad-btn dpad-up" data-dir="up">▲</div>
  <div class="dpad-btn dpad-down" data-dir="down">▼</div>
  <div class="dpad-btn dpad-left" data-dir="left">◀</div>
  <div class="dpad-btn dpad-right" data-dir="right">▶</div>
</div>

<button id="fire-btn" onclick="fireWeapon()">🔫</button>

<div id="game-over">
  <h1>💀 انتهت اللعبة</h1>
  <div class="final-stats">
    <div>💀 قتلى: <span id="final-kills">0</span></div>
    <div>🏆 نقاط: <span id="final-score">0</span></div>
    <div>⭐ المستوى: <span id="final-level">1</span></div>
  </div>
  <button onclick="restartGame()">🔄 العب مجدداً</button>
</div>

<canvas id="canvas"></canvas>

<script>
// ============================================================
//  ⚔️ لعبة البقاء - تعمل 100%
// ============================================================

// ============================================================
//  1. المتغيرات
// ============================================================

let scene, camera, renderer;
let playerGroup;
let enemies = [];
let bullets = [];
let enemySpawnTimer = 0;
let gameRunning = true;

let playerHealth = 100;
let maxHealth = 100;
let kills = 0;
let score = 0;
let level = 1;
let xp = 0;
const XP_PER_LEVEL = 50;

let touchDirs = { up:false, down:false, left:false, right:false };
const PLAYER_SPEED = 0.12;
let lastFireTime = 0;
const BULLET_SPEED = 0.5;

// ============================================================
//  2. الدوال الأساسية
// ============================================================

function updateHUD() {
  document.getElementById('health-display').textContent = Math.round(playerHealth);
  document.getElementById('kills-display').textContent = kills;
  document.getElementById('score-display').textContent = score;
  document.getElementById('level-display').textContent = level;
  
  const healthPercent = (playerHealth / maxHealth) * 100;
  document.getElementById('health-bar').style.width = healthPercent + '%';
  if (healthPercent < 30) {
    document.getElementById('health-bar').style.background = 'linear-gradient(90deg,#f87171,#ef4444)';
  } else {
    document.getElementById('health-bar').style.background = 'linear-gradient(90deg,#4ade80,#22d3ee)';
  }
}

function showMessage(text, duration = 1500) {
  const el = document.getElementById('game-message');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(el._timeout);
  el._timeout = setTimeout(() => el.classList.remove('show'), duration);
}

function addXP(amount) {
  xp += amount;
  while (xp >= XP_PER_LEVEL) {
    xp -= XP_PER_LEVEL;
    level++;
    playerHealth = Math.min(maxHealth, playerHealth + 20);
    showMessage('⭐ ترقية! المستوى ' + level, 2000);
  }
  updateHUD();
}

function healPlayer() {
  playerHealth = Math.min(maxHealth, playerHealth + 30);
  showMessage('💚 تم الشفاء +30', 1000);
  updateHUD();
}

// ============================================================
//  3. الأعداء
// ============================================================

function spawnEnemy() {
  if (!gameRunning) return;
  
  const angle = Math.random() * Math.PI * 2;
  const distance = 4 + Math.random() * 4;
  const x = playerGroup.position.x + Math.cos(angle) * distance;
  const z = playerGroup.position.z + Math.sin(angle) * distance;
  
  const limit = 10;
  const posX = Math.max(-limit, Math.min(limit, x));
  const posZ = Math.max(-limit, Math.min(limit, z));
  
  const enemy = createEnemyMesh(posX, posZ);
  enemies.push(enemy);
  showMessage('👾 عدو ظهر!', 800);
}

function createEnemyMesh(x, z) {
  const group = new THREE.Group();
  
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.35, 0.6, 8),
    new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xdc2626, emissiveIntensity: 0.2 })
  );
  body.position.y = 0.3;
  body.castShadow = true;
  group.add(body);
  
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.18, 8, 8),
    new THREE.MeshStandardMaterial({ color: 0xfca5a5 })
  );
  head.position.y = 0.75;
  head.castShadow = true;
  group.add(head);
  
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
  const eyeGeo = new THREE.SphereGeometry(0.04, 6, 6);
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
  eyeL.position.set(-0.07, 0.77, 0.18);
  group.add(eyeL);
  const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
  eyeR.position.set(0.07, 0.77, 0.18);
  group.add(eyeR);
  
  group.position.set(x, 0, z);
  group.userData = {
    health: 20 + level * 5,
    maxHealth: 20 + level * 5,
    speed: 0.02 + level * 0.002,
    damage: 5 + level * 2,
    attackCooldown: 0
  };
  
  scene.add(group);
  return group;
}

function updateEnemies() {
  const toRemove = [];
  
  enemies.forEach((enemy, index) => {
    if (!enemy.parent) {
      toRemove.push(index);
      return;
    }
    
    const dx = playerGroup.position.x - enemy.position.x;
    const dz = playerGroup.position.z - enemy.position.z;
    const dist = Math.sqrt(dx*dx + dz*dz);
    
    if (dist > 0.5) {
      const speed = enemy.userData.speed;
      enemy.position.x += (dx / dist) * speed;
      enemy.position.z += (dz / dist) * speed;
      enemy.rotation.y = Math.atan2(dx, dz);
    }
    
    if (dist < 1.0 && enemy.userData.attackCooldown <= 0) {
      playerHealth -= enemy.userData.damage;
      enemy.userData.attackCooldown = 60;
      showMessage('💥 تعرضت للهجوم! -' + enemy.userData.damage, 800);
      updateHUD();
      if (playerHealth <= 0) gameOver();
    }
    
    if (enemy.userData.attackCooldown > 0) enemy.userData.attackCooldown--;
  });
  
  enemies = enemies.filter((e, i) => !toRemove.includes(i));
}

// ============================================================
//  4. الأسلحة
// ============================================================

function fireWeapon() {
  if (!gameRunning) return;
  
  const now = Date.now();
  if (now - lastFireTime < 300) return;
  lastFireTime = now;
  
  const bullet = createBullet();
  bullets.push(bullet);
  
  const flash = new THREE.PointLight(0xff6600, 2, 3);
  flash.position.copy(playerGroup.position);
  flash.position.y += 0.6;
  scene.add(flash);
  setTimeout(() => scene.remove(flash), 100);
}

function createBullet() {
  const geo = new THREE.SphereGeometry(0.06, 8, 8);
  const mat = new THREE.MeshBasicMaterial({ color: 0x00f2ff });
  const mesh = new THREE.Mesh(geo, mat);
  
  const dir = new THREE.Vector3(0, 0, -1);
  dir.applyQuaternion(playerGroup.quaternion);
  
  mesh.position.copy(playerGroup.position);
  mesh.position.y += 0.6;
  mesh.position.x += dir.x * 0.5;
  mesh.position.z += dir.z * 0.5;
  
  mesh.userData = { direction: dir, speed: BULLET_SPEED, life: 60 };
  scene.add(mesh);
  return mesh;
}

function updateBullets() {
  const toRemove = [];
  
  bullets.forEach((bullet, index) => {
    if (!bullet.parent) {
      toRemove.push(index);
      return;
    }
    
    const dir = bullet.userData.direction;
    bullet.position.x += dir.x * bullet.userData.speed;
    bullet.position.z += dir.z * bullet.userData.speed;
    bullet.userData.life--;
    
    let hit = false;
    enemies.forEach(enemy => {
      if (hit) return;
      const dx = bullet.position.x - enemy.position.x;
      const dz = bullet.position.z - enemy.position.z;
      if (dx*dx + dz*dz < 0.5) {
        hit = true;
        enemy.userData.health -= 15 + level * 2;
        
        const particles = new THREE.Points(
          new THREE.BufferGeometry().setAttribute('position',
            new THREE.BufferAttribute(new Float32Array(20*3).map(() => (Math.random()-0.5)*0.5), 3)
          ),
          new THREE.PointsMaterial({ color: 0xff4400, size: 0.05, transparent: true, opacity: 0.8 })
        );
        particles.position.copy(enemy.position);
        particles.position.y += 0.3;
        scene.add(particles);
        setTimeout(() => scene.remove(particles), 300);
        
        if (enemy.userData.health <= 0) {
          kills++;
          score += 10 * level;
          addXP(8 + level);
          showMessage('💀 قتل عدو! +' + (10 * level), 1000);
          scene.remove(enemy);
        }
        updateHUD();
      }
    });
    
    if (hit || bullet.userData.life <= 0) {
      scene.remove(bullet);
      toRemove.push(index);
    }
  });
  
  bullets = bullets.filter((b, i) => !toRemove.includes(i));
}

// ============================================================
//  5. نهاية اللعبة
// ============================================================

function gameOver() {
  gameRunning = false;
  document.getElementById('final-kills').textContent = kills;
  document.getElementById('final-score').textContent = score;
  document.getElementById('final-level').textContent = level;
  document.getElementById('game-over').style.display = 'flex';
  showMessage('💀 لقد مت!', 2000);
}

function restartGame() {
  document.getElementById('game-over').style.display = 'none';
  playerHealth = maxHealth;
  kills = 0;
  score = 0;
  level = 1;
  xp = 0;
  gameRunning = true;
  
  enemies.forEach(e => scene.remove(e));
  enemies = [];
  bullets.forEach(b => scene.remove(b));
  bullets = [];
  
  playerGroup.position.set(0, 0, 0);
  updateHUD();
  showMessage('💪 معركة جديدة!', 1500);
}

function resetGame() {
  if (!gameRunning) return;
  if (confirm('🔄 إعادة تعيين اللعبة؟')) restartGame();
}

// ============================================================
//  6. حركة اللاعب والكاميرا
// ============================================================

function updatePlayer() {
  if (!gameRunning) return;
  
  let dx = 0, dz = 0;
  if (touchDirs.up) dz = -PLAYER_SPEED;
  if (touchDirs.down) dz = PLAYER_SPEED;
  if (touchDirs.left) dx = -PLAYER_SPEED;
  if (touchDirs.right) dx = PLAYER_SPEED;
  
  const limit = 10;
  playerGroup.position.x = Math.max(-limit, Math.min(limit, playerGroup.position.x + dx));
  playerGroup.position.z = Math.max(-limit, Math.min(limit, playerGroup.position.z + dz));
  
  if (dx !== 0 || dz !== 0) {
    playerGroup.rotation.y = Math.atan2(dx, dz);
  }
}

function updateCamera() {
  const target = playerGroup.position.clone();
  const angle = playerGroup.rotation.y;
  const dist = 6.5;
  const height = 4.5;
  
  const desired = new THREE.Vector3(
    target.x - Math.sin(angle) * dist,
    target.y + height,
    target.z - Math.cos(angle) * dist
  );
  
  camera.position.lerp(desired, 0.08);
  camera.lookAt(target.x, target.y + 0.8, target.z);
}

// ============================================================
//  7. تهيئة Three.js
// ============================================================

function initGame() {
  const canvas = document.getElementById('canvas');
  
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a1a);
  scene.fog = new THREE.Fog(0x0a0a1a, 20, 40);
  
  camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(0, 5, 8);
  
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  
  // إضاءة
  scene.add(new THREE.AmbientLight(0x8b5cf6, 0.4));
  const dir = new THREE.DirectionalLight(0xffeedd, 1.0);
  dir.position.set(10, 20, 10);
  dir.castShadow = true;
  scene.add(dir);
  scene.add(new THREE.DirectionalLight(0x4466ff, 0.3).position.set(-10, 10, -10));
  
  // أرضية
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(30, 30),
    new THREE.MeshStandardMaterial({ color: 0x15152a, roughness: 0.9 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.05;
  ground.receiveShadow = true;
  scene.add(ground);
  
  // شبكة
  const grid = new THREE.GridHelper(30, 15, 0x333366, 0x1a1a3e);
  grid.position.y = 0.01;
  scene.add(grid);
  
  // دائرة حول اللاعب
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.8, 1.2, 32),
    new THREE.MeshBasicMaterial({ color: 0x00f2ff, transparent: true, opacity: 0.1, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.02;
  scene.add(ring);
  
  // اللاعب
  playerGroup = new THREE.Group();
  
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.32, 0.38, 0.7, 8),
    new THREE.MeshStandardMaterial({ color: 0x8b5cf6, emissive: 0x5b21b6, emissiveIntensity: 0.2 })
  );
  body.position.y = 0.35;
  body.castShadow = true;
  playerGroup.add(body);
  
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.18, 8, 8),
    new THREE.MeshStandardMaterial({ color: 0xa78bfa })
  );
  head.position.y = 0.85;
  head.castShadow = true;
  playerGroup.add(head);
  
  const crown = new THREE.Mesh(
    new THREE.ConeGeometry(0.12, 0.12, 6),
    new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffa500, emissiveIntensity: 0.1 })
  );
  crown.position.y = 1.0;
  playerGroup.add(crown);
  
  playerGroup.position.set(0, 0, 0);
  scene.add(playerGroup);
  
  // ضوء حول اللاعب
  const playerLight = new THREE.PointLight(0x8b5cf6, 0.5, 5);
  playerLight.position.y = 0.5;
  playerGroup.add(playerLight);
  
  // بدء الحلقة
  updateHUD();
  showMessage('⚔️ ابدأ المعركة!', 1500);
  
  function loop() {
    requestAnimationFrame(loop);
    
    if (gameRunning) {
      updatePlayer();
      updateEnemies();
      updateBullets();
      
      // spawn أعداء تلقائي
      enemySpawnTimer++;
      if (enemySpawnTimer > 100 - level * 5 && enemies.length < 3 + level) {
        enemySpawnTimer = 0;
        spawnEnemy();
      }
    }
    
    updateCamera();
    renderer.render(scene, camera);
  }
  loop();
}

// ============================================================
//  8. بدء اللعبة والتحكم
// ============================================================

function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('health-bar-container').style.display = 'block';
  document.getElementById('controls').style.display = 'flex';
  document.getElementById('dpad').style.display = 'block';
  document.getElementById('fire-btn').style.display = 'flex';
  document.getElementById('game-message').style.display = 'block';
  
  initGame();
}

function setupControls() {
  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const dir = btn.dataset.dir;
    btn.addEventListener('touchstart', e => { e.preventDefault(); touchDirs[dir] = true; }, { passive: false });
    btn.addEventListener('touchend', e => { e.preventDefault(); touchDirs[dir] = false; }, { passive: false });
  });
  
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp') touchDirs.up = true;
    if (e.key === 'ArrowDown') touchDirs.down = true;
    if (e.key === 'ArrowLeft') touchDirs.left = true;
    if (e.key === 'ArrowRight') touchDirs.right = true;
    if (e.key === ' ' || e.key === 'Space') { e.preventDefault(); fireWeapon(); }
    if (e.key === 'h' || e.key === 'H') healPlayer();
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowUp') touchDirs.up = false;
    if (e.key === 'ArrowDown') touchDirs.down = false;
    if (e.key === 'ArrowLeft') touchDirs.left = false;
    if (e.key === 'ArrowRight') touchDirs.right = false;
  });
  
  document.getElementById('fire-btn').addEventListener('touchstart', e => {
    e.preventDefault();
    fireWeapon();
  });
}

window.addEventListener('resize', () => {
  if (camera) {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  }
});

setupControls();

console.log('⚔️ لعبة البقاء - تعمل 100%');
console.log('📌 التحكم:');
console.log('  ✅ D-Pad للحركة');
console.log('  ✅ زر 🔫 لإطلاق النار');
console.log('  ✅ أعداء يظهرون تلقائياً');
console.log('  ✅ نظام صحة ونقاط');
console.log('  ✅ مستويات متزايدة');
</script>
</body>
</html>

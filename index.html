/* ===== شاشة البداية ===== */

@keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-12px); } }

<script>
// ============================================================
//  🌐 الكرة الثابتة - 16 ضلع
//  كل ضلع = عالم مستقل

// ===== المتغيرات العامة =====
let scene, camera, renderer;
let tileGroup;
let isTransitioning = false;
let currentWorldId = 'main';

let playerHealth = 100;
let maxHealth = 100;
let kills = 0;
let score = 0;
let level = 1;
let worlds = [];
let visitedWorlds = new Set(['main']);

let isInWorld = false;
let gameRunning = true;

// ===== دوال مساعدة =====
function showToast(msg, type) {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast ' + (type || 'info');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2500);
}

function showMessage(text) {
  const el = document.getElementById('game-message');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(el._timeout);
  el._timeout = setTimeout(() => el.classList.remove('show'), 2000);
}

function showTransition(text) {
  document.getElementById('transition-text').textContent = text;
  document.getElementById('transition-screen').style.display = 'flex';
}
function hideTransition() {
  document.getElementById('transition-screen').style.display = 'none';
}

function updateHUD() {
  document.getElementById('health-display').textContent = Math.round(playerHealth);
  document.getElementById('kills-display').textContent = kills;
  document.getElementById('score-display').textContent = score;
  document.getElementById('level-display').textContent = level;
  document.getElementById('world-count').textContent = visitedWorlds.size;
  const healthPercent = (playerHealth / maxHealth) * 100;
  document.getElementById('health-bar').style.width = healthPercent + '%';
}

// ===== العوالم =====

function getWorld(id) { return worlds.find(w => w.id === id); }

// ===== بناء العالم =====
function buildWorld(worldId) {
  const world = getWorld(worldId);
  if (!world) return;

  currentWorldId = worldId;
  scene.background = new THREE.Color(world.background || '#0a0a1a');
  
  // إظهار/إخفاء الأزرار
  document.getElementById('fire-btn').style.display = (world.isFight) ? 'flex' : 'none';
  isInWorld = (worldId !== 'main');
  
  updateHUD();
}

// ===== بناء الكرة بـ 16 ضلع =====
let sphereGroup = null;
let facetMeshes = [];
let facetData = [];
let selectedFacet = null;
let isDraggingSphere = false;
let previousMouse = { x: 0, y: 0 };

const WORLD_NAMES = [
  '⚔️ القتال', '🌲 الغابة', '🌊 المحيط', '🔥 النار',
  '❄️ الجليد', '🏰 القلعة', '🌈 قوس قزح', '⭐ النجوم',
  '🌙 القمر', '🎨 الفن', '🎵 الموسيقى', '🚀 الفضاء',
  '🧙 السحر', '🏹 الصيد', '💎 الماس', '🔮 المستقبل'
];

const WORLD_COLORS = [
  '#ef4444', '#22c55e', '#3b82f6', '#f97316',
  '#06b6d4', '#eab308', '#ec4899', '#8b5cf6',
  '#fbbf24', '#f472b6', '#a78bfa', '#06b6d4',
  '#8b5cf6', '#22d3ee', '#f472b6', '#a855f7'
];

function buildSphere() {
  // تنظيف الكرة القديمة
  if (sphereGroup) {
    sphereGroup.children.forEach(child => {
      if (child.geometry) child.geometry.dispose();
      if (child.material) child.material.dispose();
    });
    scene.remove(sphereGroup);
  }
  facetMeshes = [];
  facetData = [];
  selectedFacet = null;
  document.getElementById('facet-info').style.display = 'none';

  sphereGroup = new THREE.Group();
  sphereGroup.position.set(0, 0, 0);

  const radius = 5;
  const faces = 16;
  
  // إنشاء 16 ضلع باستخدام IcosahedronGeometry
  const geometry = new THREE.IcosahedronGeometry(radius, 1);
  
  // الحصول على الوجوه
  const positionAttr = geometry.getAttribute('position');
  const indexAttr = geometry.index;
  const vertices = [];
  
  for (let i = 0; i < positionAttr.count; i++) {
    vertices.push(
      positionAttr.getX(i),
      positionAttr.getY(i),
      positionAttr.getZ(i)
    );
  }

  // استخراج المثلثات
  const triangles = [];
  if (indexAttr) {
    for (let i = 0; i < indexAttr.count; i += 3) {
      triangles.push([
        indexAttr.getX(i),
        indexAttr.getX(i + 1),
        indexAttr.getX(i + 2)
      ]);
    }
  }

  // دمج المثلثات لتشكيل 16 ضلع
  const targetCount = faces;
  const triPerFacet = Math.max(1, Math.floor(triangles.length / targetCount));
  const facets = [];

  for (let i = 0; i < targetCount; i++) {
    const startIdx = i * triPerFacet;
    const endIdx = Math.min((i + 1) * triPerFacet, triangles.length);
    const facetTriangles = [];
    
    for (let j = startIdx; j < endIdx; j++) {
      facetTriangles.push(triangles[j]);
    }
    
    if (facetTriangles.length > 0) {
      let cx = 0, cy = 0, cz = 0;
      let count = 0;
      const pts = [];
      
      facetTriangles.forEach(tri => {
        tri.forEach(idx => {
          const x = vertices[idx * 3];
          const y = vertices[idx * 3 + 1];
          const z = vertices[idx * 3 + 2];
          cx += x; cy += y; cz += z;
          count++;
          pts.push({ x, y, z });
        });
      });
      
      cx /= count; cy /= count; cz /= count;
      const len = Math.sqrt(cx*cx + cy*cy + cz*cz);
      if (len > 0) { cx /= len; cy /= len; cz /= len; }
      
      facets.push({
        center: { x: cx, y: cy, z: cz },
        vertices: pts
      });
    }
  }

  // إنشاء الأضلاع
  facets.forEach((facet, index) => {
    createFacet(facet, index, facets.length);
  });

  // إضافة إضاءة للكرة
  const glow = new THREE.PointLight(0x8b5cf6, 0.3, 10);
  glow.position.set(0, 0, 0);
  sphereGroup.add(glow);

  scene.add(sphereGroup);
}

function createFacet(facet, index, total) {
  const color = WORLD_COLORS[index % WORLD_COLORS.length];
  const worldName = WORLD_NAMES[index % WORLD_NAMES.length];
  const points = facet.vertices;
  
  if (points.length < 3) return;
  
  const center = facet.center;
  const normal = new THREE.Vector3(center.x, center.y, center.z).normalize();
  const up = Math.abs(normal.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
  const right = new THREE.Vector3().crossVectors(normal, up).normalize();
  const localUp = new THREE.Vector3().crossVectors(normal, right).normalize();
  
  // تحويل النقاط إلى إحداثيات محلية
  const localPoints = points.map(p => {
    const v = new THREE.Vector3(p.x, p.y, p.z);
    return { x: v.dot(right), y: v.dot(localUp) };
  });
  
  let cx = 0, cy = 0;
  localPoints.forEach(p => { cx += p.x; cy += p.y; });
  cx /= localPoints.length; cy /= localPoints.length;
  
  // فرز النقاط حول المركز
  const sortedPoints = localPoints.map((p, i) => ({
    ...p,
    angle: Math.atan2(p.y - cy, p.x - cx)
  })).sort((a, b) => a.angle - b.angle);
  
  // إنشاء شكل المضلع
  const shape = new THREE.Shape();
  sortedPoints.forEach((p, i) => {
    const x = p.x - cx;
    const y = p.y - cy;
    if (i === 0) shape.moveTo(x, y);
    else shape.lineTo(x, y);
  });
  shape.closePath();

  const geometry = new THREE.ShapeGeometry(shape);
  
  // تدوير الضلع
  const quaternion = new THREE.Quaternion();
  const upVec = new THREE.Vector3(0, 0, 1);
  quaternion.setFromUnitVectors(upVec, normal);
  
  const position = geometry.getAttribute('position');
  const radius = 5;
  for (let i = 0; i < position.count; i++) {
    const x = position.getX(i);
    const y = position.getY(i);
    const v = new THREE.Vector3(x, y, 0);
    v.applyQuaternion(quaternion);
    v.x += normal.x * radius;
    v.y += normal.y * radius;
    v.z += normal.z * radius;
    position.setXYZ(i, v.x, v.y, v.z);
  }
  position.needsUpdate = true;
  geometry.computeVertexNormals();

  // المادة
  const material = new THREE.MeshStandardMaterial({
    color: color,
    emissive: color,
    emissiveIntensity: 0.2,
    roughness: 0.3,
    metalness: 0.5,
    transparent: true,
    opacity: 0.92,
    side: THREE.DoubleSide,
    flatShading: true
  });

  const mesh = new THREE.Mesh(geometry, material);
  mesh.userData = {
    facetIndex: index,
    worldName: worldName,
    isFacet: true,
    center: normal
  };

  // الحدود
  const edges = new THREE.EdgesGeometry(geometry);
  const lineMat = new THREE.LineBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.15
  });
  const wireframe = new THREE.LineSegments(edges, lineMat);
  mesh.add(wireframe);

  // اسم العالم على الضلع
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 256, 64);
  ctx.font = 'bold 20px Cairo, Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.9)';
  ctx.shadowBlur = 10;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(worldName, 128, 34);
  
  const texture = new THREE.CanvasTexture(canvas);
  const spriteMat = new THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    depthTest: false,
    sizeAttenuation: true
  });
  const sprite = new THREE.Sprite(spriteMat);
  const labelPos = new THREE.Vector3(
    normal.x * 5.6,
    normal.y * 5.6,
    normal.z * 5.6
  );
  sprite.position.copy(labelPos);
  sprite.scale.set(1.6, 0.35, 1);
  mesh.add(sprite);

  sphereGroup.add(mesh);
  facetMeshes.push(mesh);
  facetData.push({
    index: index,
    name: worldName,
    center: normal,
    mesh: mesh
  });
}

// ===== التفاعل مع الأضلاع =====
function setupFacetInteraction() {
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  // تحريك الماوس
  renderer.domElement.addEventListener('mousemove', (event) => {
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    const intersects = raycaster.intersectObjects(facetMeshes);

    if (intersects.length > 0) {
      const hit = intersects[0].object;
      if (hit.userData && hit.userData.isFacet) {
        const index = hit.userData.facetIndex;
        if (index !== selectedFacet) {
          if (selectedFacet !== null && facetMeshes[selectedFacet]) {
            facetMeshes[selectedFacet].material.emissiveIntensity = 0.2;
          }
          selectedFacet = index;
          facetMeshes[index].material.emissiveIntensity = 0.7;
          renderer.domElement.style.cursor = 'pointer';
          updateFacetInfo(index);
        }
        return;
      }
    }
    
    if (selectedFacet !== null && facetMeshes[selectedFacet]) {
      facetMeshes[selectedFacet].material.emissiveIntensity = 0.2;
    }
    selectedFacet = null;
    renderer.domElement.style.cursor = 'default';
    document.getElementById('facet-info').style.display = 'none';
  });

  // النقر للدخول
  renderer.domElement.addEventListener('click', (event) => {
    if (selectedFacet !== null && facetData[selectedFacet]) {
      const worldName = facetData[selectedFacet].name;
      const worldId = `world_${selectedFacet + 1}`;
      
      const target = getWorld(worldId);
      if (target) {
        enterWorld(worldId);
        showToast(`🌐 دخول إلى ${worldName}`, 'success');
      }
    }
  });

  // سحب الكرة
  renderer.domElement.addEventListener('mousedown', (e) => {
    isDraggingSphere = true;
    previousMouse.x = e.clientX;
    previousMouse.y = e.clientY;
  });
  
  window.addEventListener('mousemove', (e) => {
    if (isDraggingSphere && sphereGroup) {
      const dx = e.clientX - previousMouse.x;
      const dy = e.clientY - previousMouse.y;
      sphereGroup.rotation.x += dy * 0.008;
      sphereGroup.rotation.y += dx * 0.008;
      previousMouse.x = e.clientX;
      previousMouse.y = e.clientY;
    }
  });
  
  window.addEventListener('mouseup', () => {
    isDraggingSphere = false;
  });
}

function updateFacetInfo(index) {
  const info = document.getElementById('facet-info');
  const nameEl = document.getElementById('facet-name');
  const descEl = document.getElementById('facet-desc');
  
  if (index !== null && facetData[index]) {
    info.style.display = 'block';
    nameEl.textContent = facetData[index].name;
    descEl.textContent = `ضلع ${index + 1} من 16 | اضغط للدخول`;
  } else {
    info.style.display = 'none';
  }
}

// ===== الدخول والخروج =====
function enterWorld(worldId) {
  if (isTransitioning) return;
  
  const target = getWorld(worldId);
  if (!target) { showToast('❌ العالم غير موجود', 'error'); return; }

  isTransitioning = true;
  showTransition('جاري الدخول إلى ' + target.name);

  setTimeout(() => {
    buildWorld(worldId);
    
    if (!visitedWorlds.has(worldId)) {
      visitedWorlds.add(worldId);
      score += 30;
      showToast('🏆 اكتشاف عالم جديد! +30', 'success');
    }
    
    // إخفاء الكرة عند الدخول لعالم
    if (sphereGroup) sphereGroup.visible = false;
    
    hideTransition();
    isTransitioning = false;
    showMessage('✅ دخلت: ' + target.name);
    updateHUD();
  }, 700);
}

function exitWorld() {
  if (isTransitioning || currentWorldId === 'main') return;

  isTransitioning = true;
  showTransition('جاري العودة...');

  setTimeout(() => {
    buildWorld('main');
    if (sphereGroup) sphereGroup.visible = true;
    camera.position.set(0, 2, 12);
    camera.lookAt(0, 0, 0);
    hideTransition();
    isTransitioning = false;
    showMessage('✅ عدت للخريطة الرئيسية');
    updateHUD();
  }, 600);
}

// ===== القتال =====
let enemies = [];
let bullets = [];
let enemySpawnTimer = 0;
let lastFireTime = 0;

function spawnEnemy() {
  if (currentWorldId !== 'world_1') return;
  
  const angle = Math.random() * Math.PI * 2;
  const dist = 3 + Math.random() * 3;
  const x = Math.cos(angle) * dist;
  const z = Math.sin(angle) * dist;
  
  const enemy = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 8, 8),
    new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xdc2626, emissiveIntensity: 0.3 })
  );
  enemy.position.set(x, 0.3, z);
  enemy.userData = { health: 20, speed: 0.02 };
  scene.add(enemy);
  enemies.push(enemy);
  showMessage('👾 عدو ظهر!');
}

function fireWeapon() {
  if (currentWorldId !== 'world_1') {
    showToast('⚠️ فقط في عالم القتال', 'warn');
    return;
  }
  
  const now = Date.now();
  if (now - lastFireTime < 300) return;
  lastFireTime = now;
  
  const bullet = new THREE.Mesh(
    new THREE.SphereGeometry(0.06, 6, 6),
    new THREE.MeshBasicMaterial({ color: 0x00f2ff })
  );
  bullet.position.set(0, 0.5, -0.5);
  bullet.userData = { speed: 0.5, life: 40 };
  scene.add(bullet);
  bullets.push(bullet);
}

function updateEnemies() {
  enemies.forEach((enemy, idx) => {
    if (!enemy.parent) return;
    
    // تحرك نحو المركز
    const dx = -enemy.position.x;
    const dz = -enemy.position.z;
    const dist = Math.sqrt(dx*dx + dz*dz);
    
    if (dist > 0.5) {
      enemy.position.x += (dx / dist) * 0.02;
      enemy.position.z += (dz / dist) * 0.02;
    }
    
    if (dist < 0.8) {
      playerHealth -= 5;
      showMessage('💥 تعرضت للهجوم! -5');
      updateHUD();
      if (playerHealth <= 0) gameOver();
      scene.remove(enemy);
    }
  });
  enemies = enemies.filter(e => e.parent);
}

function updateBullets() {
  bullets.forEach((bullet, idx) => {
    if (!bullet.parent) return;
    
    bullet.position.z -= bullet.userData.speed;
    bullet.userData.life--;
    
    // تصادم مع الأعداء
    let hit = false;
    enemies.forEach((enemy) => {
      if (hit) return;
      const dist = bullet.position.distanceTo(enemy.position);
      if (dist < 0.5) {
        hit = true;
        scene.remove(enemy);
        kills++;
        score += 10;
        showMessage('💀 قتل عدو! +10');
        updateHUD();
      }
    });
    
    if (hit || bullet.userData.life <= 0 || bullet.position.z < -5) {
      scene.remove(bullet);
    }
  });
  bullets = bullets.filter(b => b.parent);
}

// ===== الشفاء =====
function healPlayer() {
  if (playerHealth >= maxHealth) {
    showToast('❤️ صحتك كاملة!', 'info');
    return;
  }
  playerHealth = Math.min(maxHealth, playerHealth + 30);
  showMessage('💚 تم الشفاء +30');
  updateHUD();
}

// ===== المعالم =====
let landmarks = [];
let nextLandmarkId = 1;

function addLandmark() {
  const emojis = ['🏰', '🌲', '🌊', '⛰️', '🏜️', '🌋'];
  const names = ['قلعة', 'غابة', 'بحيرة', 'جبل', 'صحراء', 'بركان'];
  const idx = Math.floor(Math.random() * emojis.length);
  
  landmarks.push({
    id: nextLandmarkId++,
    name: emojis[idx] + ' ' + names[idx],
    emoji: emojis[idx]
  });
  
  showToast('📍 تم إضافة معلم: ' + names[idx], 'success');
}

// ===== نهاية اللعبة =====
function gameOver() {
  gameRunning = false;
  showMessage('💀 لقد مت!');
  setTimeout(() => { resetGame(); }, 2000);
}

function resetGame() {
  playerHealth = 100;
  maxHealth = 100;
  kills = 0;
  score = 0;
  level = 1;
  gameRunning = true;
  
  enemies.forEach(e => scene.remove(e));
  enemies = [];
  bullets.forEach(b => scene.remove(b));
  bullets = [];
  
  visitedWorlds = new Set(['main']);
  buildWorld('main');
  if (sphereGroup) sphereGroup.visible = true;
  camera.position.set(0, 2, 12);
  camera.lookAt(0, 0, 0);
  updateHUD();
  showMessage('💪 معركة جديدة!');
}

// ===== تهيئة Three.js =====
function initGame() {
  const canvas = document.getElementById('canvas');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050510);

  camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(0, 2, 12);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

  // إضاءة
  const ambientLight = new THREE.AmbientLight(0x4466ff, 0.6);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xfff0dd, 1.5);
  dirLight.position.set(10, 20, 8);
  scene.add(dirLight);

  const dirLight2 = new THREE.DirectionalLight(0x8888ff, 0.8);
  dirLight2.position.set(-10, 5, -10);
  scene.add(dirLight2);

  // مجموعة البلاطات
  tileGroup = new THREE.Group();
  scene.add(tileGroup);

  // بناء العوالم
  createDefaultWorlds();
  buildWorld('main');

  // بناء الكرة
  buildSphere();
  setupFacetInteraction();

  // إظهار الكرة
  if (sphereGroup) sphereGroup.visible = true;

  updateHUD();
  showMessage('🌐 انقر على أي ضلع للدخول');

  // ===== حلقة اللعب =====
  function loop() {
    requestAnimationFrame(loop);

    if (gameRunning && currentWorldId === 'world_1') {
      enemySpawnTimer++;
      if (enemySpawnTimer > 60 && enemies.length < 5) {
        enemySpawnTimer = 0;
        spawnEnemy();
      }
      updateEnemies();
      updateBullets();
    }

    renderer.render(scene, camera);
  }
  loop();
}

function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('health-bar-container').style.display = 'block';
  document.getElementById('controls').style.display = 'flex';
  document.getElementById('fire-btn').style.display = 'flex';
  document.getElementById('game-message').style.display = 'block';

  initGame();
}

// ===== التحكم =====
window.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); fireWeapon(); }
  if (e.key === 'h' || e.key === 'H') healPlayer();
  if (e.key === 'Escape') exitWorld();
});

window.addEventListener('resize', () => {
  if (camera) {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  }
});

<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🗺️ خريطة 16×16 - كل مربع له هويته</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Cairo',sans-serif; background:#050510; color:#fff; overflow:hidden; }

#start-screen {
  position:fixed; inset:0; z-index:2000;
  background:linear-gradient(135deg,#0a0a2a,#000);
  display:flex; flex-direction:column; justify-content:center; align-items:center; gap:20px;
}
.start-logo { font-size:42px; font-weight:900; color:#ffd700; animation:float 3s ease-in-out infinite; }
.start-subtitle { font-size:15px; color:#666; text-align:center; max-width:380px; line-height:1.6; }
.start-btn {
  border:2px solid #00f2ff; color:#00f2ff; padding:16px 50px;
  background:rgba(0,242,255,0.08); border-radius:60px; font-size:20px;
  cursor:pointer; transition:all .3s; font-weight:700; font-family:inherit;
}
.start-btn:hover { transform:scale(1.05); background:#00f2ff; color:#000; box-shadow:0 0 50px rgba(0,242,255,0.4); }
.version-tag { position:absolute; bottom:15px; font-size:11px; color:#444; }
@keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }

#game-container { position:fixed; inset:0; display:none; background:#0a0a1a; }
#game-canvas { display:block; width:100%; height:100%; }

.hud {
  position:fixed; top:0; left:0; right:0; padding:6px 12px;
  display:flex; justify-content:space-between; align-items:center;
  pointer-events:none; z-index:100;
  background:rgba(0,0,0,0.6); backdrop-filter:blur(8px);
}
.hud .title { color:#ffd700; font-size:13px; font-weight:700; }
.hud .info { color:#aaa; font-size:11px; }

.dpad {
  position:fixed; bottom:20px; left:16px;
  width:120px; height:120px; z-index:200;
}
.dpad-btn {
  position:absolute; width:40px; height:40px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; color:rgba(255,255,255,0.4);
  cursor:pointer; transition:all .1s;
}
.dpad-btn:active { background:rgba(139,92,246,0.2); border-color:#8b5cf6; color:#8b5cf6; transform:scale(0.88); }
.dpad-up { top:0; left:40px; }
.dpad-down { bottom:0; left:40px; }
.dpad-left { top:40px; left:0; }
.dpad-right { top:40px; right:0; }

#controls {
  position:fixed; bottom:160px; left:50%; transform:translateX(-50%);
  display:flex; gap:8px; z-index:210; flex-wrap:wrap; justify-content:center;
}
#controls button {
  background:rgba(139,92,246,0.15); color:#fff; border:1px solid rgba(139,92,246,0.2);
  padding:6px 14px; border-radius:15px; cursor:pointer; font-size:11px; font-family:inherit;
  transition:all 0.3s;
}
#controls button:hover { background:rgba(139,92,246,0.3); border-color:#8b5cf6; }

#minimap-frame {
  position:fixed; top:50px; left:10px;
  width:140px; height:140px;
  border:2px solid #ffd700; border-radius:12px;
  overflow:hidden; pointer-events:none; z-index:90;
  background:rgba(5,5,16,0.6);
  display:none;
}
#minimap-label {
  position:fixed; top:52px; left:12px; z-index:91;
  font-size:8px; color:#ffd700; background:rgba(0,0,0,0.6);
  padding:1px 6px; border-radius:4px; pointer-events:none; display:none;
}

.toast-container {
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
  z-index:700; display:flex; flex-direction:column; gap:5px; pointer-events:none;
  align-items:center;
}
.toast {
  background:rgba(0,0,0,0.9); padding:6px 16px; border-radius:30px;
  font-size:11px; border:1px solid rgba(255,255,255,0.06);
  animation:toastIn .3s,toastOut .3s 2.7s forwards;
}
.toast.success { border-color:#4ade80; color:#4ade80; }
.toast.error { border-color:#f87171; color:#f87171; }
.toast.info { border-color:#60a5fa; color:#60a5fa; }
@keyframes toastIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
@keyframes toastOut { from { opacity:1; transform:translateY(0); } to { opacity:0; transform:translateY(-20px); } }

#status-bar {
  position:fixed; bottom:140px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.7); padding:4px 16px;
  border-radius:12px; font-size:10px; color:#4ade80;
  z-index:95; border:1px solid rgba(74,222,128,0.2);
  display:none; text-align:center;
}

#tile-info {
  position:fixed; top:36px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.7); padding:3px 14px;
  border-radius:12px; font-size:10px; color:#ffd700;
  z-index:95; border:1px solid rgba(255,215,0,0.2);
  display:none;
}
</style>
</head>
<body>

<!-- شاشة البداية -->
<div id="start-screen">
  <div class="start-logo">🗺️ خريطة 16×16</div>
  <div class="start-subtitle">كل مربع له فيديو خاص · كل معلم له خصائصه</div>
  <button class="start-btn" onclick="enterApp()">🚀 دخول</button>
  <div class="version-tag">v53.0 | Multi-Video Tiles</div>
</div>

<!-- اللعبة -->
<div id="game-container">
  <canvas id="game-canvas"></canvas>

  <div id="minimap-frame"></div>
  <div id="minimap-label">🗺️</div>

  <div id="tile-info">🧩 المربع: -</div>
  <div id="status-bar">🌍 جاري بناء الخريطة...</div>

  <div class="hud">
    <div class="title">🗺️ خريطة متعددة الفيديوهات</div>
    <div class="info" id="char-name">جاري التحميل...</div>
  </div>

  <div id="controls">
    <button onclick="generateMap()">🗺️ توليد خريطة</button>
    <button onclick="toggleGrid()">📐 شبكة</button>
    <button onclick="resetCamera()">🔄 إعادة</button>
  </div>

  <div class="dpad" id="dpad">
    <div class="dpad-btn dpad-up" data-dir="up">▲</div>
    <div class="dpad-btn dpad-down" data-dir="down">▼</div>
    <div class="dpad-btn dpad-left" data-dir="left">◀</div>
    <div class="dpad-btn dpad-right" data-dir="right">▶</div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
// ============================================================
//  🗺️ خريطة 16×16 - كل مربع له فيديو خاص
// ============================================================

// ============================================================
//  1. أنواع التضاريس (المعلمات)
// ============================================================

const TERRAIN_TYPES = {
    CITY: {
        name: 'مدينة',
        color: '#4a4a7a',
        height: 0.3,
        speed: 0.8,
        emoji: '🏙️',
        pattern: 'grid'
    },
    FOREST: {
        name: 'غابة',
        color: '#1a4a1a',
        height: 0.5,
        speed: 1.0,
        emoji: '🌲',
        pattern: 'circles'
    },
    WATER: {
        name: 'ماء',
        color: '#1a3a6a',
        height: -0.2,
        speed: 0.6,
        emoji: '🌊',
        pattern: 'waves'
    },
    MOUNTAIN: {
        name: 'جبل',
        color: '#5a4a3a',
        height: 1.2,
        speed: 0.5,
        emoji: '⛰️',
        pattern: 'stars'
    },
    DESERT: {
        name: 'صحراء',
        color: '#8a7a5a',
        height: 0.2,
        speed: 1.2,
        emoji: '🏜️',
        pattern: 'dots'
    },
    PLAINS: {
        name: 'سهول',
        color: '#3a5a2a',
        height: 0.1,
        speed: 1.1,
        emoji: '🌾',
        pattern: 'stripes'
    }
};

// ============================================================
//  2. توليد خريطة 16×16
// ============================================================

const MAP_SIZE = 16;
const TILE_SIZE = 3;
const WORLD_SIZE = MAP_SIZE * TILE_SIZE;
const HALF = WORLD_SIZE / 2;

let mapData = [];
let tileMeshes = [];
let tileVideos = [];
let gridHelper = null;
let gridVisible = true;
let isReady = false;

// ============================================================
//  3. Three.js
// ============================================================

let scene, camera, renderer;
let playerGroup, tileGroup;
let touchDirs = { up: false, down: false, left: false, right: false };
const PLAYER_SPEED = 0.08;

function initThree() {
  const canvas = document.getElementById('game-canvas');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a1a);

  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 8, 12);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  // إضاءة
  const ambient = new THREE.AmbientLight(0x8b5cf6, 0.5);
  scene.add(ambient);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(10, 20, 10);
  dirLight.castShadow = true;
  scene.add(dirLight);

  // لاعب
  playerGroup = new THREE.Group();
  scene.add(playerGroup);

  const bodyGeo = new THREE.SphereGeometry(0.3, 16, 16);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0x8b5cf6, emissive: 0x6d28d9, emissiveIntensity: 0.3
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.3;
  body.castShadow = true;
  playerGroup.add(body);

  const crownGeo = new THREE.ConeGeometry(0.15, 0.2, 6);
  const crownMat = new THREE.MeshStandardMaterial({
    color: 0xffd700, emissive: 0xffa500, emissiveIntensity: 0.2, metalness: 0.9
  });
  const crown = new THREE.Mesh(crownGeo, crownMat);
  crown.position.y = 0.6;
  playerGroup.add(crown);

  playerGroup.position.set(0, 0, 0);

  tileGroup = new THREE.Group();
  scene.add(tileGroup);

  setupMinimap();
  animate();
}

// ============================================================
//  4. توليد التضاريس
// ============================================================

function generateTerrainMap() {
  mapData = [];

  // أنواع التضاريس
  const types = ['CITY', 'FOREST', 'WATER', 'MOUNTAIN', 'DESERT', 'PLAINS'];

  for (let y = 0; y < MAP_SIZE; y++) {
    const row = [];
    for (let x = 0; x < MAP_SIZE; x++) {
      // توليد تضاريس طبيعية (متجاورة)
      let type;
      
      // مناطق محددة
      if (x < 3 && y < 3) type = 'CITY'; // مدينة في الزاوية
      else if (x > 12 && y > 12) type = 'DESERT'; // صحراء في الزاوية
      else if (x > 10 && y < 3) type = 'MOUNTAIN'; // جبال في الأعلى يمين
      else if (x > 5 && x < 9 && y > 5 && y < 11) type = 'WATER'; // بحيرة في المنتصف
      else if (y > 12 && x < 5) type = 'FOREST'; // غابة في الأسفل يسار
      else {
        // مناطق عشوائية
        const rand = Math.random();
        if (rand < 0.2) type = 'FOREST';
        else if (rand < 0.35) type = 'PLAINS';
        else if (rand < 0.5) type = 'WATER';
        else if (rand < 0.7) type = 'MOUNTAIN';
        else if (rand < 0.85) type = 'DESERT';
        else type = 'CITY';
      }

      // إضافة بعض العشوائية
      if (Math.random() < 0.05) {
        const randomType = types[Math.floor(Math.random() * types.length)];
        type = randomType;
      }

      row.push(type);
    }
    mapData.push(row);
  }
}

// ============================================================
//  5. إنشاء فيديوهات وهمية لكل نوع تضاريس
// ============================================================

function createTerrainVideo(type, frame) {
  const canvas = document.createElement('canvas');
  canvas.width = 128;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');

  const terrain = TERRAIN_TYPES[type];
  const color = terrain.color;
  const pattern = terrain.pattern;

  let f = frame || 0;

  function draw() {
    f++;
    ctx.clearRect(0, 0, 128, 128);

    // خلفية
    const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
    const c = new THREE.Color(color);
    const r = Math.floor(c.r * 255);
    const g = Math.floor(c.g * 255);
    const b = Math.floor(c.b * 255);
    grad.addColorStop(0, `rgb(${r+30},${g+30},${b+30})`);
    grad.addColorStop(1, `rgb(${r-20},${g-20},${b-20})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 128, 128);

    // نمط حسب النوع
    ctx.strokeStyle = `rgba(255,255,255,0.05)`;
    ctx.lineWidth = 1;

    switch(pattern) {
      case 'grid':
        for (let i = 0; i < 128; i += 16) {
          const off = (f * 0.2) % 16;
          ctx.beginPath(); ctx.moveTo(i + off, 0); ctx.lineTo(i + off, 128); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i + off); ctx.lineTo(128, i + off); ctx.stroke();
        }
        break;
      case 'circles':
        for (let i = 0; i < 15; i++) {
          const x = 64 + Math.sin(i * 1.7 + f * 0.02) * 50;
          const y = 64 + Math.cos(i * 2.3 + f * 0.015) * 50;
          const r = 5 + Math.sin(f * 0.03 + i) * 3;
          ctx.fillStyle = `rgba(255,255,255,0.05)`;
          ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        }
        break;
      case 'waves':
        for (let y = 0; y < 128; y += 10) {
          const off = Math.sin(y * 0.05 + f * 0.04) * 10;
          ctx.beginPath();
          ctx.moveTo(0, y + off);
          for (let x = 0; x < 128; x += 3) {
            const wave = Math.sin(x * 0.05 + y * 0.02 + f * 0.03) * 8;
            ctx.lineTo(x, y + wave + off);
          }
          ctx.stroke();
        }
        break;
      case 'stars':
        for (let i = 0; i < 30; i++) {
          const x = (i * 23 + f * 0.5) % 128;
          const y = (i * 17 + f * 0.3) % 128;
          const size = 1 + Math.sin(f * 0.05 + i) * 1.5;
          ctx.fillStyle = `rgba(255,255,255,${0.1 + Math.sin(f * 0.03 + i) * 0.1})`;
          ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI * 2); ctx.fill();
        }
        break;
      case 'dots':
        for (let i = 0; i < 25; i++) {
          const x = (i * 19 + f * 0.3) % 128;
          const y = (i * 23 + f * 0.2) % 128;
          ctx.fillStyle = `rgba(255,255,255,0.05)`;
          ctx.beginPath(); ctx.arc(x, y, 2 + Math.sin(f * 0.02 + i), 0, Math.PI * 2); ctx.fill();
        }
        break;
      case 'stripes':
        for (let i = 0; i < 10; i++) {
          const x = (i * 16 + f * 0.5) % 140 - 10;
          ctx.fillStyle = `rgba(255,255,255,0.04)`;
          ctx.fillRect(x, 0, 8, 128);
        }
        break;
    }

    // إسم التضاريس
    ctx.fillStyle = `rgba(255,255,255,${0.1 + Math.sin(f * 0.02) * 0.05})`;
    ctx.font = '12px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(terrain.emoji + ' ' + terrain.name, 64, 65);

    // حدود
    ctx.strokeStyle = `rgba(255,255,255,0.03)`;
    ctx.lineWidth = 0.5;
    ctx.strokeRect(0, 0, 128, 128);

    requestAnimationFrame(draw);
  }
  draw();

  return canvas;
}

// ============================================================
//  6. بناء الخريطة
// ============================================================

function buildMap() {
  // تنظيف القديم
  tileMeshes.forEach(mesh => {
    if (mesh.parent) mesh.parent.remove(mesh);
    if (mesh.material) {
      if (mesh.material.map) mesh.material.map.dispose();
      mesh.material.dispose();
    }
    if (mesh.geometry) mesh.geometry.dispose();
  });
  tileMeshes = [];
  tileVideos = [];

  // توليد التضاريس
  generateTerrainMap();

  for (let y = 0; y < MAP_SIZE; y++) {
    for (let x = 0; x < MAP_SIZE; x++) {
      const type = mapData[y][x];
      const terrain = TERRAIN_TYPES[type];
      
      // إنشاء فيديو خاص بالمربع
      const canvas = createTerrainVideo(type, x * MAP_SIZE + y);
      const video = document.createElement('video');
      video.muted = true;
      video.loop = true;
      video.playsInline = true;
      const stream = canvas.captureStream(30);
      video.srcObject = stream;
      video.onloadeddata = function() {
        video.play().catch(() => {});
      };
      video.load();

      // حفظ الفيديو
      tileVideos.push(video);

      // إنشاء Texture
      const texture = new THREE.VideoTexture(video);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;

      // ارتفاع المربع حسب التضاريس
      const height = terrain.height;

      // إنشاء المربع
      const geometry = new THREE.PlaneGeometry(TILE_SIZE * 0.95, TILE_SIZE * 0.95);
      const material = new THREE.MeshStandardMaterial({
        map: texture,
        side: THREE.DoubleSide,
        transparent: true,
        roughness: 0.5,
        metalness: 0.1,
        emissive: new THREE.Color(terrain.color),
        emissiveIntensity: 0.05
      });

      const mesh = new THREE.Mesh(geometry, material);
      const posX = x * TILE_SIZE - HALF + TILE_SIZE / 2;
      const posZ = y * TILE_SIZE - HALF + TILE_SIZE / 2;
      mesh.position.set(posX, height, posZ);
      mesh.rotation.x = -Math.PI / 2;
      mesh.receiveShadow = true;

      mesh.userData = {
        gridX: x,
        gridY: y,
        type: type,
        terrain: terrain,
        index: y * MAP_SIZE + x
      };

      tileGroup.add(mesh);
      tileMeshes.push(mesh);
    }
  }

  // إضافة شبكة
  addGrid();

  isReady = true;
  document.getElementById('status-bar').style.display = 'none';
  document.getElementById('char-name').textContent = '🗺️ خريطة ' + MAP_SIZE + '×' + MAP_SIZE + ' جاهزة';
  showToast('✅ خريطة ' + MAP_SIZE + '×' + MAP_SIZE + ' مع ' + Object.keys(TERRAIN_TYPES).length + ' تضاريس', 'success');
}

// ============================================================
//  7. شبكة إرشادية
// ============================================================

function addGrid() {
  if (gridHelper) {
    tileGroup.remove(gridHelper);
    gridHelper = null;
  }

  gridHelper = new THREE.GridHelper(WORLD_SIZE, MAP_SIZE, 0x8b5cf6, 0x2a2a4a);
  gridHelper.position.y = 0.05;
  gridHelper.material.transparent = true;
  gridHelper.material.opacity = gridVisible ? 0.2 : 0;
  tileGroup.add(gridHelper);
}

function toggleGrid() {
  gridVisible = !gridVisible;
  if (gridHelper) {
    gridHelper.material.opacity = gridVisible ? 0.2 : 0;
  }
  showToast(gridVisible ? '📐 شبكة ظاهرة' : '📐 شبكة مخفية', 'info');
}

// ============================================================
//  8. توليد الخريطة
// ============================================================

function generateMap() {
  document.getElementById('status-bar').style.display = 'block';
  document.getElementById('status-bar').textContent = '🔄 جاري توليد الخريطة...';
  document.getElementById('tile-info').style.display = 'block';
  
  setTimeout(() => {
    buildMap();
    document.getElementById('tile-info').textContent = '🧩 ' + MAP_SIZE + '×' + MAP_SIZE + ' = ' + (MAP_SIZE * MAP_SIZE) + ' مربع';
  }, 100);
}

// ============================================================
//  9. تحديث اللاعب
// ============================================================

function updatePlayer() {
  let dx = 0, dz = 0;
  if (touchDirs.up) dz = -PLAYER_SPEED;
  if (touchDirs.down) dz = PLAYER_SPEED;
  if (touchDirs.left) dx = -PLAYER_SPEED;
  if (touchDirs.right) dx = PLAYER_SPEED;

  const newX = playerGroup.position.x + dx;
  const newZ = playerGroup.position.z + dz;
  const limit = HALF - TILE_SIZE / 2;

  playerGroup.position.x = Math.max(-limit, Math.min(limit, newX));
  playerGroup.position.z = Math.max(-limit, Math.min(limit, newZ));

  if (dx !== 0 || dz !== 0) {
    playerGroup.rotation.y = Math.atan2(dx, dz);
  }

  // معرفة المربع الحالي
  updateActiveTile();

  // تحديث سرعة الفيديو حسب التضاريس
  updateTileSpeed();
}

function updateActiveTile() {
  const px = playerGroup.position.x + HALF;
  const pz = playerGroup.position.z + HALF;
  const col = Math.floor(px / TILE_SIZE);
  const row = Math.floor(pz / TILE_SIZE);

  if (col >= 0 && col < MAP_SIZE && row >= 0 && row < MAP_SIZE) {
    const index = row * MAP_SIZE + col;
    const type = mapData[row][col];
    const terrain = TERRAIN_TYPES[type];

    // تمييز المربع النشط
    tileMeshes.forEach((mesh, i) => {
      if (i === index) {
        mesh.material.emissive = new THREE.Color(0x8b5cf6);
        mesh.material.emissiveIntensity = 0.2;
        mesh.scale.set(1.02, 1.02, 1);
      } else {
        mesh.material.emissive = new THREE.Color(0x000000);
        mesh.material.emissiveIntensity = 0;
        mesh.scale.set(1, 1, 1);
      }
    });

    // تحديث معلومات المربع
    document.getElementById('tile-info').textContent = 
      '🧩 ' + terrain.emoji + ' ' + terrain.name + 
      ' (' + col + ', ' + row + ')';
  }
}

function updateTileSpeed() {
  const px = playerGroup.position.x + HALF;
  const pz = playerGroup.position.z + HALF;
  const col = Math.floor(px / TILE_SIZE);
  const row = Math.floor(pz / TILE_SIZE);

  if (col >= 0 && col < MAP_SIZE && row >= 0 && row < MAP_SIZE) {
    const type = mapData[row][col];
    const terrain = TERRAIN_TYPES[type];
    const speed = terrain.speed;

    // تغيير سرعة الفيديو حسب التضاريس
    const idx = row * MAP_SIZE + col;
    if (tileVideos[idx]) {
      // سرعة الحركة تؤثر على الفيديو
      const moveSpeed = Math.sqrt(
        Math.pow(touchDirs.up || touchDirs.down ? 1 : 0, 2) +
        Math.pow(touchDirs.left || touchDirs.right ? 1 : 0, 2)
      );
      const videoSpeed = speed * (0.3 + moveSpeed * 0.7);
      tileVideos[idx].playbackRate = Math.min(videoSpeed, 2);
    }
  }
}

// ============================================================
//  10. خريطة مصغرة
// ============================================================

let minimapCtx;

function setupMinimap() {
  const minimapFrame = document.getElementById('minimap-frame');
  const canvas = document.createElement('canvas');
  canvas.width = 140; canvas.height = 140;
  minimapFrame.appendChild(canvas);
  minimapCtx = canvas.getContext('2d');
}

function updateMinimap() {
  if (!minimapCtx) return;
  const ctx = minimapCtx;
  const w = 140, h = 140;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(10,10,26,0.9)';
  ctx.fillRect(0, 0, w, h);

  const scale = w / WORLD_SIZE;

  // رسم المربعات
  for (let y = 0; y < MAP_SIZE; y++) {
    for (let x = 0; x < MAP_SIZE; x++) {
      const px = x * TILE_SIZE * scale;
      const py = y * TILE_SIZE * scale;
      const size = TILE_SIZE * scale * 0.9;
      
      const type = mapData[y]?.[x] || 'PLAINS';
      const terrain = TERRAIN_TYPES[type];
      const color = new THREE.Color(terrain.color);
      ctx.fillStyle = `rgb(${color.r*255|0},${color.g*255|0},${color.b*255|0})`;
      ctx.fillRect(px, py, size, size);
    }
  }

  // اللاعب
  const px = (playerGroup.position.x + HALF) * scale;
  const py = (playerGroup.position.z + HALF) * scale;

  ctx.fillStyle = '#8b5cf6';
  ctx.shadowColor = '#8b5cf6';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.arc(px, py, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(0, 0, w, h);
}

// ============================================================
//  11. كاميرا
// ============================================================

function updateCamera() {
  const target = playerGroup.position.clone();
  camera.position.x += (target.x - camera.position.x) * 0.05;
  camera.position.z += (target.z + 10 - camera.position.z) * 0.05;
  camera.position.y += (8 - camera.position.y) * 0.05;
  camera.lookAt(target.x, 0, target.z);
}

function resetCamera() {
  camera.position.set(0, 8, 12);
  camera.lookAt(0, 0, 0);
  playerGroup.position.set(0, 0, 0);
}

// ============================================================
//  12. حلقة الرسم
// ============================================================

function animate() {
  requestAnimationFrame(animate);

  updatePlayer();
  updateCamera();
  updateMinimap();

  // تحديث الفيديوهات
  tileVideos.forEach(video => {
    if (video && video.texture) {
      video.texture.needsUpdate = true;
    }
  });

  renderer.render(scene, camera);
}

// ============================================================
//  13. تحكم
// ============================================================

function setupTouchControls() {
  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const dir = btn.getAttribute('data-dir');
    btn.addEventListener('touchstart', e => {
      e.preventDefault();
      touchDirs[dir] = true;
      btn.style.background = 'rgba(139,92,246,0.2)';
      btn.style.borderColor = '#8b5cf6';
    }, { passive: false });
    btn.addEventListener('touchend', e => {
      e.preventDefault();
      touchDirs[dir] = false;
      btn.style.background = '';
      btn.style.borderColor = '';
    }, { passive: false });
    btn.addEventListener('touchcancel', () => {
      touchDirs[dir] = false;
      btn.style.background = '';
      btn.style.borderColor = '';
    });
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') touchDirs.up = true;
  if (e.key === 'ArrowDown') touchDirs.down = true;
  if (e.key === 'ArrowLeft') touchDirs.left = true;
  if (e.key === 'ArrowRight') touchDirs.right = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowUp') touchDirs.up = false;
  if (e.key === 'ArrowDown') touchDirs.down = false;
  if (e.key === 'ArrowLeft') touchDirs.left = false;
  if (e.key === 'ArrowRight') touchDirs.right = false;
});

function showToast(message, type) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast ' + (type || '');
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

// ============================================================
//  14. الدخول
// ============================================================

function enterApp() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game-container').style.display = 'block';
  document.getElementById('minimap-frame').style.display = 'block';
  document.getElementById('minimap-label').style.display = 'block';

  initThree();

  window.addEventListener('resize', () => {
    if (camera) {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  });

  // توليد الخريطة تلقائياً
  setTimeout(generateMap, 500);
}

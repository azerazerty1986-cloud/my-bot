<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebM في 3D - يعمل</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
body { margin:0; overflow:hidden; background:#050510; font-family:sans-serif; }
#info { position:fixed; top:10px; left:50%; transform:translateX(-50%); color:#fff; background:rgba(0,0,0,0.8); padding:12px 24px; border-radius:12px; z-index:10; font-size:16px; text-align:center; }
#info .status { color:#ffd700; }
#info .error { color:#f87171; }
#info .success { color:#4ade80; }
</style>
</head>
<body>

<div id="info">
  <div class="status">⏳ جاري التحميل...</div>
</div>
<canvas id="canvas"></canvas>

<script>
// ============================================================
//  حل بسيط ومضمون لعرض الفيديو في 3D
// ============================================================

const canvas = document.getElementById('canvas');
const info = document.getElementById('info');

// --- Three.js ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 8);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

// --- إضاءة ---
const ambient = new THREE.AmbientLight(0x8b5cf6, 0.4);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);

// --- أرضية ---
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(10, 10),
  new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.9, metalness: 0.1 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// --- شبكة ---
scene.add(new THREE.GridHelper(10, 10, 0x8b5cf6, 0x333355));

// --- اللاعب (كرة متوهجة) ---
const player = new THREE.Mesh(
  new THREE.SphereGeometry(0.4, 16, 16),
  new THREE.MeshStandardMaterial({ 
    color: 0x8b5cf6, 
    emissive: 0x6d28d9, 
    emissiveIntensity: 0.5 
  })
);
player.position.y = 0.4;
scene.add(player);

// ============================================================
//  🎬 الطريقة الجديدة لعرض الفيديو
// ============================================================

// روابط فيديو تجريبية (تعمل في جميع المتصفحات)
const VIDEOS = [
  'https://www.w3schools.com/html/mov_bbb.mp4',
  'https://sample-videos.com/video321/mp4/720/big_buck_bunny_720p_1mb.mp4',
  'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4'
];

// وظيفة لعرض الفيديو
function showVideo(url) {
  info.innerHTML = `<div class="status">🎬 جاري تحميل: ${url.split('/').pop()}</div>`;
  
  // 1. إنشاء عنصر الفيديو
  const video = document.createElement('video');
  video.muted = true;
  video.loop = true;
  video.playsInline = true;
  video.crossOrigin = 'anonymous';
  video.preload = 'auto';
  video.src = url;
  
  // 2. عند تحميل الفيديو
  video.onloadedmetadata = function() {
    info.innerHTML = `<div class="success">✅ تم التحميل! جاري التشغيل...</div>`;
    
    // بدء التشغيل
    video.play().catch(() => {
      info.innerHTML = `<div class="error">⚠️ لا يمكن التشغيل التلقائي</div>`;
    });
    
    // 3. إنشاء الـ Texture
    const texture = new THREE.VideoTexture(video);
    texture.minFilter = THREE.LinearFilter;
    texture.magFilter = THREE.LinearFilter;
    texture.format = THREE.RGBAFormat;
    
    // 4. إزالة Sprite القديم إن وجد
    if (window.sprite) {
      scene.remove(window.sprite);
    }
    
    // 5. إنشاء Sprite جديد
    const material = new THREE.SpriteMaterial({ 
      map: texture, 
      transparent: true,
      depthTest: true,
      depthWrite: false
    });
    const sprite = new THREE.Sprite(material);
    sprite.scale.set(3.5, 3.5, 1);
    sprite.position.y = 2.0;
    scene.add(sprite);
    window.sprite = sprite;
    
    info.innerHTML = `<div class="success">🎬 الفيديو يعمل! (${url.split('/').pop()})</div>`;
  };
  
  // 6. عند حدوث خطأ
  video.onerror = function(e) {
    const errorMsg = video.error ? video.error.message : 'خطأ غير معروف';
    info.innerHTML = `<div class="error">❌ فشل: ${errorMsg}</div>`;
    console.error('❌ Video Error:', video.error);
    
    // تجربة الرابط التالي
    const currentIndex = VIDEOS.indexOf(url);
    if (currentIndex < VIDEOS.length - 1) {
      info.innerHTML += `<div class="status">🔄 تجربة الرابط التالي...</div>`;
      setTimeout(() => showVideo(VIDEOS[currentIndex + 1]), 1000);
    } else {
      info.innerHTML = `<div class="error">❌ جميع الروابط فشلت</div>`;
    }
  };
  
  // 7. بدء التحميل
  video.load();
}

// ============================================================
//  حلقة الرسم
// ============================================================

function animate() {
  requestAnimationFrame(animate);
  
  // دوران الكرة
  player.rotation.y += 0.03;
  
  // تحديث الـ Texture
  if (window.sprite && window.sprite.material.map) {
    window.sprite.material.map.needsUpdate = true;
  }
  
  renderer.render(scene, camera);
}

// ============================================================
//  البدء
// ============================================================

animate();

// تشغيل الفيديو الأول
setTimeout(() => {
  showVideo(VIDEOS[0]);
}, 500);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

console.log('🚀 جاهز - جاري تحميل الفيديو...');
</script>
</body>
</html>

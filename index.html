<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #000; color: white; font-family: sans-serif; margin: 0; text-align: center; }
        .header { background: linear-gradient(180deg, #1a1a1a 0%, #000 100%); padding: 25px; border-bottom: 1px solid #333; }
        .balance-val { font-size: 38px; color: #00ffa3; font-weight: bold; margin: 5px 0; }
        .radar-status { font-size: 12px; color: #ff9900; margin-top: 10px; font-weight: bold; }
        .input-box { padding: 15px; }
        input { width: 90%; padding: 14px; border-radius: 12px; border: 1px solid #333; background: #0a0a0a; color: #fff; text-align: center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px 20px; }
        button { background: #1a1a1a; color: white; border: 1px solid #333; padding: 15px; border-radius: 14px; font-weight: bold; cursor: pointer; }
        .btn-main { grid-column: span 2; background: #248bcf; border: none; font-size: 16px; }
        .btn-radar { grid-column: span 2; background: #e63946; border: none; }
    </style>
</head>
<body>
    <div class="header">
        <div style="color: #888;">رصيد المحفظة المرتبط 💰</div>
        <div class="balance-val">10.00 SOL</div>
        <div class="radar-status" id="radarStat">الرادار: متوقف 🔴</div>
    </div>

    <div class="input-box">
        <input type="text" id="ca_input" placeholder="لصق عنوان العقد (CA) للفحص...">
    </div>

    <div class="grid">
        <button class="btn-main" onclick="sendAction('تحليل:' + document.getElementById('ca_input').value)">📊 تحليل فني شامل (3 في 1)</button>
        <button class="btn-radar" id="radarBtn" onclick="toggleRadar()">🟢 تشغيل الرادار التلقائي</button>
        <button onclick="sendAction('connect_wallet')">🔗 إنشاء محفظة</button>
        <button onclick="sendAction('show_keys')">🔑 عرض المفاتيح</button>
        <button onclick="sendAction('المحفظة')">💳 تفاصيل الحساب</button>
        <button onclick="sendAction('تحديث')">🔄 تحديث البيانات</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let radarOn = false;

        function toggleRadar() {
            radarOn = !radarOn;
            const btn = document.getElementById('radarBtn');
            const stat = document.getElementById('radarStat');
            if(radarOn) {
                btn.innerText = "🔴 إيقاف الرادار"; btn.style.background = "#444";
                stat.innerText = "الرادار: يمسح الشبكة الآن... 🛰️";
                tg.sendData("start_radar");
            } else {
                btn.innerText = "🟢 تشغيل الرادار التلقائي"; btn.style.background = "#e63946";
                stat.innerText = "الرادار: متوقف 🔴";
                tg.sendData("stop_radar");
            }
        }

        function sendAction(data) {
            if(data.startsWith('تحليل:') && data.length < 15) {
                tg.showAlert("يرجى إدخال عنوان عقد صحيح أولاً!"); return;
            }
            tg.sendData(data);
        }
    </script>
</body>
</html>

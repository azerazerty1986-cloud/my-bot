<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #000;
            --card-bg: #111;
            --accent-blue: #248bcf;
            --accent-green: #00ffa3;
            --danger-red: #e63946;
            --text-secondary: #888;
        }

        body { background-color: var(--bg-color); color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding-bottom: 20px; }
        
        /* رأس الصفحة والرصيد */
        .header { background: linear-gradient(180deg, #1a1a1a 0%, #000 100%); padding: 20px; border-bottom: 1px solid #333; }
        .balance-val { font-size: 32px; color: var(--accent-green); font-weight: bold; margin: 5px 0; }
        
        /* بطاقة التحليل (محاكاة للصورة المرفقة) */
        .analysis-card {
            background: var(--card-bg);
            margin: 15px;
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #222;
            text-align: right;
        }
        .token-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 10px; margin-bottom: 10px; }
        .stat-row { display: flex; justify-content: space-between; margin: 8px 0; font-size: 15px; }
        .rsi-badge { background: #222; padding: 4px 10px; border-radius: 8px; color: #ff4d4d; font-family: monospace; }

        /* الأزرار والمدخلات */
        .input-box { padding: 10px 15px; }
        input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #333; background: #0a0a0a; color: #fff; text-align: center; box-sizing: border-box; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 15px; }
        button { background: #1a1a1a; color: white; border: 1px solid #333; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.98); opacity: 0.8; }
        
        .btn-main { grid-column: span 2; background: var(--accent-blue); border: none; font-size: 16px; margin-top: 5px; }
        .btn-radar { grid-column: span 2; background: var(--danger-red); border: none; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="header">
        <div style="color: var(--text-secondary); font-size: 14px;">رصيد المحفظة 💰</div>
        <div class="balance-val">10.00 SOL</div>
        <div id="radarStat" style="color: #ff9900; font-size: 12px; font-weight: bold;">الرادار: متوقف 🔴</div>
    </div>

    <div class="analysis-card">
        <div class="token-header">
            <span style="font-size: 18px; font-weight: bold;">📊 تحليل Pepe</span>
            <span class="rsi-badge">📈 RSI: 50.7</span>
        </div>
        <div class="stat-row">
            <span>السعر:</span>
            <span style="color: var(--accent-green); font-family: monospace;">$0.00021820</span>
        </div>
        <div class="stat-row">
            <span>الذكي 🧠:</span>
            <span>انتظار ⚪</span>
        </div>
        <div class="stat-row">
            <span>الأمان 🛡️:</span>
            <span style="color: #ffcc00;">Unknown ⚠️</span>
        </div>
    </div>

    <div class="input-box">
        <input type="text" id="ca_input" placeholder="ضع عنوان العقد (CA) هنا...">
    </div>

    <div class="grid">
        <button class="btn-main" onclick="sendAction('تحليل:' + document.getElementById('ca_input').value)">📊 تحليل فني شامل (3 في 1)</button>
        <button class="btn-radar" id="radarBtn" onclick="toggleRadar()">🟢 تشغيل الرادار التلقائي</button>
        
        <button onclick="sendAction('الثالوث الذكي')">🧠 الثالوث الذكي</button>
        <button onclick="sendAction('المضارب المحترف')">⚡ المضارب</button>
        <button onclick="sendAction('المدافع الحكيم')">🛡️ المدافع</button>
        <button onclick="sendAction('المحفظة')">💰 المحفظة</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        function toggleRadar() {
            let btn = document.getElementById('radarBtn');
            let stat = document.getElementById('radarStat');
            if (btn.innerText.includes("تشغيل")) {
                btn.innerText = "🔴 إيقاف الرادار";
                btn.style.background = "#444";
                stat.innerText = "الرادار: يمسح الشبكة الآن... 🛰️";
                tg.sendData("start_radar");
            } else {
                btn.innerText = "🟢 تشغيل الرادار التلقائي";
                btn.style.background = "#e63946";
                stat.innerText = "الرادار: متوقف 🔴";
                tg.sendData("stop_radar");
            }
        }

        function sendAction(data) {
            tg.sendData(data);
        }
    </script>
</body>
</html>

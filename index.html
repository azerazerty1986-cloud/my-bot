<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎮 العوالم القتالية - النسخة الكاملة</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Cairo',sans-serif; background:#050510; color:#fff; overflow:hidden; }

canvas { display:block; width:100%; height:100%; }

/* شاشة البداية */
#start-screen {
  position:fixed; inset:0; z-index:2000;
  background:linear-gradient(135deg,#0a0a2a,#000);
  display:flex; flex-direction:column; justify-content:center; align-items:center; gap:20px;
}
.start-logo { font-size:48px; font-weight:900; color:#ffd700; animation:float 3s ease-in-out infinite; }
.start-subtitle { font-size:14px; color:#888; text-align:center; max-width:400px; line-height:1.8; }
.start-subtitle span { color:#ffd700; }
.start-btn {
  border:2px solid #00f2ff; color:#00f2ff; padding:16px 50px;
  background:rgba(0,242,255,0.08); border-radius:60px; font-size:20px;
  cursor:pointer; transition:all .3s; font-weight:700; font-family:inherit;
}
.start-btn:hover { transform:scale(1.05); background:#00f2ff; color:#000; box-shadow:0 0 50px rgba(0,242,255,0.4); }
.version-tag { position:absolute; bottom:15px; font-size:11px; color:#444; }
@keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }

/* HUD */
#hud {
  position:fixed; top:10px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.85); padding:5px 14px; border-radius:14px;
  z-index:100; display:flex; gap:12px; font-size:11px;
  border:1px solid rgba(255,255,255,0.05);
  flex-wrap:wrap; justify-content:center;
}
#hud .stat { text-align:center; }
#hud .stat .val { font-weight:bold; }
#hud .stat .health { color:#4ade80; }
#hud .stat .kills { color:#ffd700; }
#hud .stat .label { font-size:8px; color:#666; display:block; }

#health-bar-container {
  position:fixed; bottom:130px; left:50%; transform:translateX(-50%);
  width:200px; height:6px; background:rgba(255,255,255,0.05);
  border-radius:3px; z-index:100; overflow:hidden;
}
#health-bar {
  height:100%; width:100%; background:linear-gradient(90deg,#4ade80,#22d3ee);
  border-radius:3px; transition:width 0.3s;
}

#game-message {
  position:fixed; bottom:160px; left:50%; transform:translateX(-50%);
  color:#ffd700; font-size:16px; font-weight:bold; z-index:100;
  text-shadow:0 0 20px rgba(255,215,0,0.3);
  opacity:0; transition:opacity 0.5s;
}
#game-message.show { opacity:1; }

#controls {
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
  display:flex; gap:4px; z-index:100; flex-wrap:wrap; justify-content:center;
}
#controls button {
  background:rgba(139,92,246,0.15); color:#fff; border:1px solid rgba(139,92,246,0.2);
  padding:4px 10px; border-radius:10px; cursor:pointer; font-size:9px; font-family:inherit;
  transition:all 0.3s;
}
#controls button:hover { background:rgba(139,92,246,0.3); }

.dpad {
  position:fixed; bottom:80px; left:16px; width:100px; height:100px; z-index:200;
}
.dpad-btn {
  position:absolute; width:34px; height:34px; border-radius:50%;
  background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.1);
  display:flex; align-items:center; justify-content:center; font-size:14px;
  color:rgba(255,255,255,0.35); cursor:pointer;
}
.dpad-btn:active { background:rgba(139,92,246,0.3); color:#c4b5fd; transform:scale(0.9); }
.dpad-up { top:0; left:33px; }
.dpad-down { bottom:0; left:33px; }
.dpad-left { top:33px; left:0; }
.dpad-right { top:33px; right:0; }

#fire-btn {
  position:fixed; bottom:90px; right:20px;
  width:60px; height:60px; border-radius:50%;
  background:rgba(255,68,68,0.2); border:2px solid rgba(255,68,68,0.4);
  color:#ff4444; font-size:24px; cursor:pointer; z-index:200;
  display:flex; align-items:center; justify-content:center;
}
#fire-btn:active { transform:scale(0.85); background:rgba(255,68,68,0.4); }

#enter-btn, #exit-btn {
  position:fixed; bottom:140px; left:50%; transform:translateX(-50%);
  padding:6px 18px; border-radius:12px; border:none; font-size:12px;
  font-family:inherit; cursor:pointer; z-index:150; display:none;
}
#enter-btn { background:rgba(0,242,255,0.2); color:#fff; border:1px solid rgba(0,242,255,0.3); }
#exit-btn { background:rgba(248,113,113,0.2); color:#fff; border:1px solid rgba(248,113,113,0.3); }

#transition-screen {
  position:fixed; inset:0; z-index:500;
  background:rgba(0,0,0,0.88); display:none;
  justify-content:center; align-items:center; flex-direction:column;
}
#transition-screen .spinner {
  width:40px; height:40px; border:3px solid rgba(255,215,0,0.15);
  border-top-color:#ffd700; border-radius:50%; animation:spin 0.9s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
#transition-text { margin-top:14px; color:#ffd700; font-size:14px; }

#toast-container {
  position:fixed; bottom:110px; left:50%; transform:translateX(-50%);
  z-index:1000; display:flex; flex-direction:column; gap:4px; align-items:center;
  pointer-events:none;
}
.toast {
  background:rgba(0,0,0,0.9); color:#fff; padding:4px 14px;
  border-radius:14px; font-size:11px; border:1px solid rgba(255,255,255,0.06);
  animation: fadeIn 0.25s;
}
.toast.success { border-color:#4ade80; }
.toast.error { border-color:#f87171; }
.toast.info { border-color:#60a5fa; }
@keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

#minimap-frame {
  position:fixed; top:50px; left:10px; width:100px; height:100px;
  border:2px solid #ffd700; border-radius:10px; overflow:hidden;
  background:rgba(5,5,16,0.7); z-index:90; display:none;
}

#video-controls {
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
  z-index:300; display:none; gap:8px; align-items:center;
  background:rgba(0,0,0,0.85); padding:6px 14px; border-radius:16px;
}
#video-controls button {
  background:rgba(255,255,255,0.1); border:none; color:#fff;
  width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:14px;
}
#video-controls input[type="range"] { width:100px; height:3px; -webkit-appearance:none; background:rgba(255,255,255,0.2); border-radius:2px; }
#video-controls input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:8px; height:8px; border-radius:50%; background:#ffd700; cursor:pointer; }

#game-over {
  position:fixed; inset:0; z-index:500;
  background:rgba(0,0,0,0.9); display:none;
  justify-content:center; align-items:center; flex-direction:column; gap:15px;
}
#game-over h1 { font-size:36px; }
#game-over .final-stats { color:#aaa; font-size:14px; text-align:center; line-height:1.8; }
#game-over button {
  padding:10px 35px; border-radius:25px; border:none;
  background:#ffd700; color:#111; font-size:16px; font-weight:bold;
  cursor:pointer; font-family:inherit;
}

#upload-modal {
  position:fixed; inset:0; z-index:500;
  background:rgba(0,0,0,0.8); display:none;
  justify-content:center; align-items:center;
}
#upload-modal .modal-content {
  background:rgba(10,10,30,0.95); border:1px solid rgba(255,215,0,0.2);
  border-radius:14px; padding:20px; max-width:380px; width:90%;
}
#upload-modal .modal-title { color:#ffd700; font-size:16px; font-weight:700; text-align:center; margin-bottom:12px; }
#upload-modal .modal-field { margin-bottom:10px; }
#upload-modal .modal-field label { display:block; color:#888; font-size:10px; margin-bottom:3px; }
#upload-modal .modal-field input, #upload-modal .modal-field select {
  width:100%; padding:6px 10px; border-radius:6px;
  border:1px solid rgba(255,215,0,0.1); background:#0a0a1a;
  color:#fff; font-size:11px; font-family:inherit;
}
#upload-modal .file-upload-area {
  border:2px dashed rgba(255,215,0,0.15); border-radius:6px;
  padding:15px; text-align:center; cursor:pointer; margin-bottom:10px;
}
#upload-modal .file-upload-area .icon { font-size:30px; display:block; margin-bottom:4px; }
#upload-modal .file-upload-area .text { color:#666; font-size:11px; }
#upload-modal .file-upload-area .file-name { color:#4ade80; font-size:10px; display:none; }
#upload-modal .modal-actions { display:flex; gap:8px; margin-top:12px; }
#upload-modal .modal-actions button { flex:1; padding:6px; border:none; border-radius:6px; font-weight:700; font-size:11px; cursor:pointer; font-family:inherit; }
.btn-secondary { background:rgba(255,255,255,0.05); color:#888; }
.btn-success { background:#4ade80; color:#111; }

#file-input { display:none; }
</style>
</head>
<body>

<!-- شاشة البداية -->
<div id="start-screen">
  <div class="start-logo">🎮 العوالم القتالية</div>
  <div class="start-subtitle">
    <span>🏆 20+ ميزة</span><br>
    خريطة · معالم · عوالم · فيديو 360 · قتال
  </div>
  <button class="start-btn" onclick="startGame()">🚀 ابدأ</button>
  <div class="version-tag">v63.0 | الكاملة</div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="stat"><span class="val health" id="health-display">100</span><span class="label">❤️ صحة</span></div>
  <div class="stat"><span class="val kills" id="kills-display">0</span><span class="label">💀 قتلى</span></div>
  <div class="stat"><span class="val" id="score-display" style="color:#ffd700;">0</span><span class="label">🏆 نقاط</span></div>
  <div class="stat"><span class="val" id="level-display" style="color:#60a5fa;">1</span><span class="label">⭐ مستوى</span></div>
  <div class="stat"><span class="val" id="world-count" style="color:#a78bfa;">1</span><span class="label">🌍 عوالم</span></div>
  <div class="stat"><span class="val" id="landmark-count" style="color:#fbbf24;">0</span><span class="label">📍 معالم</span></div>
</div>

<div id="health-bar-container"><div id="health-bar"></div></div>
<div id="game-message">⚔️ استكشف واقتل الأعداء!</div>

<div id="controls">
  <button onclick="spawnEnemy()">👾 عدو</button>
  <button onclick="healPlayer()">💚 شفاء</button>
  <button onclick="addLandmark()">📍 معلم</button>
  <button onclick="addRandomWorld()">🌍 عالم</button>
  <button onclick="openUploadModal()">📁 رفع</button>
  <button onclick="resetGame()">🔄 إعادة</button>
</div>

<div class="dpad" id="dpad">
  <div class="dpad-btn dpad-up" data-dir="up">▲</div>
  <div class="dpad-btn dpad-down" data-dir="down">▼</div>
  <div class="dpad-btn dpad-left" data-dir="left">◀</div>
  <div class="dpad-btn dpad-right" data-dir="right">▶</div>
</div>

<button id="fire-btn" onclick="fireWeapon()">🔫</button>
<button id="enter-btn" onclick="enterWorld()">🌐 دخول</button>
<button id="exit-btn" onclick="exitWorld()">🚪 خروج</button>

<div id="transition-screen">
  <div class="spinner"></div>
  <div id="transition-text">جاري الانتقال...</div>
</div>

<div id="toast-container"></div>
<div id="minimap-frame"></div>

<div id="video-controls">
  <button onclick="togglePlay()">⏸️</button>
  <input type="range" id="video-progress" min="0" max="100" value="0">
  <span id="video-time" style="font-size:10px;color:#aaa;min-width:60px;">00:00</span>
  <button onclick="toggleMute()">🔊</button>
</div>

<div id="game-over">
  <h1>💀 انتهت اللعبة</h1>
  <div class="final-stats">
    <div>💀 قتلى: <span id="final-kills">0</span></div>
    <div>🏆 نقاط: <span id="final-score">0</span></div>
    <div>⭐ المستوى: <span id="final-level">1</span></div>
    <div>🌍 عوالم: <span id="final-worlds">1</span></div>
  </div>
  <button onclick="restartGame()">🔄 العب مجدداً</button>
</div>

<div id="upload-modal">
  <div class="modal-content">
    <div class="modal-title">📁 رفع فيديو/صورة</div>
    <div class="modal-field">
      <label>🏷️ الاسم</label>
      <input type="text" id="lm-name" placeholder="اسم المعلم">
    </div>
    <div class="modal-field">
      <label>📂 النوع</label>
      <select id="lm-type">
        <option value="video">🎬 فيديو</option>
        <option value="image">🖼️ صورة</option>
        <option value="video360">🌐 فيديو 360</option>
      </select>
    </div>
    <div class="modal-field">
      <label>📍 الإحداثيات</label>
      <div style="display:flex;gap:6px;">
        <input type="number" id="lm-row" placeholder="صف" min="0" max="11" style="flex:1;">
        <input type="number" id="lm-col" placeholder="عمود" min="0" max="11" style="flex:1;">
      </div>
    </div>
    <div class="file-upload-area" onclick="document.getElementById('file-input').click()">
      <span class="icon">📁</span>
      <span class="text">اختر ملف</span>
      <span class="file-name" id="file-name-display"></span>
    </div>
    <input type="file" id="file-input" accept="video/*,.webm,.mp4,.mov,image/*" onchange="handleLandmarkFile(event)">
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeUploadModal()">✖ إلغاء</button>
      <button class="btn-success" onclick="addLandmarkFromModal()">✅ إضافة</button>
    </div>
  </div>
</div>

<canvas id="canvas"></canvas>

<script>
// ============================================================
//  🎮 العوالم القتالية - النسخة الكاملة
//  جميع النقاط المطلوبة
// ============================================================

// ============================================================
//  1. المتغيرات العامة
// ============================================================

let scene, camera, renderer;
let playerGroup, tileGroup;
let tileMeshes = [];
let gridHelper = null;
let minimapCtx = null;
let isTransitioning = false;
let isInWorld = false;
let currentWorldId = 'main';
let savedPlayerPos = null;

let touchDirs = { up:false, down:false, left:false, right:false };
const PLAYER_SPEED = 0.10;

// إحصائيات اللاعب
let playerHealth = 100;
let maxHealth = 100;
let kills = 0;
let score = 0;
let level = 1;
let xp = 0;
const XP_PER_LEVEL = 50;
let visitedWorlds = new Set(['main']);

// الخريطة
let GRID = 12;
let TILE_SIZE = 3;
let WORLD_SIZE = GRID * TILE_SIZE;
let HALF = WORLD_SIZE / 2;
let gridVisible = true;
let gameRunning = true;

// المعالم
let landmarks = [];
let nextLandmarkId = 1;
let pendingFile = null;

// العوالم
let worlds = [];
let worldItems = [];

// القتال
let enemies = [];
let bullets = [];
let enemySpawnTimer = 0;
let lastFireTime = 0;
const BULLET_SPEED = 0.5;

// فيديو 360
let videoMesh = null;
let videoTexture = null;
let videoElement = null;
let isVideoPlaying = true;
let isVideoMuted = false;
let lon = 0, lat = 0;
let isDragging = false;

// ============================================================
//  2. العوالم الافتراضية
// ============================================================

function createDefaultWorlds() {
  worlds = [
    {
      id: 'main',
      name: 'الخريطة الرئيسية',
      grid: 12,
      tileSize: 3,
      startPosition: { x: 0, z: 0 },
      background: '#0a0a1a',
      items: [
        { id: 'p1', type: 'portal', title: 'عالم القتال', emoji: '⚔️', row: 3, col: 3, targetWorld: 'world_fight' },
        { id: 'p2', type: 'portal', title: 'فيديو 360', emoji: '🌐', row: 3, col: 8, targetWorld: 'world_360' },
        { id: 'p3', type: 'portal', title: 'معرض الصور', emoji: '🖼️', row: 8, col: 3, targetWorld: 'world_gallery' }
      ]
    },
    {
      id: 'world_fight',
      name: '⚔️ ساحة القتال',
      grid: 10,
      tileSize: 3,
      startPosition: { x: 0, z: 0 },
      background: '#1a0a0a',
      items: []
    },
    {
      id: 'world_360',
      name: '🌐 فيديو 360',
      grid: 6,
      tileSize: 4,
      startPosition: { x: 0, z: 0 },
      background: '#050510',
      videoUrl: 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm',
      items: []
    },
    {
      id: 'world_gallery',
      name: '🖼️ معرض الصور',
      grid: 8,
      tileSize: 3.5,
      startPosition: { x: 0, z: 0 },
      background: '#0a0a2e',
      items: [
        { id: 1, type: 'image', title: '🌊 موجة', emoji: '🌊', row: 2, col: 2 },
        { id: 2, type: 'image', title: '🔥 نار', emoji: '🔥', row: 2, col: 5 },
        { id: 3, type: 'image', title: '🌈 قوس قزح', emoji: '🌈', row: 5, col: 2 }
      ]
    }
  ];
}

// ============================================================
//  3. دوال مساعدة
// ============================================================

function showToast(msg, type = 'info') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function showMessage(text, duration = 1500) {
  const el = document.getElementById('game-message');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(el._timeout);
  el._timeout = setTimeout(() => el.classList.remove('show'), duration);
}

function showTransition(text) {
  document.getElementById('transition-text').textContent = text;
  document.getElementById('transition-screen').style.display = 'flex';
}
function hideTransition() {
  document.getElementById('transition-screen').style.display = 'none';
}

function updateHUD() {
  document.getElementById('health-display').textContent = Math.round(playerHealth);
  document.getElementById('kills-display').textContent = kills;
  document.getElementById('score-display').textContent = score;
  document.getElementById('level-display').textContent = level;
  document.getElementById('world-count').textContent = visitedWorlds.size;
  document.getElementById('landmark-count').textContent = landmarks.length;
  
  const healthPercent = (playerHealth / maxHealth) * 100;
  document.getElementById('health-bar').style.width = healthPercent + '%';
  if (healthPercent < 30) {
    document.getElementById('health-bar').style.background = 'linear-gradient(90deg,#f87171,#ef4444)';
  } else {
    document.getElementById('health-bar').style.background = 'linear-gradient(90deg,#4ade80,#22d3ee)';
  }
}

function addXP(amount) {
  xp += amount;
  while (xp >= XP_PER_LEVEL) {
    xp -= XP_PER_LEVEL;
    level++;
    playerHealth = Math.min(maxHealth, playerHealth + 20);
    showMessage('⭐ ترقية! المستوى ' + level, 2000);
  }
  updateHUD();
}

function getWorld(id) { return worlds.find(w => w.id === id); }
function getCurrentWorld() { return getWorld(currentWorldId); }
function getPlayerTile() {
  const px = playerGroup.position.x + HALF;
  const pz = playerGroup.position.z + HALF;
  return { col: Math.floor(px / TILE_SIZE), row: Math.floor(pz / TILE_SIZE) };
}

// ============================================================
//  4. بناء العالم
// ============================================================

function clearWorld() {
  tileMeshes.forEach(m => {
    if (m.parent) m.parent.remove(m);
    if (m.material?.map) m.material.map.dispose();
    if (m.material) m.material.dispose();
    if (m.geometry) m.geometry.dispose();
  });
  tileMeshes = [];
  
  if (gridHelper && gridHelper.parent) { gridHelper.parent.remove(gridHelper); gridHelper = null; }
  
  if (videoMesh) {
    if (videoMesh.parent) videoMesh.parent.remove(videoMesh);
    if (videoMesh.material?.map) videoMesh.material.map.dispose();
    if (videoMesh.material) videoMesh.material.dispose();
    if (videoMesh.geometry) videoMesh.geometry.dispose();
    videoMesh = null;
  }
  if (videoTexture) { videoTexture.dispose(); videoTexture = null; }
  if (videoElement) { try { videoElement.pause(); } catch(e) {} videoElement = null; }
  document.getElementById('video-controls').style.display = 'none';
}

function buildWorld(worldId) {
  const world = getWorld(worldId);
  if (!world) return;
  
  clearWorld();
  currentWorldId = worldId;
  GRID = world.grid || 8;
  TILE_SIZE = world.tileSize || 3;
  WORLD_SIZE = GRID * TILE_SIZE;
  HALF = WORLD_SIZE / 2;
  
  scene.background = new THREE.Color(world.background || '#0a0a1a');
  
  // بناء المربعات
  for (let row = 0; row < GRID; row++) {
    for (let col = 0; col < GRID; col++) {
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      
      const item = world.items?.find(i => i.row === row && i.col === col);
      
      if (item) {
        ctx.fillStyle = item.type === 'portal' ? '#0a2a3a' : '#1a1a2e';
        ctx.fillRect(0, 0, 128, 128);
        ctx.fillStyle = item.type === 'portal' ? '#00f2ff' : '#ffd700';
        ctx.font = item.emoji ? '42px Arial' : '24px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(item.emoji || '📌', 64, 48);
        ctx.font = '11px Arial';
        ctx.fillStyle = '#ffffff';
        ctx.fillText((item.title || '').substring(0, 12), 64, 95);
      } else {
        const colors = ['#1a1a2e', '#16213e', '#0f3460', '#1e293b', '#2d1b3d'];
        ctx.fillStyle = colors[(row + col) % colors.length];
        ctx.fillRect(0, 0, 128, 128);
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.font = '12px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(col + ',' + row, 64, 64);
      }
      
      const tex = new THREE.CanvasTexture(canvas);
      const geo = new THREE.PlaneGeometry(TILE_SIZE * 0.95, TILE_SIZE * 0.95);
      const mat = new THREE.MeshStandardMaterial({ map: tex, side: THREE.DoubleSide, roughness: 0.4, metalness: 0.1 });
      const mesh = new THREE.Mesh(geo, mat);
      const posX = col * TILE_SIZE - HALF + TILE_SIZE / 2;
      const posZ = row * TILE_SIZE - HALF + TILE_SIZE / 2;
      mesh.position.set(posX, 0, posZ);
      mesh.rotation.x = -Math.PI / 2;
      mesh.userData = { row, col, item: item || null };
      tileGroup.add(mesh);
      tileMeshes.push(mesh);
    }
  }
  
  // أيقونات عائمة
  if (world.items) {
    world.items.forEach(item => {
      const posX = item.col * TILE_SIZE - HALF + TILE_SIZE / 2;
      const posZ = item.row * TILE_SIZE - HALF + TILE_SIZE / 2;
      
      if (item.emoji) {
        const c = document.createElement('canvas');
        c.width = 128; c.height = 128;
        const cx = c.getContext('2d');
        cx.font = '80px Arial';
        cx.textAlign = 'center';
        cx.textBaseline = 'middle';
        cx.fillText(item.emoji, 64, 64);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthTest: false }));
        sprite.scale.set(1.4, 1.4, 1);
        sprite.position.set(posX, 1.25, posZ);
        scene.add(sprite);
      }
      
      if (item.type === 'portal') {
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(0.55, 0.8, 32),
          new THREE.MeshBasicMaterial({ color: 0x00f2ff, transparent: true, opacity: 0.4, side: THREE.DoubleSide })
        );
        ring.rotation.x = -Math.PI / 2;
        ring.position.set(posX, 0.06, posZ);
        scene.add(ring);
      }
    });
  }
  
  // فيديو 360
  if (world.type === 'video360' && world.videoUrl) {
    createVideo360(world.videoUrl);
    document.getElementById('video-controls').style.display = 'flex';
  }
  
  // شبكة
  gridHelper = new THREE.GridHelper(WORLD_SIZE, GRID, 0x8b5cf6, 0x2a2a4a);
  gridHelper.position.y = 0.04;
  gridHelper.material.transparent = true;
  gridHelper.material.opacity = gridVisible ? 0.18 : 0;
  tileGroup.add(gridHelper);
  
  document.getElementById('status').textContent = '📍 ' + world.name;
  document.getElementById('exit-btn').style.display = (worldId !== 'main') ? 'block' : 'none';
  document.getElementById('enter-btn').style.display = 'none';
  
  isInWorld = (worldId !== 'main');
  
  if (world.startPosition) {
    playerGroup.position.set(world.startPosition.x, 0, world.startPosition.z);
  }
  
  // إعادة تعيين الأعداء في عالم القتال
  if (worldId === 'world_fight') {
    enemies.forEach(e => scene.remove(e));
    enemies = [];
    enemySpawnTimer = 0;
  }
  
  updateHUD();
  updateActiveTile();
}

//  5. فيديو 360
// ============================================================

function createVideo360(url) {
  videoElement = document.createElement('video');
  videoElement.muted = false;
  videoElement.loop = true;
  videoElement.playsInline = true;
  videoElement.crossOrigin = 'anonymous';
  videoElement.src = url;
  videoElement.volume = 0.35;
  
  videoElement.addEventListener('loadeddata', () => {
    videoElement.play().catch(() => {});
    videoTexture = new THREE.VideoTexture(videoElement);
    videoTexture.minFilter = THREE.LinearFilter;
    videoTexture.magFilter = THREE.LinearFilter;
    
    const geo = new THREE.SphereGeometry(6, 64, 64);
    const mat = new THREE.MeshBasicMaterial({ map: videoTexture, side: THREE.BackSide });
    videoMesh = new THREE.Mesh(geo, mat);
    videoMesh.position.set(0, 0, 0);
    scene.add(videoMesh);
    
    camera.position.set(0, 0, 0);
    lon = 0; lat = 0;
    update360Camera();
  });
  videoElement.load();
}

function update360Camera() {
  const phi = THREE.MathUtils.degToRad(90 - lat);
  const theta = THREE.MathUtils.degToRad(lon);
  const target = new THREE.Vector3(
    Math.sin(phi) * Math.cos(theta),
    Math.cos(phi),
    Math.sin(phi) * Math.sin(theta)
  );
  camera.lookAt(target);
}

document.addEventListener('pointerdown', e => {
  if (!isInWorld || getCurrentWorld()?.id !== 'world_360') return;
  isDragging = true;
  onPointerDownX = e.clientX;
  onPointerDownY = e.clientY;
  onPointerDownLon = lon;
  onPointerDownLat = lat;
});

document.addEventListener('pointermove', e => {
  if (!isDragging) return;
  lon = onPointerDownLon - (e.clientX - onPointerDownX) * 0.15;
  lat = Math.max(-85, Math.min(85, onPointerDownLat + (e.clientY - onPointerDownY) * 0.15));
  update360Camera();
});

document.addEventListener('pointerup', () => { isDragging = false; });
document.addEventListener('pointerleave', () => { isDragging = false; });

function togglePlay() {
  if (!videoElement) return;
  if (isVideoPlaying) { videoElement.pause(); document.querySelector('#video-controls button:first-child').textContent = '▶️'; }
  else { videoElement.play(); document.querySelector('#video-controls button:first-child').textContent = '⏸️'; }
  isVideoPlaying = !isVideoPlaying;
}

function toggleMute() {
  if (!videoElement) return;
  isVideoMuted = !isVideoMuted;
  videoElement.muted = isVideoMuted;
  document.querySelector('#video-controls button:last-child').textContent = isVideoMuted ? '🔇' : '🔊';
}

// ============================================================
//  6. الدخول والخروج من العوالم
// ============================================================

function enterWorld() {
  if (isTransitioning || currentWorldId !== 'main') return;
  
  const { row, col } = getPlayerTile();
  const world = getCurrentWorld();
  const item = world.items?.find(i => i.row === row && i.col === col && i.type === 'portal');
  
  if (!item || !item.targetWorld) {
    showToast('❌ لا توجد بوابة هنا', 'error');
    return;
  }
  
  const target = getWorld(item.targetWorld);
  if (!target) { showToast('❌ العالم غير موجود', 'error'); return; }
  
  isTransitioning = true;
  savedPlayerPos = { x: playerGroup.position.x, z: playerGroup.position.z };
  showTransition('جاري الدخول إلى ' + target.name);
  
  setTimeout(() => {
    buildWorld(item.targetWorld);
    
    if (!visitedWorlds.has(item.targetWorld)) {
      visitedWorlds.add(item.targetWorld);
      score += 50;
      addXP(30);
      showToast('🏆 اكتشاف عالم جديد! +50', 'success');
    }
    
    if (target.id === 'world_360') {
      camera.position.set(0, 0, 0);
      lon = 0; lat = 0;
      update360Camera();
    } else {
      camera.position.set(0, 6.5, 11);
      camera.lookAt(0, 0.5, 0);
    }
    
    hideTransition();
    isTransitioning = false;
    showToast('✅ دخلت: ' + target.name, 'success');
  }, 700);
}

function exitWorld() {
  if (isTransitioning || currentWorldId === 'main') return;
  
  isTransitioning = true;
  showTransition('جاري العودة للخريطة...');
  
  setTimeout(() => {
    buildWorld('main');
    if (savedPlayerPos) {
      playerGroup.position.set(savedPlayerPos.x, 0, savedPlayerPos.z);
      savedPlayerPos = null;
    }
    camera.position.set(0, 7, 12);
    camera.lookAt(0, 0, 0);
    hideTransition();
    isTransitioning = false;
    showToast('✅ عدت للخريطة الرئيسية', 'success');
  }, 600);
}

function addLandmark() {
  const emojis = ['🏰','🌲','🌊','⛰️','🏜️','🌋','🏗️','🌺','🕌','🏯','🎪','🏟️'];
  const names = ['قلعة','غابة','بحيرة','جبل','صحراء','بركان','مبنى','حديقة','مسجد','معبد','سيرك','ملعب'];
  
  const idx = Math.floor(Math.random() * emojis.length);
  const x = (Math.random() - 0.5) * 20;
  const z = (Math.random() - 0.5) * 20;
  
  landmarks.push({
    id: nextLandmarkId++,
    name: emojis[idx] + ' ' + names[idx],
    emoji: emojis[idx],
    x: x,
    z: z,
    color: '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0')
  });
  
  showToast('📍 تم إضافة معلم: ' + names[idx], 'success');
  updateHUD();
  renderLandmarks();
}

function renderLandmarks() {
  if (window.landmarkMeshes) {
    window.landmarkMeshes.forEach(m => {
      if (m.parent) m.parent.remove(m);
      if (m.material) m.material.dispose();
      if (m.geometry) m.geometry.dispose();
    });
  }
  window.landmarkMeshes = [];
  
  landmarks.forEach(lm => {
    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.3, 12, 12),
      new THREE.MeshStandardMaterial({ color: lm.color, emissive: lm.color, emissiveIntensity: 0.2, transparent: true, opacity: 0.8 })
    );
    sphere.position.set(lm.x, 0.3, lm.z);
    sphere.castShadow = true;
    scene.add(sphere);
    window.landmarkMeshes.push(sphere);
    
    const pillar = new THREE.Mesh(
      new THREE.CylinderGeometry(0.02, 0.05, 1.5, 6),
      new THREE.MeshBasicMaterial({ color: lm.color, transparent: true, opacity: 0.15 })
    );
    pillar.position.set(lm.x, 0.8, lm.z);
    scene.add(pillar);
    window.landmarkMeshes.push(pillar);
    
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, 64, 64);
    ctx.font = '36px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(lm.emoji, 32, 32);
    
    const sprite = new THREE.Sprite(
      new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true, depthTest: false })
    );
    sprite.scale.set(0.8, 0.8, 1);
    sprite.position.set(lm.x, 1.2, lm.z);
    scene.add(sprite);
    window.landmarkMeshes.push(sprite);
  });
}

function addRandomWorld() {
  const emojis = ['🎮','🎯','🎨','🌈','⭐','🌺','🌸','🌊','🔥','💫','🚀','🌙'];
  const titles = ['ملصقات','فن','طبيعة','خيال','مغامرات','ألعاب','رياضة','موسيقى'];
  
  const newId = 'world_' + Date.now();

    id: newId,
    name: '🌍 ' + titles[Math.floor(Math.random() * titles.length)],
    grid: 8,
    tileSize: 3.5,
    startPosition: { x: 0, z: 0 },
    background: '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0'),
    items: []
  };
  
  const num = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < num; i++) {
    let r, c;
    do {

      emoji: emojis[i % emojis.length],
      row: r,
      col: c
    });

  worlds.push(newWorld);
  
  const main = getWorld('main');
  if (main) {
    let pr, pc;
    do {
      pr = 1 + Math.floor(Math.random() * 10);
      pc = 1 + Math.floor(Math.random() * 10);
    } while (main.items.some(it => it.row === pr && it.col === pc));
    
    main.items.push({
      id: 'portal_' + Date.now(),
      type: 'portal',
      title: newWorld.name,
      emoji: '🌐',
      row: pr,
      col: pc,
      targetWorld: newId
    });
    
    if (currentWorldId === 'main') buildWorld('main');

  showToast('✅ تم إنشاء عالم جديد: ' + newWorld.name, 'success');
}

function spawnEnemy() {
  if (!gameRunning || currentWorldId !== 'world_fight') {
    showToast('⚠️ فقط في ساحة القتال', 'warn');
    return;
  }
  
  const angle = Math.random() * Math.PI * 2;
  const distance = 4 + Math.random() * 4;
  const x = playerGroup.position.x + Math.cos(angle) * distance;
  const z = playerGroup.position.z + Math.sin(angle) * distance;
  
  const limit = GRID * TILE_SIZE / 2 - 1;
  const posX = Math.max(-limit, Math.min(limit, x));
  const posZ = Math.max(-limit, Math.min(limit, z));
  
  const enemy = createEnemyMesh(posX, posZ);
  enemies.push(enemy);
  showMessage('👾 عدو ظهر!', 800);
}

function createEnemyMesh(x, z) {
  const group = new THREE.Group();
  
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.35, 0.6, 8),
    new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xdc2626, emissiveIntensity: 0.2 })
  );
  body.position.y = 0.3;
  body.castShadow = true;
  group.add(body);
  
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.18, 8, 8),
    new THREE.MeshStandardMaterial({ color: 0xfca5a5 })
  );
  head.position.y = 0.75;
  head.castShadow = true;
  group.add(head);
  
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
  const eyeGeo = new THREE.SphereGeometry(0.04, 6, 6);
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
  eyeL.position.set(-0.07, 0.77, 0.18);
  group.add(eyeL);
  const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
  eyeR.position.set(0.07, 0.77, 0.18);
  group.add(eyeR);
  
  group.position.set(x, 0, z);
  group.userData = {
    health: 20 + level * 5,
    maxHealth: 20 + level * 5,
    speed: 0.02 + level * 0.002,
    damage: 5 + level * 2,
    attackCooldown: 0
  };
  
  scene.add(group);
  return group;
}

function updateEnemies() {
  if (currentWorldId !== 'world_fight') return;
  
  const toRemove = [];
  
  enemies.forEach((enemy, index) => {
    if (!enemy.parent) {
      toRemove.push(index);
      return;
    }
    
    const dx = playerGroup.position.x - enemy.position.x;
    const dz = playerGroup.position.z - enemy.position.z;
    const dist = Math.sqrt(dx*dx + dz*dz);
    
    if (dist > 0.5) {
      const speed = enemy.userData.speed;
      enemy.position.x += (dx / dist) * speed;
      enemy.position.z += (dz / dist) * speed;
      enemy.rotation.y = Math.atan2(dx, dz);
    }
    
    if (dist < 1.0 && enemy.userData.attackCooldown <= 0) {
      playerHealth -= enemy.userData.damage;
      enemy.userData.attackCooldown = 60;
      showMessage('💥 تعرضت للهجوم! -' + enemy.userData.damage, 800);
      updateHUD();
      if (playerHealth <= 0) gameOver();
    }
    
    if (enemy.userData.attackCooldown > 0) enemy.userData.attackCooldown--;
  });
  
  enemies = enemies.filter((e, i) => !toRemove.includes(i));
}

function fireWeapon() {
  if (!gameRunning || currentWorldId !== 'world_fight') {
    showToast('⚠️ فقط في ساحة القتال', 'warn');
    return;
  }
  
  const now = Date.now();
  if (now - lastFireTime < 300) return;
  lastFireTime = now;
  
  const bullet = createBullet();
  bullets.push(bullet);
  
  const flash = new THREE.PointLight(0xff6600, 2, 3);
  flash.position.copy(playerGroup.position);
  flash.position.y += 0.6;
  scene.add(flash);
  setTimeout(() => scene.remove(flash), 100);
}

function createBullet() {
  const geo = new THREE.SphereGeometry(0.06, 8, 8);
  const mat = new THREE.MeshBasicMaterial({ color: 0x00f2ff });
  const mesh = new THREE.Mesh(geo, mat);
  
  const dir = new THREE.Vector3(0, 0, -1);
  dir.applyQuaternion(playerGroup.quaternion);
  
  mesh.position.copy(playerGroup.position);
  mesh.position.y += 0.6;
  mesh.position.x += dir.x * 0.5;
  mesh.position.z += dir.z * 0.5;
  
  mesh.userData = { direction: dir, speed: BULLET_SPEED, life: 60 };
  scene.add(mesh);
  return mesh;
}

function updateBullets() {
  if (currentWorldId !== 'world_fight') return;
  
  const toRemove = [];
  
  bullets.forEach((bullet, index) => {
    if (!bullet.parent) {
      toRemove.push(index);
      return;
    }
    
    const dir = bullet.userData.direction;
    bullet.position.x += dir.x * bullet.userData.speed;
    bullet.position.z += dir.z * bullet.userData.speed;
    bullet.userData.life--;
    
    let hit = false;
    enemies.forEach(enemy => {
      if (hit) return;
      const dx = bullet.position.x - enemy.position.x;
      const dz = bullet.position.z - enemy.position.z;
      if (dx*dx + dz*dz < 0.5) {
        hit = true;
        enemy.userData.health -= 15 + level * 2;
        
        const particles = new THREE.Points(
          new THREE.BufferGeometry().setAttribute('position',
            new THREE.BufferAttribute(new Float32Array(30*3).map(() => (Math.random()-0.5)*0.5), 3)
          ),
          new THREE.PointsMaterial({ color: 0xff4400, size: 0.05, transparent: true, opacity: 0.8 })
        );
        particles.position.copy(enemy.position);
        particles.position.y += 0.3;
        scene.add(particles);
        setTimeout(() => scene.remove(particles), 300);
        
        if (enemy.userData.health <= 0) {
          kills++;
          score += 10 * level;
          addXP(8 + level);
          showMessage('💀 قتل عدو! +' + (10 * level), 1000);
          scene.remove(enemy);
        }
        updateHUD();
      }
    });
    
    if (hit || bullet.userData.life <= 0) {
      scene.remove(bullet);
      toRemove.push(index);
    }
  });
  
  bullets = bullets.filter((b, i) => !toRemove.includes(i));
}

function healPlayer() {
  playerHealth = Math.min(maxHealth, playerHealth + 30);
  showMessage('💚 تم الشفاء +30', 1000);
  updateHUD();
}

// ============================================================
//  12. حركة اللاعب والكاميرا
// ============================================================

function updatePlayer() {
  if (isTransitioning) return;
  if (!gameRunning) return;
  
  if (isInWorld && getCurrentWorld()?.id === 'world_360') return;
  
  let dx = 0, dz = 0;
  if (touchDirs.up) dz = -PLAYER_SPEED;
  if (touchDirs.down) dz = PLAYER_SPEED;
  if (touchDirs.left) dx = -PLAYER_SPEED;
  if (touchDirs.right) dx = PLAYER_SPEED;
  
  const limit = HALF - TILE_SIZE / 2;
  playerGroup.position.x = Math.max(-limit, Math.min(limit, playerGroup.position.x + dx));
  playerGroup.position.z = Math.max(-limit, Math.min(limit, playerGroup.position.z + dz));
  
  if (dx !== 0 || dz !== 0) {
    playerGroup.rotation.y = Math.atan2(dx, dz);
  }
  
  updateActiveTile();
}

function updateCamera() {
  if (isTransitioning) return;
  if (isInWorld && getCurrentWorld()?.id === 'world_360') return;
  
  const target = playerGroup.position.clone();
  const angle = playerGroup.rotation.y;
  const dist = 6.5;
  const height = 4.5;
  
  const desired = new THREE.Vector3(
    target.x - Math.sin(angle) * dist,
    target.y + height,
    target.z - Math.cos(angle) * dist
  );
  
  camera.position.lerp(desired, 0.08);
  camera.lookAt(target.x, target.y + 0.8, target.z);
}

// ============================================================
//  13. تحديث المربع النشط
// ============================================================

function updateActiveTile() {
  if (isTransitioning) return;
  const { row, col } = getPlayerTile();
  let onPortal = false;
  let portalTitle = '';
  
  tileMeshes.forEach(mesh => {
    const d = mesh.userData;
    if (d.row === row && d.col === col) {
      mesh.material.emissive = new THREE.Color(0x00f2ff);
      mesh.material.emissiveIntensity = 0.35;
      if (d.item && d.item.type === 'portal') {
        onPortal = true;
        portalTitle = d.item.title || 'عالم';
      }
    } else {
      mesh.material.emissive = new THREE.Color(0x000000);
      mesh.material.emissiveIntensity = 0;
    }
  });
  
  const btn = document.getElementById('enter-btn');
  if (onPortal && currentWorldId === 'main') {
    btn.style.display = 'block';
    btn.textContent = '🌐 دخول ' + portalTitle;
  } else {
    btn.style.display = 'none';
  }
}

// ============================================================
//  14. خريطة مصغرة
// ============================================================

function setupMinimap() {
  const frame = document.getElementById('minimap-frame');
  const c = document.createElement('canvas');
  c.width = 100; c.height = 100;
  frame.appendChild(c);
  minimapCtx = c.getContext('2d');
}

function updateMinimap() {
  if (!minimapCtx || !document.getElementById('minimap-frame').style.display) return;
  const ctx = minimapCtx;
  const w = 100, h = 100;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(8,8,20,0.92)';
  ctx.fillRect(0, 0, w, h);
  
  const scale = w / WORLD_SIZE;
  const world = getCurrentWorld();
  if (!world) return;
  
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const item = world.items?.find(i => i.row === y && i.col === x);
      ctx.fillStyle = item ? (item.type === 'portal' ? '#00f2ff' : '#fbbf24') : ((x + y) % 2 === 0 ? '#2a2a4a' : '#1a1a2e');
      ctx.fillRect(x * TILE_SIZE * scale, y * TILE_SIZE * scale, TILE_SIZE * scale * 0.9, TILE_SIZE * scale * 0.9);
    }
  }
  
  const px = (playerGroup.position.x + HALF) * scale;
  const py = (playerGroup.position.z + HALF) * scale;
  ctx.fillStyle = '#a78bfa';
  ctx.beginPath();
  ctx.arc(px, py, 3, 0, Math.PI * 2);
  ctx.fill();
}

// ============================================================
//  15. تهيئة Three.js
// ============================================================

function initGame() {
  const canvas = document.getElementById('canvas');
  
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a1a);
  scene.fog = new THREE.Fog(0x0a0a1a, 25, 50);
  
  camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(0, 7, 12);
  
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  
  scene.add(new THREE.AmbientLight(0x8b5cf6, 0.5));
  const dir = new THREE.DirectionalLight(0xfff0dd, 0.85);
  dir.position.set(10, 20, 8);
  dir.castShadow = true;
  scene.add(dir);
  scene.add(new THREE.DirectionalLight(0x4466ff, 0.3).position.set(-10, 10, -10));
  
  // أرضية
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 40),
    new THREE.MeshStandardMaterial({ color: 0x15152a, roughness: 0.9 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.05;
  ground.receiveShadow = true;
  scene.add(ground);
  
  // لاعب
  playerGroup = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.32, 0.38, 0.7, 8),
    new THREE.MeshStandardMaterial({ color: 0x8b5cf6, emissive: 0x5b21b6, emissiveIntensity: 0.2 })
  );
  body.position.y = 0.35;
  body.castShadow = true;
  playerGroup.add(body);
  
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.18, 8, 8),
    new THREE.MeshStandardMaterial({ color: 0xa78bfa })
  );
  head.position.y = 0.85;
  head.castShadow = true;
  playerGroup.add(head);
  
  const crown = new THREE.Mesh(
    new THREE.ConeGeometry(0.12, 0.12, 6),
    new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffa500, emissiveIntensity: 0.1 })
  );
  crown.position.y = 1.0;
  playerGroup.add(crown);
  
  playerGroup.position.set(0, 0, 0);
  scene.add(playerGroup);
  
  tileGroup = new THREE.Group();
  scene.add(tileGroup);
  
  setupMinimap();
  document.getElementById('minimap-frame').style.display = 'block';
  
  createDefaultWorlds();
  renderLandmarks();
  buildWorld('main');
  updateHUD();
  
  showMessage('⚔️ استكشف العوالم واقتل الأعداء!', 2000);
  
  function loop() {
    requestAnimationFrame(loop);
    
    if (gameRunning) {
      updatePlayer();
      updateEnemies();
      updateBullets();
      
      if (currentWorldId === 'world_fight') {
        enemySpawnTimer++;
        if (enemySpawnTimer > 100 - level * 3 && enemies.length < 4 + level) {
          enemySpawnTimer = 0;
          spawnEnemy();
        }
      }
    }
    
    updateCamera();
    updateMinimap();
    if (videoTexture) videoTexture.needsUpdate = true;
    renderer.render(scene, camera);
  }
  loop();
}

function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('health-bar-container').style.display = 'block';
  document.getElementById('controls').style.display = 'flex';
  document.getElementById('dpad').style.display = 'block';
  document.getElementById('fire-btn').style.display = 'flex';
  document.getElementById('game-message').style.display = 'block';
  document.getElementById('minimap-frame').style.display = 'block';
  document.getElementById('enter-btn').style.display = 'block';
  
  // إخفاء enter-btn في البداية
  document.getElementById('enter-btn').style.display = 'none';
  
  initGame();
}

// ============================================================
//  16. التحكم
// ============================================================

function setupControls() {
  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const dir = btn.dataset.dir;
    btn.addEventListener('touchstart', e => { e.preventDefault(); touchDirs[dir] = true; }, { passive: false });
    btn.addEventListener('touchend', e => { e.preventDefault(); touchDirs[dir] = false; }, { passive: false });
  });
  
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp') touchDirs.up = true;
    if (e.key === 'ArrowDown') touchDirs.down = true;
    if (e.key === 'ArrowLeft') touchDirs.left = true;
    if (e.key === 'ArrowRight') touchDirs.right = true;
    if (e.key === ' ' || e.key === 'Space') { e.preventDefault(); fireWeapon(); }
    if (e.key === 'h' || e.key === 'H') healPlayer();
    if (e.key === 'Enter') enterWorld();
    if (e.key === 'Escape') exitWorld();
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowUp') touchDirs.up = false;
    if (e.key === 'ArrowDown') touchDirs.down = false;
    if (e.key === 'ArrowLeft') touchDirs.left = false;
    if (e.key === 'ArrowRight') touchDirs.right = false;
  });
  
  document.getElementById('fire-btn').addEventListener('touchstart', e => {
    e.preventDefault();
    fireWeapon();
  });
}

window.addEventListener('resize', () => {
  if (camera) {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  }
});

<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>👤 الشخصية المتكاملة</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Cairo',sans-serif; background:#050510; color:#fff; overflow:hidden; }

#info {
  position:fixed; top:10px; left:50%; transform:translateX(-50%);
  color:#fff; background:rgba(0,0,0,0.7); padding:6px 18px;
  border-radius:20px; z-index:100; font-size:12px;
  border:1px solid rgba(255,215,0,0.2);
  text-align:center;
}
#info span { color:#ffd700; }

#status {
  position:fixed; top:60px; left:50%; transform:translateX(-50%);
  color:#4ade80; font-size:12px; background:rgba(0,0,0,0.5);
  padding:4px 16px; border-radius:10px; z-index:100;
  border:1px solid rgba(74,222,128,0.2);
}

#hud {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  display:flex; gap:15px; z-index:100; background:rgba(0,0,0,0.6);
  padding:8px 20px; border-radius:15px; border:1px solid rgba(255,255,255,0.05);
}
#hud .stat { color:#aaa; font-size:11px; text-align:center; }
#hud .stat .value { color:#4ade80; font-weight:bold; font-size:14px; }
#hud .stat .label { color:#666; font-size:9px; }

#controls {
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
  display:flex; gap:6px; z-index:100; flex-wrap:wrap; justify-content:center;
}
#controls button {
  background:rgba(139,92,246,0.15); color:#fff; border:1px solid rgba(139,92,246,0.2);
  padding:5px 12px; border-radius:12px; cursor:pointer; font-size:10px;
  transition:all 0.3s; font-family:inherit;
}
#controls button:hover { background:rgba(139,92,246,0.3); border-color:#8b5cf6; }
#controls button.active { background:#8b5cf6; color:#fff; border-color:#8b5cf6; }

#upload-area {
  position:fixed; bottom:130px; left:50%; transform:translateX(-50%);
  display:flex; gap:6px; z-index:100; flex-wrap:wrap; justify-content:center;
}
#upload-area button {
  background:rgba(60,60,120,0.2); color:#aaa; border:1px solid rgba(255,255,255,0.05);
  padding:3px 10px; border-radius:8px; cursor:pointer; font-size:9px;
  font-family:inherit;
}
#upload-area button:hover { background:rgba(139,92,246,0.2); border-color:#8b5cf6; }

.hidden { display:none; }
canvas { display:block; width:100%; height:100%; background:#0a0a1a; }

#timer-bar {
  position:fixed; bottom:75px; left:50%; transform:translateX(-50%);
  width:150px; height:3px; background:rgba(255,255,255,0.05);
  border-radius:2px; z-index:100; overflow:hidden; display:none;
}
#timer-bar .fill {
  height:100%; width:0%; background:linear-gradient(90deg,#8b5cf6,#00f2ff);
  border-radius:2px; transition:width 0.1s;
}
</style>
</head>
<body>

<div id="info">👤 <span>الشخصية المتكاملة</span></div>
<div id="status">🧍 وقوف</div>
<div id="timer-bar"><div class="fill" id="timer-fill"></div></div>

<div id="hud">
  <div class="stat"><div class="value" id="health">100</div><div class="label">❤️ صحة</div></div>
  <div class="stat"><div class="value" id="shield">50</div><div class="label">🛡️ درع</div></div>
  <div class="stat"><div class="value" id="ammo">30</div><div class="label">🔫 ذخيرة</div></div>
  <div class="stat"><div class="value" id="kills">0</div><div class="label">💀 قتلى</div></div>
</div>

<div id="upload-area">
  <button onclick="document.getElementById('char-input').click()">📁 رفع شخصية</button>
  <button onclick="loadTestCharacter()">🧪 شخصية تجريبية</button>
</div>

<div id="controls">
  <button class="active" onclick="setAction('idle', 0)">🧍 وقوف</button>
  <button onclick="setAction('walk', 0.8)">🚶 مشي</button>
  <button onclick="setAction('run', 0.5)">🏃 جري</button>
  <button onclick="setAction('fight', 1.0)">⚔️ قتال</button>
  <button onclick="setAction('shoot', 0.3)">🔫 إطلاق</button>
  <button onclick="setAction('shield', 1.5)">🛡️ دفاع</button>
</div>

<input type="file" id="char-input" class="hidden" accept="video/*,.webm,.mp4,.mov" onchange="loadCharacterFile(event)">

<canvas id="canvas"></canvas>

<script>
// ============================================================
//  👤 الشخصية المتكاملة
// ============================================================

const canvas = document.getElementById('canvas');
const statusEl = document.getElementById('status');

// ============================================================
//  1. متغيرات الشخصية
// ============================================================

let characterVideo = null;
let characterTexture = null;
let characterSprite = null;
let isReady = false;
let currentAction = 'idle';
let actionTimer = null;
let timerInterval = null;

// ============================================================
//  2. تحميل الشخصية
// ============================================================

function loadCharacterFile(event) {
    const file = event.target.files[0];
    if (!file) {
        showToast('⚠️ لم يتم اختيار ملف', 'warn');
        return;
    }
    if (!file.type.startsWith('video/')) {
        showToast('❌ الملف ليس فيديو', 'error');
        event.target.value = '';
        return;
    }
    if (file.size > 50 * 1024 * 1024) {
        showToast('❌ الفيديو كبير جداً (الحد 50MB)', 'error');
        event.target.value = '';
        return;
    }

    const url = URL.createObjectURL(file);
    const name = file.name.replace(/\.[^/.]+$/, '') || 'فيديو محلي';
    loadCharacter(url, name);
    event.target.value = '';
}

function loadCharacter(url, name) {
    // تنظيف القديم
    if (characterSprite) {
        if (characterSprite.material) {
            if (characterSprite.material.map) characterSprite.material.map.dispose();
            characterSprite.material.dispose();
        }
        scene.remove(characterSprite);
        characterSprite = null;
    }
    if (characterVideo) {
        try { characterVideo.pause(); } catch(e) {}
        characterVideo = null;
    }
    if (characterTexture) {
        try { characterTexture.dispose(); } catch(e) {}
        characterTexture = null;
    }

    statusEl.textContent = '⏳ جاري تحميل: ' + name;
    showToast('📥 جاري تحميل الشخصية...', 'info');

    characterVideo = document.createElement('video');
    characterVideo.muted = true;
    characterVideo.loop = true;
    characterVideo.playsInline = true;
    characterVideo.preload = 'auto';
    characterVideo.crossOrigin = 'anonymous';
    characterVideo.src = url;

    characterVideo.onloadeddata = function() {
        characterVideo.play().catch(() => {});
        characterTexture = new THREE.VideoTexture(characterVideo);
        characterTexture.minFilter = THREE.LinearFilter;
        characterTexture.magFilter = THREE.LinearFilter;
        characterTexture.format = THREE.RGBAFormat;

        isReady = true;

        const material = new THREE.SpriteMaterial({
            map: characterTexture,
            transparent: true,
            depthTest: true,
            depthWrite: false
        });

        characterSprite = new THREE.Sprite(material);
        characterSprite.scale.set(2.5, 2.5, 1);
        characterSprite.position.y = 1.2;
        scene.add(characterSprite);

        statusEl.textContent = '✅ ' + name + ' جاهز';
        showToast('✅ الشخصية جاهزة!', 'success');
        setAction('idle', 0);
    };

    characterVideo.onerror = function() {
        statusEl.textContent = '❌ فشل التحميل';
        showToast('❌ فشل تحميل الشخصية', 'error');
    };

    characterVideo.load();
}

// ============================================================
//  3. شخصية تجريبية (بدون فيديو)
// ============================================================

function loadTestCharacter() {
    const canvas2 = document.createElement('canvas');
    canvas2.width = 256;
    canvas2.height = 256;
    const ctx = canvas2.getContext('2d');
    let frame = 0;

    function draw() {
        frame++;
        ctx.clearRect(0, 0, 256, 256);

        // خلفية شفافة
        ctx.clearRect(0, 0, 256, 256);

        // جسم متحرك
        const grad = ctx.createRadialGradient(128, 140, 0, 128, 140, 70);
        grad.addColorStop(0, `hsl(${frame * 0.5 % 360}, 80%, 60%)`);
        grad.addColorStop(0.5, `hsl(${(frame * 0.5 + 60) % 360}, 80%, 50%)`);
        grad.addColorStop(1, `hsl(${(frame * 0.5 + 120) % 360}, 80%, 30%)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(128, 140, 70, 0, Math.PI * 2);
        ctx.fill();

        // رأس
        ctx.fillStyle = `hsl(${frame * 0.3 % 360}, 70%, 70%)`;
        ctx.beginPath();
        ctx.arc(128, 80, 40, 0, Math.PI * 2);
        ctx.fill();

        // عيون
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(115, 75, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(141, 75, 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#1a1a2e';
        ctx.beginPath();
        ctx.arc(118, 77, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(144, 77, 5, 0, Math.PI * 2);
        ctx.fill();

        // تاج
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.moveTo(105, 50);
        ctx.lineTo(128, 30);
        ctx.lineTo(151, 50);
        ctx.closePath();
        ctx.fill();

        // اسم الحركة الحالية
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.font = '16px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(getActionName(currentAction), 128, 220);

        // توهج
        const glow = ctx.createRadialGradient(128, 140, 0, 128, 140, 120);
        glow.addColorStop(0, `rgba(139,92,246,0)`);
        glow.addColorStop(1, `rgba(139,92,246,0.05)`);
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(128, 140, 120, 0, Math.PI * 2);
        ctx.fill();

        requestAnimationFrame(draw);
    }
    draw();

    const stream = canvas2.captureStream(30);
    const video = document.createElement('video');
    video.muted = true;
    video.loop = true;
    video.playsInline = true;
    video.srcObject = stream;

    video.onloadeddata = function() {
        video.play().catch(() => {});
        const url = URL.createObjectURL(stream);
        loadCharacter(url, 'شخصية تجريبية');
    };
    video.load();
}

// ============================================================
//  4. 🎯 التحكم بالحركات والزمن
// ============================================================

const ACTION_NAMES = {
    idle: 'وقوف',
    walk: 'مشي',
    run: 'جري',
    fight: 'قتال',
    shoot: 'إطلاق',
    shield: 'دفاع'
};

function getActionName(action) {
    return ACTION_NAMES[action] || action;
}

function setAction(action, duration) {
    currentAction = action;
    
    // تحديث الأزرار
    document.querySelectorAll('#controls button').forEach(btn => {
        btn.classList.remove('active');
    });
    if (event && event.target) {
        event.target.classList.add('active');
    }

    // تحديث الحالة
    statusEl.textContent = '🎯 ' + getActionName(action);

    // إذا كان هناك زمن محدد
    if (duration > 0) {
        if (actionTimer) {
            clearTimeout(actionTimer);
            actionTimer = null;
        }
        
        showTimer(duration);
        
        actionTimer = setTimeout(() => {
            setAction('idle', 0);
            hideTimer();
            statusEl.textContent = '🧍 عودة إلى الوقوف';
        }, duration * 1000);
    } else {
        hideTimer();
    }

    // تحديث سرعة الفيديو حسب الحركة
    updateVideoSpeed(action);
}

function updateVideoSpeed(action) {
    if (!characterVideo || !isReady) return;
    
    const speeds = {
        idle: 0.3,
        walk: 0.6,
        run: 1.2,
        fight: 0.8,
        shoot: 2.0,
        shield: 0.5
    };
    
    characterVideo.playbackRate = speeds[action] || 0.5;
}

// ============================================================
//  5. شريط التقدم
// ============================================================

let timerBar = document.getElementById('timer-bar');
let timerFill = document.getElementById('timer-fill');

function showTimer(duration) {
    timerBar.style.display = 'block';
    timerFill.style.width = '100%';
    
    if (timerInterval) clearInterval(timerInterval);
    
    let progress = 1;
    const step = 1 / (duration * 20);
    
    timerInterval = setInterval(() => {
        progress -= step;
        if (progress <= 0) {
            progress = 0;
            clearInterval(timerInterval);
        }
        timerFill.style.width = (progress * 100) + '%';
    }, 50);
}

function hideTimer() {
    timerBar.style.display = 'none';
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
}

// ============================================================
//  6. Three.js
// ============================================================

let scene, camera, renderer;
let playerGroup, ringGroup;
let touchDirs = { up: false, down: false, left: false, right: false };
const PLAYER_SPEED = 0.08;
let time = 0;

function initScene() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a1a);
    scene.fog = new THREE.Fog(0x0a0a1a, 15, 30);

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 30);
    camera.position.set(3, 3, 5);
    camera.lookAt(0, 1.2, 0);

    renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    // إضاءة
    const ambient = new THREE.AmbientLight(0x8b5cf6, 0.4);
    scene.add(ambient);

    const mainLight = new THREE.DirectionalLight(0xffeedd, 1.0);
    mainLight.position.set(5, 10, 5);
    mainLight.castShadow = true;
    scene.add(mainLight);

    const rimLight = new THREE.DirectionalLight(0x4466ff, 0.4);
    rimLight.position.set(-3, 5, -5);
    scene.add(rimLight);

    // مجموعة اللاعب
    playerGroup = new THREE.Group();
    scene.add(playerGroup);

    // دائرة شفافة
    ringGroup = new THREE.Group();
    scene.add(ringGroup);

    // الدائرة الرئيسية
    const ringGeo = new THREE.RingGeometry(1.0, 1.3, 32);
    const ringMat = new THREE.MeshBasicMaterial({
        color: 0x00f2ff,
        transparent: true,
        opacity: 0.15,
        side: THREE.DoubleSide,
        depthWrite: false
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.02;
    ringGroup.add(ring);

    // الدائرة الخارجية
    const glowGeo = new THREE.RingGeometry(1.3, 1.5, 32);
    const glowMat = new THREE.MeshBasicMaterial({
        color: 0x8b5cf6,
        transparent: true,
        opacity: 0.08,
        side: THREE.DoubleSide,
        depthWrite: false
    });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    glow.rotation.x = -Math.PI / 2;
    glow.position.y = 0.01;
    ringGroup.add(glow);

    // نقاط متحركة
    for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * Math.PI * 2;
        const dotGeo = new THREE.SphereGeometry(0.02, 4, 4);
        const dotMat = new THREE.MeshBasicMaterial({
            color: 0x00f2ff,
            transparent: true,
            opacity: 0.3
        });
        const dot = new THREE.Mesh(dotGeo, dotMat);
        dot.position.set(Math.cos(angle) * 1.4, 0.02, Math.sin(angle) * 1.4);
        ringGroup.add(dot);
    }

    // أرضية
    const groundGeo = new THREE.PlaneGeometry(20, 20);
    const groundMat = new THREE.MeshStandardMaterial({
        color: 0x15152a,
        roughness: 0.9,
        metalness: 0.1
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.05;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(20, 20, 0x333366, 0x1a1a3e);
    grid.position.y = 0.01;
    scene.add(grid);

    animate();
}

// ============================================================
//  7. حركة اللاعب
// ============================================================

function updatePlayer() {
    let dx = 0, dz = 0;
    if (touchDirs.up) dz = -PLAYER_SPEED;
    if (touchDirs.down) dz = PLAYER_SPEED;
    if (touchDirs.left) dx = -PLAYER_SPEED;
    if (touchDirs.right) dx = PLAYER_SPEED;

    const newX = playerGroup.position.x + dx;
    const newZ = playerGroup.position.z + dz;
    const limit = 8;

    playerGroup.position.x = Math.max(-limit, Math.min(limit, newX));
    playerGroup.position.z = Math.max(-limit, Math.min(limit, newZ));

    if (dx !== 0 || dz !== 0) {
        const angle = Math.atan2(dx, dz);
        playerGroup.rotation.y = angle;
    }

    // تحديث موقع الشخصية والدائرة
    if (characterSprite) {
        characterSprite.position.x = playerGroup.position.x;
        characterSprite.position.z = playerGroup.position.z;
    }
    ringGroup.position.x = playerGroup.position.x;
    ringGroup.position.z = playerGroup.position.z;
}

// ============================================================
//  8. حلقة الرسم
// ============================================================

function animate() {
    requestAnimationFrame(animate);
    time += 0.016;

    updatePlayer();

    // تحريك نقاط الدائرة
    ringGroup.children.forEach((child, i) => {
        if (i > 0 && child.isMesh) {
            const angle = (i / 12) * Math.PI * 2 + time * 0.5;
            child.position.x = Math.cos(angle) * 1.4;
            child.position.z = Math.sin(angle) * 1.4;
        }
    });

    // دوران الدائرة
    ringGroup.rotation.y += 0.005;

    // تحديث الفيديو
    if (characterTexture && isReady) {
        characterTexture.needsUpdate = true;
    }

    // تحريك الكاميرا
    const target = playerGroup.position.clone();
    camera.position.x += (target.x + 3 * Math.sin(time * 0.05) - camera.position.x) * 0.05;
    camera.position.z += (target.z + 4 * Math.cos(time * 0.05) + 1 - camera.position.z) * 0.05;
    camera.position.y += (2.5 - camera.position.y) * 0.05;
    camera.lookAt(target.x, 1.2, target.z);

    renderer.render(scene, camera);
}

// ============================================================
//  9. تحكم
// ============================================================

function setupTouchControls() {
    document.querySelectorAll('.dpad-btn').forEach(btn => {
        const dir = btn.getAttribute('data-dir');
        btn.addEventListener('touchstart', e => {
            e.preventDefault();
            touchDirs[dir] = true;
            btn.style.background = 'rgba(139,92,246,0.2)';
            btn.style.borderColor = '#8b5cf6';
        }, { passive: false });
        btn.addEventListener('touchend', e => {
            e.preventDefault();
            touchDirs[dir] = false;
            btn.style.background = '';
            btn.style.borderColor = '';
        }, { passive: false });
        btn.addEventListener('touchcancel', () => {
            touchDirs[dir] = false;
            btn.style.background = '';
            btn.style.borderColor = '';
        });
    });
}

document.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp') touchDirs.up = true;
    if (e.key === 'ArrowDown') touchDirs.down = true;
    if (e.key === 'ArrowLeft') touchDirs.left = true;
    if (e.key === 'ArrowRight') touchDirs.right = true;
});
document.addEventListener('keyup', e => {
    if (e.key === 'ArrowUp') touchDirs.up = false;
    if (e.key === 'ArrowDown') touchDirs.down = false;
    if (e.key === 'ArrowLeft') touchDirs.left = false;
    if (e.key === 'ArrowRight') touchDirs.right = false;
});

function showToast(message, type) {
    const container = document.getElementById('toast-container');
    if (!container) {
        // إنشاء حاوية إذا لم تكن موجودة
        const div = document.createElement('div');
        div.id = 'toast-container';
        div.style.cssText = `
            position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
            z-index:1000; display:flex; flex-direction:column; gap:5px; align-items:center;
            pointer-events:none;
        `;
        document.body.appendChild(div);
    }
    const toast = document.createElement('div');
    toast.style.cssText = `
        background:rgba(0,0,0,0.9); color:#fff; padding:5px 16px;
        border-radius:20px; font-size:11px; border:1px solid rgba(255,255,255,0.05);
        animation: fadeIn 0.3s, fadeOut 0.3s 2.7s forwards;
    `;
    if (type === 'success') toast.style.borderColor = '#4ade80';
    if (type === 'error') toast.style.borderColor = '#f87171';
    if (type === 'warn') toast.style.borderColor = '#fb923c';
    if (type === 'info') toast.style.borderColor = '#60a5fa';
    toast.textContent = message;
    document.getElementById('toast-container').appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

// ============================================================
//  10. بدء التشغيل
// ============================================================

window.addEventListener('resize', () => {
    if (camera) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
});

setupTouchControls();
initScene();

// تحميل شخصية تجريبية تلقائياً
setTimeout(loadTestCharacter, 500);

console.log('👤 الشخصية المتكاملة جاهزة!');
console.log('📌 المميزات:');
console.log('  ✅ فيديو واحد للشخصية');
console.log('  ✅ 6 حركات مختلفة (وقوف، مشي، جري، قتال، إطلاق، دفاع)');
console.log('  ✅ كل حركة لها زمن محدد');
console.log('  ✅ العودة التلقائية للوقوف');
console.log('  ✅ دائرة شفافة متحركة');
console.log('  ✅ رفع فيديو محلي');
console.log('  ✅ شخصية تجريبية');
console.log('  ✅ HUD متكامل (صحة، درع، ذخيرة)');
</script>
</body>
</html>

<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎬 فيديو على الخريطة 3D</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Cairo',sans-serif; background:#050510; color:#fff; overflow:hidden; user-select:none; }

/* شاشة البداية */
#start-screen {
  position:fixed; inset:0; z-index:2000;
  background:linear-gradient(135deg,#0a0a2a,#000);
  display:flex; flex-direction:column; justify-content:center; align-items:center; gap:20px;
}
.start-logo { font-size:42px; font-weight:900; color:#ffd700; animation:float 3s ease-in-out infinite; }
.start-subtitle { font-size:15px; color:#666; text-align:center; max-width:350px; }
.start-btn {
  border:2px solid #00f2ff; color:#00f2ff; padding:16px 50px;
  background:rgba(0,242,255,0.08); border-radius:60px; font-size:20px;
  cursor:pointer; transition:all .3s; font-weight:700; font-family:inherit;
}
.start-btn:hover { transform:scale(1.05); background:#00f2ff; color:#000; box-shadow:0 0 50px rgba(0,242,255,0.4); }
.user-info { color:#00f2ff; font-size:13px; background:rgba(0,0,0,0.6); padding:8px 24px; border-radius:30px; }
.version-tag { position:absolute; bottom:15px; font-size:11px; color:#444; }
@keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }

/* اللعبة */
#game-container { position:fixed; inset:0; display:none; background:#0a0a1a; }
#game-canvas { display:block; width:100%; height:100%; }

/* HUD */
.hud {
  position:fixed; top:0; left:0; right:0; padding:6px 12px;
  display:flex; justify-content:space-between; align-items:center;
  pointer-events:none; z-index:100;
  background:rgba(0,0,0,0.6); backdrop-filter:blur(8px);
}
.hud .title { color:#ffd700; font-size:13px; font-weight:700; }
.hud .info { color:#aaa; font-size:11px; }

/* D-Pad */
.dpad {
  position:fixed; bottom:20px; left:16px;
  width:120px; height:120px; z-index:200;
}
.dpad-btn {
  position:absolute; width:40px; height:40px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; color:rgba(255,255,255,0.4);
  cursor:pointer; transition:all .1s;
}
.dpad-btn:active {
  background:rgba(139,92,246,0.2);
  border-color:#8b5cf6; color:#8b5cf6;
  transform:scale(0.88);
}
.dpad-up { top:0; left:40px; }
.dpad-down { bottom:0; left:40px; }
.dpad-left { top:40px; left:0; }
.dpad-right { top:40px; right:0; }

/* أزرار التحكم */
.tg-toggle {
  position:fixed; bottom:155px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.6); border:1px solid rgba(255,215,0,0.1);
  border-radius:20px; padding:3px 14px;
  z-index:210; font-size:11px; color:#888; cursor:pointer; display:none;
}
.tg-dropdown {
  position:fixed; bottom:170px; left:50%; transform:translateX(-50%);
  background:rgba(10,10,30,0.95); border:1px solid rgba(255,215,0,0.15);
  border-radius:14px; padding:10px 14px; z-index:250;
  min-width:280px; max-width:92%; display:none; backdrop-filter:blur(12px);
}
.tg-dropdown.show { display:block; }
.tg-dropdown .row { display:flex; gap:5px; margin-bottom:5px; flex-wrap:wrap; }
.tg-dropdown input {
  flex:1; padding:4px 8px; border-radius:6px;
  border:1px solid rgba(255,215,0,0.1); background:#0a0a1a;
  color:#fff; font-size:10px; font-family:inherit; min-width:50px;
}
.tg-dropdown .btn {
  padding:4px 10px; border:none; border-radius:6px;
  font-weight:700; font-size:10px; cursor:pointer; font-family:inherit;
}
.btn-accent { background:#00f2ff; color:#111; }
.btn-purple { background:#8b5cf6; color:#fff; }
.btn-gold { background:#ffd700; color:#111; }
.btn-red { background:#f87171; color:#fff; }
.btn-green { background:#4ade80; color:#111; }
#tg-status { font-size:10px; color:#888; margin-top:4px; }

/* خريطة مصغرة */
#minimap-frame {
  position:fixed; top:50px; left:10px;
  width:140px; height:140px;
  border:2px solid #ffd700; border-radius:12px;
  overflow:hidden; pointer-events:none; z-index:90;
  background:rgba(5,5,16,0.6);
  display:none; box-shadow:0 0 20px rgba(255,215,0,0.15);
}
#minimap-label {
  position:fixed; top:52px; left:12px; z-index:91;
  font-size:9px; color:#ffd700; background:rgba(0,0,0,0.6);
  padding:1px 6px; border-radius:4px; pointer-events:none; display:none;
}

/* Toast */
.toast-container {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  z-index:700; display:flex; flex-direction:column; gap:5px; pointer-events:none;
}
.toast {
  background:rgba(0,0,0,0.9); padding:6px 16px; border-radius:30px;
  font-size:11px; border:1px solid rgba(255,255,255,0.06);
  animation:toastIn .3s,toastOut .3s 2.7s forwards;
}
.toast.success { border-color:#4ade80; color:#4ade80; }
.toast.error { border-color:#f87171; color:#f87171; }
.toast.info { border-color:#60a5fa; color:#60a5fa; }
@keyframes toastIn {
  from { opacity:0; transform:translate(-50%,20px); }
  to { opacity:1; transform:translate(-50%,0); }
}
@keyframes toastOut {
  from { opacity:1; transform:translate(-50%,0); }
  to { opacity:0; transform:translate(-50%,-20px); }
}

/* input file مخفي */
#local-video-input { display:none; }
</style>
</head>
<body>

<!-- شاشة البداية -->
<div id="start-screen">
  <div class="start-logo">🎬 فيديو على الخريطة</div>
  <div class="start-subtitle">جلب WebM من Telegram • عرض 3D<br>أو رفع فيديو من الجهاز</div>
  <div class="user-info" id="userInfoDisplay">🔄 جاري التحميل...</div>
  <button class="start-btn" id="start-btn" onclick="enterApp()" style="display:none;">🚀 دخول</button>
  <div class="version-tag">v36.1 | Fixed Loading</div>
</div>

<!-- اللعبة -->
<div id="game-container">
  <canvas id="game-canvas"></canvas>
  
  <div id="minimap-frame"></div>
  <div id="minimap-label">🗺️ الخريطة</div>

  <div class="hud">
    <div class="title">🎮 الخريطة 3D</div>
    <div class="info" id="char-name">لا يوجد فيديو</div>
  </div>

  <div class="dpad" id="dpad">
    <div class="dpad-btn dpad-up" data-dir="up">▲</div>
    <div class="dpad-btn dpad-down" data-dir="down">▼</div>
    <div class="dpad-btn dpad-left" data-dir="left">◀</div>
    <div class="dpad-btn dpad-right" data-dir="right">▶</div>
  </div>

  <button class="tg-toggle" id="tg-toggle" onclick="toggleTG()">📡 القناة / رفع</button>
  <div class="tg-dropdown" id="tg-dropdown">
    <div class="row">
      <input type="text" id="bot-token" placeholder="Bot Token">
      <input type="text" id="chat-id" placeholder="Channel ID">
    </div>
    <div class="row">
      <button class="btn btn-accent" onclick="testTelegram()">🔗 اتصال</button>
      <button class="btn btn-purple" onclick="loadVideoFromTelegram()">🎬 جلب فيديو</button>
      <button class="btn btn-red" onclick="toggleTG()">✖</button>
    </div>
    <div class="row" style="margin-top:6px;">
      <button class="btn btn-green" onclick="document.getElementById('local-video-input').click()">📁 رفع فيديو محلي</button>
      <button class="btn btn-gold" onclick="loadTestVideo()">🧪 فيديو تجريبي</button>
    </div>
    <div id="tg-status">⭕ غير متصل<br><span style="color:#f87171;font-size:9px;">ملاحظة: Telegram API محظور بـ CORS من المتصفح. استخدم رفع محلي أو Proxy.</span></div>
  </div>

  <input type="file" id="local-video-input" accept="video/*,.webm,.mp4,.mov" onchange="handleLocalVideo(event)">
</div>

<div class="toast-container" id="toast-container"></div>

<script>
// ============================================================
//  التهيئة
// ============================================================

const tg = window.Telegram?.WebApp;
let userData = null;
let botToken = '', channelId = '', connected = false, lastUpdateId = 0;

function initTelegram() {
  try {
    if (tg) { tg.ready(); tg.expand(); }
    userData = tg?.initDataUnsafe?.user || { id: Math.floor(Math.random()*100000), first_name: 'مستخدم' };
    document.getElementById('userInfoDisplay').innerHTML = '👤 ' + (userData.first_name || 'مستخدم');
  } catch(e) {
    userData = { id: Math.floor(Math.random()*100000), first_name: 'مستخدم' };
    document.getElementById('userInfoDisplay').innerHTML = '👤 مستخدم';
  }
}

// ============================================================
//  Three.js
// ============================================================

let scene, camera, renderer;
let playerGroup, videoSprite;
let videoElement = null;
let videoTexture = null;
let isVideoReady = false;
let currentBlobUrl = null;

const MAP_SIZE = 16;
const TILE_SIZE = 4;
const WORLD_SIZE = MAP_SIZE * TILE_SIZE;
const OFFSET = WORLD_SIZE / 2;
const PLAYER_SPEED = 0.12;
let mapData = [];
let touchDirs = { up: false, down: false, left: false, right: false };

function initThree() {
  const canvas = document.getElementById('game-canvas');
  
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a1a);
  scene.fog = new THREE.Fog(0x0a0a1a, 20, 60);

  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 18, 16);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const ambient = new THREE.AmbientLight(0x8b5cf6, 0.4);
  scene.add(ambient);
  
  const dirLight = new THREE.DirectionalLight(0xffeedd, 0.9);
  dirLight.position.set(20, 30, 20);
  dirLight.castShadow = true;
  scene.add(dirLight);
  
  const fillLight = new THREE.DirectionalLight(0x4466ff, 0.3);
  fillLight.position.set(-20, 10, -20);
  scene.add(fillLight);

  const groundGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x15152a, roughness: 0.9, metalness: 0.1 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  const gridHelper = new THREE.GridHelper(WORLD_SIZE, MAP_SIZE, 0x6d28d9, 0x2a2a4a);
  gridHelper.position.y = 0.02;
  scene.add(gridHelper);

  playerGroup = new THREE.Group();
  scene.add(playerGroup);
  
  const bodyGeo = new THREE.SphereGeometry(0.5, 16, 16);
  const bodyMat = new THREE.MeshStandardMaterial({ 
    color: 0x8b5cf6, 
    emissive: 0x6d28d9, 
    emissiveIntensity: 0.3,
    roughness: 0.3,
    metalness: 0.6
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.5;
  body.castShadow = true;
  playerGroup.add(body);

  const crownGeo = new THREE.ConeGeometry(0.3, 0.3, 6);
  const crownMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffa500, emissiveIntensity: 0.2, metalness: 0.8 });
  const crown = new THREE.Mesh(crownGeo, crownMat);
  crown.position.y = 1.0;
  playerGroup.add(crown);

  const glowGeo = new THREE.PlaneGeometry(2.5, 2.5);
  const glowMat = new THREE.MeshBasicMaterial({ color: 0x8b5cf6, transparent: true, opacity: 0.15 });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.rotation.x = -Math.PI / 2;
  glow.position.y = 0.05;
  playerGroup.add(glow);

  buildWalls();
  
  playerGroup.position.set(
    1.5 * TILE_SIZE - OFFSET + TILE_SIZE/2,
    0,
    1.5 * TILE_SIZE - OFFSET + TILE_SIZE/2
  );

  setupMinimap();
  animate();
}

function buildWalls() {
  mapData = [];
  const wallGeo = new THREE.BoxGeometry(TILE_SIZE * 0.92, TILE_SIZE, TILE_SIZE * 0.92);
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x2a2a4a, roughness: 0.5, metalness: 0.3 });
  const edgeMat = new THREE.MeshStandardMaterial({ color: 0x3a3a6a, roughness: 0.5, metalness: 0.5 });

  for (let z = 0; z < MAP_SIZE; z++) {
    const row = [];
    for (let x = 0; x < MAP_SIZE; x++) {
      let isWall = false;
      if (x === 0 || x === MAP_SIZE - 1 || z === 0 || z === MAP_SIZE - 1) isWall = true;
      else if (Math.random() < 0.1 && !(x <= 3 && z <= 3)) isWall = true;
      
      row.push(isWall ? 1 : 0);
      
      if (isWall) {
        const mat = (x===0||x===MAP_SIZE-1||z===0||z===MAP_SIZE-1) ? edgeMat : wallMat;
        const wall = new THREE.Mesh(wallGeo, mat);
        wall.position.set(
          x * TILE_SIZE - OFFSET + TILE_SIZE/2,
          TILE_SIZE / 2,
          z * TILE_SIZE - OFFSET + TILE_SIZE/2
        );
        wall.castShadow = true;
        wall.receiveShadow = true;
        scene.add(wall);
      }
    }
    mapData.push(row);
  }
}

function updatePlayer() {
  let dx = 0, dz = 0;
  if (touchDirs.up) dz = -PLAYER_SPEED;
  if (touchDirs.down) dz = PLAYER_SPEED;
  if (touchDirs.left) dx = -PLAYER_SPEED;
  if (touchDirs.right) dx = PLAYER_SPEED;

  if (dx === 0 && dz === 0) return;

  const newX = playerGroup.position.x + dx;
  const newZ = playerGroup.position.z + dz;
  
  const gridX = Math.floor((newX + OFFSET) / TILE_SIZE);
  const gridZ_forX = Math.floor((playerGroup.position.z + OFFSET) / TILE_SIZE);
  if (gridX >= 0 && gridX < MAP_SIZE && gridZ_forX >= 0 && gridZ_forX < MAP_SIZE && mapData[gridZ_forX][gridX] !== 1) {
    playerGroup.position.x = newX;
  }

  const gridZ = Math.floor((newZ + OFFSET) / TILE_SIZE);
  const gridX_forZ = Math.floor((playerGroup.position.x + OFFSET) / TILE_SIZE);
  if (gridX_forZ >= 0 && gridX_forZ < MAP_SIZE && gridZ >= 0 && gridZ < MAP_SIZE && mapData[gridZ][gridX_forZ] !== 1) {
    playerGroup.position.z = newZ;
  }
}

// ============================================================
//  خريطة مصغرة
// ============================================================

let minimapCtx;

function setupMinimap() {
  const minimapFrame = document.getElementById('minimap-frame');
  const canvas = document.createElement('canvas');
  canvas.width = 140;
  canvas.height = 140;
  minimapFrame.appendChild(canvas);
  minimapCtx = canvas.getContext('2d');
}

function updateMinimap() {
  if (!minimapCtx || !playerGroup) return;
  const ctx = minimapCtx;
  const w = 140, h = 140;
  
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(10,10,26,0.9)';
  ctx.fillRect(0, 0, w, h);

  const scale = w / (MAP_SIZE * TILE_SIZE);

  for (let z = 0; z < MAP_SIZE; z++) {
    for (let x = 0; x < MAP_SIZE; x++) {
      const px = x * TILE_SIZE * scale;
      const py = z * TILE_SIZE * scale;
      const size = TILE_SIZE * scale * 0.9;
      
      if (mapData[z][x] === 1) {
        ctx.fillStyle = '#3a3a6a';
        ctx.fillRect(px, py, size, size);
      } else {
        ctx.fillStyle = (x + z) % 2 === 0 ? '#1a1a2e' : '#222244';
        ctx.fillRect(px, py, size, size);
      }
    }
  }

  const px = (playerGroup.position.x + OFFSET) * scale - TILE_SIZE * scale / 2;
  const py = (playerGroup.position.z + OFFSET) * scale - TILE_SIZE * scale / 2;
  
  ctx.fillStyle = '#8b5cf6';
  ctx.shadowColor = '#8b5cf6';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(px + TILE_SIZE * scale / 2, py + TILE_SIZE * scale / 2, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  ctx.strokeStyle = '#c084fc';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(px + TILE_SIZE * scale / 2, py + TILE_SIZE * scale / 2, 6, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,215,0,0.2)';
  ctx.lineWidth = 1;
  ctx.strokeRect(0, 0, w, h);
}

// ============================================================
//  🧹 تنظيف الفيديو القديم
// ============================================================

function cleanupVideo() {
  if (videoSprite) {
    if (videoSprite.material) {
      if (videoSprite.material.map) {
        videoSprite.material.map.dispose();
      }
      videoSprite.material.dispose();
    }
    if (playerGroup) playerGroup.remove(videoSprite);
    videoSprite = null;
  }

  if (videoElement) {
    try {
      videoElement.pause();
      videoElement.removeAttribute('src');
      videoElement.load();
      videoElement.onloadeddata = null;
      videoElement.oncanplay = null;
      videoElement.onerror = null;
      videoElement.onplaying = null;
    } catch(e) {}
    videoElement = null;
  }

  if (videoTexture) {
    try { videoTexture.dispose(); } catch(e) {}
    videoTexture = null;
  }

  if (currentBlobUrl) {
    try { URL.revokeObjectURL(currentBlobUrl); } catch(e) {}
    currentBlobUrl = null;
  }

  isVideoReady = false;
}

// ============================================================
//  🎬 عرض الفيديو على الخريطة
// ============================================================

function showVideoOnMap(url, name, isBlob = false) {
  cleanupVideo();

  showToast('📥 جاري تحميل: ' + name, 'info');
  document.getElementById('char-name').textContent = '⏳ ' + name;

  videoElement = document.createElement('video');
  videoElement.muted = true;
  videoElement.loop = true;
  videoElement.playsInline = true;
  videoElement.preload = 'auto';
  videoElement.crossOrigin = isBlob ? null : 'anonymous';
  videoElement.setAttribute('playsinline', '');
  videoElement.setAttribute('webkit-playsinline', '');

  const onReady = function() {
    if (isVideoReady) return;
    isVideoReady = true;

    videoTexture = new THREE.VideoTexture(videoElement);
    videoTexture.minFilter = THREE.LinearFilter;
    videoTexture.magFilter = THREE.LinearFilter;
    videoTexture.format = THREE.RGBAFormat;
    videoTexture.generateMipmaps = false;

    const material = new THREE.SpriteMaterial({
      map: videoTexture,
      transparent: true,
      depthTest: true,
      depthWrite: false,
      sizeAttenuation: true
    });
    videoSprite = new THREE.Sprite(material);
    
    const aspect = videoElement.videoWidth && videoElement.videoHeight
      ? videoElement.videoWidth / videoElement.videoHeight
      : 1;
    const height = 4.5;
    const width = height * aspect;
    videoSprite.scale.set(width, height, 1);
    videoSprite.position.y = 2.8;
    
    playerGroup.add(videoSprite);

    const playPromise = videoElement.play();
    if (playPromise !== undefined) {
      playPromise.catch(err => {
        console.warn('Play blocked:', err);
        showToast('اضغط على الشاشة لتشغيل الفيديو', 'info');
      });
    }

    document.getElementById('char-name').textContent = '🎬 ' + name;
    showToast('✅ ' + name + ' جاهز!', 'success');
  };

  videoElement.oncanplay = onReady;
  videoElement.onloadeddata = onReady;

  videoElement.onplaying = function() {
    console.log('▶️ الفيديو يعمل الآن');
  };

  videoElement.onerror = function(e) {
    console.error('❌ خطأ في الفيديو:', e, videoElement.error);
    const code = videoElement.error ? videoElement.error.code : 0;
    let msg = 'فشل تحميل الفيديو';
    if (code === 2) msg = 'خطأ شبكة / CORS';
    if (code === 3) msg = 'ملف تالف أو غير مدعوم';
    if (code === 4) msg = 'تنسيق غير مدعوم';

    showToast('❌ ' + msg, 'error');
    document.getElementById('char-name').textContent = '❌ فشل التحميل';
    cleanupVideo();
  };

  if (isBlob) {
    currentBlobUrl = url;
  }
  videoElement.src = url;
  videoElement.load();
}

// ============================================================
//  رفع فيديو محلي
// ============================================================

function handleLocalVideo(event) {
  const file = event.target.files[0];
  if (!file) return;

  if (!file.type.startsWith('video/')) {
    showToast('❌ الملف ليس فيديو', 'error');
    return;
  }

  const blobUrl = URL.createObjectURL(file);
  const name = file.name.replace(/\.[^/.]+$/, '') || 'فيديو محلي';
  showVideoOnMap(blobUrl, name, true);
  event.target.value = '';
}

// ============================================================
//  فيديو تجريبي
// ============================================================

function loadTestVideo() {
  const testUrl = 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm';
  showVideoOnMap(testUrl, 'فيديو تجريبي (MDN)', false);
}

// ============================================================
//  جلب من Telegram
// ============================================================

async function loadVideoFromTelegram() {
  if (!connected) {
    showToast('⚠️ اتصل بالقناة أولاً', 'error');
    return;
  }

  showToast('🎬 جاري البحث عن فيديو...', 'info');
  document.getElementById('tg-status').textContent = '🔍 جاري البحث...';

  try {
    const res = await fetch(
      'https://api.telegram.org/bot' + botToken + '/getUpdates?limit=50&offset=' + (lastUpdateId + 1)
    );
    const data = await res.json();
    
    if (!data.ok) {
      document.getElementById('tg-status').textContent = '❌ ' + (data.description || 'خطأ');
      showToast('❌ ' + (data.description || 'فشل الاتصال'), 'error');
      return;
    }

    let found = false;

    for (const update of (data.result || [])) {
      lastUpdateId = Math.max(lastUpdateId, update.update_id);
      const msg = update.channel_post || update.message;
      if (!msg) continue;

      if (msg.sticker && msg.sticker.is_video) {
        const fileId = msg.sticker.file_id;
        const fileRes = await fetch('https://api.telegram.org/bot' + botToken + '/getFile?file_id=' + fileId);
        const fileData = await fileRes.json();
        
        if (fileData.ok && fileData.result.file_path) {
          const url = 'https://api.telegram.org/file/bot' + botToken + '/' + fileData.result.file_path;
          const caption = msg.caption || '';
          const nameMatch = caption.match(/(?:اسم|name|Name)[\s:]*([^\n]+)/i);
          const name = nameMatch ? nameMatch[1].trim() : 'ملصق WebM';
          
          showVideoOnMap(url, name, false);
          document.getElementById('tg-status').textContent = '✅ تم جلب: ' + name + ' (قد يفشل CORS)';
          found = true;
          break;
        }
      }
      
      if (msg.video) {
        const fileId = msg.video.file_id;
        const fileRes = await fetch('https://api.telegram.org/bot' + botToken + '/getFile?file_id=' + fileId);
        const fileData = await fileRes.json();
        
        if (fileData.ok && fileData.result.file_path) {
          const url = 'https://api.telegram.org/file/bot' + botToken + '/' + fileData.result.file_path;
          const caption = msg.caption || '';
          const nameMatch = caption.match(/(?:اسم|name|Name)[\s:]*([^\n]+)/i);
          const name = nameMatch ? nameMatch[1].trim() : 'فيديو';
          
          showVideoOnMap(url, name, false);
          document.getElementById('tg-status').textContent = '✅ تم جلب: ' + name + ' (قد يفشل CORS)';
          found = true;
          break;
        }
      }
    }

    if (!found) {
      document.getElementById('tg-status').textContent = '📭 لا يوجد فيديو جديد';
      showToast('📭 أرسل فيديو/ملصق في القناة ثم أعد المحاولة', 'info');
    }

  } catch (e) {
    console.error(e);
    document.getElementById('tg-status').textContent = '❌ CORS أو خطأ شبكة';
    showToast('❌ فشل الاتصال بـ Telegram (CORS). استخدم "رفع فيديو محلي"', 'error');
  }
}

// ============================================================
//  دوال Telegram
// ============================================================

function toggleTG() {
  document.getElementById('tg-dropdown').classList.toggle('show');
}

async function testTelegram() {
  botToken = document.getElementById('bot-token').value.trim();
  channelId = document.getElementById('chat-id').value.trim();
  if (!botToken || !channelId) {
    document.getElementById('tg-status').textContent = '❌ ادخل البيانات';
    return;
  }
  
  document.getElementById('tg-status').textContent = '🔄 جاري...';
  
  try {
    const res = await fetch('https://api.telegram.org/bot' + botToken + '/getMe');
    const data = await res.json();
    if (data.ok) {
      connected = true;
      document.getElementById('tg-status').textContent = '✅ متصل بـ @' + data.result.username + 
        '<br><span style="color:#f87171;font-size:9px;">ملاحظة: جلب الملفات غالباً يفشل بسبب CORS. استخدم رفع محلي.</span>';
      localStorage.setItem('nardo_bot_token', botToken);
      localStorage.setItem('nardo_chat_id', channelId);
      showToast('✅ تم الاتصال!', 'success');
    } else {
      document.getElementById('tg-status').textContent = '❌ ' + data.description;
    }
  } catch(e) {
    document.getElementById('tg-status').textContent = '❌ فشل الاتصال (CORS؟)';
    showToast('❌ لا يمكن الاتصال من المتصفح (CORS)', 'error');
  }
}

// ============================================================
//  تحكم
// ============================================================

function setupTouchControls() {
  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const dir = btn.getAttribute('data-dir');
    btn.addEventListener('touchstart', e => {
      e.preventDefault();
      touchDirs[dir] = true;
      btn.style.background = 'rgba(139,92,246,0.2)';
      btn.style.borderColor = '#8b5cf6';
    }, { passive: false });
    btn.addEventListener('touchend', e => {
      e.preventDefault();
      touchDirs[dir] = false;
      btn.style.background = '';
      btn.style.borderColor = '';
    }, { passive: false });
    btn.addEventListener('touchcancel', () => {
      touchDirs[dir] = false;
      btn.style.background = '';
      btn.style.borderColor = '';
    });
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') touchDirs.up = true;
  if (e.key === 'ArrowDown') touchDirs.down = true;
  if (e.key === 'ArrowLeft') touchDirs.left = true;
  if (e.key === 'ArrowRight') touchDirs.right = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowUp') touchDirs.up = false;
  if (e.key === 'ArrowDown') touchDirs.down = false;
  if (e.key === 'ArrowLeft') touchDirs.left = false;
  if (e.key === 'ArrowRight') touchDirs.right = false;
});

document.addEventListener('touchstart', function unlockVideo() {
  if (videoElement && videoElement.paused && isVideoReady) {
    videoElement.play().catch(() => {});
  }
}, { once: false });

function showToast(message, type) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast ' + (type || '');
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

// ============================================================
//  حلقة الرسم
// ============================================================

function animate() {
  requestAnimationFrame(animate);
  
  updatePlayer();
  
  if (videoTexture && isVideoReady) {
    videoTexture.needsUpdate = true;
  }
  
  if (playerGroup) {
    const target = playerGroup.position.clone();
    camera.position.x += (target.x - camera.position.x) * 0.06;
    camera.position.z += (target.z + 12 - camera.position.z) * 0.06;
    camera.position.y += (14 - camera.position.y) * 0.06;
    camera.lookAt(target.x, 0, target.z);
  }
  
  updateMinimap();
  
  renderer.render(scene, camera);
}

// ============================================================
//  الدخول
// ============================================================

function enterApp() {
  document.getElementById('start-screen').style.opacity = '0';
  setTimeout(() => {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-container').style.display = 'block';
    document.getElementById('tg-toggle').style.display = 'block';
    document.getElementById('minimap-frame').style.display = 'block';
    document.getElementById('minimap-label').style.display = 'block';
    
    initThree();
    
    window.addEventListener('resize', () => {
      if (camera) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });

    const savedToken = localStorage.getItem('nardo_bot_token');
    const savedChat = localStorage.getItem('nardo_chat_id');
    if (savedToken) document.getElementById('bot-token').value = savedToken;
    if (savedChat) document.getElementById('chat-id').value = savedChat;

    setTimeout(() => {
      if (savedToken && savedChat) testTelegram();
    }, 600);

    setTimeout(() => {
      showToast('📁 اضغط "رفع فيديو محلي" أو "فيديو تجريبي"', 'info');
    }, 1000);
    
  }, 400);
}

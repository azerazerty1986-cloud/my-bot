<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎮 نظام الشخصيات - قنوات متعددة</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Cairo',sans-serif; background:#050510; color:#fff; overflow:hidden; user-select:none; }

#start-screen {
  position:fixed; inset:0; z-index:2000;
  background:linear-gradient(135deg,#0a0a2a,#000);
  display:flex; flex-direction:column; justify-content:center; align-items:center; gap:20px;
}
.start-logo { font-size:42px; font-weight:900; color:#ffd700; animation:float 3s ease-in-out infinite; }
.start-subtitle { font-size:15px; color:#666; text-align:center; max-width:350px; }
.start-btn {
  border:2px solid #00f2ff; color:#00f2ff; padding:16px 50px;
  background:rgba(0,242,255,0.08); border-radius:60px; font-size:20px;
  cursor:pointer; transition:all .3s; font-weight:700; font-family:inherit;
}
.start-btn:hover { transform:scale(1.05); background:#00f2ff; color:#000; box-shadow:0 0 50px rgba(0,242,255,0.4); }
.user-info { color:#00f2ff; font-size:13px; background:rgba(0,0,0,0.6); padding:8px 24px; border-radius:30px; }
.version-tag { position:absolute; bottom:15px; font-size:11px; color:#444; }
@keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }

#game-container { position:fixed; inset:0; display:none; background:#0a0a1a; }
#game-canvas { display:block; width:100%; height:100%; }

.hud {
  position:fixed; top:0; left:0; right:0; padding:6px 12px;
  display:flex; justify-content:space-between; align-items:center;
  pointer-events:none; z-index:100;
  background:rgba(0,0,0,0.6); backdrop-filter:blur(8px);
}
.hud .title { color:#ffd700; font-size:13px; font-weight:700; }
.hud .info { color:#aaa; font-size:11px; }
.hud .status { color:#4ade80; font-size:10px; }

.dpad {
  position:fixed; bottom:20px; left:16px;
  width:120px; height:120px; z-index:200;
}
.dpad-btn {
  position:absolute; width:40px; height:40px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; color:rgba(255,255,255,0.4);
  cursor:pointer; transition:all .1s;
}
.dpad-btn:active {
  background:rgba(139,92,246,0.2);
  border-color:#8b5cf6; color:#8b5cf6;
  transform:scale(0.88);
}
.dpad-up { top:0; left:40px; }
.dpad-down { bottom:0; left:40px; }
.dpad-left { top:40px; left:0; }
.dpad-right { top:40px; right:0; }

/* Telegram */
.tg-toggle {
  position:fixed; bottom:155px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.6); border:1px solid rgba(255,215,0,0.1);
  border-radius:20px; padding:3px 14px;
  z-index:210; font-size:11px; color:#888; cursor:pointer; display:none;
}
.tg-toggle:hover { color:#ffd700; }

.tg-dropdown {
  position:fixed; bottom:170px; left:50%; transform:translateX(-50%);
  background:rgba(10,10,30,0.95); border:1px solid rgba(255,215,0,0.15);
  border-radius:14px; padding:10px 14px; z-index:250;
  min-width:280px; max-width:92%; display:none; backdrop-filter:blur(12px);
  max-height:350px; overflow-y:auto;
}
.tg-dropdown.show { display:block; }
.tg-dropdown .row { display:flex; gap:5px; margin-bottom:5px; flex-wrap:wrap; }
.tg-dropdown input {
  flex:1; padding:4px 8px; border-radius:6px;
  border:1px solid rgba(255,215,0,0.1); background:#0a0a1a;
  color:#fff; font-size:10px; font-family:inherit; min-width:50px;
}
.tg-dropdown .btn {
  padding:4px 10px; border:none; border-radius:6px;
  font-weight:700; font-size:10px; cursor:pointer; font-family:inherit;
}
.btn-accent { background:#00f2ff; color:#111; }
.btn-purple { background:#8b5cf6; color:#fff; }
.btn-gold { background:#ffd700; color:#111; }
.btn-green { background:#4ade80; color:#111; }
.btn-red { background:#f87171; color:#fff; }
.btn-pink { background:#ec4899; color:#fff; }
#tg-status { font-size:10px; color:#888; margin-top:5px; text-align:center; }

/* قائمة الشخصيات */
.character-grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(70px,1fr));
  gap:6px; margin-top:6px; max-height:120px; overflow-y:auto;
}
.character-card {
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08);
  border-radius:6px; padding:4px; text-align:center; cursor:pointer;
  transition:all .3s;
}
.character-card:hover { background:rgba(139,92,246,0.15); border-color:#8b5cf6; }
.character-card.active { border-color:#ffd700; background:rgba(255,215,0,0.08); }
.character-card .preview {
  width:45px; height:45px; border-radius:50%; margin:0 auto 3px;
  background:#0a0a1a; overflow:hidden; display:flex; align-items:center; justify-content:center;
}
.character-card .preview img, 
.character-card .preview video { width:100%; height:100%; object-fit:cover; }
.character-card .name { font-size:8px; color:#aaa; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.character-card .info { font-size:7px; color:#666; }

/* خريطة مصغرة */
#minimap-frame {
  position:fixed; top:50px; left:10px;
  width:120px; height:120px;
  border:2px solid #ffd700; border-radius:12px;
  overflow:hidden; pointer-events:none; z-index:90;
  background:rgba(5,5,16,0.6);
  display:none; box-shadow:0 0 20px rgba(255,215,0,0.15);
}
#minimap-label {
  position:fixed; top:52px; left:12px; z-index:91;
  font-size:8px; color:#ffd700; background:rgba(0,0,0,0.6);
  padding:1px 6px; border-radius:4px; pointer-events:none; display:none;
}

/* Toast */
.toast-container {
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
  z-index:700; display:flex; flex-direction:column; gap:5px; pointer-events:none;
  align-items:center;
}
.toast {
  background:rgba(0,0,0,0.9); padding:6px 16px; border-radius:30px;
  font-size:11px; border:1px solid rgba(255,255,255,0.06);
  animation:toastIn .3s,toastOut .3s 2.7s forwards;
}
.toast.success { border-color:#4ade80; color:#4ade80; }
.toast.error { border-color:#f87171; color:#f87171; }
.toast.info { border-color:#60a5fa; color:#60a5fa; }
@keyframes toastIn {
  from { opacity:0; transform:translateY(20px); }
  to { opacity:1; transform:translateY(0); }
}
@keyframes toastOut {
  from { opacity:1; transform:translateY(0); }
  to { opacity:0; transform:translateY(-20px); }
}

/* ملف محلي */
#local-video-input { display:none; }

@media (max-width:600px) {
  .character-grid { grid-template-columns:repeat(auto-fill,minmax(55px,1fr)); }
  .character-card .preview { width:35px; height:35px; }
  #minimap-frame { width:100px; height:100px; top:45px; left:8px; }
  #minimap-label { top:47px; left:10px; font-size:7px; }
}
</style>
</head>
<body>

<!-- شاشة البداية -->
<div id="start-screen">
  <div class="start-logo">🎮 نظام الشخصيات</div>
  <div class="start-subtitle">جلب شخصيات من قنوات متعددة + رفع محلي</div>
  <div class="user-info" id="userInfoDisplay">🔄 جاري التحميل...</div>
  <button class="start-btn" id="start-btn" onclick="enterApp()" style="display:none;">🚀 دخول</button>
  <div class="version-tag">v41.0 | Multi-Channel Characters</div>
</div>

<!-- اللعبة -->
<div id="game-container">
  <canvas id="game-canvas"></canvas>
  
  <div id="minimap-frame"></div>
  <div id="minimap-label">🗺️</div>

  <div class="hud">
    <div class="title">👥 الشخصيات</div>
    <div class="info" id="char-name">لا توجد شخصية</div>
    <div class="status" id="game-status">● متصل</div>
  </div>

  <div class="dpad" id="dpad">
    <div class="dpad-btn dpad-up" data-dir="up">▲</div>
    <div class="dpad-btn dpad-down" data-dir="down">▼</div>
    <div class="dpad-btn dpad-left" data-dir="left">◀</div>
    <div class="dpad-btn dpad-right" data-dir="right">▶</div>
  </div>

  <button class="tg-toggle" id="tg-toggle" onclick="toggleTG()">📡 القنوات</button>
  
  <div class="tg-dropdown" id="tg-dropdown">
    <div class="row">
      <input type="text" id="bot-token" placeholder="Bot Token">
      <input type="text" id="chat-id" placeholder="Channel ID">
    </div>
    <div class="row">
      <button class="btn btn-accent" onclick="testTelegram()">🔗 اتصال</button>
      <button class="btn btn-purple" onclick="addChannel()">➕ إضافة قناة</button>
      <button class="btn btn-gold" onclick="fetchAllCharacters()">👥 جلب الكل</button>
      <button class="btn btn-red" onclick="toggleTG()">✖</button>
    </div>
    <div class="row">
      <button class="btn btn-green" onclick="document.getElementById('local-video-input').click()">📁 رفع محلي</button>
      <button class="btn btn-pink" onclick="loadTestCharacter()">🧪 شخصية تجريبية</button>
    </div>
    <div id="tg-status">⭕ غير متصل<br><span style="color:#f87171;font-size:9px;">ملاحظة: Telegram API محظور بـ CORS من المتصفح. استخدم رفع محلي.</span></div>
    
    <!-- القنوات -->
    <div style="margin-top:6px;border-top:1px solid rgba(255,255,255,0.05);padding-top:6px;">
      <div style="font-size:9px;color:#666;">📋 القنوات المضافة:</div>
      <div id="channels-list" style="font-size:9px;color:#888;"></div>
    </div>
    
    <!-- الشخصيات -->
    <div style="margin-top:6px;border-top:1px solid rgba(255,255,255,0.05);padding-top:6px;">
      <div style="font-size:9px;color:#666;">👥 الشخصيات:</div>
      <div id="characters-list" class="character-grid"></div>
    </div>
  </div>

  <input type="file" id="local-video-input" accept="video/*,.webm,.mp4,.mov" onchange="handleLocalVideo(event)">
</div>

<div class="toast-container" id="toast-container"></div>

<script>
// ============================================================
//  1. التهيئة
// ============================================================

const tg = window.Telegram?.WebApp;
let userData = null;
let botToken = '', connected = false, lastUpdateId = 0;

function initTelegram() {
  try {
    if (tg) { tg.ready(); tg.expand(); }
    userData = tg?.initDataUnsafe?.user || { id: Math.floor(Math.random()*100000), first_name: 'مستخدم' };
    document.getElementById('userInfoDisplay').innerHTML = '👤 ' + (userData.first_name || 'مستخدم');
  } catch(e) {
    userData = { id: Math.floor(Math.random()*100000), first_name: 'مستخدم' };
    document.getElementById('userInfoDisplay').innerHTML = '👤 مستخدم';
  }
}

// ============================================================
//  2. نظام القنوات والشخصيات
// ============================================================

let channels = [];
let characters = [];
let currentCharacterIndex = -1;

function loadChannels() {
  try {
    const saved = localStorage.getItem('nardo_channels_v41');
    if (saved) {
      channels = JSON.parse(saved);
      renderChannels();
    }
  } catch(e) {}
}

function saveChannels() {
  try {
    localStorage.setItem('nardo_channels_v41', JSON.stringify(channels));
  } catch(e) {}
}

function addChannel() {
  const channelId = document.getElementById('chat-id').value.trim();
  if (!channelId) {
    showToast('⚠️ ادخل معرف القناة', 'error');
    return;
  }
  
  if (channels.some(c => c.id === channelId)) {
    showToast('⚠️ القناة مضافة مسبقاً', 'error');
    return;
  }
  
  channels.push({
    id: channelId,
    name: 'قناة #' + (channels.length + 1),
    type: 'characters',
    added: Date.now()
  });
  
  saveChannels();
  renderChannels();
  showToast('✅ تم إضافة القناة', 'success');
  document.getElementById('chat-id').value = '';
}

function removeChannel(index) {
  channels.splice(index, 1);
  saveChannels();
  renderChannels();
  showToast('🗑️ تم حذف القناة', 'info');
}

function renderChannels() {
  const list = document.getElementById('channels-list');
  if (channels.length === 0) {
    list.innerHTML = '<span style="color:#555;">لا توجد قنوات مضافة</span>';
    return;
  }
  list.innerHTML = channels.map((c, i) => 
    `<div style="display:flex;justify-content:space-between;align-items:center;padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.03);">
      <span>📡 ${c.name} (${c.id})</span>
      <button onclick="removeChannel(${i})" style="background:none;border:none;color:#f87171;cursor:pointer;font-size:10px;">✖</button>
    </div>`
  ).join('');
}

// ============================================================
//  3. جلب الشخصيات من القنوات
// ============================================================

async function fetchAllCharacters() {
  if (!connected) {
    showToast('⚠️ اتصل بالقناة أولاً', 'error');
    return;
  }
  
  if (channels.length === 0) {
    showToast('⚠️ أضف قناة أولاً', 'error');
    return;
  }
  
  showToast('👥 جاري جلب الشخصيات...', 'info');
  setTGStatus('🔄 جاري الجلب...', '');
  
  let totalFound = 0;
  
  for (const channel of channels) {
    try {
      const found = await fetchCharactersFromChannel(channel.id);
      totalFound += found;
    } catch (e) {
      console.error('خطأ في جلب القناة:', channel.id, e);
    }
  }
  
  if (totalFound > 0) {
    setTGStatus('✅ تم جلب ' + totalFound + ' شخصية!', 'success');
    showToast('✅ تم جلب ' + totalFound + ' شخصية!', 'success');
    renderCharacters();
    
    if (characters.length > 0 && currentCharacterIndex === -1) {
      selectCharacter(0);
    }
  } else {
    setTGStatus('📭 لا توجد شخصيات', '');
    showToast('📭 أرسل شخصيات (WebM) في القنوات', 'info');
  }
}

async function fetchCharactersFromChannel(channelId) {
  let found = 0;
  
  try {
    const res = await fetch(
      'https://api.telegram.org/bot' + botToken + '/getUpdates?limit=100&offset=' + (lastUpdateId + 1)
    );
    const data = await res.json();
    
    if (!data.ok) {
      console.error('خطأ في الجلب:', data.description);
      return 0;
    }
    
    for (const update of (data.result || [])) {
      lastUpdateId = Math.max(lastUpdateId, update.update_id);
      const msg = update.channel_post || update.message;
      if (!msg) continue;
      
      if (msg.chat.id.toString() !== channelId) continue;
      
      if (msg.sticker && msg.sticker.is_video) {
        const fileId = msg.sticker.file_id;
        const fileRes = await fetch('https://api.telegram.org/bot' + botToken + '/getFile?file_id=' + fileId);
        const fileData = await fileRes.json();
        
        if (fileData.ok && fileData.result.file_path) {
          const url = 'https://api.telegram.org/file/bot' + botToken + '/' + fileData.result.file_path;
          const caption = msg.caption || '';
          
          let name = 'شخصية';
          const nameMatch = caption.match(/(?:اسم|name|Name)[\s:]*([^\n]+)/i);
          if (nameMatch) name = nameMatch[1].trim();
          
          let health = 100;
          const healthMatch = caption.match(/(?:صحة|health)[\s:]*(\d+)/i);
          if (healthMatch) health = parseInt(healthMatch[1]);
          
          let speed = 5;
          const speedMatch = caption.match(/(?:سرعة|speed)[\s:]*(\d+)/i);
          if (speedMatch) speed = parseInt(speedMatch[1]);
          
          characters.push({
            id: fileId,
            name: name,
            url: url,
            channel: channelId,
            health: health,
            speed: speed,
            isVideo: true,
            loaded: false,
            isBlob: false
          });
          
          found++;
        }
      }
    }
    
  } catch (e) {
    console.error('fetchCharactersFromChannel error:', e);
  }
  
  return found;
}

// ============================================================
//  4. عرض الشخصيات في الواجهة
// ============================================================

function renderCharacters() {
  const list = document.getElementById('characters-list');
  
  if (characters.length === 0) {
    list.innerHTML = '<div style="color:#555;font-size:9px;text-align:center;">لا توجد شخصيات</div>';
    return;
  }
  
  list.innerHTML = characters.map((char, index) => `
    <div class="character-card ${index === currentCharacterIndex ? 'active' : ''}" 
         onclick="selectCharacter(${index})"
         data-index="${index}">
      <div class="preview">
        ${char.loaded ? 
          (char.isVideo || char.isBlob ? 
            `<video autoplay loop muted playsinline src="${char.url}" style="width:100%;height:100%;object-fit:cover;"></video>` :
            `<img src="${char.url}" style="width:100%;height:100%;object-fit:cover;">`
          ) : '⏳'
        }
      </div>
      <div class="name">${char.name}</div>
      <div class="info">❤️${char.health}</div>
    </div>
  `).join('');
}

// ============================================================
//  5. اختيار وعرض الشخصية في 3D
// ============================================================

let playerCharacter = null;
let characterVideoElement = null;

function selectCharacter(index) {
  if (index < 0 || index >= characters.length) return;
  
  currentCharacterIndex = index;
  const char = characters[index];
  
  // تنظيف القديم
  if (playerCharacter) {
    if (playerCharacter.material) {
      if (playerCharacter.material.map) playerCharacter.material.map.dispose();
      playerCharacter.material.dispose();
    }
    playerGroup.remove(playerCharacter);
    playerCharacter = null;
  }
  if (characterVideoElement) {
    try { characterVideoElement.pause(); } catch(e) {}
    characterVideoElement = null;
  }
  
  renderCharacters();
  document.getElementById('char-name').textContent = '👤 ' + char.name;
  
  // تحميل وعرض الشخصية
  if (char.isVideo || char.isBlob) {
    showCharacterVideo(char);
  } else {
    showCharacterImage(char);
  }
  
  showToast('✅ تم اختيار: ' + char.name, 'success');
}

function showCharacterVideo(char) {
  const video = document.createElement('video');
  video.muted = true;
  video.loop = true;
  video.playsInline = true;
  video.setAttribute('playsinline', '');
  video.setAttribute('webkit-playsinline', '');
  video.src = char.url;
  
  characterVideoElement = video;
  
  video.onloadeddata = function() {
    video.play().catch(() => {});
    
    const texture = new THREE.VideoTexture(video);
    texture.minFilter = THREE.LinearFilter;
    texture.magFilter = THREE.LinearFilter;
    texture.format = THREE.RGBAFormat;
    
    const material = new THREE.SpriteMaterial({
      map: texture,
      transparent: true,
      depthTest: true,
      depthWrite: false
    });
    
    const sprite = new THREE.Sprite(material);
    const aspect = video.videoWidth && video.videoHeight ? video.videoWidth / video.videoHeight : 1;
    const height = 4.5;
    const width = height * aspect;
    sprite.scale.set(width, height, 1);
    sprite.position.y = 2.8;
    
    playerGroup.add(sprite);
    playerCharacter = sprite;
    char.loaded = true;
    renderCharacters();
  };
  
  video.onerror = function() {
    showToast('❌ فشل تحميل الشخصية', 'error');
    char.loaded = false;
  };
  
  video.load();
}

function showCharacterImage(char) {
  const loader = new THREE.TextureLoader();
  loader.load(char.url, (texture) => {
    const material = new THREE.SpriteMaterial({
      map: texture,
      transparent: true,
      depthTest: true,
      depthWrite: false
    });
    
    const sprite = new THREE.Sprite(material);
    sprite.scale.set(4.0, 4.0, 1);
    sprite.position.y = 2.8;
    
    playerGroup.add(sprite);
    playerCharacter = sprite;
    char.loaded = true;
    renderCharacters();
  });
}

// ============================================================
//  6. رفع فيديو محلي
// ============================================================

function handleLocalVideo(event) {
  const file = event.target.files[0];
  if (!file) return;

  if (!file.type.startsWith('video/')) {
    showToast('❌ الملف ليس فيديو', 'error');
    return;
  }

  const blobUrl = URL.createObjectURL(file);
  const name = file.name.replace(/\.[^/.]+$/, '') || 'فيديو محلي';
  
  // إضافة الشخصية
  characters.push({
    id: 'local_' + Date.now(),
    name: name,
    url: blobUrl,
    channel: 'local',
    health: 100,
    speed: 5,
    isVideo: true,
    isBlob: true,
    loaded: false
  });
  
  renderCharacters();
  selectCharacter(characters.length - 1);
  event.target.value = '';
}

// ============================================================
//  7. شخصية تجريبية
// ============================================================

function loadTestCharacter() {
  const testUrl = 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm';
  
  characters.push({
    id: 'test_' + Date.now(),
    name: 'زهرة تجريبية',
    url: testUrl,
    channel: 'test',
    health: 100,
    speed: 5,
    isVideo: true,
    isBlob: false,
    loaded: false
  });
  
  renderCharacters();
  selectCharacter(characters.length - 1);
  showToast('🧪 تم تحميل شخصية تجريبية', 'success');
}

// ============================================================
//  8. Three.js
// ============================================================

let scene, camera, renderer;
let playerGroup;
let touchDirs = { up: false, down: false, left: false, right: false };
let mapData = [];
let minimapCtx;

const MAP_SIZE = 12;
const TILE_SIZE = 3;
const WORLD_SIZE = MAP_SIZE * TILE_SIZE;
const OFFSET = WORLD_SIZE / 2;
const PLAYER_SPEED = 0.10;

function initThree() {
  const canvas = document.getElementById('game-canvas');
  
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a1a);
  
  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 15, 15);
  
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  
  const ambient = new THREE.AmbientLight(0x8b5cf6, 0.4);
  scene.add(ambient);
  
  const dirLight = new THREE.DirectionalLight(0xffeedd, 0.8);
  dirLight.position.set(20, 30, 20);
  scene.add(dirLight);
  
  const groundGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x15152a, roughness: 0.9 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);
  
  const gridHelper = new THREE.GridHelper(WORLD_SIZE, MAP_SIZE, 0x6d28d9, 0x2a2a4a);
  gridHelper.position.y = 0.02;
  scene.add(gridHelper);
  
  playerGroup = new THREE.Group();
  scene.add(playerGroup);
  
  const ball = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 8, 8),
    new THREE.MeshStandardMaterial({ color: 0x8b5cf6, emissive: 0x6d28d9, emissiveIntensity: 0.3 })
  );
  ball.position.y = 0.3;
  playerGroup.add(ball);
  
  playerGroup.position.set(0, 0, 0);
  
  generateMap();
  setupMinimap();
  animate();
}

function generateMap() {
  mapData = [];
  for (let z = 0; z < MAP_SIZE; z++) {
    const row = [];
    for (let x = 0; x < MAP_SIZE; x++) {
      if (x === 0 || x === MAP_SIZE - 1 || z === 0 || z === MAP_SIZE - 1) row.push(1);
      else if (Math.random() < 0.08) row.push(1);
      else row.push(0);
    }
    mapData.push(row);
  }
  for (let z = 1; z <= 2; z++) {
    for (let x = 1; x <= 2; x++) {
      mapData[z][x] = 0;
    }
  }
}

function updatePlayer() {
  let dx = 0, dz = 0;
  if (touchDirs.up) dz = -PLAYER_SPEED;
  if (touchDirs.down) dz = PLAYER_SPEED;
  if (touchDirs.left) dx = -PLAYER_SPEED;
  if (touchDirs.right) dx = PLAYER_SPEED;
  
  if (dx === 0 && dz === 0) return;
  
  const newX = playerGroup.position.x + dx;
  const newZ = playerGroup.position.z + dz;
  const gridX = Math.floor((newX + OFFSET) / TILE_SIZE);
  const gridZ = Math.floor((newZ + OFFSET) / TILE_SIZE);
  
  if (gridX >= 0 && gridX < MAP_SIZE && gridZ >= 0 && gridZ < MAP_SIZE && mapData[gridZ][gridX] !== 1) {
    playerGroup.position.x = newX;
    playerGroup.position.z = newZ;
  }
}

// ============================================================
//  9. خريطة مصغرة
// ============================================================

function setupMinimap() {
  const minimapFrame = document.getElementById('minimap-frame');
  const canvas = document.createElement('canvas');
  canvas.width = 120;
  canvas.height = 120;
  minimapFrame.appendChild(canvas);
  minimapCtx = canvas.getContext('2d');
}

function updateMinimap() {
  if (!minimapCtx) return;
  const ctx = minimapCtx;
  const w = 120, h = 120;
  
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(10,10,26,0.9)';
  ctx.fillRect(0, 0, w, h);
  
  const scale = w / (MAP_SIZE * TILE_SIZE);
  
  for (let z = 0; z < mapData.length; z++) {
    for (let x = 0; x < mapData[z].length; x++) {
      const px = x * TILE_SIZE * scale;
      const py = z * TILE_SIZE * scale;
      const size = TILE_SIZE * scale * 0.8;
      
      ctx.fillStyle = mapData[z][x] === 1 ? '#3a3a6a' : '#1a1a2e';
      ctx.fillRect(px, py, size, size);
    }
  }
  
  const px = (playerGroup.position.x + OFFSET) * scale;
  const py = (playerGroup.position.z + OFFSET) * scale;
  
  ctx.fillStyle = '#8b5cf6';
  ctx.shadowColor = '#8b5cf6';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.arc(px, py, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(0, 0, w, h);
}

// ============================================================
//  10. حلقة الرسم
// ============================================================

function animate() {
  requestAnimationFrame(animate);
  
  updatePlayer();
  
  if (playerCharacter && playerCharacter.material && playerCharacter.material.map) {
    if (playerCharacter.material.map.isVideoTexture) {
      playerCharacter.material.map.needsUpdate = true;
    }
  }
  
  const target = playerGroup.position.clone();
  camera.position.x += (target.x - camera.position.x) * 0.05;
  camera.position.z += (target.z + 10 - camera.position.z) * 0.05;
  camera.position.y += (12 - camera.position.y) * 0.05;
  camera.lookAt(target.x, 0, target.z);
  
  updateMinimap();
  renderer.render(scene, camera);
}

function toggleTG() {
  document.getElementById('tg-dropdown').classList.toggle('show');
}

function setTGStatus(msg, type) {
  const el = document.getElementById('tg-status');
  el.textContent = msg;
  el.style.color = type === 'success' ? '#4ade80' : type === 'error' ? '#f87171' : '#888';
}

async function testTelegram() {
  botToken = document.getElementById('bot-token').value.trim();
  if (!botToken) { setTGStatus('❌ ادخل Token', 'error'); return; }
  
  setTGStatus('🔄 جاري...', '');
  try {
    const res = await fetch('https://api.telegram.org/bot' + botToken + '/getMe');
    const data = await res.json();
    if (data.ok) {
      connected = true;
      setTGStatus('✅ متصل بـ @' + data.result.username + '<br><span style="color:#f87171;font-size:9px;">⚠️ جلب الملفات يفشل بـ CORS. استخدم رفع محلي.</span>', 'success');
      localStorage.setItem('nardo_bot_token', botToken);
      showToast('✅ تم الاتصال!', 'success');
      loadChannels();
      document.getElementById('game-status').textContent = '● متصل';
      document.getElementById('game-status').style.color = '#4ade80';
    } else {
      setTGStatus('❌ ' + data.description, 'error');
    }
  } catch(e) {
    setTGStatus('❌ فشل الاتصال (CORS)', 'error');
    showToast('❌ لا يمكن الاتصال من المتصفح (CORS)', 'error');
  }
}

// ============================================================
//  12. تحكم
// ============================================================

function setupTouchControls() {
  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const dir = btn.getAttribute('data-dir');
    btn.addEventListener('touchstart', e => {
      e.preventDefault();
      touchDirs[dir] = true;
      btn.style.background = 'rgba(139,92,246,0.2)';
      btn.style.borderColor = '#8b5cf6';
    }, { passive: false });
    btn.addEventListener('touchend', e => {
      e.preventDefault();
      touchDirs[dir] = false;
      btn.style.background = '';
      btn.style.borderColor = '';
    }, { passive: false });
    btn.addEventListener('touchcancel', () => {
      touchDirs[dir] = false;
      btn.style.background = '';
      btn.style.borderColor = '';
    });
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') touchDirs.up = true;
  if (e.key === 'ArrowDown') touchDirs.down = true;
  if (e.key === 'ArrowLeft') touchDirs.left = true;
  if (e.key === 'ArrowRight') touchDirs.right = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowUp') touchDirs.up = false;
  if (e.key === 'ArrowDown') touchDirs.down = false;
  if (e.key === 'ArrowLeft') touchDirs.left = false;
  if (e.key === 'ArrowRight') touchDirs.right = false;
});

function showToast(message, type) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast ' + (type || '');
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

//  13. الدخول
// ============================================================

function enterApp() {
  document.getElementById('start-screen').style.opacity = '0';
  setTimeout(() => {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-container').style.display = 'block';
    document.getElementById('tg-toggle').style.display = 'block';
    document.getElementById('minimap-frame').style.display = 'block';
    document.getElementById('minimap-label').style.display = 'block';
    
    initThree();
    
    window.addEventListener('resize', () => {
      if (camera) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });
    
    const savedToken = localStorage.getItem('nardo_bot_token');
    if (savedToken) {
      document.getElementById('bot-token').value = savedToken;
      setTimeout(testTelegram, 600);
    }
    
    showToast('📁 أضف قناة أو ارفع فيديو محلي', 'info');
  }, 400);
}

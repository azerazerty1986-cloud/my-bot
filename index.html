<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة النقر</title>
    <style>
        body { background-color: #121212; color: white; text-align: center; font-family: Arial; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .coin { width: 200px; height: 200px; background: radial-gradient(circle, #fbc02d, #f9a825); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 100px; box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); cursor: pointer; transition: transform 0.1s; user-select: none; }
        .coin:active { transform: scale(0.9); }
        h1 { margin-bottom: 20px; color: #ffd700; }
    </style>
</head>
<body>
    <h1>روبوتي الخاص 🪙</h1>
    <div class="coin" onclick="this.style.transform='scale(0.95)'">🪙</div>
    <p>اضغط على العملة للبدء!</p>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم روبوتي</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; text-align: center; padding: 15px; margin: 0; }
        .header { background: #1e1e1e; padding: 15px; border-radius: 0 0 20px 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .score-box { font-size: 32px; color: #ffd700; font-weight: bold; }
        .coin-container { margin: 30px auto; width: 180px; height: 180px; position: relative; }
        .coin { width: 100%; cursor: pointer; transition: transform 0.1s; filter: drop-shadow(0 0 15px #ff9900); }
        .coin:active { transform: scale(0.92); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        button { background: #248bcf; color: white; border: none; padding: 16px; border-radius: 14px; font-size: 14px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:active { background: #1a6699; }
        .full-btn { grid-column: span 2; background: #28a745; font-size: 16px; }
        .footer { margin-top: 30px; font-size: 11px; color: #666; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="score-box">🪙 <span id="balance">0</span></div>
        <p style="margin: 5px 0 0; color: #aaa;">رصيدك من النقاط</p>
    </div>

    <div class="coin-container">
        <img src="https://raw.githubusercontent.com/azerazerty1986-cloud/my-bot/main/coin.png" class="coin" onclick="tapCoin()">
    </div>
    
    <h3 style="text-align: right; margin-right: 10px;">أدوات التداول:</h3>
    <div class="grid">
        <button class="full-btn" onclick="sendCmd('تحليل شامل')">📊 تحليل شامل (3 في 1)</button>
        <button onclick="sendCmd('المحفظة')">💰 المحفظة</button>
        <button onclick="sendCmd('إضافة للرادار')">➕ إضافة للرادار</button>
        <button onclick="sendCmd('المضارب المحترف')">⚡ المضارب</button>
        <button onclick="sendCmd('المدافع الحكيم')">🛡️ المدافع</button>
        <button onclick="sendCmd('تشغيل الرادار')">🟢 تشغيل الرادار</button>
        <button onclick="sendCmd('قائمة المراقبة')">📜 القائمة</button>
    </div>

    <div class="footer">POWERED BY AZERAZERTY1986</div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.headerColor = '#1e1e1e';

        let score = localStorage.getItem('userScore') || 0;
        document.getElementById('balance').innerText = score;

        function tapCoin() {
            score++;
            document.getElementById('balance').innerText = score;
            localStorage.setItem('userScore', score);
            tg.HapticFeedback.impactOccurred('light');
        }

        function sendCmd(cmdText) {
            tg.sendData(cmdText); // يرسل النص للبوت ويغلق الواجهة
        }
    </script>
</body>
</html>

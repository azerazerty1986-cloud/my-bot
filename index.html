<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌍 بيئة حية - سماء وأرضية متحركة + 360</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Cairo', sans-serif; background:#050510; color:#fff; overflow:hidden; }
canvas { display:block; width:100%; height:100%; }

#info {
  position:fixed; top:10px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.75); padding:6px 18px; border-radius:20px;
  z-index:100; font-size:13px; border:1px solid rgba(255,215,0,0.25);
}
#info span { color:#ffd700; }

#status {
  position:fixed; top:48px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.6); padding:4px 14px; border-radius:12px;
  z-index:100; font-size:12px; color:#4ade80;
}

#controls {
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
  display:flex; gap:6px; z-index:100; flex-wrap:wrap; justify-content:center;
}
#controls button {
  background:rgba(139,92,246,0.2); color:#fff; border:1px solid rgba(139,92,246,0.35);
  padding:6px 14px; border-radius:12px; cursor:pointer; font-size:12px; font-family:inherit;
}
#controls button:hover { background:rgba(139,92,246,0.4); }

.dpad {
  position:fixed; bottom:90px; left:16px; width:110px; height:110px; z-index:200;
}
.dpad-btn {
  position:absolute; width:36px; height:36px; border-radius:50%;
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12);
  display:flex; align-items:center; justify-content:center; font-size:14px;
  color:rgba(255,255,255,0.4); cursor:pointer;
}
.dpad-btn:active { background:rgba(139,92,246,0.35); color:#c4b5fd; }
.dpad-up { top:0; left:37px; }
.dpad-down { bottom:0; left:37px; }
.dpad-left { top:37px; left:0; }
.dpad-right { top:37px; right:0; }

#enter360-btn {
  position:fixed; bottom:160px; left:50%; transform:translateX(-50%);
  background:rgba(0,242,255,0.25); color:#fff; border:1px solid rgba(0,242,255,0.45);
  padding:8px 22px; border-radius:16px; font-size:13px; font-family:inherit;
  cursor:pointer; z-index:150; display:none; animation: pulse 1.4s infinite;
}
@keyframes pulse {
  0%,100% { transform:translateX(-50%) scale(1); }
  50% { transform:translateX(-50%) scale(1.05); }
}

#exit360-btn {
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
  background:rgba(248,113,113,0.3); color:#fff; border:1px solid rgba(248,113,113,0.5);
  padding:8px 22px; border-radius:16px; font-size:13px; font-family:inherit;
  cursor:pointer; z-index:300; display:none;
}

#toast-container {
  position:fixed; bottom:120px; left:50%; transform:translateX(-50%);
  z-index:1000; display:flex; flex-direction:column; gap:6px; align-items:center;
  pointer-events:none;
}
.toast {
  background:rgba(0,0,0,0.9); color:#fff; padding:6px 16px;
  border-radius:18px; font-size:12px; border:1px solid rgba(255,255,255,0.08);
}
.toast.success { border-color:#4ade80; }
.toast.info { border-color:#60a5fa; }
.toast.error { border-color:#f87171; }

#loader {
  position:fixed; inset:0; z-index:2000; background:#050510;
  display:flex; flex-direction:column; justify-content:center; align-items:center; gap:16px;
}
#loader .spin {
  width:48px; height:48px; border:4px solid rgba(255,215,0,0.15);
  border-top-color:#ffd700; border-radius:50%; animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loader">
  <div class="spin"></div>
  <div style="color:#ffd700;font-size:14px;">جاري تحميل البيئة...</div>
</div>

<div id="info">🌍 <span>بيئة حية</span> — سماء + أرضية متحركة</div>
<div id="status">جاري التهيئة...</div>

<div id="controls">
  <button onclick="resetCamera()">🔄 كاميرا</button>
  <button onclick="toggleGround()">地板 أرضية</button>
  <button onclick="toggleSky()">🌌 سماء</button>
</div>

<div class="dpad" id="dpad">
  <div class="dpad-btn dpad-up" data-dir="up">▲</div>
  <div class="dpad-btn dpad-down" data-dir="down">▼</div>
  <div class="dpad-btn dpad-left" data-dir="left">◀</div>
  <div class="dpad-btn dpad-right" data-dir="right">▶</div>
</div>

<button id="enter360-btn" onclick="enter360()">🌐 دخول 360</button>
<button id="exit360-btn" onclick="exit360()">🚪 خروج من 360</button>

<div id="toast-container"></div>
<canvas id="canvas"></canvas>

<script>
// ============================================================
//  بيئة حية: سماء متحركة + أرضية متحركة + دخول 360
// ============================================================

const PLAYER_SPEED = 0.13;
const GROUND_SIZE = 80;

let scene, camera, renderer;
let playerGroup;
let groundMesh, skyMesh;
let groundVideo, skyVideo;
let groundTexture, skyTexture;

let touchDirs = { up:false, down:false, left:false, right:false };
let isIn360 = false;
let groundVisible = true;
let skyVisible = true;

// 360
let lon = 0, lat = 0;
let isDragging = false;
let ptrX = 0, ptrY = 0, ptrLon = 0, ptrLat = 0;

// فيديوهات تجريبية (يمكن استبدالها لاحقاً)
const GROUND_VIDEO = 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm';
const SKY_VIDEO    = 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm';

// ============================================================
//  واجهة
// ============================================================
function showToast(msg, type='info') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

function setStatus(text) {
  document.getElementById('status').textContent = text;
}

// ============================================================
//  إنشاء فيديو كـ Texture
// ============================================================
function createVideoTexture(url, onReady) {
  const video = document.createElement('video');
  video.src = url;
  video.crossOrigin = 'anonymous';
  video.loop = true;
  video.muted = true;
  video.playsInline = true;
  video.preload = 'auto';

  video.addEventListener('loadeddata', () => {
    video.play().catch(() => {});
    const tex = new THREE.VideoTexture(video);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.format = THREE.RGBAFormat;
    if (onReady) onReady(video, tex);
  });

  video.addEventListener('error', () => {
    showToast('⚠️ فشل تحميل فيديو', 'error');
    if (onReady) onReady(null, null);
  });

  video.load();
  return video;
}

// ============================================================
//  الأرضية المتحركة
// ============================================================
function createGround() {
  createVideoTexture(GROUND_VIDEO, (video, tex) => {
    if (!tex) {
      // احتياطي: لون ثابت
      const mat = new THREE.MeshStandardMaterial({ color: 0x1a3a2a, roughness: 0.9 });
      groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE), mat);
      groundMesh.rotation.x = -Math.PI / 2;
      groundMesh.position.y = 0;
      scene.add(groundMesh);
      return;
    }

    groundVideo = video;
    groundTexture = tex;
    groundTexture.wrapS = THREE.RepeatWrapping;
    groundTexture.wrapT = THREE.RepeatWrapping;
    groundTexture.repeat.set(6, 6); // تكرار ليعطي امتداد

    const geo = new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE);
    const mat = new THREE.MeshStandardMaterial({
      map: groundTexture,
      roughness: 0.85,
      metalness: 0.05
    });
    groundMesh = new THREE.Mesh(geo, mat);
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.position.y = 0;
    groundMesh.receiveShadow = true;
    scene.add(groundMesh);

    showToast('✅ الأرضية المتحركة جاهزة', 'success');
    checkReady();
  });
}

// ============================================================
//  السماء المتحركة
// ============================================================
function createSky() {
  createVideoTexture(SKY_VIDEO, (video, tex) => {
    if (!tex) {
      scene.background = new THREE.Color(0x0a0a2a);
      checkReady();
      return;
    }

    skyVideo = video;
    skyTexture = tex;

    // كرة كبيرة من الداخل = سماء محيطة
    const geo = new THREE.SphereGeometry(90, 48, 32);
    const mat = new THREE.MeshBasicMaterial({
      map: skyTexture,
      side: THREE.BackSide
    });
    skyMesh = new THREE.Mesh(geo, mat);
    scene.add(skyMesh);

    showToast('✅ السماء المتحركة جاهزة', 'success');
    checkReady();
  });
}

let readyCount = 0;
function checkReady() {
  readyCount++;
  if (readyCount >= 2) {
    document.getElementById('loader').style.display = 'none';
    setStatus('✅ البيئة جاهزة — تحرك بحرية');
    showToast('🌍 مرحباً في البيئة الحية', 'success');
    document.getElementById('enter360-btn').style.display = 'block';
  }
}

// ============================================================
//  اللاعب
// ============================================================
function createPlayer() {
  playerGroup = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.35, 0.4, 0.9, 10),
    new THREE.MeshStandardMaterial({
      color: 0x8b5cf6, emissive: 0x5b21b6, emissiveIntensity: 0.25, roughness: 0.4
    })
  );
  body.position.y = 0.45;
  body.castShadow = true;
  playerGroup.add(body);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.22, 10, 10),
    new THREE.MeshStandardMaterial({ color: 0xa78bfa, roughness: 0.3 })
  );
  head.position.y = 1.05;
  head.castShadow = true;
  playerGroup.add(head);

  // ظل بسيط
  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(0.5, 16),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.02;
  playerGroup.add(shadow);

  playerGroup.position.set(0, 0, 0);
  scene.add(playerGroup);
}

// ============================================================
//  الحركة والكاميرا (وضع اللعب العادي)
// ============================================================
function updatePlayer() {
  if (isIn360) return;

  let dx = 0, dz = 0;
  if (touchDirs.up)    dz = -PLAYER_SPEED;
  if (touchDirs.down)  dz =  PLAYER_SPEED;
  if (touchDirs.left)  dx = -PLAYER_SPEED;
  if (touchDirs.right) dx =  PLAYER_SPEED;

  const limit = GROUND_SIZE / 2 - 2;
  playerGroup.position.x = Math.max(-limit, Math.min(limit, playerGroup.position.x + dx));
  playerGroup.position.z = Math.max(-limit, Math.min(limit, playerGroup.position.z + dz));

  if (dx !== 0 || dz !== 0) {
    playerGroup.rotation.y = Math.atan2(dx, dz);
  }
}

function updateCamera() {
  if (isIn360) return;

  const target = playerGroup.position.clone();
  const angle = playerGroup.rotation.y;
  const dist = 8;
  const height = 5.5;

  const desired = new THREE.Vector3(
    target.x - Math.sin(angle) * dist,
    target.y + height,
    target.z - Math.cos(angle) * dist
  );

  camera.position.lerp(desired, 0.08);
  camera.lookAt(target.x, target.y + 1.0, target.z);
}

// ============================================================
//  وضع 360
// ============================================================
function enter360() {
  if (isIn360) return;
  isIn360 = true;

  // إخفاء اللاعب والأرضية مؤقتاً لتعزيز الإحساس
  playerGroup.visible = false;
  if (groundMesh) groundMesh.visible = false;

  // وضع الكاميرا في المركز
  camera.position.set(playerGroup.position.x, 1.6, playerGroup.position.z);
  lon = 0; lat = 0;
  update360Camera();

  document.getElementById('enter360-btn').style.display = 'none';
  document.getElementById('exit360-btn').style.display = 'block';
  document.getElementById('dpad').style.display = 'none';
  setStatus('🌐 وضع 360 — اسحب للنظر حولك');
  showToast('🌐 دخلت وضع 360', 'success');
}

function exit360() {
  if (!isIn360) return;
  isIn360 = false;

  playerGroup.visible = true;
  if (groundMesh) groundMesh.visible = groundVisible;

  document.getElementById('enter360-btn').style.display = 'block';
  document.getElementById('exit360-btn').style.display = 'none';
  document.getElementById('dpad').style.display = 'block';
  setStatus('✅ عدت للوضع العادي');
  showToast('خرجت من 360', 'info');
}

function update360Camera() {
  const phi = THREE.MathUtils.degToRad(90 - lat);
  const theta = THREE.MathUtils.degToRad(lon);
  const target = new THREE.Vector3(
    Math.sin(phi) * Math.cos(theta),
    Math.cos(phi),
    Math.sin(phi) * Math.sin(theta)
  );
  const pos = camera.position.clone();
  camera.lookAt(pos.add(target));
}

// سحب للنظر في 360
document.addEventListener('pointerdown', e => {
  if (!isIn360) return;
  isDragging = true;
  ptrX = e.clientX; ptrY = e.clientY;
  ptrLon = lon; ptrLat = lat;
});
document.addEventListener('pointermove', e => {
  if (!isDragging || !isIn360) return;
  lon = ptrLon - (e.clientX - ptrX) * 0.15;
  lat = Math.max(-85, Math.min(85, ptrLat + (e.clientY - ptrY) * 0.15));
  update360Camera();
});
document.addEventListener('pointerup', () => { isDragging = false; });
document.addEventListener('pointerleave', () => { isDragging = false; });

// ============================================================
//  أزرار إضافية
// ============================================================
function resetCamera() {
  if (isIn360) {
    lon = 0; lat = 0;
    update360Camera();
  } else {
    camera.position.set(0, 6, 10);
    camera.lookAt(0, 0, 0);
  }
}

function toggleGround() {
  groundVisible = !groundVisible;
  if (groundMesh && !isIn360) groundMesh.visible = groundVisible;
  showToast(groundVisible ? 'الأرضية ظاهرة' : 'الأرضية مخفية', 'info');
}

function toggleSky() {
  skyVisible = !skyVisible;
  if (skyMesh) skyMesh.visible = skyVisible;
  showToast(skyVisible ? 'السماء ظاهرة' : 'السماء مخفية', 'info');
}

// ============================================================
//  تهيئة Three.js
// ============================================================
function init() {
  const canvas = document.getElementById('canvas');

  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0a1a, 0.012);

  camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
  camera.position.set(0, 6, 10);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;

  // إضاءة
  scene.add(new THREE.AmbientLight(0x8899cc, 0.55));
  const sun = new THREE.DirectionalLight(0xfff5e0, 0.9);
  sun.position.set(20, 40, 15);
  sun.castShadow = true;
  scene.add(sun);

  createPlayer();
  createGround();
  createSky();

  // حلقة الرسم
  function loop() {
    requestAnimationFrame(loop);

    if (groundTexture) groundTexture.needsUpdate = true;
    if (skyTexture) skyTexture.needsUpdate = true;

    updatePlayer();
    updateCamera();

    renderer.render(scene, camera);
  }
  loop();
}

// ============================================================
//  التحكم
// ============================================================
function setupControls() {
  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const dir = btn.dataset.dir;
    btn.addEventListener('touchstart', e => { e.preventDefault(); touchDirs[dir] = true; }, { passive:false });
    btn.addEventListener('touchend',   e => { e.preventDefault(); touchDirs[dir] = false; }, { passive:false });
  });

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp') touchDirs.up = true;
    if (e.key === 'ArrowDown') touchDirs.down = true;
    if (e.key === 'ArrowLeft') touchDirs.left = true;
    if (e.key === 'ArrowRight') touchDirs.right = true;
    if (e.key === 'Escape' && isIn360) exit360();
    if ((e.key === 'Enter' || e.key === ' ') && !isIn360) enter360();
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowUp') touchDirs.up = false;
    if (e.key === 'ArrowDown') touchDirs.down = false;
    if (e.key === 'ArrowLeft') touchDirs.left = false;
    if (e.key === 'ArrowRight') touchDirs.right = false;
  });
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

setupControls();
init();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 أرضية واقعية 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
body { margin:0; overflow:hidden; background:#000; }
#info {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  color:#fff; font-family:Arial; background:rgba(0,0,0,0.7);
  padding:10px 20px; border-radius:10px; z-index:10;
  font-size:14px; text-align:center;
}
</style>
</head>
<body>

<div id="info">🌍 أرضية واقعية متحركة</div>
<canvas id="canvas"></canvas>

<script>
// ============================================================
//  🌍 أرضية واقعية مع فيديو
// ============================================================

const canvas = document.getElementById('canvas');

// المشهد
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);
scene.fog = new THREE.FogExp2(0x0a0a1a, 0.005);

// الكاميرا
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 8, 10);
camera.lookAt(0, 0, 0);

// الـ Renderer
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// إضاءة ديناميكية (تتحرك)
const ambient = new THREE.AmbientLight(0x8b5cf6, 0.4);
scene.add(ambient);

const mainLight = new THREE.DirectionalLight(0xffeedd, 0.9);
mainLight.position.set(10, 20, 10);
mainLight.castShadow = true;
scene.add(mainLight);

const fillLight = new THREE.DirectionalLight(0x4466ff, 0.3);
fillLight.position.set(-10, 10, -10);
scene.add(fillLight);

// 🎬 إنشاء أرضية فيديو
function createVideoFloor(url) {
  const video = document.createElement('video');
  video.muted = true;
  video.loop = true;
  video.playsInline = true;
  video.crossOrigin = 'anonymous';
  video.src = url;
  video.preload = 'auto';

  video.onloadeddata = function() {
    video.play().catch(() => {});
    
    const texture = new THREE.VideoTexture(video);
    texture.minFilter = THREE.LinearFilter;
    texture.magFilter = THREE.LinearFilter;
    texture.anisotropy = 16;

    // 🔥 أرضية كبيرة تغطي كل شيء
    const size = 30;
    const geometry = new THREE.PlaneGeometry(size, size);
    const material = new THREE.MeshStandardMaterial({
      map: texture,
      side: THREE.DoubleSide,
      roughness: 0.3,
      metalness: 0.1,
      emissive: new THREE.Color(0x222244),
      emissiveIntensity: 0.1
    });

    const floor = new THREE.Mesh(geometry, material);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.1;
    floor.receiveShadow = true;
    scene.add(floor);

    // 🌟 إضافة جسيمات متطايرة (للإحساس بالواقع)
    createParticles();

    // 🏗️ إضافة بعض الجدران الشفافة
    createGlassWalls();

    // 🔄 تحديث مستمر للكاميرا
    animate(floor);
  };

  video.onerror = function() {
    document.getElementById('info').innerHTML = '❌ فشل تحميل الفيديو، استخدم أرضية Canvas';
    createCanvasFloor();
  };

  video.load();
}

// 🌟 جسيمات متطايرة (شبيهة بالغبار أو الأضواء)
function createParticles() {
  const count = 500;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 40;
    positions[i * 3 + 1] = Math.random() * 15 + 1;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 40;
    
    colors[i * 3] = 0.5 + Math.random() * 0.5;
    colors[i * 3 + 1] = 0.3 + Math.random() * 0.4;
    colors[i * 3 + 2] = 0.8 + Math.random() * 0.2;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const material = new THREE.PointsMaterial({
    size: 0.15,
    vertexColors: true,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const particles = new THREE.Points(geometry, material);
  particles.position.y = 0;
  scene.add(particles);

  // تخزين للإشارة في animate
  window.particles = particles;
}

// 🏗️ جدران شفافة
function createGlassWalls() {
  const wallMat = new THREE.MeshStandardMaterial({
    color: 0x8b5cf6,
    transparent: true,
    opacity: 0.15,
    roughness: 0.1,
    metalness: 0.8,
    side: THREE.DoubleSide
  });

  const size = 14;
  const positions = [
    [-size/2, 0, 0, 0.5, 3, size],
    [size/2, 0, 0, 0.5, 3, size],
    [0, 0, -size/2, size, 3, 0.5],
    [0, 0, size/2, size, 3, 0.5]
  ];

  positions.forEach(([x, y, z, w, h, d]) => {
    const geo = new THREE.BoxGeometry(w, h, d);
    const wall = new THREE.Mesh(geo, wallMat);
    wall.position.set(x, h/2, z);
    scene.add(wall);
  });
}

// 🎨 أرضية Canvas (بديل إذا فشل الفيديو)
function createCanvasFloor() {
  const canvas = document.createElement('canvas');
  canvas.width = 1024;
  canvas.height = 1024;
  const ctx = canvas.getContext('2d');

  let frame = 0;

  function animateCanvas() {
    frame++;
    // خلفية متحركة
    const gradient = ctx.createRadialGradient(512, 512, 0, 512, 512, 512);
    gradient.addColorStop(0, `hsl(${frame % 360}, 80%, 50%)`);
    gradient.addColorStop(0.5, `hsl(${(frame + 120) % 360}, 70%, 30%)`);
    gradient.addColorStop(1, `hsl(${(frame + 240) % 360}, 80%, 20%)`);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 1024, 1024);

    // دوائر متحركة
    for (let i = 0; i < 30; i++) {
      const x = 512 + Math.sin(i * 1.7 + frame * 0.01) * 400;
      const y = 512 + Math.cos(i * 2.3 + frame * 0.008) * 400;
      const r = 20 + Math.sin(frame * 0.03 + i) * 10;
      
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${(i * 20 + frame) % 360}, 80%, 60%, 0.3)`;
      ctx.fill();
    }

    requestAnimationFrame(animateCanvas);
  }
  animateCanvas();

  const texture = new THREE.CanvasTexture(canvas);
  const floorMat = new THREE.MeshStandardMaterial({
    map: texture,
    side: THREE.DoubleSide
  });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.1;
  scene.add(floor);

  createParticles();
  createGlassWalls();
  animate(floor);
}

// ============================================================
//  حلقة الرسم (مع تأثيرات ديناميكية)
// ============================================================

function animate(floor) {
  let time = 0;

  function render() {
    requestAnimationFrame(render);
    time += 0.01;

    // 🌟 تحريك الجسيمات
    if (window.particles) {
      const positions = window.particles.geometry.attributes.position.array;
      for (let i = 0; i < positions.length; i += 3) {
        positions[i + 1] += Math.sin(time + i) * 0.002;
        positions[i] += Math.sin(time * 0.5 + i * 0.1) * 0.001;
        positions[i + 2] += Math.cos(time * 0.3 + i * 0.1) * 0.001;
      }
      window.particles.geometry.attributes.position.needsUpdate = true;
    }

    // 🔄 تحريك الأرضية قليلاً (تأثير واقعي)
    if (floor) {
      floor.position.y = Math.sin(time * 0.2) * 0.05;
      floor.rotation.z = Math.sin(time * 0.1) * 0.005;
    }

    // 💡 إضاءة متحركة
    mainLight.position.x = Math.sin(time * 0.1) * 15;
    mainLight.position.z = Math.cos(time * 0.1) * 15;

    // 🎥 كاميرا تدور ببطء حول المركز
    const radius = 12;
    const angle = time * 0.03;
    camera.position.x = Math.sin(angle) * radius;
    camera.position.z = Math.cos(angle) * radius;
    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
  }

  render();
}

// ============================================================
//  البدء
// ============================================================

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// 🌊 تحميل فيديو أرضية واقعية
// استخدام فيديو تجريبي
const testVideo = 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm';
createVideoFloor(testVideo);

console.log('🌍 أرضية واقعية 3D - جاهزة!');
</script>
</body>
</html>

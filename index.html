<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎮 منصة الألعاب - خريطة + 360</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Cairo',sans-serif; background:#050510; color:#fff; overflow:hidden; }

#info {
  position:fixed; top:10px; left:50%; transform:translateX(-50%);
  color:#fff; background:rgba(0,0,0,0.7); padding:6px 18px;
  border-radius:20px; z-index:100; font-size:12px;
  border:1px solid rgba(255,215,0,0.2); text-align:center;
}
#info span { color:#ffd700; }

#status {
  position:fixed; top:60px; left:50%; transform:translateX(-50%);
  color:#4ade80; font-size:12px; background:rgba(0,0,0,0.5);
  padding:4px 16px; border-radius:10px; z-index:100;
  border:1px solid rgba(74,222,128,0.2);
}

#game-stats {
  position:fixed; top:90px; left:50%; transform:translateX(-50%);
  display:flex; gap:8px; z-index:100;
  background:rgba(0,0,0,0.8); padding:5px 12px;
  border-radius:12px; border:1px solid rgba(255,215,0,0.15);
  font-size:11px; color:#fff; backdrop-filter:blur(8px);
}
#game-stats div { padding:0 4px; }

#controls {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  display:flex; gap:5px; z-index:100; flex-wrap:wrap; justify-content:center;
}
#controls button {
  background:rgba(139,92,246,0.15); color:#fff; border:1px solid rgba(139,92,246,0.2);
  padding:4px 10px; border-radius:12px; cursor:pointer; font-size:10px;
  transition:all 0.3s; font-family:inherit;
}
#controls button:hover { background:rgba(139,92,246,0.3); border-color:#8b5cf6; }
#controls button.enter360 { 
  background:rgba(0,242,255,0.2); 
  border-color:rgba(0,242,255,0.3); 
  animation:pulse 1.5s infinite;
  display:none;
}
@keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }

.dpad {
  position:fixed; bottom:80px; left:16px;
  width:100px; height:100px; z-index:200;
}
.dpad-btn {
  position:absolute; width:34px; height:34px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; color:rgba(255,255,255,0.3);
  cursor:pointer; transition:all .1s;
}
.dpad-btn:active { background:rgba(139,92,246,0.2); border-color:#8b5cf6; color:#8b5cf6; transform:scale(0.85); }
.dpad-up { top:0; left:33px; }
.dpad-down { bottom:0; left:33px; }
.dpad-left { top:33px; left:0; }
.dpad-right { top:33px; right:0; }

#minimap-frame {
  position:fixed; top:50px; left:10px;
  width:120px; height:120px;
  border:2px solid #ffd700; border-radius:12px;
  overflow:hidden; pointer-events:none; z-index:90;
  background:rgba(5,5,16,0.6);
  display:none;
}
#minimap-label {
  position:fixed; top:52px; left:12px; z-index:91;
  font-size:8px; color:#ffd700; background:rgba(0,0,0,0.6);
  padding:1px 6px; border-radius:4px; pointer-events:none; display:none;
}

#tile-info {
  position:fixed; top:36px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.7); padding:3px 14px;
  border-radius:12px; font-size:10px; color:#ffd700;
  z-index:95; border:1px solid rgba(255,215,0,0.2);
  display:none;
}

#toast-container {
  position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
  z-index:1000; display:flex; flex-direction:column; gap:5px; align-items:center;
  pointer-events:none;
}
.toast {
  background:rgba(0,0,0,0.9); color:#fff; padding:5px 16px;
  border-radius:20px; font-size:11px; border:1px solid rgba(255,255,255,0.05);
  animation: fadeIn 0.3s, fadeOut 0.3s 2.7s forwards;
}
.toast.success { border-color:#4ade80; }
.toast.error { border-color:#f87171; }
.toast.warn { border-color:#fb923c; }
.toast.info { border-color:#60a5fa; }

#file-input { display:none; }
canvas { display:block; width:100%; height:100%; background:#0a0a1a; }

#upload-modal {
  position:fixed; inset:0; z-index:500;
  background:rgba(0,0,0,0.8);
  display:none;
  justify-content:center; align-items:center;
  backdrop-filter:blur(8px);
}
#upload-modal .modal-content {
  background:rgba(10,10,30,0.95);
  border:1px solid rgba(255,215,0,0.2);
  border-radius:16px;
  padding:20px;
  max-width:380px;
  width:90%;
}
#upload-modal .modal-title { color:#ffd700; font-size:16px; font-weight:700; text-align:center; margin-bottom:12px; }
#upload-modal .modal-field { margin-bottom:10px; }
#upload-modal .modal-field label { display:block; color:#888; font-size:10px; margin-bottom:3px; }
#upload-modal .modal-field input, #upload-modal .modal-field select {
  width:100%; padding:6px 10px; border-radius:8px;
  border:1px solid rgba(255,215,0,0.1); background:#0a0a1a;
  color:#fff; font-size:12px; font-family:inherit;
}
#upload-modal .file-upload-area {
  border:2px dashed rgba(255,215,0,0.15); border-radius:8px;
  padding:15px; text-align:center; cursor:pointer;
  transition:all 0.3s; margin-bottom:10px;
}
#upload-modal .file-upload-area:hover { border-color:#8b5cf6; background:rgba(139,92,246,0.05); }
#upload-modal .file-upload-area .icon { font-size:30px; display:block; margin-bottom:4px; }
#upload-modal .file-upload-area .text { color:#666; font-size:11px; }
#upload-modal .file-upload-area .file-name { color:#4ade80; font-size:10px; display:none; }
#upload-modal .modal-actions { display:flex; gap:8px; margin-top:12px; }
#upload-modal .modal-actions button { flex:1; padding:6px; border:none; border-radius:8px; font-weight:700; font-size:11px; cursor:pointer; font-family:inherit; transition:all 0.3s; }
#upload-modal .modal-actions button:hover { transform:scale(1.02); }
.btn-secondary { background:rgba(255,255,255,0.05); color:#888; }
.btn-success { background:#4ade80; color:#111; }

#interact-btn {
  position:fixed; bottom:140px; left:50%; transform:translateX(-50%);
  background:rgba(139,92,246,0.25); color:#fff;
  border:1px solid rgba(139,92,246,0.4);
  padding:6px 18px; border-radius:14px;
  cursor:pointer; font-size:12px; z-index:100;
  font-family:inherit; display:none;
  animation:pulse 1.5s infinite;
}
</style>
</head>
<body>

<div id="info">🎮 <span>منصة الألعاب</span> - خريطة + 360</div>
<div id="status">🧭 جاري التحميل...</div>
<div id="tile-info">🧩 المربع: -</div>

<div id="game-stats">
  <div>🏆 <span id="score-display">0</span></div>
  <div>⭐ <span id="level-display">1</span></div>
  <div>📊 <span id="xp-display">0</span> XP</div>

</div>

<div id="controls">
  <button onclick="generateMap()">🗺️ خريطة</button>

<div id="minimap-frame"></div>

<!-- نافذة رفع -->
<div id="upload-modal">
  <div class="modal-content">
    <div class="modal-title">📍 إضافة معلم</div>
    <div class="modal-field">
      <label>🏷️ اسم المعلم</label>
      <input type="text" id="lm-name" placeholder="مثال: غرفة 360">
    </div>
    <div class="modal-field">
      <label>📂 نوع المعلم</label>
      <select id="lm-type">
        <option value="video">🎬 فيديو</option>
        <option value="image">🖼️ صورة</option>
        <option value="video360" selected>🌐 فيديو 360</option>
      </select>
    </div>
    <div class="modal-field">
      <label>📍 الإحداثيات</label>
      <div style="display:flex;gap:8px;">
        <input type="number" id="lm-row" placeholder="الصف" min="0" max="11" style="flex:1;">
        <input type="number" id="lm-col" placeholder="العمود" min="0" max="11" style="flex:1;">
      </div>

    <div class="file-upload-area" onclick="document.getElementById('file-input').click()">
      <span class="icon">📁</span>

    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeUploadModal()">✖ إلغاء</button>
      <button class="btn-success" onclick="addLandmarkFromModal()">✅ إضافة</button>
    </div>

<canvas id="canvas"></canvas>

<script>
// ============================================================
//  🎮 منصة الألعاب - الكود الكامل
// ============================================================

// ============================================================
//  1. الإعدادات العامة
// ============================================================

const GRID = 12;
const TILE_SIZE = 3;
const WORLD_SIZE = GRID * TILE_SIZE;
const HALF = WORLD_SIZE / 2;
const PLAYER_SPEED = 0.10;

let scene, camera, renderer;
let playerGroup, tileGroup;
let tileMeshes = [];
let gridHelper = null;
let gridVisible = true;
let isReady = false;
let minimapCtx;
let touchDirs = { up: false, down: false, left: false, right: false };
let isIn360Mode = false;

// ============================================================
//  2. نظام اللعبة
// ============================================================

let playerScore = 0;
let playerLevel = 1;
let playerXP = 0;
const XP_PER_LEVEL = 100;

let activeQuests = [];
let completedQuests = [];
let questIdCounter = 1;
let collectedCount = 0;
let visitedTiles = new Set();
let totalMoves = 0;
let total360Entries = 0;

let collectibles = [];
let collectibleIdCounter = 1;
let npcs = [];
let achievements = [];
let unlockedAchievements = [];

// ============================================================
//  3. المعالم
// ============================================================

let landmarks = [];
let nextLandmarkId = 1;
let pendingFile = null;

// ============================================================
//  4. متغيرات 360
// ============================================================

let lon = 0, lat = 0;
let isDragging = false;
let onPointerDownLon = 0, onPointerDownLat = 0;
let onPointerDownX = 0, onPointerDownY = 0;
let isGyroAvailable = false;
let sphere360Mesh = null;
let sphere360Video = null;
let sphere360Texture = null;

// ============================================================
//  5. نظام الصوت
// ============================================================

class AudioManager {
  constructor() {
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) {
      this.ctx = null;
    }
  }
  
  play(type) {
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      const now = this.ctx.currentTime;
      
      switch(type) {
        case 'collect':
          osc.frequency.setValueAtTime(523, now);
          osc.frequency.setValueAtTime(659, now + 0.08);
          osc.frequency.setValueAtTime(784, now + 0.16);
          osc.frequency.setValueAtTime(1047, now + 0.24);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.start(now); osc.stop(now + 0.5);
          break;
        case 'quest':
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(554, now + 0.1);
          osc.frequency.setValueAtTime(659, now + 0.2);
          gain.gain.setValueAtTime(0.07, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc.start(now); osc.stop(now + 0.4);
          break;
        case 'achievement':
          osc.frequency.setValueAtTime(523, now);
          osc.frequency.setValueAtTime(659, now + 0.1);
          osc.frequency.setValueAtTime(784, now + 0.2);
          osc.frequency.setValueAtTime(1047, now + 0.3);
          osc.frequency.setValueAtTime(1318, now + 0.4);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc.start(now); osc.stop(now + 0.6);
          break;
        case 'move':
          osc.frequency.setValueAtTime(200, now);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now); osc.stop(now + 0.05);
          break;
        case 'levelup':
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(554, now + 0.1);
          osc.frequency.setValueAtTime(659, now + 0.2);
          osc.frequency.setValueAtTime(880, now + 0.3);
          osc.frequency.setValueAtTime(1108, now + 0.4);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc.start(now); osc.stop(now + 0.6);
          break;
      }
    } catch(e) {}
  }
}

let audioManager = null;

function playSound(type) {
  if (!audioManager) audioManager = new AudioManager();
  audioManager.play(type);
}

// ============================================================
//  6. نظام المهام
// ============================================================

const QUEST_TEMPLATES = [
  { name: '🔍 مستكشف', desc: 'زر 5 مربعات مختلفة', objective: { type: 'visit_tiles', count: 5 }, reward: { xp: 30, score: 10 }, icon: '🔍' },
  { name: '📸 مصور معالم', desc: 'زر 3 معالم', objective: { type: 'visit_landmarks', count: 3 }, reward: { xp: 50, score: 20 }, icon: '📸' },
  { name: '🌐 مستكشف 360', desc: 'ادخل وضع 360 مرة', objective: { type: 'enter_360', count: 1 }, reward: { xp: 40, score: 15 }, icon: '🌐' },
  { name: '👣 متجول', desc: 'تحرك 20 خطوة', objective: { type: 'move_steps', count: 20 }, reward: { xp: 25, score: 10 }, icon: '👣' },
  { name: '⭐ جامع نجوم', desc: 'اجمع 5 عناصر', objective: { type: 'collect_items', count: 5 }, reward: { xp: 60, score: 25 }, icon: '⭐' },
  { name: '🏆 محترف', desc: 'وصل للمستوى 3', objective: { type: 'level', count: 3 }, reward: { xp: 80, score: 30 }, icon: '🏆' }
];

function generateQuests() {
  const shuffled = [...QUEST_TEMPLATES].sort(() => Math.random() - 0.5);
  const newQuests = shuffled.slice(0, 3).map(t => ({
    id: questIdCounter++,
    ...t,
    progress: 0,
    completed: false,
    started: Date.now()
  }));
  activeQuests = newQuests;
  updateQuestsUI();
}

function updateQuestProgress(type, data = {}) {
  activeQuests.forEach(q => {
    if (q.completed) return;
    let completed = false;
    
    switch(q.objective.type) {
      case 'visit_tiles':
        q.progress = Math.min(q.progress + 1, q.objective.count);
        if (q.progress >= q.objective.count) completed = true;
        break;
      case 'visit_landmarks':
        q.progress = Math.min(q.progress + 1, q.objective.count);
        if (q.progress >= q.objective.count) completed = true;
        break;
      case 'enter_360':
        q.progress = Math.min(q.progress + 1, q.objective.count);
        if (q.progress >= q.objective.count) completed = true;
        break;
      case 'move_steps':
        q.progress = Math.min(q.progress + 1, q.objective.count);
        if (q.progress >= q.objective.count) completed = true;
        break;
      case 'collect_items':
        q.progress = Math.min(q.progress + 1, q.objective.count);
        if (q.progress >= q.objective.count) completed = true;
        break;
      case 'level':
        if (playerLevel >= q.objective.count) completed = true;
        break;
    }
    
    if (completed) {
      q.completed = true;
      completedQuests.push(q);
      addXP(q.reward.xp);
      playerScore += q.reward.score;
      playSound('quest');
      showToast(`✅ ${q.icon} إكمال: ${q.name}! +${q.reward.xp} XP`, 'success');
      updateStatsUI();
      checkAchievements();
    }
    updateQuestsUI();
  });
}

// ============================================================
//  7. نظام الإنجازات
// ============================================================

const ACHIEVEMENT_DEFS = [
  { id: 'first_step', name: '🚶 أول خطوة', desc: 'تحرك لأول مرة', icon: '🚶' },
  { id: 'explorer', name: '🗺️ مستكشف', desc: 'زر 10 مربعات مختلفة', icon: '🗺️' },
  { id: 'collector', name: '⭐ جامع', desc: 'اجمع 10 عناصر', icon: '⭐' },
  { id: 'quest_master', name: '📋 سيد المهام', desc: 'أكمل 5 مهام', icon: '📋' },
  { id: 'level_5', name: '🌟 المستوى 5', desc: 'وصل للمستوى 5', icon: '🌟' },
  { id: 'landmark_hunter', name: '📸 صياد معالم', desc: 'زر 5 معالم', icon: '📸' },
  { id: 'three_sixty', name: '🌐 مستكشف 360', desc: 'ادخل 360 3 مرات', icon: '🌐' },
  { id: 'rich', name: '💰 ثري', desc: 'اجمع 500 نقطة', icon: '💰' },
  { id: 'legendary', name: '🐉 أسطوري', desc: 'وصل للمستوى 10', icon: '🐉' },
  { id: 'completionist', name: '🏆 مكتمل', desc: 'أكمل كل المهام', icon: '🏆' }
];

function checkAchievements() {
  ACHIEVEMENT_DEFS.forEach(def => {
    if (unlockedAchievements.includes(def.id)) return;
    let unlock = false;
    
    switch(def.id) {
      case 'first_step': if (totalMoves >= 1) unlock = true; break;
      case 'explorer': if (visitedTiles.size >= 10) unlock = true; break;
      case 'collector': if (collectedCount >= 10) unlock = true; break;
      case 'quest_master': if (completedQuests.length >= 5) unlock = true; break;
      case 'level_5': if (playerLevel >= 5) unlock = true; break;
      case 'landmark_hunter': if (landmarks.filter(l => l.visited).length >= 5) unlock = true; break;
      case 'three_sixty': if (total360Entries >= 3) unlock = true; break;
      case 'rich': if (playerScore >= 500) unlock = true; break;
      case 'legendary': if (playerLevel >= 10) unlock = true; break;
      case 'completionist': if (activeQuests.every(q => q.completed) && activeQuests.length > 0) unlock = true; break;
    }
    
    if (unlock) {
      unlockedAchievements.push(def.id);
      addXP(50);
      playerScore += 25;
      playSound('achievement');
      showToast(`🏆 إنجاز: ${def.icon} ${def.name}!`, 'success');
      updateAchievementsUI();
      createCelebration();
    }
  });
}

function createCelebration() {
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      const pos = new THREE.Vector3(
        (Math.random() - 0.5) * 8,
        Math.random() * 3 + 1,
        (Math.random() - 0.5) * 8
      );
      createCollectEffect(pos);
    }, i * 150);
  }
}

// ============================================================
//  8. نظام العناصر القابلة للجمع
// ============================================================

const COLLECTIBLE_TYPES = [
  { name: '⭐ نجمة', icon: '⭐', color: '#fbbf24', value: 10, xp: 5 },
  { name: '💎 جوهرة', icon: '💎', color: '#60a5fa', value: 25, xp: 15 },
  { name: '🏆 كأس', icon: '🏆', color: '#f472b6', value: 50, xp: 30 },
  { name: '🔮 كرة سحرية', icon: '🔮', color: '#a78bfa', value: 40, xp: 20 },
  { name: '⚡ صاعقة', icon: '⚡', color: '#fbbf24', value: 30, xp: 15 }
];

function generateCollectibles() {
  collectibles = [];
  const numItems = 5 + Math.floor(Math.random() * 5);
  
  for (let i = 0; i < numItems; i++) {
    let row, col, occupied;
    do {
      row = Math.floor(Math.random() * GRID);
      col = Math.floor(Math.random() * GRID);
      occupied = landmarks.some(l => l.row === row && l.col === col) ||
                 collectibles.some(c => c.row === row && c.col === col) ||
                 npcs.some(n => n.row === row && n.col === col);
    } while (occupied);
    
    const type = COLLECTIBLE_TYPES[Math.floor(Math.random() * COLLECTIBLE_TYPES.length)];
    collectibles.push({
      id: collectibleIdCounter++,
      ...type,
      row, col,
      collected: false
    });
  }
}

function collectItem(row, col) {
  const item = collectibles.find(c => c.row === row && c.col === col && !c.collected);
  if (item) {
    item.collected = true;
    collectedCount++;
    playerScore += item.value;
    addXP(item.xp);
    playSound('collect');
    createCollectEffect(getPositionFromGrid(row, col));
    showToast(`🎉 ${item.icon} ${item.name}! +${item.value} نقطة`, 'success');
    updateStatsUI();
    updateQuestProgress('collect_items');
    checkAchievements();
    return true;
  }
  return false;
}

function getPositionFromGrid(row, col) {
  const posX = col * TILE_SIZE - HALF + TILE_SIZE / 2;
  const posZ = row * TILE_SIZE - HALF + TILE_SIZE / 2;
  return new THREE.Vector3(posX, 0.2, posZ);
}

function createCollectEffect(position) {
  const particleCount = 25;
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);
  const colors = new Float32Array(particleCount * 3);
  
  for (let i = 0; i < particleCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = Math.random() * 1.2;
    positions[i*3] = Math.cos(angle) * radius;
    positions[i*3+1] = Math.random() * 1.2;
    positions[i*3+2] = Math.sin(angle) * radius;
    colors[i*3] = Math.random();
    colors[i*3+1] = Math.random() * 0.5 + 0.5;
    colors[i*3+2] = Math.random() * 0.5 + 0.5;
  }
  
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  
  const material = new THREE.PointsMaterial({
    size: 0.12,
    vertexColors: true,
    transparent: true,
    opacity: 1,
    blending: THREE.AdditiveBlending
  });
  
  const particles = new THREE.Points(geometry, material);
  particles.position.copy(position);
  particles.position.y = 0.5;
  scene.add(particles);
  
  let opacity = 1;
  const fadeInterval = setInterval(() => {
    opacity -= 0.02;
    material.opacity = opacity;
    particles.position.y += 0.01;
    if (opacity <= 0) {
      clearInterval(fadeInterval);
      scene.remove(particles);
      geometry.dispose();
      material.dispose();
    }
  }, 16);
}

function generateNPCs() {
  const npcTemplates = [
    { name: '🧙 الحكيم', color: '#a78bfa', dialogs: ['مرحباً أيها المغامر!', 'ابحث عن الكنز في الشمال', 'هناك جوهرة مخفية...', 'لقد كنت أنتظرك!'] },
    { name: '🧝 الجنية', color: '#60a5fa', dialogs: ['أهلاً بك في عالمنا!', 'اجمع النجوم لتصبح أقوى', 'هل تريد مساعدتي؟', 'الغابة تحمل أسراراً'] },
    { name: '⚔️ المحارب', color: '#f472b6', dialogs: ['استعد للمعركة!', 'قوتك في إصرارك', 'لقد تدربت لسنوات', 'الخطر قادم من الشرق'] },
    { name: '🧪 الكيميائي', color: '#34d399', dialogs: ['أنا أصنع الجرعات', 'هذا المكون نادر', 'هل تريد جرعة قوة؟', 'الذهب السائل... مذهل!'] }
  ];
  
  npcs = [];
  const numNPCs = 3 + Math.floor(Math.random() * 3);
  
  for (let i = 0; i < numNPCs; i++) {
    let row, col, occupied;
    do {
      row = Math.floor(Math.random() * GRID);
      col = Math.floor(Math.random() * GRID);
      occupied = landmarks.some(l => l.row === row && l.col === col) ||
                 collectibles.some(c => c.row === row && c.col === col && !c.collected) ||
                 npcs.some(n => n.row === row && n.col === col);
    } while (occupied);
    
    const template = npcTemplates[i % npcTemplates.length];
    npcs.push({
      id: i + 1,
      ...template,
      row, col,
      dialogIndex: 0,
      lastInteraction: 0
    });
  }
}

function interactWithNPC(row, col) {
  const npc = npcs.find(n => n.row === row && n.col === col);
  if (!npc) return false;
  if (Date.now() - npc.lastInteraction < 2000) return false;
  
  npc.lastInteraction = Date.now();
  const dialog = npc.dialogs[npc.dialogIndex % npc.dialogs.length];
  npc.dialogIndex++;
  
  showDialog(npc.name, dialog);
  
  if (Math.random() < 0.3) {
    addXP(5);
    showToast(`💬 ${npc.name} يمنحك +5 XP`, 'info');
  }
  return true;
}

function generateMap() { rebuildMap(); }

function rebuildMap() {
  tileMeshes.forEach(m => {
    if (m.parent) m.parent.remove(m);
    if (m.material) { if (m.material.map) m.material.map.dispose(); m.material.dispose(); }
    if (m.geometry) m.geometry.dispose();
  });
  tileMeshes = [];

  for (let row = 0; row < GRID; row++) {
    for (let col = 0; col < GRID; col++) {
      const landmark = landmarks.find(l => l.row === row && l.col === col);
      let texture;

      if (landmark) {
        if (landmark.type === 'video' || landmark.type === 'video360') {
          const video = document.createElement('video');
          video.muted = true; video.loop = true; video.playsInline = true;
          video.src = landmark.url;
          video.onloadeddata = () => video.play().catch(() => {});
          video.load();
          texture = new THREE.VideoTexture(video);
        } else {
          const img = new Image();
          img.src = landmark.url;
          texture = new THREE.Texture(img);
          img.onload = () => { texture.needsUpdate = true; };
        }
      } else {
        const canvas = document.createElement('canvas');
        canvas.width = 128; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        const colors = ['#1a1a2e', '#16213e', '#0f3460', '#533483'];
        ctx.fillStyle = colors[(row + col) % colors.length];
        ctx.fillRect(0, 0, 128, 128);
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.font = '14px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('(' + col + ',' + row + ')', 64, 64);
        texture = new THREE.CanvasTexture(canvas);
      }

      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;

      const geometry = new THREE.PlaneGeometry(TILE_SIZE * 0.95, TILE_SIZE * 0.95);
      const material = new THREE.MeshStandardMaterial({
        map: texture, side: THREE.DoubleSide, transparent: true,
        roughness: 0.3, metalness: 0.1
      });

      const mesh = new THREE.Mesh(geometry, material);
      const posX = col * TILE_SIZE - HALF + TILE_SIZE / 2;
      const posZ = row * TILE_SIZE - HALF + TILE_SIZE / 2;
      mesh.position.set(posX, 0, posZ);
      mesh.rotation.x = -Math.PI / 2;
      mesh.receiveShadow = true;
      
      mesh.userData = { row, col, hasLandmark: !!landmark, landmarkName: landmark ? landmark.name : '', is360: landmark ? landmark.is360 : false };

      tileGroup.add(mesh);
      tileMeshes.push(mesh);
    }
  }

  create360Spheres();
  addGrid();
  isReady = true;
  document.getElementById('tile-info').style.display = 'block';
  document.getElementById('tile-info').textContent = '🧩 خريطة ' + GRID + '×' + GRID + ' | معالم: ' + landmarks.length;
  document.getElementById('status').textContent = '✅ جاهز | ' + landmarks.length + ' معلم';
}

function create360Spheres() {
  if (window.sphereMeshes) {
    window.sphereMeshes.forEach(m => {
      if (m.parent) m.parent.remove(m);
      if (m.material) { if (m.material.map) m.material.map.dispose(); m.material.dispose(); }
      if (m.geometry) m.geometry.dispose();
    });
  }
  window.sphereMeshes = [];

  landmarks.filter(l => l.is360).forEach(l => {
    const posX = l.col * TILE_SIZE - HALF + TILE_SIZE / 2;
    const posZ = l.row * TILE_SIZE - HALF + TILE_SIZE / 2;
    
    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.4, 16, 16),
      new THREE.MeshStandardMaterial({
        color: 0x00f2ff, transparent: true, opacity: 0.3,
        emissive: 0x00f2ff, emissiveIntensity: 0.2, wireframe: true
      })
    );
    sphere.position.set(posX, 0.4, posZ);
    scene.add(sphere);
    window.sphereMeshes.push(sphere);
    
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, 64, 64);
    ctx.font = '40px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🌐', 32, 32);
    const icon = new THREE.Sprite(
      new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true, depthTest: false })
    );
    icon.scale.set(0.8, 0.8, 1);
    icon.position.set(posX, 0.9, posZ);
    scene.add(icon);
    window.sphereMeshes.push(icon);
  });
}

// ============================================================
//  19. تحكم 360
// ============================================================

function onPointerDown(event) {
  isDragging = true;
  isGyroAvailable = false;
  onPointerDownX = event.clientX;
  onPointerDownY = event.clientY;
  onPointerDownLon = lon;
  onPointerDownLat = lat;
}

function onPointerMove(event) {
  if (!isDragging) return;
  const deltaX = event.clientX - onPointerDownX;
  const deltaY = event.clientY - onPointerDownY;
  
  lon = onPointerDownLon - deltaX * 0.15;
  lat = Math.max(-85, Math.min(85, onPointerDownLat + deltaY * 0.15));
  
  update360Camera();
}

function onPointerUp() {
  isDragging = false;
}

function update360Camera() {
  if (!isIn360Mode) return;
  
  const phi = THREE.MathUtils.degToRad(90 - lat);
  const theta = THREE.MathUtils.degToRad(lon);
  
  const target = new THREE.Vector3(
    Math.sin(phi) * Math.cos(theta),
    Math.cos(phi),
    Math.sin(phi) * Math.sin(theta)
  );
  
  camera.lookAt(camera.position.clone().add(target));
}

function onDeviceOrientation(event) {
  if (isDragging || !isIn360Mode) return;
  
  const alpha = event.alpha || 0;
  const beta = event.beta || 0;
  const gamma = event.gamma || 0;
  
  lon = -alpha;
  lat = Math.max(-85, Math.min(85, beta - 90));
  
  isGyroAvailable = true;
  update360Camera();
}

  tileMeshes.forEach(mesh => {
    const data = mesh.userData;
    if (data.row === row && data.col === col) {
      mesh.material.emissive = new THREE.Color(0x00f2ff);
      mesh.material.emissiveIntensity = 0.3;
      is360 = data.is360;
      landmarkName = data.landmarkName;
      hasLandmark = data.hasLandmark;
    } else {
      mesh.material.emissive = new THREE.Color(0x000000);
      mesh.material.emissiveIntensity = 0;
    }
  });

  const enterBtn = document.getElementById('enter360-btn');
  if (is360 && !isIn360Mode) {
    enterBtn.style.display = 'block';
    enterBtn.textContent = '🌐 دخول 360 - ' + landmarkName;
    document.getElementById('tile-info').textContent = '🌐 ' + landmarkName + ' (' + col + ',' + row + ')';
  } else if (!is360) {
    enterBtn.style.display = 'none';
    document.getElementById('tile-info').textContent = '🧩 (' + col + ',' + row + ')';
  }
  
  // تحديث التقدم في اللعبة
  const tileKey = row + ',' + col;
  if (!visitedTiles.has(tileKey)) {
    visitedTiles.add(tileKey);
    updateQuestProgress('visit_tiles');
    checkAchievements();
  }
  
  if (hasLandmark) {
    const landmark = landmarks.find(l => l.row === row && l.col === col);
    if (landmark && !landmark.visited) {
      landmark.visited = true;
      updateQuestProgress('visit_landmarks');
      checkAchievements();
    }
  }
}

// ============================================================
//  21. حركة اللاعب
// ============================================================

function updatePlayer() {
  if (isIn360Mode) return;
  let dx = 0, dz = 0;
  let moving = false;
  
  if (touchDirs.up) { dz = -PLAYER_SPEED; moving = true; }
  if (touchDirs.down) { dz = PLAYER_SPEED; moving = true; }
  if (touchDirs.left) { dx = -PLAYER_SPEED; moving = true; }
  if (touchDirs.right) { dx = PLAYER_SPEED; moving = true; }

  const newX = playerGroup.position.x + dx;
  const newZ = playerGroup.position.z + dz;
  const limit = HALF - TILE_SIZE/2;

  const oldRow = Math.floor((playerGroup.position.z + HALF) / TILE_SIZE);
  const oldCol = Math.floor((playerGroup.position.x + HALF) / TILE_SIZE);
  
  playerGroup.position.x = Math.max(-limit, Math.min(limit, newX));
  playerGroup.position.z = Math.max(-limit, Math.min(limit, newZ));

  if (dx !== 0 || dz !== 0) {
    playerGroup.rotation.y = Math.atan2(dx, dz);
  }
  
  const newRow = Math.floor((playerGroup.position.z + HALF) / TILE_SIZE);
  const newCol = Math.floor((playerGroup.position.x + HALF) / TILE_SIZE);
  
  if (moving && (newRow !== oldRow || newCol !== oldCol)) {
    totalMoves++;
    updateQuestProgress('move_steps');
    checkAchievements();
    
    if (Math.random() < 0.1 && audioManager) {
      audioManager.play('move');
    }
    
    // التحقق من العناصر القابلة للجمع
    collectItem(newRow, newCol);
    
    // التحقق من NPC
    interactWithNPC(newRow, newCol);
  }
  
  updateActiveTile();
}

// ============================================================
//  22. الكاميرا
// ============================================================

function updateCamera() {
  if (isIn360Mode) return;
  const target = playerGroup.position.clone();
  const angle = playerGroup.rotation.y;
  const distance = 7;
  const height = 4.5;

  const camX = target.x - Math.sin(angle) * distance;
  const camZ = target.z - Math.cos(angle) * distance;
  const camY = target.y + height;

  camera.position.x += (camX - camera.position.x) * 0.08;
  camera.position.z += (camZ - camera.position.z) * 0.08;
  camera.position.y += (camY - camera.position.y) * 0.08;
  camera.lookAt(target.x, target.y + 0.8, target.z);
}

function resetCamera() {
  camera.position.set(0, 6, 10);
  camera.lookAt(0, 0, 0);
  playerGroup.position.set(0, 0, 0);
}

// ============================================================
//  23. الشبكة والخريطة المصغرة
// ============================================================

function addGrid() {
  if (gridHelper) { tileGroup.remove(gridHelper); gridHelper = null; }
  gridHelper = new THREE.GridHelper(WORLD_SIZE, GRID, 0x8b5cf6, 0x2a2a4a);
  gridHelper.position.y = 0.05;
  gridHelper.material.transparent = true;
  gridHelper.material.opacity = gridVisible ? 0.15 : 0;
  tileGroup.add(gridHelper);
}

function toggleGrid() {
  gridVisible = !gridVisible;
  if (gridHelper) gridHelper.material.opacity = gridVisible ? 0.15 : 0;
  showToast(gridVisible ? '📐 شبكة ظاهرة' : '📐 شبكة مخفية', 'info');
}

function setupMinimap() {
  const frame = document.getElementById('minimap-frame');
  const canvas = document.createElement('canvas');
  canvas.width = 120; canvas.height = 120;
  frame.appendChild(canvas);
  minimapCtx = canvas.getContext('2d');
  document.getElementById('minimap-frame').style.display = 'block';
  document.getElementById('minimap-label').style.display = 'block';
}

function updateMinimap() {
  if (!minimapCtx) return;
  const ctx = minimapCtx;
  const w = 120, h = 120;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(10,10,26,0.9)';
  ctx.fillRect(0, 0, w, h);

  const scale = w / WORLD_SIZE;

  // رسم العناصر
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const px = x * TILE_SIZE * scale;
      const py = y * TILE_SIZE * scale;
      const size = TILE_SIZE * scale * 0.9;
      
      const landmark = landmarks.find(l => l.row === y && l.col === x);
      const collectible = collectibles.find(c => c.row === y && c.col === x && !c.collected);
      const npc = npcs.find(n => n.row === y && n.col === x);
      
      if (landmark && landmark.is360) { ctx.fillStyle = '#00f2ff'; }
      else if (landmark) { ctx.fillStyle = '#ffd700'; }
      else if (collectible) { ctx.fillStyle = '#fbbf24'; }
      else if (npc) { ctx.fillStyle = '#a78bfa'; }
      else { ctx.fillStyle = ((x + y) % 2 === 0) ? '#2a2a4a' : '#1a1a2e'; }
      ctx.fillRect(px, py, size, size);
    }
  }

  const px = (playerGroup.position.x + HALF) * scale;
  const py = (playerGroup.position.z + HALF) * scale;

  ctx.fillStyle = '#8b5cf6';
  ctx.shadowColor = '#8b5cf6';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.arc(px, py, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(0, 0, w, h);
}

// ============================================================
//  24. Three.js
// ============================================================

function initThree() {
  const canvas = document.getElementById('canvas');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a1a);
  scene.fog = new THREE.Fog(0x0a0a1a, 20, 50);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 6, 10);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const ambient = new THREE.AmbientLight(0x8b5cf6, 0.4);
  scene.add(ambient);
  const dirLight = new THREE.DirectionalLight(0xffeedd, 1.0);
  dirLight.position.set(10, 20, 10);
  dirLight.castShadow = true;
  scene.add(dirLight);
  const fillLight = new THREE.DirectionalLight(0x4466ff, 0.3);
  fillLight.position.set(-10, 10, -10);
  scene.add(fillLight);

  // اللاعب
  playerGroup = new THREE.Group();
  scene.add(playerGroup);
  
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.35, 0.4, 0.8, 8),
    new THREE.MeshStandardMaterial({ color: 0x8b5cf6, emissive: 0x6d28d9, emissiveIntensity: 0.2, roughness: 0.4, metalness: 0.3 })
  );
  body.position.y = 0.4; body.castShadow = true;
  playerGroup.add(body);
  
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.2, 8, 8),
    new THREE.MeshStandardMaterial({ color: 0x8b5cf6, roughness: 0.3, metalness: 0.2 })
  );
  head.position.y = 0.9; head.castShadow = true;
  playerGroup.add(head);
  
  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(0.8, 0.8),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.2 })
  );
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.02;
  playerGroup.add(shadow);

  playerGroup.position.set(0, 0, 0);

  tileGroup = new THREE.Group();
  scene.add(tileGroup);

  setupMinimap();

  function animate() {
    requestAnimationFrame(animate);
    if (!isIn360Mode) {
      updatePlayer();
      updateCamera();
    }
    updateMinimap();
    if (sphere360Texture && isIn360Mode) { sphere360Texture.needsUpdate = true; }
    renderer.render(scene, camera);
  }
  animate();
}

// ============================================================
//  25. التحكم
// ============================================================

function setupTouchControls() {
  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const dir = btn.getAttribute('data-dir');
    btn.addEventListener('touchstart', e => {
      e.preventDefault();
      touchDirs[dir] = true;
      btn.style.background = 'rgba(139,92,246,0.2)';
      btn.style.borderColor = '#8b5cf6';
    }, { passive: false });
    btn.addEventListener('touchend', e => {
      e.preventDefault();
      touchDirs[dir] = false;
      btn.style.background = '';
      btn.style.borderColor = '';
    }, { passive: false });
    btn.addEventListener('touchcancel', () => {
      touchDirs[dir] = false;
      btn.style.background = '';
      btn.style.borderColor = '';
    });
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') touchDirs.up = true;
  if (e.key === 'ArrowDown') touchDirs.down = true;
  if (e.key === 'ArrowLeft') touchDirs.left = true;
  if (e.key === 'ArrowRight') touchDirs.right = true;
  if (e.key === 'Escape' && isIn360Mode) exit360Mode();
  if (e.key === 'e' || e.key === 'E') interact();
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowUp') touchDirs.up = false;
  if (e.key === 'ArrowDown') touchDirs.down = false;
  if (e.key === 'ArrowLeft') touchDirs.left = false;
  if (e.key === 'ArrowRight') touchDirs.right = false;
});

function showToast(message, type) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast ' + (type || '');
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ============================================================
//  26. بدء التشغيل
// ============================================================

window.addEventListener('resize', () => {
  if (camera) {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
});

setupTouchControls();
initThree();

</script>

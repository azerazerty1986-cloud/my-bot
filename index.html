<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>إيموجي 3D — شخصيتي المتحركة</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffd700;--success:#4ade80;--error:#f87171;--info:#60a5fa;--accent:#00f2ff;--purple:#8b5cf6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#050510;color:#fff;overflow:hidden;user-select:none}

#start-screen{position:fixed;inset:0;z-index:2000;background:linear-gradient(135deg,#0a0a2a,#000);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px}
.start-logo{font-size:42px;font-weight:900;color:var(--gold);animation:float 3s ease-in-out infinite}
.start-subtitle{font-size:15px;color:#666;text-align:center;max-width:350px}
.start-btn{border:2px solid var(--accent);color:var(--accent);padding:16px 50px;background:rgba(0,242,255,0.08);border-radius:60px;font-size:20px;cursor:pointer;transition:all .3s;font-weight:700;font-family:inherit}
.start-btn:hover{transform:scale(1.05);background:var(--accent);color:#000;box-shadow:0 0 50px rgba(0,242,255,0.4)}
.user-info{color:var(--accent);font-size:13px;background:rgba(0,0,0,0.6);padding:8px 24px;border-radius:30px}
.version-tag{position:absolute;bottom:15px;font-size:11px;color:#444}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

#game-container{position:fixed;inset:0;display:none;background:#050510}
#game-canvas{display:block;width:100%;height:100%}

.hud{position:fixed;top:0;left:0;right:0;padding:6px 10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:100}
.player-bar{background:rgba(0,0,0,0.8);border-radius:8px;padding:5px 10px;backdrop-filter:blur(10px);min-width:120px;border:1px solid rgba(139,92,246,0.3)}
.player-bar .label{font-size:9px;font-weight:700;color:var(--purple);display:flex;justify-content:space-between;margin-bottom:2px}

.dpad{position:fixed;bottom:20px;left:16px;width:120px;height:120px;z-index:200}
.dpad-btn{position:absolute;width:40px;height:40px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;color:rgba(255,255,255,0.4);cursor:pointer;transition:all .1s}
.dpad-btn:active{background:rgba(139,92,246,0.15);border-color:var(--purple);color:var(--purple);transform:scale(0.88)}
.dpad-up{top:0;left:40px}
.dpad-down{bottom:0;left:40px}
.dpad-left{top:40px;left:0}
.dpad-right{top:40px;right:0}

.action-btns{position:fixed;bottom:20px;right:16px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:200}
.action-btn{width:54px;height:54px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px)}
.action-btn:active{transform:scale(0.86)}
.btn-rotate{border-color:var(--gold);color:var(--gold)}
.btn-run{border-color:var(--success);color:var(--success);width:46px;height:46px;font-size:16px}
.btn-zoom{border-color:var(--accent);color:var(--accent);width:46px;height:46px;font-size:16px}

.tg-dropdown{position:fixed;bottom:170px;left:50%;transform:translateX(-50%);background:rgba(10,10,30,0.95);border:1px solid rgba(255,215,0,0.15);border-radius:14px;padding:12px 16px;z-index:250;min-width:300px;max-width:92%;display:none;backdrop-filter:blur(12px)}
.tg-dropdown.show{display:block}
.tg-dropdown .row{display:flex;gap:5px;margin-bottom:5px;flex-wrap:wrap}
.tg-dropdown input{flex:1;padding:5px 10px;border-radius:6px;border:1px solid rgba(255,215,0,0.1);background:#0a0a1a;color:#fff;font-size:11px;font-family:inherit;min-width:60px}
.tg-dropdown .btn{padding:5px 12px;border:none;border-radius:6px;font-weight:700;font-size:10px;cursor:pointer;font-family:inherit}
.btn-accent{background:var(--accent);color:#111}
.btn-gold{background:var(--gold);color:#111}
.btn-purple{background:var(--purple);color:#fff}
.btn-green{background:var(--success);color:#111}
.btn-red{background:var(--error);color:#fff}
.tg-toggle{position:fixed;bottom:155px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);border:1px solid rgba(255,215,0,0.1);border-radius:20px;padding:3px 14px;z-index:210;font-size:11px;color:#888;cursor:pointer;display:none}

.skin-selector{position:fixed;bottom:220px;left:50%;transform:translateX(-50%);background:rgba(10,10,30,0.95);border:1px solid rgba(255,215,0,0.12);border-radius:14px;padding:12px;z-index:230;display:none;backdrop-filter:blur(12px);min-width:200px;max-height:200px;overflow-y:auto}
.skin-selector.show{display:block}
.skin-selector h4{color:var(--gold);font-size:12px;margin-bottom:8px;text-align:center}
.skin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.skin-option{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:6px;text-align:center;cursor:pointer;transition:.2s}
.skin-option:hover{background:rgba(139,92,246,0.08);border-color:var(--purple)}
.skin-option .preview{width:32px;height:32px;border-radius:50%;margin:0 auto 3px;display:flex;align-items:center;justify-content:center;font-size:16px;background:#0a0a1a;overflow:hidden}
.skin-option .preview img{width:100%;height:100%;object-fit:cover}
.skin-option .sname{font-size:8px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skin-option.active{border-color:var(--gold);background:rgba(255,215,0,0.05)}

.char-grid-panel{position:fixed;bottom:280px;left:50%;transform:translateX(-50%);background:rgba(10,10,30,0.95);border:1px solid rgba(255,215,0,0.12);border-radius:14px;padding:10px 12px;z-index:230;max-width:92%;width:360px;display:none;max-height:160px;overflow-y:auto}
.char-grid-panel.show{display:block}
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px}
.char-mini{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.04);border-radius:6px;padding:6px;text-align:center;cursor:pointer;transition:.2s}
.char-mini:hover{background:rgba(139,92,246,0.08);border-color:var(--purple)}
.char-mini .avatar{width:28px;height:28px;border-radius:50%;margin:0 auto 3px;background:#0a0a1a;display:flex;align-items:center;justify-content:center;font-size:14px;overflow:hidden}
.char-mini .avatar img{width:100%;height:100%;object-fit:cover}
.char-mini .cname{font-size:9px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.toast-container{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:700;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.toast{background:rgba(0,0,0,0.9);padding:6px 16px;border-radius:30px;font-size:11px;border:1px solid rgba(255,255,255,0.06);animation:toastIn .3s,toastOut .3s 2.7s forwards}
.toast.success{border-color:var(--success);color:var(--success)}
.toast.error{border-color:var(--error);color:var(--error)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-20px)}}

.skin-toggle{position:fixed;top:10px;right:60px;background:rgba(0,0,0,0.6);border:1px solid rgba(255,215,0,0.1);border-radius:6px;padding:3px 10px;z-index:200;font-size:10px;color:#888;cursor:pointer;display:none}
.skin-toggle:hover{color:var(--gold)}

.anim-status{position:fixed;top:10px;left:10px;background:rgba(0,0,0,0.6);border:1px solid rgba(139,92,246,0.15);border-radius:6px;padding:3px 10px;z-index:200;font-size:10px;color:#888;pointer-events:none}
.anim-status span{margin-left:4px}
.anim-status .state-idle{color:#888}
.anim-status .state-run{color:var(--success)}
.anim-status .state-rotate{color:var(--gold)}
</style>
</head>
<body>

<!-- START -->
<div id="start-screen">
  <div class="start-logo">🎨 إيموجي 3D</div>
  <div class="start-subtitle">جلب الإيموجي من القناة • تحريك مثل بوبجي</div>
  <div class="user-info" id="userInfoDisplay">🔄 جاري التحميل...</div>
  <button class="start-btn" id="start-btn" onclick="enterApp()" style="display:none;">🚀 دخول</button>
  <div class="version-tag">v14.0 | Emoji 3D + Walking</div>
</div>

<!-- GAME -->
<div id="game-container">
  <div id="game-canvas"></div>

  <div class="hud">
    <div class="player-bar">
      <div class="label"><span>😊 شخصيتي</span><span id="char-name">جاري التحميل...</span></div>
    </div>
  </div>

  <div class="anim-status" id="anim-status">
    الحالة: <span class="state-idle" id="anim-state-text">🛑 متوقف</span>
  </div>

  <div class="dpad" id="dpad">
    <div class="dpad-btn dpad-up" data-dir="up">▲</div>
    <div class="dpad-btn dpad-down" data-dir="down">▼</div>
    <div class="dpad-btn dpad-left" data-dir="left">◀</div>
    <div class="dpad-btn dpad-right" data-dir="right">▶</div>
  </div>
  <div class="action-btns">
    <button class="action-btn btn-rotate" onclick="toggleRotate()">🔄</button>
    <button class="action-btn btn-run" onclick="toggleAutoRun()">🏃</button>
    <button class="action-btn btn-zoom" onclick="resetCamera()">📷</button>
  </div>

  <button class="tg-toggle" id="tg-toggle" onclick="toggleTG()">📡 القناة</button>
  <div class="tg-dropdown" id="tg-dropdown">
    <div class="row">
      <input type="text" id="bot-token" placeholder="Bot Token">
      <input type="text" id="chat-id" placeholder="Channel ID">
    </div>
    <div class="row">
      <button class="btn btn-accent" onclick="testTelegram()">🔗 اتصال</button>
      <button class="btn btn-purple" onclick="fetchEmojisFromChannel()">😊 جلب إيموجي</button>
      <button class="btn btn-red" onclick="toggleTG()">✖</button>
    </div>
    <div style="font-size:10px;color:#888;" id="tg-status">⭕ غير متصل</div>
  </div>

  <div class="skin-selector" id="skin-selector">
    <h4>😊 اختر الإيموجي</h4>
    <div class="skin-grid" id="skin-grid"></div>
  </div>

  <div class="char-grid-panel" id="char-grid-panel">
    <div class="char-grid" id="char-grid"></div>
  </div>

  <button class="skin-toggle" id="skin-toggle" onclick="toggleSkinSelector()">😊 شخصيتي</button>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
// ============================================================
//  إيموجي 3D v14.0 — جلب الإيموجي من القناة وتحريكه
// ============================================================

// ============================================================
//  TELEGRAM
// ============================================================

const tg = window.Telegram?.WebApp;
let userData = null;

function initTelegram() {
  try {
    if (tg) {
      tg.ready(); tg.expand();
      if (tg.initDataUnsafe?.user) {
        userData = tg.initDataUnsafe.user;
        document.getElementById('userInfoDisplay').innerHTML = '👤 ' + (userData.first_name || 'مستخدم');
      } else {
        userData = { id: Math.floor(Math.random()*100000), first_name: 'مستخدم' };
        document.getElementById('userInfoDisplay').innerHTML = '👤 مستخدم';
      }
    } else {
      userData = { id: Math.floor(Math.random()*100000), first_name: 'مستخدم' };
      document.getElementById('userInfoDisplay').innerHTML = '👤 مستخدم';
    }
  } catch(e) {
    userData = { id: Math.floor(Math.random()*100000), first_name: 'مستخدم' };
    document.getElementById('userInfoDisplay').innerHTML = '👤 مستخدم';
  }
}

let botToken = '', channelId = '', connected = false, lastUpdateId = 0;
let fetchedEmojis = [];
let loadedImages = {};
let playerSkin = null;
let autoSelectDone = false;

// ============================================================
//  TELEGRAM FUNCTIONS
// ============================================================

function toggleTG() { document.getElementById('tg-dropdown').classList.toggle('show'); }

function toggleSkinSelector() {
  document.getElementById('skin-selector').classList.toggle('show');
  renderSkinSelector();
}

function renderSkinSelector() {
  const grid = document.getElementById('skin-grid');
  grid.innerHTML = '';

  const defaultOpt = document.createElement('div');
  defaultOpt.className = 'skin-option' + (!playerSkin ? ' active' : '');
  defaultOpt.innerHTML = `<div class="preview" style="font-size:20px;">🧑</div><div class="sname">افتراضي</div>`;
  defaultOpt.onclick = function() { selectSkin(null); };
  grid.appendChild(defaultOpt);

  for (const char of fetchedEmojis) {
    const opt = document.createElement('div');
    opt.className = 'skin-option' + (playerSkin && playerSkin.id === char.id ? ' active' : '');
    const avatar = char.imageUrl ? `<img src="${char.imageUrl}" alt="">` : '😊';
    opt.innerHTML = `
      <div class="preview">${avatar}</div>
      <div class="sname">${char.name}</div>
      <div style="font-size:7px;color:#888;">${char.isEmoji ? '😊 إيموجي' : '🖼️ صورة'}</div>
    `;
    opt.onclick = function() { selectSkin(char); };
    grid.appendChild(opt);
  }
}

function selectSkin(char) {
  if (char) {
    playerSkin = {
      id: char.id,
      name: char.name,
      imageUrl: char.imageUrl,
      isEmoji: char.isEmoji || false
    };
    document.getElementById('char-name').textContent = char.name + ' 😊';
    showToast('✅ تم اختيار ' + char.name, 'success');
  } else {
    playerSkin = null;
    document.getElementById('char-name').textContent = 'افتراضي';
    showToast('🧑 المظهر الافتراضي', 'info');
  }
  updatePlayer3D();
  renderSkinSelector();
  document.getElementById('skin-selector').classList.remove('show');
}

function setTGStatus(msg, type) {
  const el = document.getElementById('tg-status');
  el.textContent = msg;
  el.style.color = type === 'success' ? 'var(--success)' : type === 'error' ? 'var(--error)' : '#888';
}

async function testTelegram() {
  botToken = document.getElementById('bot-token').value.trim();
  channelId = document.getElementById('chat-id').value.trim();
  if (!botToken || !channelId) { setTGStatus('❌ ادخل البيانات', 'error'); return; }
  setTGStatus('🔄 جاري...', '');
  try {
    const res = await fetch('https://api.telegram.org/bot' + botToken + '/getMe');
    const data = await res.json();
    if (data.ok) {
      connected = true;
      setTGStatus('✅ متصل بـ @' + data.result.username, 'success');
      localStorage.setItem('nardo_bot_token', botToken);
      localStorage.setItem('nardo_chat_id', channelId);
      showToast('✅ تم الاتصال!', 'success');
    } else {
      setTGStatus('❌ ' + data.description, 'error');
    }
  } catch(e) { setTGStatus('❌ فشل الاتصال', 'error'); }
}

function autoSelectFirstEmoji() {
    if (autoSelectDone) return;
    const emojis = fetchedEmojis.filter(c => c.isEmoji);
    if (emojis.length > 0) {
        const first = emojis[0];
        showToast('😊 تم اختيار الإيموجي تلقائياً: ' + first.name, 'success');
        selectSkin(first);
        autoSelectDone = true;
        return true;
    }
    if (fetchedEmojis.length > 0) {
        const first = fetchedEmojis[0];
        showToast('🖼️ تم اختيار الصورة تلقائياً: ' + first.name, 'success');
        selectSkin(first);
        autoSelectDone = true;
        return true;
    }
    return false;
}

// ============================================================
//  جلب الإيموجي من القناة (الميزة الرئيسية)
// ============================================================

async function fetchEmojisFromChannel() {
  if (!connected) { setTGStatus('⚠️ اتصل أولاً', 'error'); return; }
  setTGStatus('😊 جاري جلب الإيموجي...', '');

  try {
    const res = await fetch('https://api.telegram.org/bot' + botToken + '/getUpdates?limit=50&offset=' + (lastUpdateId + 1));
    const data = await res.json();
    if (!data.ok) { setTGStatus('❌ ' + data.description, 'error'); return; }

    let newItems = 0;

    for (const update of data.result || []) {
      lastUpdateId = Math.max(lastUpdateId, update.update_id);
      const msg = update.channel_post || update.message;
      if (!msg) continue;

      let fileId = null, imageUrl = '';

      // البحث عن الإيموجي (ملصق)
      if (msg.sticker) {
        fileId = msg.sticker.file_id;
        const fileRes = await fetch('https://api.telegram.org/bot' + botToken + '/getFile?file_id=' + fileId);
        const fileData = await fileRes.json();
        if (fileData.ok && fileData.result.file_path) {
          imageUrl = 'https://api.telegram.org/file/bot' + botToken + '/' + fileData.result.file_path;
        }
      }

      // البحث عن الصور
      if (!fileId && msg.photo && msg.photo.length > 0) {
        fileId = msg.photo[msg.photo.length - 1].file_id;
        const fileRes = await fetch('https://api.telegram.org/bot' + botToken + '/getFile?file_id=' + fileId);
        const fileData = await fileRes.json();
        if (fileData.ok && fileData.result.file_path) {
          imageUrl = 'https://api.telegram.org/file/bot' + botToken + '/' + fileData.result.file_path;
        }
      }

      if (!fileId) continue;
      if (fetchedEmojis.some(c => c.fileId === fileId)) continue;

      const caption = msg.caption || '';
      const nameMatch = caption.match(/(?:اسم|name|Name)[\s:]*([^\n]+)/i);

      const isEmoji = !!msg.sticker;
      const char = {
        id: (isEmoji ? 'emoji_' : 'image_') + fileId,
        fileId: fileId,
        name: nameMatch ? nameMatch[1].trim() : (isEmoji ? 'إيموجي #' : 'صورة #') + (fetchedEmojis.length + 1),
        imageUrl: imageUrl,
        isEmoji: isEmoji
      };

      fetchedEmojis.push(char);
      newItems++;

      if (imageUrl) {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function() { 
          loadedImages[char.id] = img;
          // إذا كان إيموجي ولم يتم الاختيار بعد
          if (isEmoji && !autoSelectDone && fetchedEmojis.length === 1) {
            setTimeout(autoSelectFirstEmoji, 500);
          }
        };
        img.src = imageUrl;
      }
    }

    if (newItems > 0) {
      setTGStatus('✅ جلب ' + newItems + ' عنصر!', 'success');
      showCharGrid();
      renderSkinSelector();
      showToast('😊 تم جلب ' + newItems + ' إيموجي/صورة!', 'success');
      
      if (!autoSelectDone) {
        setTimeout(autoSelectFirstEmoji, 800);
      }
    } else {
      setTGStatus('📭 لا توجد عناصر جديدة', '');
    }
  } catch(e) {
    setTGStatus('❌ خطأ', 'error');
    console.error(e);
  }
}

function showCharGrid() {
  const panel = document.getElementById('char-grid-panel');
  const grid = document.getElementById('char-grid');
  grid.innerHTML = '';

  for (const char of fetchedEmojis) {
    const div = document.createElement('div');
    div.className = 'char-mini';
    const avatar = char.imageUrl ? `<img src="${char.imageUrl}" alt="">` : '😊';
    div.innerHTML = `
      <div class="avatar">${avatar}</div>
      <div class="cname">${char.name}</div>
      <div style="font-size:7px;color:#888;">${char.isEmoji ? '😊 إيموجي' : '🖼️ صورة'}</div>
    `;
    div.onclick = function() { selectSkin(char); };
    grid.appendChild(div);
  }
  panel.classList.add('show');
}

// ============================================================
//  THREE.JS 3D VIEWER مع تكبير الإيموجي وتحريك
// ============================================================

let scene, camera, renderer;
let player3D = null;
let clock = new THREE.Clock();
let autoRotate = false;
let autoRun = false;
let runSpeed = 2.5;
let moveSpeed = 0.06;
let runTime = 0;
let limbRefs = {};
let playerState = 'idle';
let touchDirs = { up: false, down: false, left: false, right: false };

// متغيرات الكاميرا التابعة
let cameraAngleX = 0.3;
let cameraAngleY = 0.3;
let cameraDistance = 4.5;
let targetCameraPosition = new THREE.Vector3();
let cameraSmoothness = 0.08;

// عالم اللعبة
let worldGroup = null;
let groundSize = 30;

function initThreeJS() {
  const container = document.getElementById('game-canvas');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a1a);

  const aspect = window.innerWidth / window.innerHeight;
  camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 100);
  camera.position.set(0, 5, 5);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  container.appendChild(renderer.domElement);

  // Lights
  const ambient = new THREE.AmbientLight(0x404060, 0.6);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);

function createWorld() {
  if (worldGroup) {
    scene.remove(worldGroup);
    worldGroup = null;
  }

  worldGroup = new THREE.Group();
  scene.add(worldGroup);

  // الأرضية
  const groundGeo = new THREE.PlaneGeometry(groundSize, groundSize);
  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x0a0a20,
    roughness: 0.9,
    metalness: 0.1
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.1;
  ground.receiveShadow = true;
  worldGroup.add(ground);

  // شبكة الأرضية
  const gridHelper = new THREE.GridHelper(groundSize, 30, 0x333366, 0x222244);
  gridHelper.position.y = 0;
  worldGroup.add(gridHelper);

  // أعمدة ملونة
  const colors = [0x4444ff, 0xff4444, 0x44ff44, 0xffff44, 0xff44ff, 0x44ffff];
  for (let i = 0; i < 40; i++) {
    const x = (Math.random() - 0.5) * (groundSize - 4);
    const z = (Math.random() - 0.5) * (groundSize - 4);
    if (Math.abs(x) < 2 && Math.abs(z) < 2) continue;
    
    const height = 0.3 + Math.random() * 1.2;
    const boxMat = new THREE.MeshStandardMaterial({
      color: colors[Math.floor(Math.random() * colors.length)],
      roughness: 0.7,
      metalness: 0.3,
      emissive: colors[Math.floor(Math.random() * colors.length)],
      emissiveIntensity: 0.1
    });
    const box = new THREE.Mesh(new THREE.BoxGeometry(0.4, height, 0.4), boxMat);
    box.position.set(x, height/2, z);
    box.castShadow = true;
    box.receiveShadow = true;
    worldGroup.add(box);
  }

  // أعمدة كبيرة (معالم)
  const landmarkPositions = [
    [-8, -8], [8, -8], [-8, 8], [8, 8],
    [-6, 6], [6, -6], [-6, -6], [6, 6]
  ];
  for (const [lx, lz] of landmarkPositions) {
    const pillarMat = new THREE.MeshStandardMaterial({
      color: 0x444466,
      roughness: 0.5,
      metalness: 0.5,
      emissive: 0x222244,
      emissiveIntensity: 0.2
    });
    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.8, 2, 8), pillarMat);
    pillar.position.set(lx, 1, lz);
    pillar.castShadow = true;
    pillar.receiveShadow = true;
    worldGroup.add(pillar);
    
    const lightMat = new THREE.MeshStandardMaterial({
      color: 0x6666ff,
      emissive: 0x4444ff,
      emissiveIntensity: 0.3,
      transparent: true,
      opacity: 0.5
    });
    const light = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), lightMat);
    light.position.set(lx, 2.2, lz);
    worldGroup.add(light);
  }
}

function createEmojiTexture(imageUrl, callback) {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    
    img.onload = function() {
        // Canvas بحجم كبير لتكبير الإيموجي
        const canvas = document.createElement('canvas');
        const size = 512; // حجم كبير لجودة عالية
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        
        // خلفية شفافة
        ctx.clearRect(0, 0, size, size);
        
        // حساب حجم الإيموجي (تكبير 2x - يغطي 85% من المساحة)
        const imgSize = size * 0.85;
        const offset = (size - imgSize) / 2;
        
        // رسم الإيموجي مكبراً
        ctx.drawImage(img, offset, offset, imgSize, imgSize);
        
        // إضافة تأثير إضاءة خفيف
        const gradient = ctx.createRadialGradient(
            size/2, size/2, 0,
            size/2, size/2, size/2
        );
        gradient.addColorStop(0, 'rgba(255,255,255,0.08)');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, size, size);
        
        // إنشاء النسيج
        const texture = new THREE.CanvasTexture(canvas);
        texture.needsUpdate = true;
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        
        callback(texture);
    };
    
    img.onerror = function() {
        // في حال فشل التحميل، استخدم إيموجي افتراضي
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#8b5cf6';
        ctx.fillRect(0, 0, 128, 128);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 80px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('😊', 64, 72);
        const texture = new THREE.CanvasTexture(canvas);
        texture.needsUpdate = true;
        callback(texture);
    };
    
    img.src = imageUrl;
}

// ============================================================
//  حركة الشخصية مثل بوبجي
// ============================================================

function updateAnimationState() {
  const stateText = document.getElementById('anim-state-text');
  if (playerState === 'run') {
    stateText.textContent = '🏃 يجري';
    stateText.className = 'state-run';
  } else if (playerState === 'rotate') {
    stateText.textContent = '🔄 يدور';
    stateText.className = 'state-rotate';
  } else {
    stateText.textContent = '🛑 متوقف';
    stateText.className = 'state-idle';
  }
}

function animateLimbs(delta) {
  if (!limbRefs.armL || !limbRefs.armR || !limbRefs.legL || !limbRefs.legR) return;

  if (playerState === 'run') {
    runTime += delta * runSpeed;
    const armAngle = Math.sin(runTime) * 0.8;
    const legAngle = Math.sin(runTime + Math.PI) * 0.8;
    const bobbing = Math.abs(Math.sin(runTime * 2)) * 0.08;

    limbRefs.armL.rotation.x = armAngle;
    limbRefs.armR.rotation.x = -armAngle;
    limbRefs.legL.rotation.x = legAngle;
    limbRefs.legR.rotation.x = -legAngle;

    if (limbRefs.body) limbRefs.body.position.y = 0.5 + bobbing;
    if (limbRefs.head) limbRefs.head.position.y = 1.1 + bobbing;

    // تحريك الشخصية
    if (player3D) {
      if (touchDirs.up || autoRun) {
        player3D.position.x += Math.sin(player3D.rotation.y) * moveSpeed;
        player3D.position.z += Math.cos(player3D.rotation.y) * moveSpeed;
      }
      if (touchDirs.down) {
        player3D.position.x -= Math.sin(player3D.rotation.y) * moveSpeed * 0.5;
        player3D.position.z -= Math.cos(player3D.rotation.y) * moveSpeed * 0.5;
      }
    }
  } else if (playerState === 'rotate') {
    if (player3D) {
      const rotSpeed = 0.04;
      if (touchDirs.left) player3D.rotation.y += rotSpeed;
      if (touchDirs.right) player3D.rotation.y -= rotSpeed;
    }
    limbRefs.armL.rotation.x *= 0.9;
    limbRefs.armR.rotation.x *= 0.9;
    limbRefs.legL.rotation.x *= 0.9;
    limbRefs.legR.rotation.x *= 0.9;
  } else {
    const breath = Math.sin(Date.now() * 0.002) * 0.02;
    limbRefs.armL.rotation.x += (breath - limbRefs.armL.rotation.x) * 0.1;
    limbRefs.armR.rotation.x += (-breath - limbRefs.armR.rotation.x) * 0.1;
    limbRefs.legL.rotation.x *= 0.9;
    limbRefs.legR.rotation.x *= 0.9;
    if (limbRefs.body) limbRefs.body.position.y += (0.5 - limbRefs.body.position.y) * 0.1;
    if (limbRefs.head) limbRefs.head.position.y += (1.1 - limbRefs.head.position.y) * 0.1;
  }

  if (limbRefs.shadow && player3D) {
    limbRefs.shadow.position.x = player3D.position.x;
    limbRefs.shadow.position.z = player3D.position.z;
  }
}

function handleMovementInput() {
  let newState = 'idle';
  if (touchDirs.up || touchDirs.down || autoRun) newState = 'run';
  else if (touchDirs.left || touchDirs.right) newState = 'rotate';
  if (newState !== playerState) {
    playerState = newState;
    updateAnimationState();
  }
}

// ============================================================
//  الكاميرا التابعة (مثل بوبجي)
// ============================================================

function updateFollowCamera() {
  if (!player3D) return;

  const targetX = player3D.position.x;
  const targetY = player3D.position.y + 1.2;
  const targetZ = player3D.position.z;

  const x = Math.sin(cameraAngleX) * Math.cos(cameraAngleY) * cameraDistance;
  const y = Math.sin(cameraAngleY) * cameraDistance + 0.5;
  const z = Math.cos(cameraAngleX) * Math.cos(cameraAngleY) * cameraDistance;

  targetCameraPosition.set(targetX + x, targetY + y, targetZ + z);

  camera.position.lerp(targetCameraPosition, cameraSmoothness);
  camera.lookAt(targetX, targetY, targetZ);
}

function animateThree() {
  if (!renderer) return;
  requestAnimationFrame(animateThree);

  const delta = clock.getDelta();

  handleMovementInput();
  animateLimbs(delta);
  updateFollowCamera();

  renderer.render(scene, camera);
}

function setupTouchControls() {
  document.querySelectorAll('.dpad-btn').forEach(function(btn) {
    const dir = btn.getAttribute('data-dir');
    btn.addEventListener('touchstart', function(e) {
      e.preventDefault();
      touchDirs[dir] = true;
      btn.style.background = 'rgba(139,92,246,0.15)';
      btn.style.borderColor = 'var(--purple)';
    }, { passive: false });
    btn.addEventListener('touchend', function(e) {
      e.preventDefault();
      touchDirs[dir] = false;
      btn.style.background = '';
      btn.style.borderColor = '';
    }, { passive: false });
    btn.addEventListener('touchcancel', function() {
      touchDirs[dir] = false;
      btn.style.background = '';
      btn.style.borderColor = '';
    });
  });
}

// تحريك الكاميرا بالسحب
let isDragging = false;
let prevMouseX = 0, prevMouseY = 0;

document.addEventListener('mousedown', function(e) {
  isDragging = true;
  prevMouseX = e.clientX;
  prevMouseY = e.clientY;
});

document.addEventListener('mousemove', function(e) {
  if (!isDragging) return;
  const dx = e.clientX - prevMouseX;
  const dy = e.clientY - prevMouseY;
  cameraAngleX += dx * 0.005;
  cameraAngleY += dy * 0.005;
  cameraAngleY = Math.max(-1.0, Math.min(1.0, cameraAngleY));
  prevMouseX = e.clientX;
  prevMouseY = e.clientY;
});

document.addEventListener('mouseup', function() { isDragging = false; });

// تكبير/تصغير
document.addEventListener('wheel', function(e) {
  cameraDistance += e.deltaY * 0.005;
  cameraDistance = Math.max(2, Math.min(8, cameraDistance));
}, { passive: true });

// Keyboard
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowUp') touchDirs.up = true;
  if (e.key === 'ArrowDown') touchDirs.down = true;
  if (e.key === 'ArrowLeft') touchDirs.left = true;
  if (e.key === 'ArrowRight') touchDirs.right = true;
  if (e.key === 'c' || e.key === 'C') resetCamera();
  if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); toggleAutoRun(); }
});
document.addEventListener('keyup', function(e) {
  if (e.key === 'ArrowUp') touchDirs.up = false;
  if (e.key === 'ArrowDown') touchDirs.down = false;
  if (e.key === 'ArrowLeft') touchDirs.left = false;
  if (e.key === 'ArrowRight') touchDirs.right = false;
});

// ============================================================
//  TOAST
// ============================================================

function showToast(message, type) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(function() { toast.remove(); }, 3000);
}

// ============================================================
//  ENTER APP
// ============================================================

function enterApp() {
  document.getElementById('start-screen').style.opacity = '0';
  setTimeout(function() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-container').style.display = 'block';
    document.getElementById('tg-toggle').style.display = 'block';
    document.getElementById('skin-toggle').style.display = 'block';
    initThreeJS();
    
    setTimeout(function() {
      if (connected) {
        fetchEmojisFromChannel();
      } else {
        showToast('📡 اضغط "اتصال" ثم "😊 جلب إيموجي"', 'info');
      }
    }, 1500);
    
  }, 500);

  const savedToken = localStorage.getItem('nardo_bot_token');
  const savedChat = localStorage.getItem('nardo_chat_id');
  if (savedToken) document.getElementById('bot-token').value = savedToken;
  if (savedChat) document.getElementById('chat-id').value = savedChat;
  
  setTimeout(function() {
    if (savedToken && savedChat) {
      testTelegram();
    }
  }, 1000);
  
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}

// ============================================================
//  INIT
// ============================================================

initTelegram();
setupTouchControls();

setTimeout(function() {
  document.getElementById('start-btn').style.display = 'block';
}, 500);

console.log('😊 إيموجي 3D — جاهز مع تكبير وتحريك مثل بوبجي!');
</script>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سوبيرات ريان</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    :root {
      --grey: #4a5555;
      --red:  #ff5e5e;
      --light: #f8f9fa;
    }
    body { 
      background: var(--light); 
      font-family: system-ui, sans-serif; 
      margin: 0; 
      padding-bottom: 90px; 
    }
    header { 
      background: var(--grey); 
      color: white; 
      padding: 12px; 
      display: flex; 
      justify-content: space-between; 
      position: sticky; 
      top: 0; 
      z-index: 10; 
    }
    .card { 
      background: white; 
      border-radius: 16px; 
      margin: 12px; 
      padding: 16px; 
      box-shadow: 0 1px 6px #0001; 
    }
    .bottom-bar { 
      position: fixed; 
      bottom: 0; 
      width: 100%; 
      background: white; 
      display: flex; 
      border-top: 1px solid #ddd; 
      z-index: 10; 
    }
    .bottom-bar a { 
      flex: 1; 
      text-align: center; 
      padding: 8px 0; 
      color: #666; 
      text-decoration: none; 
    }
    .bottom-bar .active { color: var(--grey); font-weight: bold; }
    .add-btn { 
      background: var(--grey); 
      color: white; 
      width: 56px; 
      height: 56px; 
      border-radius: 50%; 
      margin-top: -36px; 
      border: 4px solid white; 
      box-shadow: 0 2px 8px #0002; 
    }
    table { width: 100%; font-size: 14px; }
    th { color: #777; border-bottom: 1px solid #eee; padding: 8px; }
    td { padding: 10px; text-align: center; }
    .total-bar { 
      background: var(--grey); 
      color: white; 
      padding: 12px; 
      border-radius: 12px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin: 12px; 
    }
    @media print {
      body > *:not(#print-area) { display: none; }
      #print-area { 
        font-family: monospace; 
        font-size: 12px; 
        padding: 10px; 
      }
    }
  </style>
</head>
<body>

<header class="no-print">
  <i class="material-icons-round">account_circle</i>
  <span>سوبيرات ريان</span>
  <i class="material-icons-round">menu</i>
</header>

<!-- المبيعات -->
<div id="sales" class="section active">
  <div class="card no-print">
    <input type="text" id="search" class="form-control mb-2" placeholder="ابحث بالاسم أو الباركود" oninput="searchProduct(this.value)">
    <div id="results" class="list-group mb-2" style="max-height:180px;overflow-y:auto;display:none"></div>
    
    <div class="input-group mb-2">
      <input type="number" id="qty" class="form-control" placeholder="الكمية" min="1">
      <button class="btn btn-danger" onclick="addToCart()">إضافة</button>
    </div>
    <button class="btn btn-outline-secondary w-100 mb-2" onclick="clearCart()">مسح السلة</button>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>الصنف</th><th>كمية</th><th>المجموع</th><th></th></tr></thead>
      <tbody id="cart"></tbody>
    </table>
  </div>

  <div class="total-bar no-print">
    <button class="btn btn-light px-4" onclick="printInvoice()">طباعة</button>
    <div>المجموع: <b id="total">0</b> دج</div>
  </div>
</div>

<!-- الفواتير -->
<div id="invoices" class="section" style="display:none">
  <div class="card">
    <h5 class="text-center mb-3">الفواتير</h5>
    <table>
      <thead><tr><th>رقم</th><th>التاريخ</th><th>المبلغ</th></tr></thead>
      <tbody id="invoice-list"></tbody>
    </table>
  </div>
</div>

<!-- إضافة منتج -->
<div id="add" class="section" style="display:none">
  <div class="card">
    <h5 class="text-center mb-3">منتج جديد</h5>
    <input id="p-name"   class="form-control mb-2" placeholder="الاسم *">
    <input id="p-barcode"class="form-control mb-2" placeholder="باركود">
    <input id="p-sell"   class="form-control mb-2" type="number" placeholder="سعر البيع *">
    <input id="p-buy"    class="form-control mb-2" type="number" placeholder="سعر الشراء">
    <input id="p-qty"    class="form-control mb-3" type="number" value="0" placeholder="الكمية">
    <button class="btn btn-dark w-100" onclick="saveProduct()">حفظ</button>
  </div>
</div>

<!-- المخزن -->
<div id="stock" class="section" style="display:none">
  <div class="card">
    <h5 class="text-center mb-3">المخزن</h5>
    <table>
      <thead><tr><th>الصنف</th><th>الكمية</th><th>البيع</th></tr></thead>
      <tbody id="stock-list"></tbody>
    </table>
  </div>
</div>

<!-- منطقة الطباعة -->
<div id="print-area">
  <div style="text-align:center; border-bottom:1px dashed #000; padding-bottom:8px;">
    <h6>سوبيرات ريان</h6>
    <small id="print-date"></small><br>
    فاتورة رقم: <b id="print-no"></b>
  </div>
  <table style="width:100%; margin:8px 0;">
    <tbody id="print-items"></tbody>
  </table>
  <div style="border-top:1px dashed #000; padding-top:8px; font-weight:bold; display:flex; justify-content:space-between;">
    <span>الإجمالي</span>
    <span id="print-total"></span>
  </div>
</div>

<div class="bottom-bar no-print">
  <a href="#" class="active" onclick="show('sales',this)"><i class="material-icons-round">payments</i>بيع</a>
  <a href="#" onclick="show('invoices',this)"><i class="material-icons-round">receipt_long</i>فواتير</a>
  <a href="#" class="text-center" onclick="show('add',this)">
    <div class="add-btn"><i class="material-icons-round">add</i></div>
  </a>
  <a href="#" onclick="show('stock',this)"><i class="material-icons-round">inventory_2</i>مخزن</a>
</div>

<script>
let stock   = JSON.parse(localStorage.getItem('st')||'[]');
let invoices = JSON.parse(localStorage.getItem('inv')||'[]');
let cart    = [];

function show(id, el){
  document.querySelectorAll('.section').forEach(s=>s.style.display='none');
  document.getElementById(id).style.display='block';
  
  document.querySelectorAll('.bottom-bar a').forEach(a=>a.classList.remove('active'));
  if(el) el.classList.add('active');
  
  if(id==='invoices') renderInvoices();
  if(id==='stock')    renderStock();
}

function searchProduct(val){
  if(!val.trim()){ document.getElementById('results').style.display='none'; return; }
  let res = document.getElementById('results');
  let matches = stock.filter(p=>p.name.includes(val)||p.barcode?.includes(val));
  res.innerHTML = matches.map(p=>`
    <button class="list-group-item list-group-item-action" onclick="select('${p.name}')">
      ${p.name} - ${p.qty} ${p.unit||''} - ${p.sellPrice} دج
    </button>
  `).join('');
  res.style.display = matches.length ? 'block' : 'none';
}

function select(name){
  document.getElementById('search').value = name;
  document.getElementById('results').style.display='none';
  document.getElementById('qty').focus();
}

function addToCart(){
  let name = document.getElementById('search').value.trim();
  let qty  = +document.getElementById('qty').value;
  if(!name || qty<1) return alert('أكمل البيانات');

  let p = stock.find(x=>x.name===name);
  if(!p) return alert('غير موجود');
  if(qty > p.qty) return alert(`الكمية المتوفرة ${p.qty}`);

  cart.push({name, qty, price:p.sellPrice, total:qty*p.sellPrice});
  p.qty -= qty;
  save();
  renderCart();
  document.getElementById('search').value = '';
  document.getElementById('qty').value = '';
}

function renderCart(){
  document.getElementById('cart').innerHTML = cart.map((it,i)=>`
    <tr>
      <td>${it.name}</td>
      <td>${it.qty}</td>
      <td>${it.total}</td>
      <td class="text-danger" onclick="remove(${i})">×</td>
    </tr>
  `).join('');
  
  let sum = cart.reduce((a,c)=>a+c.total,0);
  document.getElementById('total').textContent = sum;
}

function remove(i){
  let it = cart[i];
  let p = stock.find(x=>x.name===it.name);
  if(p) p.qty += it.qty;
  cart.splice(i,1);
  save();
  renderCart();
}

function clearCart(){
  if(!cart.length || !confirm('مسح السلة؟')) return;
  cart.forEach(it=>{
    let p=stock.find(x=>x.name===it.name);
    if(p) p.qty += it.qty;
  });
  cart=[];
  save();
  renderCart();
}

function printInvoice(){
  if(!cart.length) return alert('السلة فارغة');

  let sum = cart.reduce((a,c)=>a+c.total,0);
  let no  = invoices.length + 1001;
  let date = new Date().toLocaleString('ar-DZ');

  invoices.push({no, date, items:[...cart], sum});
  saveInv();

  document.getElementById('print-no').textContent = no;
  document.getElementById('print-date').textContent = date;
  document.getElementById('print-total').textContent = sum + ' دج';

  document.getElementById('print-items').innerHTML = cart.map(it=>`
    <tr>
      <td>${it.name}</td>
      <td style="text-align:center">${it.qty}</td>
      <td style="text-align:right">${it.total} دج</td>
    </tr>
  `).join('');

  window.print();
  cart = [];
  renderCart();
}

function save(){ localStorage.setItem('st', JSON.stringify(stock)); }
function saveInv(){ localStorage.setItem('inv', JSON.stringify(invoices)); }

function saveProduct(){
  let name = document.getElementById('p-name').value.trim();
  let sell = +document.getElementById('p-sell').value;
  if(!name || sell<1) return alert('الاسم وسعر البيع مطلوب');

  stock.push({
    name,
    barcode: document.getElementById('p-barcode').value.trim()||'',
    sellPrice: sell,
    buyPrice: +document.getElementById('p-buy').value||0,
    qty: +document.getElementById('p-qty').value||0,
    unit: 'قطعة'
  });
  save();
  alert('تم الحفظ');
  ['p-name','p-barcode','p-sell','p-buy','p-qty'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('p-qty').value='0';
}

function renderInvoices(){
  document.getElementById('invoice-list').innerHTML = invoices.map(i=>`
    <tr>
      <td>${i.no}</td>
      <td>${i.date}</td>
      <td>${i.sum} دج</td>
    </tr>
  `).join('');
}

function renderStock(){
  document.getElementById('stock-list').innerHTML = stock.map(p=>`
    <tr>
      <td>${p.name}</td>
      <td>${p.qty}</td>
      <td>${p.sellPrice}</td>
    </tr>
  `).join('');
}

renderCart();
</script>
</body>
</html>

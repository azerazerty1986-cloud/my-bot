<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>👤 الشخصية المتكاملة (منظّفة)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Cairo',sans-serif; background:#050510; color:#fff; overflow:hidden; }
canvas { display:block; width:100%; height:100%; background:#0a0a1a; }

#info {
  position:fixed; top:10px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.75); padding:6px 18px; border-radius:20px;
  z-index:100; font-size:13px; border:1px solid rgba(255,215,0,0.25);
}
#info span { color:#ffd700; }

#status {
  position:fixed; top:48px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.6); padding:4px 14px; border-radius:12px;
  z-index:100; font-size:12px; color:#4ade80;
}

#hud {
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
  display:flex; gap:14px; z-index:100;
  background:rgba(0,0,0,0.7); padding:8px 18px; border-radius:14px;
  border:1px solid rgba(255,255,255,0.06);
}
#hud .stat { text-align:center; min-width:50px; }
#hud .stat .value { color:#4ade80; font-weight:700; font-size:14px; }
#hud .stat .label { color:#777; font-size:10px; margin-top:2px; }

#controls {
  position:fixed; bottom:85px; left:50%; transform:translateX(-50%);
  display:flex; gap:6px; z-index:100; flex-wrap:wrap; justify-content:center;
}
#controls button {
  background:rgba(139,92,246,0.18); color:#fff;
  border:1px solid rgba(139,92,246,0.3);
  padding:5px 12px; border-radius:12px; cursor:pointer;
  font-size:11px; font-family:inherit;
}
#controls button:hover { background:rgba(139,92,246,0.35); }
#controls button.active { background:#8b5cf6; border-color:#a78bfa; }

#upload-area {
  position:fixed; bottom:130px; left:50%; transform:translateX(-50%);
  display:flex; gap:6px; z-index:100;
}
#upload-area button {
  background:rgba(60,60,120,0.25); color:#bbb;
  border:1px solid rgba(255,255,255,0.08);
  padding:4px 12px; border-radius:10px; cursor:pointer;
  font-size:11px; font-family:inherit;
}
#upload-area button:hover { background:rgba(139,92,246,0.25); color:#fff; }

.dpad {
  position:fixed; bottom:90px; left:14px; width:105px; height:105px; z-index:200;
}
.dpad-btn {
  position:absolute; width:34px; height:34px; border-radius:50%;
  background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.1);
  display:flex; align-items:center; justify-content:center;
  font-size:13px; color:rgba(255,255,255,0.35); cursor:pointer;
}
.dpad-btn:active { background:rgba(139,92,246,0.3); color:#c4b5fd; }
.dpad-up { top:0; left:35px; }
.dpad-down { bottom:0; left:35px; }
.dpad-left { top:35px; left:0; }
.dpad-right { top:35px; right:0; }

#timer-bar {
  position:fixed; bottom:70px; left:50%; transform:translateX(-50%);
  width:140px; height:3px; background:rgba(255,255,255,0.08);
  border-radius:2px; z-index:100; overflow:hidden; display:none;
}
#timer-bar .fill {
  height:100%; width:100%;
  background:linear-gradient(90deg,#8b5cf6,#00f2ff);
  border-radius:2px; transition:width 0.05s linear;
}

#toast-container {
  position:fixed; bottom:175px; left:50%; transform:translateX(-50%);
  z-index:1000; display:flex; flex-direction:column; gap:5px; align-items:center;
  pointer-events:none;
}
.toast {
  background:rgba(0,0,0,0.9); color:#fff; padding:5px 14px;
  border-radius:16px; font-size:11px; border:1px solid rgba(255,255,255,0.06);
}
.toast.success { border-color:#4ade80; }
.toast.error { border-color:#f87171; }
.toast.warn { border-color:#fb923c; }
.toast.info { border-color:#60a5fa; }

.hidden { display:none; }
</style>
</head>
<body>

<div id="info">👤 <span>الشخصية المتكاملة</span></div>
<div id="status">🧍 وقوف</div>

<div id="hud">
  <div class="stat"><div class="value" id="health">100</div><div class="label">❤️ صحة</div></div>
  <div class="stat"><div class="value" id="shield">50</div><div class="label">🛡️ درع</div></div>
  <div class="stat"><div class="value" id="ammo">30</div><div class="label">🔫 ذخيرة</div></div>
  <div class="stat"><div class="value" id="kills">0</div><div class="label">💀 قتلى</div></div>
</div>

<div id="upload-area">
  <button onclick="document.getElementById('char-input').click()">📁 رفع شخصية</button>
  <button onclick="loadTestCharacter()">🧪 شخصية تجريبية</button>
</div>

<div id="controls">
  <button class="active" data-action="idle"   onclick="setAction('idle', 0)">🧍 وقوف</button>
  <button data-action="walk"   onclick="setAction('walk', 0.8)">🚶 مشي</button>
  <button data-action="run"    onclick="setAction('run', 0.5)">🏃 جري</button>
  <button data-action="fight"  onclick="setAction('fight', 1.0)">⚔️ قتال</button>
  <button data-action="shoot"  onclick="setAction('shoot', 0.3)">🔫 إطلاق</button>
  <button data-action="shield" onclick="setAction('shield', 1.5)">🛡️ دفاع</button>
</div>

<div id="timer-bar"><div class="fill" id="timer-fill"></div></div>

<div class="dpad" id="dpad">
  <div class="dpad-btn dpad-up" data-dir="up">▲</div>
  <div class="dpad-btn dpad-down" data-dir="down">▼</div>
  <div class="dpad-btn dpad-left" data-dir="left">◀</div>
  <div class="dpad-btn dpad-right" data-dir="right">▶</div>
</div>

<div id="toast-container"></div>
<input type="file" id="char-input" class="hidden" accept="video/*,.webm,.mp4,.mov">
<canvas id="canvas"></canvas>

<script>
// ============================================================
//  👤 الشخصية المتكاملة — نسخة منظّفة
// ============================================================

const PLAYER_SPEED = 0.09;
const ACTION_NAMES = {
  idle: 'وقوف', walk: 'مشي', run: 'جري',
  fight: 'قتال', shoot: 'إطلاق', shield: 'دفاع'
};
const ACTION_SPEEDS = {
  idle: 0.35, walk: 0.7, run: 1.25,
  fight: 0.9, shoot: 1.8, shield: 0.45
};

let scene, camera, renderer;
let playerGroup, ringGroup, characterSprite;
let characterVideo = null;
let characterTexture = null;
let isReady = false;
let currentAction = 'idle';
let actionTimer = null;
let timerInterval = null;
let time = 0;
let touchDirs = { up:false, down:false, left:false, right:false };

// ============================================================
//  واجهة
// ============================================================
function showToast(msg, type = 'info') {
  const box = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

function setStatus(text) {
  document.getElementById('status').textContent = text;
}

// ============================================================
//  تحميل الشخصية من ملف
// ============================================================
document.getElementById('char-input').addEventListener('change', function(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;

  if (!file.type.startsWith('video/')) {
    showToast('❌ الملف ليس فيديو', 'error');
    return;
  }
  if (file.size > 50 * 1024 * 1024) {
    showToast('❌ الحد الأقصى 50MB', 'error');
    return;
  }

  const url = URL.createObjectURL(file);
  const name = file.name.replace(/\.[^/.]+$/, '') || 'شخصية محلية';
  loadCharacter(url, name);
});

function clearCharacter() {
  if (characterSprite) {
    scene.remove(characterSprite);
    if (characterSprite.material?.map) characterSprite.material.map.dispose();
    if (characterSprite.material) characterSprite.material.dispose();
    characterSprite = null;
  }
  if (characterVideo) {
    try { characterVideo.pause(); } catch(e) {}
    characterVideo = null;
  }
  if (characterTexture) {
    try { characterTexture.dispose(); } catch(e) {}
    characterTexture = null;
  }
  isReady = false;
}

function loadCharacter(url, name) {
  clearCharacter();
  setStatus('⏳ تحميل: ' + name);
  showToast('📥 جاري تحميل الشخصية...', 'info');

  characterVideo = document.createElement('video');
  characterVideo.muted = true;
  characterVideo.loop = true;
  characterVideo.playsInline = true;
  characterVideo.preload = 'auto';
  characterVideo.crossOrigin = 'anonymous';
  characterVideo.src = url;

  characterVideo.onloadeddata = function() {
    characterVideo.play().catch(() => {});

    characterTexture = new THREE.VideoTexture(characterVideo);
    characterTexture.minFilter = THREE.LinearFilter;
    characterTexture.magFilter = THREE.LinearFilter;
    characterTexture.format = THREE.RGBAFormat;

    const mat = new THREE.SpriteMaterial({
      map: characterTexture,
      transparent: true,
      depthTest: true,
      depthWrite: false
    });

    characterSprite = new THREE.Sprite(mat);
    characterSprite.scale.set(2.4, 2.4, 1);
    characterSprite.position.y = 1.2;
    scene.add(characterSprite);

    isReady = true;
    setStatus('✅ ' + name);
    showToast('✅ الشخصية جاهزة', 'success');
    setAction('idle', 0);
  };

  characterVideo.onerror = function() {
    setStatus('❌ فشل التحميل');
    showToast('❌ فشل تحميل الشخصية', 'error');
  };

  characterVideo.load();
}

// ============================================================
//  شخصية تجريبية (Canvas متحرك)
// ============================================================
function loadTestCharacter() {
  const c = document.createElement('canvas');
  c.width = 256;
  c.height = 256;
  const ctx = c.getContext('2d');
  let frame = 0;

  function draw() {
    frame++;
    ctx.clearRect(0, 0, 256, 256);

    // جسم
    const hue = (frame * 0.5) % 360;
    const grad = ctx.createRadialGradient(128, 145, 0, 128, 145, 72);
    grad.addColorStop(0, `hsl(${hue}, 80%, 60%)`);
    grad.addColorStop(1, `hsl(${(hue + 80) % 360}, 80%, 28%)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(128, 145, 68, 0, Math.PI * 2);
    ctx.fill();

    // رأس
    ctx.fillStyle = `hsl(${(hue + 40) % 360}, 70%, 68%)`;
    ctx.beginPath();
    ctx.arc(128, 78, 38, 0, Math.PI * 2);
    ctx.fill();

    // عيون
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(114, 74, 9, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(142, 74, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath(); ctx.arc(116, 76, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(144, 76, 4, 0, Math.PI * 2); ctx.fill();

    // تاج
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.moveTo(105, 48);
    ctx.lineTo(128, 28);
    ctx.lineTo(151, 48);
    ctx.closePath();
    ctx.fill();

    // اسم الحركة
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.font = '15px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(ACTION_NAMES[currentAction] || '', 128, 230);

    requestAnimationFrame(draw);
  }
  draw();

  // تحويل Canvas إلى فيديو عبر captureStream
  const stream = c.captureStream(30);
  const video = document.createElement('video');
  video.muted = true;
  video.loop = true;
  video.playsInline = true;
  video.srcObject = stream;

  video.onloadeddata = function() {
    video.play().catch(() => {});
    // نمرر عنصر الفيديو مباشرة عبر ObjectURL من canvas كحل بديل:
    // الأفضل: نستخدم texture من canvas مباشرة، لكن للحفاظ على نفس المسار:
    clearCharacter();

    characterVideo = video;
    characterTexture = new THREE.CanvasTexture(c);
    characterTexture.minFilter = THREE.LinearFilter;
    characterTexture.magFilter = THREE.LinearFilter;

    // تحديث الـ texture كل إطار
    const updateTex = () => {
      if (characterTexture) characterTexture.needsUpdate = true;
      requestAnimationFrame(updateTex);
    };
    updateTex();

    const mat = new THREE.SpriteMaterial({
      map: characterTexture,
      transparent: true,
      depthTest: true,
      depthWrite: false
    });
    characterSprite = new THREE.Sprite(mat);
    characterSprite.scale.set(2.4, 2.4, 1);
    characterSprite.position.y = 1.2;
    scene.add(characterSprite);

    isReady = true;
    setStatus('✅ شخصية تجريبية');
    showToast('✅ الشخصية التجريبية جاهزة', 'success');
    setAction('idle', 0);
  };
  video.play().catch(() => {});
}

// ============================================================
//  الحركات
// ============================================================
function setAction(action, duration) {
  currentAction = action;

  // تحديث الأزرار
  document.querySelectorAll('#controls button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.action === action);
  });

  setStatus('🎯 ' + (ACTION_NAMES[action] || action));

  // سرعة التشغيل
  if (characterVideo && isReady && characterVideo.playbackRate !== undefined) {
    characterVideo.playbackRate = ACTION_SPEEDS[action] || 0.5;
  }

  // مؤقت العودة للوقوف
  if (actionTimer) {
    clearTimeout(actionTimer);
    actionTimer = null;
  }
  hideTimer();

  if (duration > 0) {
    showTimer(duration);
    actionTimer = setTimeout(() => {
      setAction('idle', 0);
      setStatus('🧍 عودة إلى الوقوف');
    }, duration * 1000);
  }
}

function showTimer(duration) {
  const bar = document.getElementById('timer-bar');
  const fill = document.getElementById('timer-fill');
  bar.style.display = 'block';
  fill.style.width = '100%';

  if (timerInterval) clearInterval(timerInterval);
  let p = 1;
  const step = 1 / (duration * 20);
  timerInterval = setInterval(() => {
    p -= step;
    if (p <= 0) {
      p = 0;
      clearInterval(timerInterval);
    }
    fill.style.width = (p * 100) + '%';
  }, 50);
}

function hideTimer() {
  document.getElementById('timer-bar').style.display = 'none';
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

// ============================================================
//  Three.js
// ============================================================
function initScene() {
  const canvas = document.getElementById('canvas');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a1a);
  scene.fog = new THREE.Fog(0x0a0a1a, 16, 32);

  camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 40);
  camera.position.set(3.5, 3.2, 5.5);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;

  scene.add(new THREE.AmbientLight(0x8b5cf6, 0.45));
  const sun = new THREE.DirectionalLight(0xffeedd, 1.0);
  sun.position.set(5, 12, 6);
  sun.castShadow = true;
  scene.add(sun);
  const rim = new THREE.DirectionalLight(0x4466ff, 0.35);
  rim.position.set(-4, 6, -5);
  scene.add(rim);

  // مجموعة اللاعب + الدائرة
  playerGroup = new THREE.Group();
  scene.add(playerGroup);

  ringGroup = new THREE.Group();
  scene.add(ringGroup);

  // حلقة رئيسية
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(1.0, 1.28, 40),
    new THREE.MeshBasicMaterial({
      color: 0x00f2ff, transparent: true, opacity: 0.18,
      side: THREE.DoubleSide, depthWrite: false
    })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.02;
  ringGroup.add(ring);

  // حلقة خارجية
  const glow = new THREE.Mesh(
    new THREE.RingGeometry(1.28, 1.48, 40),
    new THREE.MeshBasicMaterial({
      color: 0x8b5cf6, transparent: true, opacity: 0.1,
      side: THREE.DoubleSide, depthWrite: false
    })
  );
  glow.rotation.x = -Math.PI / 2;
  glow.position.y = 0.015;
  ringGroup.add(glow);

  // نقاط متحركة
  for (let i = 0; i < 12; i++) {
    const dot = new THREE.Mesh(
      new THREE.SphereGeometry(0.025, 6, 6),
      new THREE.MeshBasicMaterial({ color: 0x00f2ff, transparent: true, opacity: 0.4 })
    );
    const a = (i / 12) * Math.PI * 2;
    dot.position.set(Math.cos(a) * 1.38, 0.03, Math.sin(a) * 1.38);
    dot.userData.baseAngle = a;
    ringGroup.add(dot);
  }

  // أرضية
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(22, 22),
    new THREE.MeshStandardMaterial({ color: 0x15152a, roughness: 0.9, metalness: 0.08 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.04;
  ground.receiveShadow = true;
  scene.add(ground);

  const grid = new THREE.GridHelper(22, 22, 0x333366, 0x1a1a3e);
  grid.position.y = 0.01;
  scene.add(grid);

  animate();
}

// ============================================================
//  حركة
// ============================================================
function updatePlayer() {
  let dx = 0, dz = 0;
  if (touchDirs.up)    dz = -PLAYER_SPEED;
  if (touchDirs.down)  dz =  PLAYER_SPEED;
  if (touchDirs.left)  dx = -PLAYER_SPEED;
  if (touchDirs.right) dx =  PLAYER_SPEED;

  const limit = 9;
  playerGroup.position.x = Math.max(-limit, Math.min(limit, playerGroup.position.x + dx));
  playerGroup.position.z = Math.max(-limit, Math.min(limit, playerGroup.position.z + dz));

  if (dx !== 0 || dz !== 0) {
    playerGroup.rotation.y = Math.atan2(dx, dz);
    // أثناء الحركة نفضّل وضع المشي إن كان واقفًا
    if (currentAction === 'idle') setAction('walk', 0);
  } else if (currentAction === 'walk') {
    setAction('idle', 0);
  }

  // مزامنة موقع الشخصية والدائرة
  if (characterSprite) {
    characterSprite.position.x = playerGroup.position.x;
    characterSprite.position.z = playerGroup.position.z;
  }
  ringGroup.position.x = playerGroup.position.x;
  ringGroup.position.z = playerGroup.position.z;
}

function animate() {
  requestAnimationFrame(animate);
  time += 0.016;

  updatePlayer();

  // تحريك نقاط الدائرة
  ringGroup.children.forEach(child => {
    if (child.userData.baseAngle !== undefined) {
      const a = child.userData.baseAngle + time * 0.55;
      child.position.x = Math.cos(a) * 1.38;
      child.position.z = Math.sin(a) * 1.38;
    }
  });
  ringGroup.rotation.y += 0.004;

  if (characterTexture && isReady) {
    characterTexture.needsUpdate = true;
  }

  // كاميرا ناعمة
  const target = playerGroup.position;
  camera.position.x += (target.x + 3.2 - camera.position.x) * 0.06;
  camera.position.z += (target.z + 5.0 - camera.position.z) * 0.06;
  camera.position.y += (3.0 - camera.position.y) * 0.06;
  camera.lookAt(target.x, 1.2, target.z);

  renderer.render(scene, camera);
}

// ============================================================
//  التحكم
// ============================================================
function setupControls() {
  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const dir = btn.dataset.dir;
    btn.addEventListener('touchstart', e => {
      e.preventDefault();
      touchDirs[dir] = true;
    }, { passive: false });
    btn.addEventListener('touchend', e => {
      e.preventDefault();
      touchDirs[dir] = false;
    }, { passive: false });
    btn.addEventListener('touchcancel', () => { touchDirs[dir] = false; });
  });

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp') touchDirs.up = true;
    if (e.key === 'ArrowDown') touchDirs.down = true;
    if (e.key === 'ArrowLeft') touchDirs.left = true;
    if (e.key === 'ArrowRight') touchDirs.right = true;
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowUp') touchDirs.up = false;
    if (e.key === 'ArrowDown') touchDirs.down = false;
    if (e.key === 'ArrowLeft') touchDirs.left = false;
    if (e.key === 'ArrowRight') touchDirs.right = false;
  });
}

window.addEventListener('resize', () => {
  if (!camera || !renderer) return;
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

setupControls();
initScene();
setTimeout(loadTestCharacter, 400);

console.log('👤 الشخصية المتكاملة — نسخة منظّفة جاهزة');
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebM في 3D - الحل النهائي</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
body { margin:0; overflow:hidden; background:#050510; }
#canvas { display:block; width:100%; height:100%; }
#info { position:fixed; top:10px; left:50%; transform:translateX(-50%); color:#fff; font-family:sans-serif; background:rgba(0,0,0,0.7); padding:8px 20px; border-radius:10px; z-index:10; }
</style>
</head>
<body>

<div id="info">⏳ جاري تحميل الفيديو...</div>
<canvas id="canvas"></canvas>

<script>
// ============================================================
//  مختصر 3D + WebM + Blob
// ============================================================

const canvas = document.getElementById('canvas');
const info = document.getElementById('info');

// --- المشهد ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 8, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

// --- إضاءة ---
scene.add(new THREE.AmbientLight(0x8b5cf6, 0.5));
const light = new THREE.DirectionalLight(0xffffff, 0.8);
light.position.set(10, 20, 10);
scene.add(light);

// --- أرضية ---
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.9 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// --- شبكة ---
scene.add(new THREE.GridHelper(20, 10, 0x8b5cf6, 0x2a2a4a));

// --- كرة (اللاعب) ---
const player = new THREE.Mesh(
  new THREE.SphereGeometry(0.5, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0x8b5cf6, emissive: 0x4a1a8a, emissiveIntensity: 0.2 })
);
player.position.y = 0.5;
scene.add(player);

// ============================================================
//  🔥 تحميل وعرض الفيديو باستخدام Blob
// ============================================================

// رابط فيديو تجريبي (WebM من Telegram)
const TEST_URL = 'https://cdn.pixabay.com/vimeo/877366053/sea-877366053-360.mp4?width=360&hash=9d8c4f4b1c4a1b1e4f4a1b1e4f4a1b1e';

async function loadVideo() {
  info.textContent = '📥 جاري تحميل الفيديو...';
  
  try {
    // 1. جلب الفيديو كـ Blob
    const response = await fetch(TEST_URL);
    const blob = await response.blob();
    
    // 2. إنشاء رابط محلي
    const blobUrl = URL.createObjectURL(blob);
    info.textContent = '✅ تم التحميل، جاري التشغيل...';
    
    // 3. عنصر الفيديو
    const video = document.createElement('video');
    video.muted = true;
    video.loop = true;
    video.playsInline = true;
    video.src = blobUrl;
    
    video.onloadeddata = () => {
      video.play().catch(() => {});
      info.textContent = '🎬 الفيديو يعمل!';
      
      // 4. إنشاء Texture وعرضها
      const texture = new THREE.VideoTexture(video);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      
      const material = new THREE.SpriteMaterial({ 
        map: texture, 
        transparent: true 
      });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(4, 4, 1);
      sprite.position.y = 2.5;
      scene.add(sprite);
      
      // تحريك الكاميرا قليلاً
      camera.position.set(0, 6, 8);
      camera.lookAt(0, 0, 0);
    };
    
    video.onerror = () => {
      info.textContent = '❌ فشل تشغيل الفيديو';
    };
    
    video.load();
    
  } catch (err) {
    info.textContent = '❌ خطأ: ' + err.message;
    console.error(err);
  }
}

// ============================================================
//  حلقة الرسم
// ============================================================

function animate() {
  requestAnimationFrame(animate);
  
  // دوران اللاعب
  player.rotation.y += 0.02;
  
  renderer.render(scene, camera);
}

// ============================================================
//  البدء
// ============================================================

animate();

// تحميل الفيديو بعد 1 ثانية
setTimeout(loadVideo, 1000);

// تكبير عند تغيير الحجم
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

console.log('🚀 جاهز - انتظر تحميل الفيديو...');
</script>
</body>
</html>

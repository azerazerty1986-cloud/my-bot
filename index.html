<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوبيرات ريان | النظام الذكي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root { --primary-color: #0d47a1; --accent-gold: #ffc107; }
        body { background: #f0f2f5; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        /* شاشة القفل */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary-color); z-index: 10000;
            display: flex; align-items: center; justify-content: center;
        }
        .login-card { background: white; padding: 40px; border-radius: 25px; width: 350px; text-align: center; }

        /* القائمة الجانبية */
        .sidebar { background: var(--primary-color); min-height: 100vh; color: white; padding: 20px; }
        .nav-link { color: #e3f2fd; cursor: pointer; border-radius: 12px; margin: 10px 0; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.2); color: white; }
        
        /* المحتوى */
        .section { display: none; padding: 20px; }
        .active-section { display: block; animation: fadeIn 0.5s; }
        .card { border: none; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        #scanner-view { width: 100%; height: 250px; background: #000; border-radius: 15px; display: none; overflow: hidden; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body onload="checkAuth()">

<div id="lock-screen">
    <div class="login-card shadow">
        <h2 class="mb-4 text-primary">سوبيرات ريان</h2>
        <input type="password" id="pass" class="form-control mb-3 text-center fs-4" placeholder="رمز الدخول">
        <button class="btn btn-primary w-100 py-2" onclick="login()">دخول</button>
        <p id="err" class="text-danger mt-2" style="display:none">الرمز غير صحيح!</p>
    </div>
</div>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 sidebar shadow">
            <div class="text-center mb-5">
                <span class="material-icons-round fs-1 text-warning">local_grocery_store</span>
                <h4 class="mt-2">سوبيرات ريان</h4>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link active" onclick="showSection('inv')">📦 المخزن</a></li>
                <li class="nav-item"><a class="nav-link" onclick="showSection('bill')">🧾 فاتورة جديدة</a></li>
                <li class="nav-item mt-5"><a class="nav-link text-warning" onclick="logout()">🔒 خروج</a></li>
            </ul>
        </nav>

        <main class="col-md-10">
            <div id="inv" class="section active-section">
                <h2 class="mb-4">حالة المخزن</h2>
                <div class="card p-3">
                    <table class="table">
                        <thead><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الحالة</th></tr></thead>
                        <tbody id="inv-body"></tbody>
                    </table>
                </div>
            </div>

            <div id="bill" class="section">
                <div class="d-flex justify-content-between mb-4">
                    <h2>إدخال فاتورة جماعية</h2>
                    <div class="btn-group">
                        <button class="btn btn-outline-danger" onclick="startVoice()"><span class="material-icons-round align-middle">mic</span></button>
                        <button class="btn btn-outline-primary" onclick="toggleScanner()"><span class="material-icons-round align-middle">qr_code_scanner</span></button>
                    </div>
                </div>
                <div id="scanner-view" class="mb-3"></div>
                <div class="card p-4">
                    <div class="row g-2 mb-3">
                        <div class="col-md-4"><input type="text" id="p-name" class="form-control" placeholder="اسم المنتج"></div>
                        <div class="col-md-3"><input type="number" id="p-qty" class="form-control" placeholder="الكمية"></div>
                        <div class="col-md-3"><input type="number" id="p-price" class="form-control" placeholder="السعر"></div>
                        <div class="col-md-2"><button class="btn btn-primary w-100" onclick="addToBill()">إضافة</button></div>
                    </div>
                    <table class="table"><tbody id="bill-items"></tbody></table>
                    <button class="btn btn-success w-100 mt-3" onclick="saveToStorage()">حفظ الكل في المخزن</button>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<script>
    const PASS = "1234"; // رمز الدخول
    let db = JSON.parse(localStorage.getItem('ryanStore')) || [];
    let tempItems = [];

    function login() {
        if(document.getElementById('pass').value === PASS) {
            document.getElementById('lock-screen').style.display = 'none';
            sessionStorage.setItem('auth', '1');
        } else { document.getElementById('err').style.display = 'block'; }
    }

    function checkAuth() { if(sessionStorage.getItem('auth')) document.getElementById('lock-screen').style.display = 'none'; }
    function logout() { sessionStorage.clear(); location.reload(); }

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active-section'));
        document.getElementById(id).classList.add('active-section');
    }

    function addToBill() {
        const n = document.getElementById('p-name').value;
        const q = parseInt(document.getElementById('p-qty').value);
        const p = parseFloat(document.getElementById('p-price').value);
        if(n && q && p) {
            tempItems.push({n, q, p});
            renderBill();
            document.getElementById('p-name').value = '';
        }
    }

    function renderBill() {
        document.getElementById('bill-items').innerHTML = tempItems.map(it => `<tr><td>${it.n}</td><td>${it.q}</td><td>${it.p}</td></tr>`).join('');
    }

    function saveToStorage() {
        db = [...db, ...tempItems];
        localStorage.setItem('ryanStore', JSON.stringify(db));
        tempItems = []; renderBill(); renderInv();
        showSection('inv');
    }

    function renderInv() {
        document.getElementById('inv-body').innerHTML = db.map(it => `
            <tr class="${it.q <= 5 ? 'table-danger' : ''}">
                <td>${it.n}</td><td>${it.q}</td><td>${it.p}</td>
                <td>${it.q <= 5 ? '⚠️ ناقص' : '✅ متوفر'}</td>
            </tr>`).join('');
    }

    function startVoice() {
        const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        rec.lang = 'ar-SA';
        rec.onresult = (e) => document.getElementById('p-name').value = e.results[0][0].transcript;
        rec.start();
    }

    let scActive = false;
    function toggleScanner() {
        const v = document.getElementById('scanner-view');
        if(!scActive) {
            v.style.display = 'block';
            Quagga.init({inputStream:{name:"Live",type:"LiveStream",target:v},decoder:{readers:["ean_reader"]}},()=>Quagga.start());
            scActive = true;
        } else { Quagga.stop(); v.style.display = 'none'; scActive = false; }
    }
    Quagga.onDetected((r) => { document.getElementById('p-name').value = r.codeResult.code; toggleScanner(); });

    renderInv();
</script>
</body>
</html>

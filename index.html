<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎬 فيديو كأرضية 3D</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Cairo',sans-serif; background:#050510; color:#fff; overflow:hidden; user-select:none; }

#start-screen {
  position:fixed; inset:0; z-index:2000;
  background:linear-gradient(135deg,#0a0a2a,#000);
  display:flex; flex-direction:column; justify-content:center; align-items:center; gap:20px;
}
.start-logo { font-size:42px; font-weight:900; color:#ffd700; animation:float 3s ease-in-out infinite; }
.start-subtitle { font-size:15px; color:#666; text-align:center; max-width:350px; }
.start-btn {
  border:2px solid #00f2ff; color:#00f2ff; padding:16px 50px;
  background:rgba(0,242,255,0.08); border-radius:60px; font-size:20px;
  cursor:pointer; transition:all .3s; font-weight:700; font-family:inherit;
}
.start-btn:hover { transform:scale(1.05); background:#00f2ff; color:#000; box-shadow:0 0 50px rgba(0,242,255,0.4); }
.user-info { color:#00f2ff; font-size:13px; background:rgba(0,0,0,0.6); padding:8px 24px; border-radius:30px; }
.version-tag { position:absolute; bottom:15px; font-size:11px; color:#444; }
@keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }

#game-container { position:fixed; inset:0; display:none; background:#0a0a1a; }
#game-canvas { display:block; width:100%; height:100%; }

.hud {
  position:fixed; top:0; left:0; right:0; padding:6px 12px;
  display:flex; justify-content:space-between; align-items:center;
  pointer-events:none; z-index:100;
  background:rgba(0,0,0,0.6); backdrop-filter:blur(8px);
}
.hud .title { color:#ffd700; font-size:13px; font-weight:700; }
.hud .info { color:#aaa; font-size:11px; }

.dpad {
  position:fixed; bottom:20px; left:16px;
  width:120px; height:120px; z-index:200;
}
.dpad-btn {
  position:absolute; width:40px; height:40px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; color:rgba(255,255,255,0.4);
  cursor:pointer; transition:all .1s;
}
.dpad-btn:active {
  background:rgba(139,92,246,0.2);
  border-color:#8b5cf6; color:#8b5cf6;
  transform:scale(0.88);
}
.dpad-up { top:0; left:40px; }
.dpad-down { bottom:0; left:40px; }
.dpad-left { top:40px; left:0; }
.dpad-right { top:40px; right:0; }

.tg-toggle {
  position:fixed; bottom:155px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.6); border:1px solid rgba(255,215,0,0.1);
  border-radius:20px; padding:3px 14px;
  z-index:210; font-size:11px; color:#888; cursor:pointer; display:none;
}
.tg-toggle:hover { color:#ffd700; }

.tg-dropdown {
  position:fixed; bottom:170px; left:50%; transform:translateX(-50%);
  background:rgba(10,10,30,0.95); border:1px solid rgba(255,215,0,0.15);
  border-radius:14px; padding:10px 14px; z-index:250;
  min-width:280px; max-width:92%; display:none; backdrop-filter:blur(12px);
}
.tg-dropdown.show { display:block; }
.tg-dropdown .row { display:flex; gap:5px; margin-bottom:5px; flex-wrap:wrap; }
.tg-dropdown input {
  flex:1; padding:4px 8px; border-radius:6px;
  border:1px solid rgba(255,215,0,0.1); background:#0a0a1a;
  color:#fff; font-size:10px; font-family:inherit; min-width:50px;
}
.tg-dropdown .btn {
  padding:4px 10px; border:none; border-radius:6px;
  font-weight:700; font-size:10px; cursor:pointer; font-family:inherit;
}
.btn-accent { background:#00f2ff; color:#111; }
.btn-purple { background:#8b5cf6; color:#fff; }
.btn-gold { background:#ffd700; color:#111; }
.btn-green { background:#4ade80; color:#111; }
.btn-red { background:#f87171; color:#fff; }
.btn-pink { background:#ec4899; color:#fff; }
#tg-status { font-size:10px; color:#888; margin-top:4px; }

#minimap-frame {
  position:fixed; top:50px; left:10px;
  width:120px; height:120px;
  border:2px solid #ffd700; border-radius:12px;
  overflow:hidden; pointer-events:none; z-index:90;
  background:rgba(5,5,16,0.6);
  display:none; box-shadow:0 0 20px rgba(255,215,0,0.15);
}
#minimap-label {
  position:fixed; top:52px; left:12px; z-index:91;
  font-size:8px; color:#ffd700; background:rgba(0,0,0,0.6);
  padding:1px 6px; border-radius:4px; pointer-events:none; display:none;
}

.toast-container {
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
  z-index:700; display:flex; flex-direction:column; gap:5px; pointer-events:none;
  align-items:center;
}
.toast {
  background:rgba(0,0,0,0.9); padding:6px 16px; border-radius:30px;
  font-size:11px; border:1px solid rgba(255,255,255,0.06);
  animation:toastIn .3s,toastOut .3s 2.7s forwards;
}
.toast.success { border-color:#4ade80; color:#4ade80; }
.toast.error { border-color:#f87171; color:#f87171; }
.toast.info { border-color:#60a5fa; color:#60a5fa; }
@keyframes toastIn {
  from { opacity:0; transform:translateY(20px); }
  to { opacity:1; transform:translateY(0); }
}
@keyframes toastOut {
  from { opacity:1; transform:translateY(0); }
  to { opacity:0; transform:translateY(-20px); }
}

#local-video-input { display:none; }
</style>
</head>
<body>

<!-- شاشة البداية -->
<div id="start-screen">
  <div class="start-logo">🎬 أرضية متحركة 3D</div>
  <div class="start-subtitle">فيديو كخلفية أرضية للعبة</div>
  <div class="user-info" id="userInfoDisplay">🔄 جاري التحميل...</div>
  <button class="start-btn" id="start-btn" onclick="enterApp()" style="display:none;">🚀 دخول</button>
  <div class="version-tag">v42.0 | Video Floor</div>
</div>

<!-- اللعبة -->
<div id="game-container">
  <canvas id="game-canvas"></canvas>
  
  <div id="minimap-frame"></div>
  <div id="minimap-label">🗺️</div>

  <div class="hud">
    <div class="title">🎮 أرضية متحركة</div>
    <div class="info" id="char-name">لا يوجد فيديو</div>
  </div>

  <div class="dpad" id="dpad">
    <div class="dpad-btn dpad-up" data-dir="up">▲</div>
    <div class="dpad-btn dpad-down" data-dir="down">▼</div>
    <div class="dpad-btn dpad-left" data-dir="left">◀</div>
    <div class="dpad-btn dpad-right" data-dir="right">▶</div>
  </div>

  <button class="tg-toggle" id="tg-toggle" onclick="toggleTG()">📡 تحميل فيديو</button>
  
  <div class="tg-dropdown" id="tg-dropdown">
    <div class="row">
      <button class="btn btn-green" onclick="document.getElementById('local-video-input').click()">📁 رفع فيديو كأرضية</button>
      <button class="btn btn-pink" onclick="loadTestVideo()">🧪 فيديو تجريبي</button>
      <button class="btn btn-gold" onclick="loadSampleFloor()">🏗️ أرضية نموذج</button>
      <button class="btn btn-red" onclick="toggleTG()">✖</button>
    </div>
    <div id="tg-status">⭕ اختر فيديو لتظهر كأرضية 3D</div>
  </div>

  <input type="file" id="local-video-input" accept="video/*,.webm,.mp4,.mov" onchange="handleLocalVideo(event)">
</div>

<div class="toast-container" id="toast-container"></div>

<script>
// ============================================================
//  1. التهيئة
// ============================================================

const tg = window.Telegram?.WebApp;
let userData = null;

function initTelegram() {
  try {
    if (tg) { tg.ready(); tg.expand(); }
    userData = tg?.initDataUnsafe?.user || { id: Math.floor(Math.random()*100000), first_name: 'مستخدم' };
    document.getElementById('userInfoDisplay').innerHTML = '👤 ' + (userData.first_name || 'مستخدم');
  } catch(e) {
    userData = { id: Math.floor(Math.random()*100000), first_name: 'مستخدم' };
    document.getElementById('userInfoDisplay').innerHTML = '👤 مستخدم';
  }
}

// ============================================================
//  2. Three.js
// ============================================================

let scene, camera, renderer;
let playerGroup, floorMesh, characterSprite;
let videoElement = null;
let videoTexture = null;
let isVideoReady = false;
let currentBlobUrl = null;
let floorVideoMesh = null;

const MAP_SIZE = 16;
const TILE_SIZE = 4;
const WORLD_SIZE = MAP_SIZE * TILE_SIZE;
const OFFSET = WORLD_SIZE / 2;
const PLAYER_SPEED = 0.12;
let mapData = [];
let touchDirs = { up: false, down: false, left: false, right: false };

// ============================================================
//  3. تهيئة Three.js مع أرضية فيديو
// ============================================================

function initThree() {
  const canvas = document.getElementById('game-canvas');
  
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a1a);

  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 12, 12);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  // إضاءة
  const ambient = new THREE.AmbientLight(0x8b5cf6, 0.6);
  scene.add(ambient);
  
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(10, 20, 10);
  scene.add(dirLight);

  // مجموعة اللاعب
  playerGroup = new THREE.Group();
  scene.add(playerGroup);
  
  // كرة اللاعب
  const bodyGeo = new THREE.SphereGeometry(0.5, 16, 16);
  const bodyMat = new THREE.MeshStandardMaterial({ 
    color: 0x8b5cf6, 
    emissive: 0x6d28d9, 
    emissiveIntensity: 0.3,
    roughness: 0.3,
    metalness: 0.6
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.5;
  body.castShadow = true;
  playerGroup.add(body);

  // تاج
  const crownGeo = new THREE.ConeGeometry(0.3, 0.3, 6);
  const crownMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffa500, emissiveIntensity: 0.2, metalness: 0.8 });
  const crown = new THREE.Mesh(crownGeo, crownMat);
  crown.position.y = 1.0;
  playerGroup.add(crown);

  // الجدران
  buildWalls();
  
  // موقع البداية
  playerGroup.position.set(
    1.5 * TILE_SIZE - OFFSET + TILE_SIZE/2,
    0,
    1.5 * TILE_SIZE - OFFSET + TILE_SIZE/2
  );

  setupMinimap();
  animate();
}

// ============================================================
//  4. بناء الخريطة (جدران فقط، الأرضية ستكون فيديو)
// ============================================================

function buildWalls() {
  mapData = [];
  const wallGeo = new THREE.BoxGeometry(TILE_SIZE * 0.92, TILE_SIZE * 0.8, TILE_SIZE * 0.92);
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x2a2a4a, roughness: 0.5, metalness: 0.3, transparent: true, opacity: 0.7 });
  const edgeMat = new THREE.MeshStandardMaterial({ color: 0x3a3a6a, roughness: 0.5, metalness: 0.5, transparent: true, opacity: 0.6 });

  for (let z = 0; z < MAP_SIZE; z++) {
    const row = [];
    for (let x = 0; x < MAP_SIZE; x++) {
      let isWall = false;
      if (x === 0 || x === MAP_SIZE - 1 || z === 0 || z === MAP_SIZE - 1) isWall = true;
      else if (Math.random() < 0.08 && !(x <= 3 && z <= 3)) isWall = true;
      
      row.push(isWall ? 1 : 0);
      
      if (isWall) {
        const mat = (x===0||x===MAP_SIZE-1||z===0||z===MAP_SIZE-1) ? edgeMat : wallMat;
        const wall = new THREE.Mesh(wallGeo, mat);
        wall.position.set(
          x * TILE_SIZE - OFFSET + TILE_SIZE/2,
          TILE_SIZE * 0.4,
          z * TILE_SIZE - OFFSET + TILE_SIZE/2
        );
        wall.castShadow = true;
        wall.receiveShadow = true;
        scene.add(wall);
      }
    }
    mapData.push(row);
  }
}

// ============================================================
//  5. 🎬 عرض الفيديو كأرضية (Floor)
// ============================================================

function showVideoAsFloor(url, name, isBlob = false) {
  // تنظيف الأرضية القديمة
  if (floorVideoMesh) {
    if (floorVideoMesh.material) {
      if (floorVideoMesh.material.map) {
        floorVideoMesh.material.map.dispose();
      }
      floorVideoMesh.material.dispose();
    }
    scene.remove(floorVideoMesh);
    floorVideoMesh = null;
  }

  if (videoElement) {
    try { videoElement.pause(); } catch(e) {}
    videoElement = null;
  }
  if (videoTexture) {
    try { videoTexture.dispose(); } catch(e) {}
    videoTexture = null;
  }
  if (currentBlobUrl) {
    try { URL.revokeObjectURL(currentBlobUrl); } catch(e) {}
    currentBlobUrl = null;
  }

  isVideoReady = false;

  showToast('📥 جاري تحميل الفيديو كأرضية: ' + name, 'info');
  document.getElementById('char-name').textContent = '🎬 ' + name;

  videoElement = document.createElement('video');
  videoElement.muted = true;
  videoElement.loop = true;
  videoElement.playsInline = true;
  videoElement.preload = 'auto';
  videoElement.crossOrigin = isBlob ? null : 'anonymous';
  videoElement.setAttribute('playsinline', '');
  videoElement.setAttribute('webkit-playsinline', '');

  videoElement.onloadeddata = function() {
    if (isVideoReady) return;
    isVideoReady = true;

    videoTexture = new THREE.VideoTexture(videoElement);
    videoTexture.minFilter = THREE.LinearFilter;
    videoTexture.magFilter = THREE.LinearFilter;
    videoTexture.format = THREE.RGBAFormat;
    videoTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

    // 🔥 إنشاء أرضية من الفيديو
    const aspect = videoElement.videoWidth && videoElement.videoHeight 
      ? videoElement.videoWidth / videoElement.videoHeight 
      : 1;

    // حجم الأرضية يتناسب مع الخريطة
    const floorWidth = WORLD_SIZE;
    const floorHeight = WORLD_SIZE / aspect;

    const geometry = new THREE.PlaneGeometry(floorWidth, floorHeight);
    const material = new THREE.MeshBasicMaterial({
      map: videoTexture,
      side: THREE.DoubleSide,
      transparent: true,
      depthWrite: true
    });

    floorVideoMesh = new THREE.Mesh(geometry, material);
    floorVideoMesh.rotation.x = -Math.PI / 2;
    floorVideoMesh.position.y = 0.01; // فوق الشبكة بقليل
    floorVideoMesh.receiveShadow = true;
    scene.add(floorVideoMesh);

    // تشغيل الفيديو
    const playPromise = videoElement.play();
    if (playPromise !== undefined) {
      playPromise.catch(err => {
        console.warn('Play blocked:', err);
        showToast('اضغط على الشاشة لتشغيل الفيديو', 'info');
      });
    }

    // إزالة الشبكة القديمة (GridHelper) إذا وجدت
    scene.children.forEach(child => {
      if (child.isGridHelper) {
        scene.remove(child);
      }
    });

    document.getElementById('char-name').textContent = '🎬 أرضية: ' + name;
    showToast('✅ أرضية الفيديو جاهزة!', 'success');
  };

  videoElement.onerror = function(e) {
    console.error('❌ خطأ في الفيديو:', e, videoElement.error);
    const code = videoElement.error ? videoElement.error.code : 0;
    let msg = 'فشل تحميل الفيديو';
    if (code === 2) msg = 'خطأ شبكة / CORS';
    if (code === 3) msg = 'ملف تالف أو غير مدعوم';
    if (code === 4) msg = 'تنسيق غير مدعوم';

    showToast('❌ ' + msg, 'error');
    document.getElementById('char-name').textContent = '❌ فشل التحميل';
  };

  if (isBlob) {
    currentBlobUrl = url;
  }
  videoElement.src = url;
  videoElement.load();
}

// ============================================================
//  6. رفع فيديو محلي كأرضية
// ============================================================

function handleLocalVideo(event) {
  const file = event.target.files[0];
  if (!file) return;

  if (!file.type.startsWith('video/')) {
    showToast('❌ الملف ليس فيديو', 'error');
    return;
  }

  const blobUrl = URL.createObjectURL(file);
  const name = file.name.replace(/\.[^/.]+$/, '') || 'فيديو محلي';
  showVideoAsFloor(blobUrl, name, true);
  event.target.value = '';
}

// ============================================================
//  7. فيديو تجريبي كأرضية
// ============================================================

function loadTestVideo() {
  const testUrl = 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm';
  showVideoAsFloor(testUrl, 'زهرة متحركة', false);
}

// ============================================================
//  8. أرضية نموذجية (متحركة)
// ============================================================

function loadSampleFloor() {
  // إنشاء أرضية بسيطة باستخدام Canvas
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 512;
  const ctx = canvas.getContext('2d');
  
  // رسم نمط متحرك
  let frame = 0;
  const animateCanvas = () => {
    frame++;
    // خلفية متدرجة
    const gradient = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
    gradient.addColorStop(0, `hsl(${frame % 360}, 80%, 50%)`);
    gradient.addColorStop(0.5, `hsl(${(frame + 120) % 360}, 80%, 30%)`);
    gradient.addColorStop(1, `hsl(${(frame + 240) % 360}, 80%, 20%)`);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 512, 512);
    
    // شبكة متحركة
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 2;
    const offset = frame % 50;
    for (let i = 0; i < 512; i += 50) {
      ctx.beginPath();
      ctx.moveTo(i + offset, 0);
      ctx.lineTo(i + offset, 512);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i + offset);
      ctx.lineTo(512, i + offset);
      ctx.stroke();
    }
    
    // نقاط متحركة
    ctx.fillStyle = 'rgba(139,92,246,0.3)';
    for (let i = 0; i < 20; i++) {
      const x = (Math.sin(i * 1.7 + frame * 0.02) * 0.4 + 0.5) * 512;
      const y = (Math.cos(i * 2.3 + frame * 0.015) * 0.4 + 0.5) * 512;
      ctx.beginPath();
      ctx.arc(x, y, 5 + Math.sin(frame * 0.05 + i) * 3, 0, Math.PI * 2);
      ctx.fill();
    }
    
    requestAnimationFrame(animateCanvas);
  };
  animateCanvas();

  // تحويل Canvas إلى Blob URL
  canvas.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    showVideoAsFloor(url, 'أرضية نموذجية متحركة', true);
  }, 'video/webm');
}

// ============================================================
//  9. تحديث اللاعب
// ============================================================

function updatePlayer() {
  let dx = 0, dz = 0;
  if (touchDirs.up) dz = -PLAYER_SPEED;
  if (touchDirs.down) dz = PLAYER_SPEED;
  if (touchDirs.left) dx = -PLAYER_SPEED;
  if (touchDirs.right) dx = PLAYER_SPEED;

  if (dx === 0 && dz === 0) return;

  const newX = playerGroup.position.x + dx;
  const newZ = playerGroup.position.z + dz;
  
  const gridX = Math.floor((newX + OFFSET) / TILE_SIZE);
  const gridZ = Math.floor((newZ + OFFSET) / TILE_SIZE);
  
  if (gridX >= 0 && gridX < MAP_SIZE && gridZ >= 0 && gridZ < MAP_SIZE && mapData[gridZ][gridX] !== 1) {
    playerGroup.position.x = newX;
  }
  if (gridX >= 0 && gridX < MAP_SIZE && gridZ >= 0 && gridZ < MAP_SIZE && mapData[gridZ][gridX] !== 1) {
    playerGroup.position.z = newZ;
  }
}

// ============================================================
//  10. خريطة مصغرة
// ============================================================

let minimapCtx;

function setupMinimap() {
  const minimapFrame = document.getElementById('minimap-frame');
  const canvas = document.createElement('canvas');
  canvas.width = 120;
  canvas.height = 120;
  minimapFrame.appendChild(canvas);
  minimapCtx = canvas.getContext('2d');
}

function updateMinimap() {
  if (!minimapCtx) return;
  const ctx = minimapCtx;
  const w = 120, h = 120;
  
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(10,10,26,0.9)';
  ctx.fillRect(0, 0, w, h);
  
  const scale = w / (MAP_SIZE * TILE_SIZE);
  
  for (let z = 0; z < mapData.length; z++) {
    for (let x = 0; x < mapData[z].length; x++) {
      const px = x * TILE_SIZE * scale;
      const py = z * TILE_SIZE * scale;
      const size = TILE_SIZE * scale * 0.8;
      
      ctx.fillStyle = mapData[z][x] === 1 ? '#3a3a6a' : '#1a1a2e';
      ctx.fillRect(px, py, size, size);
    }
  }
  
  const px = (playerGroup.position.x + OFFSET) * scale;
  const py = (playerGroup.position.z + OFFSET) * scale;
  
  ctx.fillStyle = '#8b5cf6';
  ctx.shadowColor = '#8b5cf6';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.arc(px, py, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(0, 0, w, h);
}

// ============================================================
//  11. حلقة الرسم
// ============================================================

function animate() {
  requestAnimationFrame(animate);
  
  updatePlayer();
  
  // تحديث الفيديو
  if (videoTexture && isVideoReady) {
    videoTexture.needsUpdate = true;
  }
  
  // الكاميرا تتبع اللاعب
  const target = playerGroup.position.clone();
  camera.position.x += (target.x - camera.position.x) * 0.05;
  camera.position.z += (target.z + 10 - camera.position.z) * 0.05;
  camera.position.y += (12 - camera.position.y) * 0.05;
  camera.lookAt(target.x, 0, target.z);
  
  updateMinimap();
  renderer.render(scene, camera);
}

// ============================================================
//  12. تحكم
// ============================================================

function toggleTG() {
  document.getElementById('tg-dropdown').classList.toggle('show');
}

function setupTouchControls() {
  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const dir = btn.getAttribute('data-dir');
    btn.addEventListener('touchstart', e => {
      e.preventDefault();
      touchDirs[dir] = true;
      btn.style.background = 'rgba(139,92,246,0.2)';
      btn.style.borderColor = '#8b5cf6';
    }, { passive: false });
    btn.addEventListener('touchend', e => {
      e.preventDefault();
      touchDirs[dir] = false;
      btn.style.background = '';
      btn.style.borderColor = '';
    }, { passive: false });
    btn.addEventListener('touchcancel', () => {
      touchDirs[dir] = false;
      btn.style.background = '';
      btn.style.borderColor = '';
    });
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') touchDirs.up = true;
  if (e.key === 'ArrowDown') touchDirs.down = true;
  if (e.key === 'ArrowLeft') touchDirs.left = true;
  if (e.key === 'ArrowRight') touchDirs.right = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowUp') touchDirs.up = false;
  if (e.key === 'ArrowDown') touchDirs.down = false;
  if (e.key === 'ArrowLeft') touchDirs.left = false;
  if (e.key === 'ArrowRight') touchDirs.right = false;
});

document.addEventListener('touchstart', function unlockVideo() {
  if (videoElement && videoElement.paused && isVideoReady) {
    videoElement.play().catch(() => {});
  }
}, { once: false });

function showToast(message, type) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast ' + (type || '');
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

//  13. الدخول
// ============================================================

function enterApp() {
  document.getElementById('start-screen').style.opacity = '0';
  setTimeout(() => {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-container').style.display = 'block';
    document.getElementById('tg-toggle').style.display = 'block';
    document.getElementById('minimap-frame').style.display = 'block';
    document.getElementById('minimap-label').style.display = 'block';
    
    initThree();
    
    window.addEventListener('resize', () => {
      if (camera) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });

    setTimeout(() => {
      showToast('📁 اختر فيديو ليظهر كأرضية 3D', 'info');
    }, 600);
    
  }, 400);
}

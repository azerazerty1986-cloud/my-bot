<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📦 أيقونات المربعات + قناة تيليجرام</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Cairo', sans-serif; background: #0a0a1a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }

h1 { color: #ffd700; font-size: 24px; margin-bottom: 16px; text-align: center; }

/* ====== شبكة المربعات ====== */
.grid-container {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 8px;
  max-width: 600px;
  width: 100%;
  margin-bottom: 24px;
  background: rgba(255,255,255,0.03);
  padding: 12px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.06);
}

.tile {
  aspect-ratio: 1;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  background: rgba(255,255,255,0.05);
  border: 2px solid rgba(255,255,255,0.06);
  transition: all 0.25s ease;
  cursor: pointer;
  position: relative;
  min-height: 56px;
}
.tile .label { font-size: 9px; color: #666; margin-top: 2px; }
.tile:hover { transform: scale(1.05); border-color: rgba(255,215,0,0.3); }
.tile.has-content { border-color: rgba(0,242,255,0.3); background: rgba(0,242,255,0.06); }
.tile.has-telegram { border-color: #ffd700; background: rgba(255,215,0,0.08); }
.tile .badge { position: absolute; top: -4px; right: -4px; font-size: 10px; background: #ffd700; color: #000; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-weight: 700; }

/* ====== لوحة تحكم تيليجرام ====== */
.telegram-panel {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(139,92,246,0.2);
  border-radius: 16px;
  padding: 18px 20px;
  max-width: 500px;
  width: 100%;
  margin-bottom: 20px;
}
.telegram-panel h3 { color: #a78bfa; font-size: 16px; margin-bottom: 12px; }
.telegram-panel label { color: #888; font-size: 11px; display: block; margin-bottom: 3px; }
.telegram-panel input { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); color: #fff; font-family: inherit; font-size: 13px; margin-bottom: 10px; }
.telegram-panel input:focus { outline: none; border-color: rgba(139,92,246,0.4); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { padding: 8px 18px; border-radius: 10px; border: none; font-weight: 700; font-size: 12px; cursor: pointer; font-family: inherit; transition: all 0.2s; }
.btn-primary { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(139,92,246,0.3); }
.btn-gold { background: linear-gradient(135deg, #ffd700, #f59e0b); color: #111; }
.btn-gold:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,215,0,0.3); }
.btn-green { background: linear-gradient(135deg, #4ade80, #22c55e); color: #111; }
.btn-green:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(74,222,128,0.3); }
.btn-red { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
.btn-red:hover { background: rgba(239,68,68,0.3); }
.status { font-size: 12px; color: #888; margin-top: 6px; padding: 6px 12px; border-radius: 8px; background: rgba(0,0,0,0.3); }
.status.online { color: #4ade80; border-left: 3px solid #4ade80; }
.status.offline { color: #f87171; border-left: 3px solid #f87171; }

/* ====== نافذة إضافة ملف للمربع ====== */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(8px); }
.modal-box { background: rgba(10,10,30,0.95); border: 1px solid rgba(255,215,0,0.15); border-radius: 16px; padding: 24px; max-width: 420px; width: 90%; }
.modal-box h3 { color: #ffd700; text-align: center; margin-bottom: 16px; }
.modal-box label { color: #888; font-size: 11px; display: block; margin-bottom: 3px; }
.modal-box input, .modal-box select { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); color: #fff; font-family: inherit; font-size: 13px; margin-bottom: 10px; }
.modal-actions { display: flex; gap: 10px; margin-top: 12px; }
.modal-actions button { flex: 1; padding: 10px; border-radius: 10px; border: none; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; }

/* ====== توست ====== */
#toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { background: rgba(8,8,20,0.95); color: #fff; padding: 8px 18px; border-radius: 12px; font-size: 12px; border: 1px solid rgba(255,255,255,0.08); animation: fadeIn 0.3s ease; font-weight: 600; max-width: 300px; text-align: center; }
.toast.success { border-color: #4ade80; color: #4ade80; }
.toast.error { border-color: #f87171; color: #f87171; }
.toast.info { border-color: #60a5fa; color: #60a5fa; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-bottom: 10px; }
.emoji-btn { padding: 6px; border-radius: 6px; border: 2px solid transparent; background: rgba(255,255,255,0.04); font-size: 22px; cursor: pointer; transition: all 0.2s; }
.emoji-btn:hover { background: rgba(255,215,0,0.1); }
.emoji-btn.active { border-color: #ffd700; background: rgba(255,215,0,0.15); }

/* ====== إشعارات المزامنة ====== */
#sync-log { font-size: 11px; color: #888; max-height: 80px; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 8px 12px; margin-top: 8px; border: 1px solid rgba(255,255,255,0.04); font-family: monospace; }
#sync-log .success { color: #4ade80; }
#sync-log .error { color: #f87171; }
#sync-log .info { color: #60a5fa; }
</style>
</head>
<body>

<h1>📦 أيقونات المربعات + قناة تيليجرام</h1>

<!-- ====== شبكة المربعات ====== -->
<div class="grid-container" id="tile-grid"></div>

<!-- ====== لوحة تيليجرام ====== -->
<div class="telegram-panel">
  <h3>📱 إعدادات قناة تيليجرام</h3>
  <label>🤖 توكن البوت (من @BotFather)</label>
  <input type="text" id="tg-token" placeholder="123456789:ABCdef..." value="">
  <label>💬 Chat ID (رقم أو @channel)</label>
  <input type="text" id="tg-chatid" placeholder="مثال: -100123456789 أو @mychannel" value="">
  <div class="btn-row">
    <button class="btn btn-primary" onclick="testTelegram()">🧪 اختبار</button>
    <button class="btn btn-gold" onclick="saveTelegram()">💾 حفظ</button>
    <button class="btn btn-green" onclick="syncChannel()">🔄 مزامنة القناة</button>
  </div>
  <div class="status offline" id="tg-status">❌ غير متصل</div>
  <div id="sync-log"></div>
</div>

<!-- ====== أزرار الإجراءات ====== -->
<div class="btn-row" style="gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:16px;">
  <button class="btn btn-gold" onclick="openAddTileModal()">➕ إضافة أيقونة للمربع</button>
  <button class="btn btn-primary" onclick="resetGrid()">🔄 إعادة تعيين الشبكة</button>
</div>

<!-- ====== نافذة إضافة أيقونة ====== -->
<div class="modal-overlay" id="add-tile-modal">
  <div class="modal-box">
    <h3>➕ إضافة أيقونة إلى مربع</h3>
    
    <label>😀 اختر الأيقونة</label>
    <div class="emoji-grid" id="emoji-grid">
      <button class="emoji-btn active" data-emoji="🌍">🌍</button>
      <button class="emoji-btn" data-emoji="🔥">🔥</button>
      <button class="emoji-btn" data-emoji="💧">💧</button>
      <button class="emoji-btn" data-emoji="⚔️">⚔️</button>
      <button class="emoji-btn" data-emoji="🏰">🏰</button>
      <button class="emoji-btn" data-emoji="🌲">🌲</button>
      <button class="emoji-btn" data-emoji="⭐">⭐</button>
      <button class="emoji-btn" data-emoji="🚀">🚀</button>
      <button class="emoji-btn" data-emoji="🌈">🌈</button>
      <button class="emoji-btn" data-emoji="🎮">🎮</button>
      <button class="emoji-btn" data-emoji="📦">📦</button>
      <button class="emoji-btn" data-emoji="🗺️">🗺️</button>
    </div>

    <label>📂 الملف (اختياري، سيرفع للقناة)</label>
    <input type="file" id="tile-file" accept="*/*" onchange="handleFileSelect(event)">

    <label>🏷️ عنوان المربع</label>
    <input type="text" id="tile-title" placeholder="أدخل عنواناً..." value="عالم جديد">

    <div style="display:flex;gap:8px;margin:10px 0;">
      <div style="flex:1;"><label>📍 الصف</label><input type="number" id="tile-row" min="0" max="7" value="0"></div>
      <div style="flex:1;"><label>📍 العمود</label><input type="number" id="tile-col" min="0" max="7" value="0"></div>
    </div>

    <div style="display:flex;gap:10px;margin-top:12px;">
      <button class="btn btn-gold" style="flex:2;" onclick="addTile()">✅ إضافة</button>
      <button class="btn btn-red" style="flex:1;" onclick="closeModal()">✖ إلغاء</button>
    </div>
  </div>
</div>

<!-- ====== توست ====== -->
<div id="toast-container"></div>

<script>
// ============================================================
//  📦 بيانات المربعات
// ============================================================
const GRID_ROWS = 8;
const GRID_COLS = 8;

// [صف][عمود] -> { emoji, title, fileId, filename, caption, type }
let tileData = [];

// ============================================================
//  📤 إدارة تيليجرام
// ============================================================
const Telegram = {
  token: '',
  chatId: '',

  init() {
    this.token = localStorage.getItem('tg_token') || '';
    this.chatId = localStorage.getItem('tg_chatid') || '';
    document.getElementById('tg-token').value = this.token;
    document.getElementById('tg-chatid').value = this.chatId;
    this.updateStatus();
    return this;
  },

  save(token, chatId) {
    this.token = token.trim();
    this.chatId = chatId.trim();
    localStorage.setItem('tg_token', this.token);
    localStorage.setItem('tg_chatid', this.chatId);
    this.updateStatus();
  },

  hasConfig() {
    return this.token.length > 10 && this.chatId.length > 0;
  },

  updateStatus() {
    const el = document.getElementById('tg-status');
    if (this.hasConfig()) {
      el.textContent = '✅ متصل بالقناة: ' + this.chatId;
      el.className = 'status online';
    } else {
      el.textContent = '❌ غير متصل (أدخل التوكن و Chat ID)';
      el.className = 'status offline';
    }
  },

  // اختبار الاتصال
  async test() {
    if (!this.token) { showToast('⚠️ أدخل توكن البوت أولاً', 'error'); return false; }
    try {
      const res = await fetch('https://api.telegram.org/bot' + this.token + '/getMe');
      const data = await res.json();
      if (!data.ok) { showToast('❌ ' + data.description, 'error'); return false; }
      showToast('✅ البوت شغّال: @' + data.result.username, 'success');
      return true;
    } catch(e) {
      showToast('❌ خطأ: ' + e.message, 'error');
      return false;
    }
  },

  // رفع ملف إلى القناة مع Caption
  async uploadFile(file, caption) {
    if (!this.hasConfig()) throw new Error('⚠️ إعدادات تيليجرام غير مكتملة');
    const form = new FormData();
    form.append('chat_id', this.chatId);
    form.append('document', file);
    if (caption) form.append('caption', caption);
    const res = await fetch('https://api.telegram.org/bot' + this.token + '/sendDocument', {
      method: 'POST',
      body: form
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.description || 'فشل الرفع');
    return {
      file_id: data.result.document.file_id,
      file_unique_id: data.result.document.file_unique_id,
      filename: data.result.document.file_name,
      mime_type: data.result.document.mime_type,
      file_size: data.result.document.file_size
    };
  },

  // جلب التحديثات من القناة
  async getUpdates(offset) {
    if (!this.hasConfig()) return [];
    const url = 'https://api.telegram.org/bot' + this.token + '/getUpdates?offset=' + (offset || 0) + '&limit=50';
    const res = await fetch(url);
    const data = await res.json();
    if (!data.ok) throw new Error(data.description || 'فشل جلب التحديثات');
    return data.result || [];
  },

  // الحصول على رابط الملف
  async getFileUrl(fileId) {
    const res = await fetch('https://api.telegram.org/bot' + this.token + '/getFile?file_id=' + encodeURIComponent(fileId));
    const data = await res.json();
    if (!data.ok) throw new Error(data.description || 'فشل جلب الملف');
    return 'https://api.telegram.org/file/bot' + this.token + '/' + data.result.file_path;
  }
};

// ============================================================
//  📋 تحليل Caption من تيليجرام
// ============================================================
function parseCaption(caption) {
  if (!caption) return null;
  const result = { file: null, emoji: null, row: null, col: null, title: null };
  const lines = caption.split('\n');
  lines.forEach(line => {
    line = line.trim();
    if (line.startsWith('#file:')) result.file = line.replace('#file:', '').trim();
    else if (line.startsWith('#emoji:')) result.emoji = line.replace('#emoji:', '').trim();
    else if (line.startsWith('#row:')) result.row = parseInt(line.replace('#row:', '').trim(), 10);
    else if (line.startsWith('#col:')) result.col = parseInt(line.replace('#col:', '').trim(), 10);
    else if (line.startsWith('#title:')) result.title = line.replace('#title:', '').trim();
  });
  return result;
}

// ============================================================
//  🖼️ عرض الشبكة
// ============================================================
function renderGrid() {
  const grid = document.getElementById('tile-grid');
  grid.innerHTML = '';
  for (let r = 0; r < GRID_ROWS; r++) {
    for (let c = 0; c < GRID_COLS; c++) {
      const div = document.createElement('div');
      div.className = 'tile';
      div.dataset.row = r;
      div.dataset.col = c;
      const data = tileData[r]?.[c];
      if (data) {
        div.textContent = data.emoji || '📌';
        div.classList.add('has-content');
        if (data.fileId) div.classList.add('has-telegram');
        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = (data.title || '').substring(0, 8);
        div.appendChild(label);
        if (data.fileId) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = '📤';
          div.appendChild(badge);
        }
        div.title = data.title + (data.filename ? ' (' + data.filename + ')' : '');
      } else {
        div.textContent = '⬜';
        div.style.opacity = '0.3';
      }
      div.onclick = () => { openTile(r, c); };
      grid.appendChild(div);
    }
  }
}

// ============================================================
//  📂 فتح محتوى المربع
// ============================================================
async function openTile(row, col) {
  const data = tileData[row]?.[col];
  if (!data) { showToast('📭 هذا المربع فارغ', 'info'); return; }

  if (data.fileId) {
    showToast('⏳ جاري تحميل الملف من تيليجرام...', 'info');
    try {
      const url = await Telegram.getFileUrl(data.fileId);
      const isImage = data.mimeType && data.mimeType.startsWith('image/');
      const isVideo = data.mimeType && data.mimeType.startsWith('video/');
      const isHTML = data.filename && data.filename.endsWith('.html');
      if (isHTML) {
        window.open(url, '_blank');
        showToast('🌐 تم فتح HTML في تبويب جديد', 'success');
      } else if (isImage) {
        showToast('🖼️ فتح الصورة', 'info');
        // عرض الصورة في نافذة جديدة
        const win = window.open('', '_blank');
        win.document.write('<img src="' + url + '" style="max-width:100%;max-height:100vh;display:block;margin:auto;">');
      } else if (isVideo) {
        const win = window.open('', '_blank');
        win.document.write('<video src="' + url + '" controls autoplay style="max-width:100%;max-height:100vh;display:block;margin:auto;background:#000;"></video>');
      } else {
        // عرض كملف: تحميل
        const a = document.createElement('a');
        a.href = url;
        a.download = data.filename || 'file';
        a.click();
        showToast('⬇️ جاري تحميل: ' + (data.filename || 'ملف'), 'success');
      }
    } catch(e) {
      showToast('❌ فشل التحميل: ' + e.message, 'error');
    }
  } else {
    showToast('📌 ' + (data.title || 'مربع') + ' - ' + (data.emoji || '📍'), 'info');
  }
}

// ============================================================
//  ➕ إضافة مربع (مع رفع إلى تيليجرام)
// ============================================================
let selectedEmoji = '🌍';
let pendingFile = null;

function setupEmojiGrid() {
  document.querySelectorAll('#emoji-grid .emoji-btn').forEach(btn => {
    btn.onclick = function() {
      document.querySelectorAll('#emoji-grid .emoji-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      selectedEmoji = this.dataset.emoji;
    };
  });
}
setupEmojiGrid();

function handleFileSelect(e) {
  const file = e.target.files[0];
  if (file) pendingFile = file;
}

function openAddTileModal() {
  document.getElementById('add-tile-modal').style.display = 'flex';
  pendingFile = null;
  document.getElementById('tile-file').value = '';
}

function closeModal() {
  document.getElementById('add-tile-modal').style.display = 'none';
}

async function addTile() {
  const row = parseInt(document.getElementById('tile-row').value, 10);
  const col = parseInt(document.getElementById('tile-col').value, 10);
  const title = document.getElementById('tile-title').value.trim() || 'مربع';
  const file = pendingFile;

  if (isNaN(row) || isNaN(col) || row < 0 || row >= GRID_ROWS || col < 0 || col >= GRID_COLS) {
    showToast('❌ إحداثيات غير صالحة (0-' + (GRID_ROWS-1) + ')', 'error');
    return;
  }

  // بناء Caption
  const captionLines = [
    '#file: ' + (file ? file.name : ''),
    '#emoji: ' + selectedEmoji,
    '#title: ' + title,
    '#row: ' + row,
    '#col: ' + col
  ];
  const caption = captionLines.join('\n');

  try {
    let result = null;
    if (file && Telegram.hasConfig()) {
      showToast('⏳ جاري الرفع إلى تيليجرام...', 'info');
      result = await Telegram.uploadFile(file, caption);
      showToast('✅ تم الرفع إلى القناة!', 'success');
    }

    // تخزين في الذاكرة
    if (!tileData[row]) tileData[row] = [];
    tileData[row][col] = {
      emoji: selectedEmoji,
      title: title,
      fileId: result ? result.file_id : null,
      fileUniqueId: result ? result.file_unique_id : null,
      filename: result ? result.filename : (file ? file.name : null),
      mimeType: result ? result.mime_type : (file ? file.type : null),
      fileSize: result ? result.file_size : (file ? file.size : null),
      caption: caption,
      uploadedAt: Date.now()
    };

    saveTileData();
    renderGrid();
    closeModal();
    showToast('✅ تم إضافة المربع (' + row + ',' + col + ')', 'success');
  } catch(e) {
    showToast('❌ فشل: ' + e.message, 'error');
  }
}

// ============================================================
//  🔄 مزامنة القناة
// ============================================================
async function syncChannel() {
  const log = document.getElementById('sync-log');
  log.innerHTML = '<span class="info">⏳ جاري المزامنة...</span>';

  try {
    const updates = await Telegram.getUpdates(0);
    let count = 0;
    const newItems = [];

    updates.forEach(upd => {
      const msg = upd.channel_post || upd.message;
      if (!msg || !msg.document) return;
      const parsed = parseCaption(msg.caption || '');
      if (!parsed || parsed.row === null || parsed.col === null) return;

      const row = parsed.row;
      const col = parsed.col;
      if (row < 0 || row >= GRID_ROWS || col < 0 || col >= GRID_COLS) return;

      const emoji = parsed.emoji || '📤';
      const title = parsed.title || msg.document.file_name || 'ملف';

      if (!tileData[row]) tileData[row] = [];
      // تجنب التكرار
      const exists = tileData[row][col] && tileData[row][col].fileUniqueId === msg.document.file_unique_id;
      if (!exists) {
        tileData[row][col] = {
          emoji: emoji,
          title: title,
          fileId: msg.document.file_id,
          fileUniqueId: msg.document.file_unique_id,
          filename: msg.document.file_name,
          mimeType: msg.document.mime_type,
          fileSize: msg.document.file_size,
          caption: msg.caption || '',
          uploadedAt: msg.date || Date.now(),
          synced: true
        };
        count++;
        newItems.push('(' + row + ',' + col + ') ' + title);
      }
    });

    if (count > 0) {
      saveTileData();
      renderGrid();
      log.innerHTML = '<span class="success">✅ تمت المزامنة! تم إضافة ' + count + ' ملفات جديدة: ' + newItems.join('; ')</span>';
      showToast('🔄 تمت المزامنة: +' + count + ' ملفات', 'success');
    } else {
      log.innerHTML = '<span class="info">ℹ️ لا توجد ملفات جديدة في القناة</span>';
      showToast('ℹ️ لا توجد ملفات جديدة', 'info');
    }
  } catch(e) {
    log.innerHTML = '<span class="error">❌ فشل المزامنة: ' + e.message + '</span>';
    showToast('❌ فشل المزامنة: ' + e.message, 'error');
  }
}

// ============================================================
//  💾 حفظ وتحميل البيانات
// ============================================================
function saveTileData() {
  localStorage.setItem('tileGridData', JSON.stringify(tileData));
}

function loadTileData() {
  try {
    const data = JSON.parse(localStorage.getItem('tileGridData'));
    if (data && Array.isArray(data)) {
      tileData = data;
    } else {
      tileData = [];
    }
  } catch(e) {
    tileData = [];
  }
  renderGrid();
}

function resetGrid() {
  if (confirm('⚠️ هل أنت متأكد من إعادة تعيين جميع المربعات؟')) {
    tileData = [];
    localStorage.removeItem('tileGridData');
    renderGrid();
    showToast('🔄 تم إعادة تعيين الشبكة', 'info');
  }
}

// ============================================================
//  📱 دوال تيليجرام
// ============================================================
async function testTelegram() {
  const token = document.getElementById('tg-token').value.trim();
  const chatId = document.getElementById('tg-chatid').value.trim();
  if (!token) { showToast('⚠️ أدخل توكن البوت', 'error'); return; }
  Telegram.token = token;
  Telegram.chatId = chatId;
  const ok = await Telegram.test();
  if (ok && chatId) {
    Telegram.save(token, chatId);
    Telegram.updateStatus();
  }
}

function saveTelegram() {
  const token = document.getElementById('tg-token').value.trim();
  const chatId = document.getElementById('tg-chatid').value.trim();
  if (!token || !chatId) { showToast('⚠️ أدخل التوكن و Chat ID', 'error'); return; }
  Telegram.save(token, chatId);
  showToast('✅ تم حفظ إعدادات تيليجرام', 'success');
}

// ============================================================
//  🍞 Toast
// ============================================================
function showToast(msg, type) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast ' + (type || 'info');
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(-10px)';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// ============================================================
//  🚀 التشغيل
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
  Telegram.init();
  loadTileData();
  renderGrid();

  // إظهار تعليمات
  showToast('📦 انقر على أي مربع لفتح محتواه', 'info');
});

<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧩 فيديو واحد مقسم إلى مربعات</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Cairo',sans-serif; background:#050510; color:#fff; overflow:hidden; }

#start-screen {
  position:fixed; inset:0; z-index:2000;
  background:linear-gradient(135deg,#0a0a2a,#000);
  display:flex; flex-direction:column; justify-content:center; align-items:center; gap:20px;
}
.start-logo { font-size:42px; font-weight:900; color:#ffd700; animation:float 3s ease-in-out infinite; }
.start-subtitle { font-size:15px; color:#666; text-align:center; max-width:380px; line-height:1.6; }
.start-btn {
  border:2px solid #00f2ff; color:#00f2ff; padding:16px 50px;
  background:rgba(0,242,255,0.08); border-radius:60px; font-size:20px;
  cursor:pointer; transition:all .3s; font-weight:700; font-family:inherit;
}
.start-btn:hover { transform:scale(1.05); background:#00f2ff; color:#000; box-shadow:0 0 50px rgba(0,242,255,0.4); }
.version-tag { position:absolute; bottom:15px; font-size:11px; color:#444; }
@keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }

#game-container { position:fixed; inset:0; display:none; background:#0a0a1a; }
#game-canvas { display:block; width:100%; height:100%; }

.hud {
  position:fixed; top:0; left:0; right:0; padding:6px 12px;
  display:flex; justify-content:space-between; align-items:center;
  pointer-events:none; z-index:100;
  background:rgba(0,0,0,0.6); backdrop-filter:blur(8px);
}
.hud .title { color:#ffd700; font-size:13px; font-weight:700; }
.hud .info { color:#aaa; font-size:11px; }

.dpad {
  position:fixed; bottom:20px; left:16px;
  width:120px; height:120px; z-index:200;
}
.dpad-btn {
  position:absolute; width:40px; height:40px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; color:rgba(255,255,255,0.4);
  cursor:pointer; transition:all .1s;
}
.dpad-btn:active { background:rgba(139,92,246,0.2); border-color:#8b5cf6; color:#8b5cf6; transform:scale(0.88); }
.dpad-up { top:0; left:40px; }
.dpad-down { bottom:0; left:40px; }
.dpad-left { top:40px; left:0; }
.dpad-right { top:40px; right:0; }

#controls {
  position:fixed; bottom:160px; left:50%; transform:translateX(-50%);
  display:flex; gap:8px; z-index:210; flex-wrap:wrap; justify-content:center;
}
#controls button {
  background:rgba(139,92,246,0.15); color:#fff; border:1px solid rgba(139,92,246,0.2);
  padding:6px 14px; border-radius:15px; cursor:pointer; font-size:11px; font-family:inherit;
  transition:all 0.3s;
}
#controls button:hover { background:rgba(139,92,246,0.3); border-color:#8b5cf6; }

#minimap-frame {
  position:fixed; top:50px; left:10px;
  width:120px; height:120px;
  border:2px solid #ffd700; border-radius:12px;
  overflow:hidden; pointer-events:none; z-index:90;
  background:rgba(5,5,16,0.6);
  display:none;
}
#minimap-label {
  position:fixed; top:52px; left:12px; z-index:91;
  font-size:8px; color:#ffd700; background:rgba(0,0,0,0.6);
  padding:1px 6px; border-radius:4px; pointer-events:none; display:none;
}

.toast-container {
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
  z-index:700; display:flex; flex-direction:column; gap:5px; pointer-events:none;
  align-items:center;
}
.toast {
  background:rgba(0,0,0,0.9); padding:6px 16px; border-radius:30px;
  font-size:11px; border:1px solid rgba(255,255,255,0.06);
  animation:toastIn .3s,toastOut .3s 2.7s forwards;
}
.toast.success { border-color:#4ade80; color:#4ade80; }
.toast.error { border-color:#f87171; color:#f87171; }
.toast.info { border-color:#60a5fa; color:#60a5fa; }
@keyframes toastIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
@keyframes toastOut { from { opacity:1; transform:translateY(0); } to { opacity:0; transform:translateY(-20px); } }

#local-video-input { display:none; }
#status-bar {
  position:fixed; bottom:140px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.7); padding:4px 16px;
  border-radius:12px; font-size:10px; color:#4ade80;
  z-index:95; border:1px solid rgba(74,222,128,0.2);
  display:none; text-align:center;
}
</style>
</head>
<body>

<!-- شاشة البداية -->
<div id="start-screen">
  <div class="start-logo">🧩 فيديو مقسم</div>
  <div class="start-subtitle">فيديو واحد · مقسم إلى مربعات · كل مربع يظهر جزءاً مختلفاً</div>
  <button class="start-btn" onclick="enterApp()">🚀 دخول</button>
  <div class="version-tag">v52.0 | One Video Split</div>
</div>

<!-- اللعبة -->
<div id="game-container">
  <canvas id="game-canvas"></canvas>

  <div id="minimap-frame"></div>
  <div id="minimap-label">🗺️</div>

  <div id="status-bar">🌍 جاري تحميل الفيديو...</div>

  <div class="hud">
    <div class="title">🧩 فيديو مقسم</div>
    <div class="info" id="char-name">لا يوجد فيديو</div>
  </div>

  <div id="controls">
    <button onclick="loadTestVideo()">🧪 فيديو تجريبي</button>
    <button onclick="document.getElementById('local-video-input').click()">📁 رفع فيديو</button>
    <button onclick="toggleGrid()">📐 شبكة</button>
    <button onclick="resetCamera()">🔄 إعادة</button>
  </div>

  <div class="dpad" id="dpad">
    <div class="dpad-btn dpad-up" data-dir="up">▲</div>
    <div class="dpad-btn dpad-down" data-dir="down">▼</div>
    <div class="dpad-btn dpad-left" data-dir="left">◀</div>
    <div class="dpad-btn dpad-right" data-dir="right">▶</div>
  </div>

  <input type="file" id="local-video-input" accept="video/*,.webm,.mp4,.mov" onchange="handleLocalVideo(event)">
</div>

<div class="toast-container" id="toast-container"></div>

<script>
// ============================================================
//  🧩 فيديو واحد مقسم إلى مربعات
// ============================================================

// ============================================================
//  1. Three.js
// ============================================================

let scene, camera, renderer;
let playerGroup, tileGroup;
let tileMeshes = [];
let tileTextures = [];
let videoElement = null, mainVideoTexture = null;
let gridVisible = true;
let isReady = false;

const GRID = 4; // 4x4 = 16 مربع
const TILE_SIZE = 4;
const WORLD_SIZE = GRID * TILE_SIZE;
const HALF = WORLD_SIZE / 2;
const PLAYER_SPEED = 0.08;
let touchDirs = { up: false, down: false, left: false, right: false };

function initThree() {
  const canvas = document.getElementById('game-canvas');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a1a);

  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 6, 10);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  // إضاءة
  const ambient = new THREE.AmbientLight(0x8b5cf6, 0.5);
  scene.add(ambient);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(10, 20, 10);
  dirLight.castShadow = true;
  scene.add(dirLight);

  // لاعب
  playerGroup = new THREE.Group();
  scene.add(playerGroup);

  const bodyGeo = new THREE.SphereGeometry(0.35, 16, 16);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0x8b5cf6, emissive: 0x6d28d9, emissiveIntensity: 0.3
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.35;
  body.castShadow = true;
  playerGroup.add(body);

  const crownGeo = new THREE.ConeGeometry(0.2, 0.2, 6);
  const crownMat = new THREE.MeshStandardMaterial({
    color: 0xffd700, emissive: 0xffa500, emissiveIntensity: 0.2, metalness: 0.9
  });
  const crown = new THREE.Mesh(crownGeo, crownMat);
  crown.position.y = 0.7;
  playerGroup.add(crown);

  playerGroup.position.set(0, 0, 0);

  // مجموعة المربعات
  tileGroup = new THREE.Group();
  scene.add(tileGroup);

  setupMinimap();
  animate();
}

// ============================================================
//  2. تقسيم الفيديو إلى مربعات
// ============================================================

function splitVideoIntoTiles(videoTexture) {
  // تنظيف المربعات القديمة
  tileMeshes.forEach(mesh => {
    if (mesh.parent) mesh.parent.remove(mesh);
    if (mesh.material) {
      if (mesh.material.map) mesh.material.map.dispose();
      mesh.material.dispose();
    }
    if (mesh.geometry) mesh.geometry.dispose();
  });
  tileMeshes = [];
  tileTextures = [];

  // كل مربع يأخذ جزءاً من الفيديو
  const tileWidth = 1 / GRID;
  const tileHeight = 1 / GRID;

  for (let row = 0; row < GRID; row++) {
    for (let col = 0; col < GRID; col++) {
      // حساب إحداثيات الجزء من الفيديو
      const u = col / GRID;
      const v = row / GRID;

      // إنشاء Texture للجزء
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // رسم جزء من الفيديو على Canvas
      // (في الواقع نستخدم VideoTexture مع UV offset)

      // إنشاء المربع
      const geometry = new THREE.PlaneGeometry(TILE_SIZE * 0.95, TILE_SIZE * 0.95);
      
      // 🔥 نستخدم VideoTexture مع إزاحة UV
      const texture = videoTexture.clone();
      texture.repeat.set(tileWidth, tileHeight);
      texture.offset.set(u, v);

      const material = new THREE.MeshStandardMaterial({
        map: texture,
        side: THREE.DoubleSide,
        transparent: true,
        roughness: 0.3,
        metalness: 0.1
      });

      const mesh = new THREE.Mesh(geometry, material);
      
      // موقع المربع في الخريطة
      const posX = col * TILE_SIZE - HALF + TILE_SIZE / 2;
      const posZ = row * TILE_SIZE - HALF + TILE_SIZE / 2;
      mesh.position.set(posX, 0, posZ);
      mesh.rotation.x = -Math.PI / 2;
      mesh.receiveShadow = true;
      
      mesh.userData = { row, col, index: row * GRID + col };
      tileGroup.add(mesh);
      tileMeshes.push(mesh);
      tileTextures.push(texture);
    }
  }

  // إضافة شبكة إرشادية
  addGrid();

  isReady = true;
  document.getElementById('status-bar').style.display = 'none';
  document.getElementById('char-name').textContent = '✅ فيديو مقسم إلى ' + (GRID * GRID) + ' مربع';
  showToast('✅ الفيديو مقسم إلى ' + (GRID * GRID) + ' مربع!', 'success');
}

// ============================================================
//  3. تحميل الفيديو وتقسيمه
// ============================================================

function loadAndSplitVideo(src, name) {
  showToast('📥 جاري تحميل الفيديو...', 'info');
  document.getElementById('status-bar').style.display = 'block';
  document.getElementById('status-bar').textContent = '📥 تحميل الفيديو...';

  if (videoElement) {
    try { videoElement.pause(); } catch(e) {}
    videoElement = null;
  }

  videoElement = document.createElement('video');
  videoElement.muted = true;
  videoElement.loop = true;
  videoElement.playsInline = true;
  videoElement.preload = 'auto';
  videoElement.crossOrigin = 'anonymous';
  videoElement.src = src;

  videoElement.onloadeddata = function() {
    videoElement.play().catch(() => {});
    mainVideoTexture = new THREE.VideoTexture(videoElement);
    mainVideoTexture.minFilter = THREE.LinearFilter;
    mainVideoTexture.magFilter = THREE.LinearFilter;
    mainVideoTexture.format = THREE.RGBAFormat;

    splitVideoIntoTiles(mainVideoTexture);
    document.getElementById('char-name').textContent = '🎬 ' + (name || 'فيديو مقسم');
  };

  videoElement.onerror = function() {
    showToast('❌ فشل تحميل الفيديو', 'error');
    document.getElementById('status-bar').style.display = 'none';
  };

  videoElement.load();
}

// ============================================================
//  4. فيديو تجريبي (مرسوم)
// ============================================================

function loadTestVideo() {
  showToast('🎨 إنشاء فيديو تجريبي...', 'info');
  document.getElementById('status-bar').style.display = 'block';
  document.getElementById('status-bar').textContent = '🎨 إنشاء فيديو تجريبي...';

  const canvas = document.createElement('canvas');
  canvas.width = 1024;
  canvas.height = 1024;
  const ctx = canvas.getContext('2d');

  let frame = 0;

  function draw() {
    frame++;
    ctx.clearRect(0, 0, 1024, 1024);

    // خلفية متحركة
    const grad = ctx.createRadialGradient(512, 512, 0, 512, 512, 512);
    grad.addColorStop(0, `hsl(${frame * 0.3 % 360}, 80%, 60%)`);
    grad.addColorStop(0.5, `hsl(${(frame * 0.3 + 120) % 360}, 70%, 40%)`);
    grad.addColorStop(1, `hsl(${(frame * 0.3 + 240) % 360}, 80%, 20%)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1024, 1024);

    // شبكة متحركة
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 2;
    const off = (frame * 0.2) % 80;
    for (let i = 0; i < 1024; i += 80) {
      ctx.beginPath(); ctx.moveTo(i + off, 0); ctx.lineTo(i + off, 1024); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i + off); ctx.lineTo(1024, i + off); ctx.stroke();
    }

    // دوائر متحركة
    for (let i = 0; i < 25; i++) {
      const x = 512 + Math.sin(i * 1.7 + frame * 0.015) * 350;
      const y = 512 + Math.cos(i * 2.3 + frame * 0.012) * 350;
      const r = 15 + Math.sin(frame * 0.03 + i) * 8;
      ctx.fillStyle = `hsla(${(i * 20 + frame * 0.5) % 360}, 100%, 70%, 0.15)`;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    // مربعات متحركة (ستظهر بشكل مختلف في كل مربع)
    for (let i = 0; i < 16; i++) {
      const cx = (i % 4) * 256 + 128;
      const cy = Math.floor(i / 4) * 256 + 128;
      const size = 60 + Math.sin(frame * 0.02 + i * 0.5) * 30;
      ctx.fillStyle = `hsla(${i * 22 + frame * 0.3}, 90%, 60%, 0.15)`;
      ctx.fillRect(cx - size/2, cy - size/2, size, size);
    }

    // نص إرشادي
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.font = '30px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('🧩 فيديو مقسم إلى 16 مربع', 512, 50);

    requestAnimationFrame(draw);
  }
  draw();

  const stream = canvas.captureStream(30);
  const video = document.createElement('video');
  video.muted = true;
  video.loop = true;
  video.playsInline = true;
  video.srcObject = stream;

  video.onloadeddata = function() {
    video.play().catch(() => {});
    const url = URL.createObjectURL(stream);
    loadAndSplitVideo(url, 'فيديو تجريبي');
  };
  video.load();
}

// ============================================================
//  5. رفع فيديو محلي
// ============================================================

function handleLocalVideo(event) {
  const file = event.target.files[0];
  if (!file || !file.type.startsWith('video/')) {
    showToast('❌ ملف غير صالح', 'error');
    return;
  }
  const blobUrl = URL.createObjectURL(file);
  loadAndSplitVideo(blobUrl, file.name.replace(/\.[^/.]+$/, '') || 'فيديو محلي');
  event.target.value = '';
}

// ============================================================
//  6. شبكة إرشادية
// ============================================================

let gridHelper = null;

function addGrid() {
  if (gridHelper) {
    tileGroup.remove(gridHelper);
    gridHelper = null;
  }

  const size = WORLD_SIZE;
  const divisions = GRID;
  gridHelper = new THREE.GridHelper(size, divisions, 0x8b5cf6, 0x2a2a4a);
  gridHelper.position.y = 0.05;
  gridHelper.material.transparent = true;
  gridHelper.material.opacity = gridVisible ? 0.3 : 0;
  tileGroup.add(gridHelper);
}

function toggleGrid() {
  gridVisible = !gridVisible;
  if (gridHelper) {
    gridHelper.material.opacity = gridVisible ? 0.3 : 0;
  }
  showToast(gridVisible ? '📐 شبكة ظاهرة' : '📐 شبكة مخفية', 'info');
}

// ============================================================
//  7. تحديث اللاعب
// ============================================================

function updatePlayer() {
  let dx = 0, dz = 0;
  if (touchDirs.up) dz = -PLAYER_SPEED;
  if (touchDirs.down) dz = PLAYER_SPEED;
  if (touchDirs.left) dx = -PLAYER_SPEED;
  if (touchDirs.right) dx = PLAYER_SPEED;

  const newX = playerGroup.position.x + dx;
  const newZ = playerGroup.position.z + dz;
  const limit = HALF - TILE_SIZE/2;

  playerGroup.position.x = Math.max(-limit, Math.min(limit, newX));
  playerGroup.position.z = Math.max(-limit, Math.min(limit, newZ));

  // تدوير
  if (dx !== 0 || dz !== 0) {
    playerGroup.rotation.y = Math.atan2(dx, dz);
  }

  // تحديث سرعة الفيديو
  const speed = Math.sqrt(dx*dx + dz*dz);
  if (videoElement && isReady) {
    const videoSpeed = 0.3 + speed * 2;
    videoElement.playbackRate = Math.min(videoSpeed, 3);
  }

  // معرفة المربع الحالي
  updateActiveTile();
}

function updateActiveTile() {
  const px = playerGroup.position.x + HALF;
  const pz = playerGroup.position.z + HALF;
  const col = Math.floor(px / TILE_SIZE);
  const row = Math.floor(pz / TILE_SIZE);

  if (col >= 0 && col < GRID && row >= 0 && row < GRID) {
    const index = row * GRID + col;
    // تمييز المربع النشط
    tileMeshes.forEach((mesh, i) => {
      if (i === index) {
        mesh.material.emissive = new THREE.Color(0x8b5cf6);
        mesh.material.emissiveIntensity = 0.15;
      } else {
        mesh.material.emissive = new THREE.Color(0x000000);
        mesh.material.emissiveIntensity = 0;
      }
    });
  }
}

// ============================================================
//  8. خريطة مصغرة
// ============================================================

let minimapCtx;

function setupMinimap() {
  const minimapFrame = document.getElementById('minimap-frame');
  const canvas = document.createElement('canvas');
  canvas.width = 120; canvas.height = 120;
  minimapFrame.appendChild(canvas);
  minimapCtx = canvas.getContext('2d');
}

function updateMinimap() {
  if (!minimapCtx) return;
  const ctx = minimapCtx;
  const w = 120, h = 120;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(10,10,26,0.9)';
  ctx.fillRect(0, 0, w, h);

  const scale = w / WORLD_SIZE;

  // رسم المربعات
  for (let row = 0; row < GRID; row++) {
    for (let col = 0; col < GRID; col++) {
      const x = col * TILE_SIZE * scale;
      const y = row * TILE_SIZE * scale;
      const size = TILE_SIZE * scale * 0.9;
      ctx.fillStyle = ((row + col) % 2 === 0) ? '#2a2a4a' : '#1a1a2e';
      ctx.fillRect(x, y, size, size);
    }
  }

  // اللاعب
  const px = (playerGroup.position.x + HALF) * scale;
  const py = (playerGroup.position.z + HALF) * scale;

  ctx.fillStyle = '#8b5cf6';
  ctx.shadowColor = '#8b5cf6';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.arc(px, py, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(0, 0, w, h);
}

// ============================================================
//  9. كاميرا
// ============================================================

function updateCamera() {
  const target = playerGroup.position.clone();
  camera.position.x += (target.x - camera.position.x) * 0.05;
  camera.position.z += (target.z + 8 - camera.position.z) * 0.05;
  camera.position.y += (6 - camera.position.y) * 0.05;
  camera.lookAt(target.x, 0, target.z);
}

function resetCamera() {
  camera.position.set(0, 6, 10);
  camera.lookAt(0, 0, 0);
  playerGroup.position.set(0, 0, 0);
}

// ============================================================
//  10. حلقة الرسم
// ============================================================

function animate() {
  requestAnimationFrame(animate);

  updatePlayer();
  updateCamera();
  updateMinimap();

  if (mainVideoTexture && isReady) {
    mainVideoTexture.needsUpdate = true;
  }

  // تحديث نسيج المربعات
  tileTextures.forEach(t => { if (t) t.needsUpdate = true; });

  renderer.render(scene, camera);
}

// ============================================================
//  11. تحكم
// ============================================================

function setupTouchControls() {
  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const dir = btn.getAttribute('data-dir');
    btn.addEventListener('touchstart', e => {
      e.preventDefault();
      touchDirs[dir] = true;
      btn.style.background = 'rgba(139,92,246,0.2)';
      btn.style.borderColor = '#8b5cf6';
    }, { passive: false });
    btn.addEventListener('touchend', e => {
      e.preventDefault();
      touchDirs[dir] = false;
      btn.style.background = '';
      btn.style.borderColor = '';
    }, { passive: false });
    btn.addEventListener('touchcancel', () => {
      touchDirs[dir] = false;
      btn.style.background = '';
      btn.style.borderColor = '';
    });
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') touchDirs.up = true;
  if (e.key === 'ArrowDown') touchDirs.down = true;
  if (e.key === 'ArrowLeft') touchDirs.left = true;
  if (e.key === 'ArrowRight') touchDirs.right = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowUp') touchDirs.up = false;
  if (e.key === 'ArrowDown') touchDirs.down = false;
  if (e.key === 'ArrowLeft') touchDirs.left = false;
  if (e.key === 'ArrowRight') touchDirs.right = false;
});

function showToast(message, type) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast ' + (type || '');
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

// ============================================================
//  12. الدخول
// ============================================================

function enterApp() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game-container').style.display = 'block';
  document.getElementById('minimap-frame').style.display = 'block';
  document.getElementById('minimap-label').style.display = 'block';
  document.getElementById('status-bar').style.display = 'block';

  initThree();

  window.addEventListener('resize', () => {
    if (camera) {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  });

  // تحميل فيديو تجريبي تلقائياً
  setTimeout(loadTestVideo, 500);
}

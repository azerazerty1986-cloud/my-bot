<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>سوبر - النظام المتكامل 2026</title>
    
    <!-- Bootstrap 5 RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <!-- الخطوط العربية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Chart.js للرسوم البيانية -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- QuaggaJS للباركود -->
    <script src="https://cdn.jsdelivr.net/npm/quagga/dist/quagga.min.js"></script>
    
    <!-- SheetJS لقراءة Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    
    <!-- مكتبة الباركود -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    
    <!-- ملف CSS المخصص -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* أنماط إضافية مؤقتة لحين تحميل style.css */
        body {
            font-family: 'Cairo', 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecf2 100%);
            min-height: 100vh;
            padding-bottom: 90px;
            direction: rtl;
            margin: 0;
            color: #1e293b;
        }
        
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #4361ee 0%, #7209b7 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: white;
            font-size: 24px;
            transition: opacity 0.5s;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- شاشة التحميل المؤقتة -->
    <div id="loading-screen" class="loading-screen">
        <div class="text-center">
            <div class="loading-spinner"></div>
            <h2>سوبر - النظام المتكامل 2026</h2>
            <p class="mt-3">جاري تحميل التطبيق...</p>
            <small class="opacity-75">الإصدار 2.0.0</small>
        </div>
    </div>

    <!-- حاوية التطبيق الرئيسية -->
    <div id="app"></div>

    <!-- مخفي لاختيار ملف الاستيراد -->
    <input type="file" id="backup-file-input" accept=".json" style="display: none;">

    <!-- ===== تحميل JavaScript Modules بالترتيب الصحيح ===== -->
    
    <!-- 1️⃣ المكتبات الخارجية -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 2️⃣ الدوال المساعدة أولاً (الأساس) -->
    <script src="js/modules/utils.js"></script>
    
    <!-- 3️⃣ ملفات البيانات الأساسية -->
    <script src="js/modules/product.js"></script>
    <script src="js/modules/inventory.js"></script>
    <script src="js/modules/customer.js"></script>
    <script src="js/modules/supplier.js"></script>
    
    <!-- 4️⃣ ملفات العمليات -->
    <script src="js/modules/sales.js"></script>
    <script src="js/modules/purchases.js"></script>
    
    <!-- 5️⃣ ملفات الفواتير والتقارير -->
    <script src="js/modules/invoices.js"></script>
    <script src="js/modules/reports.js"></script>
    <script src="js/modules/debt.js"></script>
    
    <!-- 6️⃣ ملفات إضافية -->
    <script src="js/modules/backup.js"></script>
    <script src="js/modules/ai.js"></script>
    
    <!-- 7️⃣ الملف الرئيسي (آخراً) -->
    <script src="js/app.js"></script>

    <!-- ===== تحميل أقسام HTML ===== -->
    <script>
        // ترتيب تحميل الأقسام (18 ملف HTML في includes/)
        const sections = [
            'login.html',               // الرقم 2
            'header.html',              // الرقم 3
            'sales-section.html',        // الرقم 4
            'purchases-section.html',    // الرقم 5
            'add-section.html',          // الرقم 6
            'inventory-section.html',    // الرقم 7
            'reports-section.html',      // الرقم 8
            'product-section.html',      // الرقم 9
            'customer-section.html',     // الرقم 10
            'supplier-section.html',     // الرقم 11
            'invoices.html',             // الرقم 12
            'debt-section.html',         // الرقم 13
            'ai-section.html',            // الرقم 14
            'modals.html',               // الرقم 15
            'print-areas.html',           // الرقم 16
            'footer.html'                 // الرقم 17
        ];

        // دالة تحميل الأقسام
        async function loadSections() {
            const app = document.getElementById('app');
            let loadedCount = 0;
            let failedSections = [];
            
            for (const section of sections) {
                try {
                    const response = await fetch(`includes/${section}`);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const html = await response.text();
                    app.innerHTML += html;
                    loadedCount++;
                    console.log(`✅ تم تحميل ${section} (${loadedCount}/${sections.length})`);
                } catch (error) {
                    console.error(`❌ فشل تحميل ${section}:`, error);
                    failedSections.push(section);
                    
                    // إنشاء أقسام افتراضية للفواتير والديون والذكاء الاصطناعي إذا فشل التحميل
                    if (section === 'invoices.html') {
                        app.innerHTML += `
                            <div id="invoices" class="section">
                                <div class="main-card">
                                    <h3 class="text-center">قسم الفواتير</h3>
                                    <p class="text-center text-muted">جاري تجهيز القسم...</p>
                                </div>
                            </div>
                        `;
                    }
                    if (section === 'debt-section.html') {
                        app.innerHTML += `
                            <div id="debt" class="section">
                                <div class="main-card">
                                    <h3 class="text-center">قسم الديون</h3>
                                    <p class="text-center text-muted">جاري تجهيز القسم...</p>
                                </div>
                            </div>
                        `;
                    }
                    if (section === 'ai-section.html') {
                        app.innerHTML += `
                            <div id="ai" class="section">
                                <div class="main-card">
                                    <h3 class="text-center">قسم الذكاء الاصطناعي</h3>
                                    <p class="text-center text-muted">جاري تجهيز القسم...</p>
                                </div>
                            </div>
                        `;
                    }
                }
            }
            
            // إخفاء شاشة التحميل مع تأثير
            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
                loadingScreen.style.display = 'none';
            }, 500);
            
            // إعلام أن HTML جاهز
            document.dispatchEvent(new Event('html-loaded'));
            
            if (failedSections.length > 0) {
                console.warn('⚠️ بعض الأقسام فشل تحميلها:', failedSections);
            } else {
                console.log('✅ جميع أقسام HTML محملة بنجاح');
            }
        }

        // بدأ التحميل بعد تحميل الصفحة
        document.addEventListener('DOMContentLoaded', loadSections);
    </script>

    <!-- ===== دوال التنقل الأساسية (موحدة) ===== -->
    <script>
        // ================== دوال التنقل ==================
        
        // التبديل بين الأقسام الرئيسية
        function switchSection(sectionId, element) {
            console.log('🔄 التبديل إلى:', sectionId);
            
            // إخفاء جميع الأقسام
            document.querySelectorAll('.section').forEach(s => {
                s.classList.remove('active-section');
            });
            
            // إظهار القسم المطلوب
            const section = document.getElementById(sectionId);
            if (section) {
                section.classList.add('active-section');
                console.log('✅ تم العثور على القسم:', sectionId);
                
                // تحديث الشريط السفلي
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                if (element) element.classList.add('active');
                
                // تحديث بيانات القسم عند عرضه
                refreshSectionData(sectionId);
            } else {
                console.error('❌ القسم غير موجود:', sectionId);
                if (typeof Swal !== 'undefined') {
                    Swal.fire({
                        icon: 'error',
                        title: 'خطأ',
                        text: `القسم "${sectionId}" غير موجود`
                    });
                }
            }
        }

        // تحديث بيانات القسم
        function refreshSectionData(sectionId) {
            switch(sectionId) {
                case 'sales':
                    if (window.salesModule) {
                        if (salesModule.loadCustomers) salesModule.loadCustomers();
                        if (salesModule.renderInvoices) salesModule.renderInvoices();
                        if (salesModule.renderCart) salesModule.renderCart();
                    }
                    break;
                case 'purchases':
                    if (window.purchasesModule) {
                        if (purchasesModule.loadSuppliers) purchasesModule.loadSuppliers();
                        if (purchasesModule.renderInvoices) purchasesModule.renderInvoices();
                        if (purchasesModule.renderCart) purchasesModule.renderCart();
                    }
                    break;
                case 'inventory':
                    if (window.productModule) productModule.renderProducts();
                    if (window.inventoryModule) inventoryModule.renderInventory?.();
                    break;
                case 'reports':
                    if (window.reportsModule) reportsModule.updateDashboard?.();
                    break;
                case 'invoices':
                    if (window.invoicesModule) invoicesModule.refresh?.();
                    break;
                case 'debt':
                    if (window.debtModule) {
                        if (debtModule.renderAllDebts) debtModule.renderAllDebts();
                        if (debtModule.renderCustomerDebts) debtModule.renderCustomerDebts();
                        if (debtModule.renderSupplierDebts) debtModule.renderSupplierDebts();
                        if (debtModule.renderPayments) debtModule.renderPayments();
                        if (debtModule.updateStats) debtModule.updateStats();
                    }
                    break;
                case 'ai':
                    if (window.aiModule && document.getElementById('ai-overview')?.style.display !== 'none') {
                        if (typeof loadAIOverview === 'function') loadAIOverview();
                    }
                    break;
                case 'products':
                    if (window.productModule) productModule.renderProducts();
                    break;
                case 'customers':
                    if (window.customerModule) customerModule.renderCustomers();
                    break;
                case 'suppliers':
                    if (window.supplierModule) supplierModule.renderSuppliers();
                    break;
            }
        }

        // التبديل بين الأقسام الفرعية
        function showSubSection(subId) {
            const parent = document.querySelector('.active-section');
            if (!parent) return;
            
            parent.querySelectorAll('.sub-section').forEach(s => s.style.display = 'none');
            const target = document.getElementById(subId);
            if (target) target.style.display = 'block';
            
            // تحديث التبويبات
            const tabs = parent.querySelectorAll('.tab-item');
            tabs.forEach(t => t.classList.remove('active-red', 'active-green', 'active-nardo'));
            
            tabs.forEach(t => {
                if (t.getAttribute('onclick') && t.getAttribute('onclick').includes(subId)) {
                    if (parent.id === 'sales') t.classList.add('active-red');
                    else if (parent.id === 'purchases') t.classList.add('active-green');
                    else if (parent.id === 'add' || parent.id === 'invoices' || parent.id === 'debt' || parent.id === 'ai') {
                        t.classList.add('active-nardo');
                    }
                }
            });
        }

        // ================== دوال القائمة الجانبية ==================
        function toggleSidebar() {
            document.getElementById('sidebar')?.classList.toggle('show');
        }

        function openUserMenu() {
            Swal.fire({
                title: 'حساب المستخدم',
                html: `
                    <div style="text-align:right">
                        <p><strong>المستخدم:</strong> مدير النظام</p>
                        <p><strong>الصلاحية:</strong> كاملة</p>
                        <p><strong>الإصدار:</strong> 2.0.0</p>
                        <p><strong>آخر دخول:</strong> ${new Date().toLocaleDateString('ar-EG')}</p>
                    </div>
                `,
                confirmButtonText: 'تسجيل الخروج',
                showCancelButton: true,
                cancelButtonText: 'إلغاء'
            }).then((result) => {
                if (result.isConfirmed) {
                    logout();
                }
            });
        }

        function openSettings() {
            Swal.fire({
                title: 'الإعدادات',
                text: 'قريباً...',
                icon: 'info'
            });
        }

        function logout() {
            localStorage.removeItem('isLoggedIn');
            location.reload();
        }

        // ================== دوال تسجيل الدخول ==================
        function checkPassword() {
            const password = document.getElementById('password-input')?.value;
            const error = document.getElementById('error-message');
            
            if (password === '123456') {
                if (error) error.style.display = 'none';
                document.getElementById('login-screen').style.display = 'none';
                localStorage.setItem('isLoggedIn', 'true');
                
                Swal.fire({
                    icon: 'success',
                    title: 'مرحباً بك',
                    text: 'تم تسجيل الدخول بنجاح',
                    timer: 1500,
                    showConfirmButton: false
                });
            } else {
                if (error) error.style.display = 'flex';
            }
        }

        function togglePasswordVisibility() {
            const input = document.getElementById('password-input');
            const icon = document.querySelector('.toggle-password');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }

        function showResetPassword() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('reset-password-screen').style.display = 'flex';
        }

        function backToLogin() {
            document.getElementById('reset-password-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
        }

        function useDefaultPassword() {
            document.getElementById('password-input').value = '123456';
            backToLogin();
            Swal.fire({
                icon: 'info',
                title: 'تم',
                text: 'تم تعيين كلمة السر إلى 123456',
                timer: 2000,
                showConfirmButton: false
            });
        }

        // ================== دوال الباركود ==================
        function openBarcodeScanner(inputId) {
            const modal = document.getElementById('barcodeScannerModal');
            if (modal) {
                const bsModal = new bootstrap.Modal(modal);
                bsModal.show();
                
                // محاكاة مسح باركود بعد ثانيتين
                setTimeout(() => {
                    const mockBarcode = '2' + Math.floor(Math.random() * 1000000000).toString().padStart(9, '0');
                    document.getElementById('barcode-result').textContent = `تم المسح: ${mockBarcode}`;
                    
                    if (inputId) {
                        const input = document.getElementById(inputId);
                        if (input) input.value = mockBarcode;
                    }
                    
                    // إطلاق حدث
                    window.dispatchEvent(new CustomEvent('barcode-scanned', { 
                        detail: { barcode: mockBarcode }
                    }));
                }, 2000);
            } else {
                Swal.fire('معلومة', 'ماسح الباركود غير متوفر', 'info');
            }
        }

        function generateBarcode() {
            return '2' + Math.floor(Math.random() * 1000000000).toString().padStart(9, '0');
        }

        // ================== دوال البحث الصوتي ==================
        function startVoiceSearch(callback) {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'ar-SA';
                
                recognition.onstart = function() {
                    Swal.fire({
                        title: '🎤 استمع...',
                        text: 'تحدث الآن',
                        timer: 5000,
                        timerProgressBar: true,
                        showConfirmButton: false
                    });
                };
                
                recognition.onresult = function(event) {
                    const text = event.results[0][0].transcript;
                    if (callback) callback(text);
                };
                
                recognition.onerror = function() {
                    Swal.fire('خطأ', 'فشل التعرف على الصوت', 'error');
                };
                
                recognition.start();
            } else {
                Swal.fire('خطأ', 'المتصفح لا يدعم البحث الصوتي', 'error');
            }
        }

        // ================== دوال النسخ الاحتياطي ==================
        function exportBackup() {
            if (window.backupModule) {
                backupModule.exportBackup();
            } else {
                Swal.fire('معلومة', 'النسخ الاحتياطي غير متوفر', 'info');
            }
        }

        function importBackup() {
            document.getElementById('backup-file-input').click();
        }

        // ================== دوال عامة ==================
        function uploadExcel() {
            Swal.fire('رفع Excel', 'قريباً', 'info');
        }

        // ================== التحقق من حالة تسجيل الدخول ==================
        (function() {
            if (localStorage.getItem('isLoggedIn') === 'true') {
                setTimeout(() => {
                    document.getElementById('login-screen')?.style.display = 'none';
                }, 100);
            }
        })();

        // ================== إغلاق القائمة الجانبية عند النقر خارجها ==================
        document.addEventListener('click', function(e) {
            const sidebar = document.getElementById('sidebar');
            const menuIcon = document.querySelector('.app-header i:first-child');
            if (sidebar?.classList.contains('show') && 
                !sidebar.contains(e.target) && 
                e.target !== menuIcon) {
                sidebar.classList.remove('show');
            }
        });

        // ================== إغلاق نتائج البحث ==================
        document.addEventListener('click', function(e) {
            document.querySelectorAll('.search-results').forEach(box => {
                if (!box.contains(e.target) && !e.target.closest('.search-container')) {
                    box.classList.remove('show');
                }
            });
        });

        console.log('✅ جميع الدوال العامة جاهزة');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوبيرات برو - نظام محمي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root { --main-blue: #1a237e; }
        body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        
        /* تصميم شاشة القفل */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--main-blue); color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: 0.5s;
        }
        .login-box { background: white; padding: 30px; border-radius: 20px; color: #333; width: 320px; text-align: center; }

        /* التصميم العام */
        .sidebar { background: var(--main-blue); min-height: 100vh; color: white; position: sticky; top: 0; }
        .nav-link { color: #c5cae9; cursor: pointer; border-radius: 10px; margin-bottom: 5px; }
        .nav-link.active { background: rgba(255,255,255,0.15); color: white; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .section { display: none; padding: 20px; }
        .active-section { display: block; }
        #scanner-container { width: 100%; height: 300px; background: #000; display: none; border-radius: 15px; overflow: hidden; }
    </style>
</head>
<body onload="checkLock()">

<div id="lock-screen">
    <div class="login-box shadow-lg">
        <span class="material-icons-round fs-1 text-primary mb-3">lock</span>
        <h5 class="mb-4">أدخل كلمة المرور للدخول</h5>
        <input type="password" id="pass-input" class="form-control mb-3 text-center" placeholder="****">
        <button class="btn btn-primary w-100" onclick="unlock()">دخول</button>
        <p id="error-msg" class="text-danger mt-2 small" style="display:none">كلمة السر غير صحيحة!</p>
    </div>
</div>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 sidebar p-4">
            <h4 class="text-center mb-5">🛒 سوبيرات برو</h4>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link active" id="link-inv" onclick="showSection('inv')"><span class="material-icons-round align-middle me-2">inventory</span> المخزن</a></li>
                <li class="nav-item"><a class="nav-link" id="link-bulk" onclick="showSection('bulk')"><span class="material-icons-round align-middle me-2">receipt</span> فاتورة جماعية</a></li>
                <li class="nav-item mt-5"><a class="nav-link text-danger" onclick="lockApp()"><span class="material-icons-round align-middle me-2">logout</span> تسجيل خروج</a></li>
            </ul>
        </nav>

        <main class="col-md-10">
            <div id="bulk" class="section">
                <div class="d-flex justify-content-between mb-4">
                    <h2>🧾 إدخال فاتورة جماعية</h2>
                    <div>
                        <button class="btn btn-outline-danger me-2" onclick="startVoice()"><span class="material-icons-round align-middle" id="voice-icon">mic</span> إدخال صوتي</button>
                    </div>
                </div>
                <div class="card p-4">
                    <div class="row g-2 mb-3">
                        <div class="col-md-4"><input type="text" id="b-name" class="form-control" placeholder="اسم المنتج"></div>
                        <div class="col-md-3"><input type="number" id="b-qty" class="form-control" placeholder="الكمية"></div>
                        <div class="col-md-3"><input type="number" id="b-price" class="form-control" placeholder="السعر"></div>
                        <div class="col-md-2"><button class="btn btn-primary w-100" onclick="addToTempList()">أضف</button></div>
                    </div>
                    <table class="table">
                        <thead><tr><th>المنتج</th><th>الكمية</th><th>السعر</th></tr></thead>
                        <tbody id="temp-list-body"></tbody>
                    </table>
                    <button class="btn btn-success w-100 mt-3" onclick="saveBulk()">حفظ في المخزن</button>
                </div>
            </div>

            <div id="inv" class="section active-section">
                <h2 class="mb-4">📦 حالة المخزن</h2>
                <div class="card p-3">
                    <table class="table">
                        <thead><tr><th>المنتج</th><th>الكمية</th><th>السعر</th></tr></thead>
                        <tbody id="inv-body"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    // --- إعدادات الأمان ---
    const CORRECT_PASSWORD = "1234"; // يمكنك تغيير كلمة السر من هنا

    function unlock() {
        const input = document.getElementById('pass-input').value;
        if (input === CORRECT_PASSWORD) {
            document.getElementById('lock-screen').style.opacity = "0";
            setTimeout(() => {
                document.getElementById('lock-screen').style.display = "none";
            }, 500);
            sessionStorage.setItem('isLoggedIn', 'true');
        } else {
            document.getElementById('error-msg').style.display = "block";
        }
    }

    function checkLock() {
        if (sessionStorage.getItem('isLoggedIn') === 'true') {
            document.getElementById('lock-screen').style.display = "none";
        }
    }

    function lockApp() {
        sessionStorage.removeItem('isLoggedIn');
        location.reload();
    }

    // --- بقية وظائف النظام السابقة ---
    let products = JSON.parse(localStorage.getItem('products')) || [];
    let tempList = [];

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active-section'));
        document.getElementById(id).classList.add('active-section');
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        event.currentTarget.classList.add('active');
    }

    function addToTempList() {
        const name = document.getElementById('b-name').value;
        const qty = parseInt(document.getElementById('b-qty').value);
        const price = parseFloat(document.getElementById('b-price').value);
        if(name && qty && price) {
            tempList.push({ name, qty, price });
            renderTemp();
            document.getElementById('b-name').value = '';
        }
    }

    function renderTemp() {
        document.getElementById('temp-list-body').innerHTML = tempList.map(item => `<tr><td>${item.name}</td><td>${item.qty}</td><td>${item.price}</td></tr>`).join('');
    }

    function saveBulk() {
        products = [...products, ...tempList];
        localStorage.setItem('products', JSON.stringify(products));
        tempList = [];
        renderTemp();
        renderInv();
        alert("تم الحفظ!");
    }

    function renderInv() {
        document.getElementById('inv-body').innerHTML = products.map(p => `<tr><td>${p.name}</td><td>${p.qty}</td><td>${p.price}</td></tr>`).join('');
    }

    renderInv();
</script>
</body>
</html>

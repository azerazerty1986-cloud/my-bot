<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ناردو 3D — شخصيتي ثلاثية الأبعاد</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.7.1/dist/jszip.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffd700;--success:#4ade80;--error:#f87171;--info:#60a5fa;--accent:#00f2ff;--gltf:#ff6b6b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#050510;color:#fff;overflow:hidden;user-select:none}

#start-screen{position:fixed;inset:0;z-index:2000;background:linear-gradient(135deg,#0a0a2a,#000);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px}
.start-logo{font-size:42px;font-weight:900;color:var(--gold);animation:float 3s ease-in-out infinite}
.start-subtitle{font-size:15px;color:#666;text-align:center;max-width:350px}
.start-btn{border:2px solid var(--accent);color:var(--accent);padding:16px 50px;background:rgba(0,242,255,0.08);border-radius:60px;font-size:20px;cursor:pointer;transition:all .3s;font-weight:700;font-family:inherit}
.start-btn:hover{transform:scale(1.05);background:var(--accent);color:#000;box-shadow:0 0 50px rgba(0,242,255,0.4)}
.user-info{color:var(--accent);font-size:13px;background:rgba(0,0,0,0.6);padding:8px 24px;border-radius:30px}
.version-tag{position:absolute;bottom:15px;font-size:11px;color:#444}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

#game-container{position:fixed;inset:0;display:none;background:#050510}
#game-canvas{display:block;width:100%;height:100%}

/* HUD */
.hud{position:fixed;top:0;left:0;right:0;padding:6px 10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:100}
.player-bar{background:rgba(0,0,0,0.8);border-radius:8px;padding:5px 10px;backdrop-filter:blur(10px);min-width:120px;border:1px solid rgba(0,242,255,0.2)}
.player-bar .label{font-size:9px;font-weight:700;color:var(--accent);display:flex;justify-content:space-between;margin-bottom:2px}
.bar-track{width:100%;height:5px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;margin-bottom:2px}
.bar-fill{height:100%;border-radius:3px;transition:width .25s}
.hp-fill{background:linear-gradient(90deg,#ef4444,#f87171)}
.xp-fill{background:linear-gradient(90deg,#a855f7,#c084fc)}
.level-badge{background:rgba(0,0,0,0.7);border:1px solid var(--gold);border-radius:20px;padding:3px 14px;font-size:12px;color:var(--gold);font-weight:700;pointer-events:none;z-index:100}
.score-badge{background:rgba(0,0,0,0.7);border-radius:16px;padding:3px 12px;font-size:11px;color:#aaa;margin-top:2px;display:inline-block}

/* Controls */
.dpad{position:fixed;bottom:20px;left:16px;width:120px;height:120px;z-index:200}
.dpad-btn{position:absolute;width:40px;height:40px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;color:rgba(255,255,255,0.4);cursor:pointer;transition:all .1s}
.dpad-btn:active{background:rgba(0,242,255,0.12);border-color:var(--accent);color:var(--accent);transform:scale(0.88)}
.dpad-up{top:0;left:40px}
.dpad-down{bottom:0;left:40px}
.dpad-left{top:40px;left:0}
.dpad-right{top:40px;right:0}

.action-btns{position:fixed;bottom:20px;right:16px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:200}
.action-btn{width:54px;height:54px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px)}
.action-btn:active{transform:scale(0.86)}
.btn-attack{border-color:var(--error);color:var(--error)}
.btn-jump{border-color:var(--gold);color:var(--gold);width:46px;height:46px;font-size:16px}

/* TG Dropdown */
.tg-dropdown{position:fixed;bottom:170px;left:50%;transform:translateX(-50%);background:rgba(10,10,30,0.95);border:1px solid rgba(255,215,0,0.15);border-radius:14px;padding:12px 16px;z-index:250;min-width:300px;max-width:92%;display:none;backdrop-filter:blur(12px)}
.tg-dropdown.show{display:block}
.tg-dropdown .row{display:flex;gap:5px;margin-bottom:5px;flex-wrap:wrap}
.tg-dropdown input{flex:1;padding:5px 10px;border-radius:6px;border:1px solid rgba(255,215,0,0.1);background:#0a0a1a;color:#fff;font-size:11px;font-family:inherit;min-width:60px}
.tg-dropdown .btn{padding:5px 12px;border:none;border-radius:6px;font-weight:700;font-size:10px;cursor:pointer;font-family:inherit}
.btn-accent{background:var(--accent);color:#111}
.btn-gold{background:var(--gold);color:#111}
.btn-gltf{background:var(--gltf);color:#fff}
.btn-green{background:var(--success);color:#111}
.btn-red{background:var(--error);color:#fff}
.tg-toggle{position:fixed;bottom:155px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);border:1px solid rgba(255,215,0,0.1);border-radius:20px;padding:3px 14px;z-index:210;font-size:11px;color:#888;cursor:pointer;display:none}

/* Player Skin Selector */
.skin-selector{position:fixed;bottom:220px;left:50%;transform:translateX(-50%);background:rgba(10,10,30,0.95);border:1px solid rgba(255,215,0,0.12);border-radius:14px;padding:12px;z-index:230;display:none;backdrop-filter:blur(12px);min-width:200px}
.skin-selector.show{display:block}
.skin-selector h4{color:var(--gold);font-size:12px;margin-bottom:8px;text-align:center}
.skin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.skin-option{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:6px;text-align:center;cursor:pointer;transition:.2s}
.skin-option:hover{background:rgba(255,255,255,0.08);border-color:var(--gold)}
.skin-option .preview{width:40px;height:40px;border-radius:50%;margin:0 auto 3px;display:flex;align-items:center;justify-content:center;font-size:20px;background:#0a0a1a;overflow:hidden}
.skin-option .preview img{width:100%;height:100%;object-fit:cover}
.skin-option .sname{font-size:9px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skin-option.active{border-color:var(--gold);background:rgba(255,215,0,0.05)}

/* Character Grid */
.char-grid-panel{position:fixed;bottom:280px;left:50%;transform:translateX(-50%);background:rgba(10,10,30,0.95);border:1px solid rgba(255,215,0,0.12);border-radius:14px;padding:10px 12px;z-index:230;max-width:92%;width:360px;display:none;max-height:160px;overflow-y:auto}
.char-grid-panel.show{display:block}
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.char-mini{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.04);border-radius:6px;padding:6px;text-align:center;cursor:pointer;transition:.2s}
.char-mini:hover{background:rgba(255,255,255,0.06);border-color:var(--gold)}
.char-mini .avatar{width:32px;height:32px;border-radius:50%;margin:0 auto 3px;background:#0a0a1a;display:flex;align-items:center;justify-content:center;font-size:16px;overflow:hidden}
.char-mini .avatar img{width:100%;height:100%;object-fit:cover}
.char-mini .cname{font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.toast-container{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:700;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.toast{background:rgba(0,0,0,0.9);padding:6px 16px;border-radius:30px;font-size:11px;border:1px solid rgba(255,255,255,0.06);animation:toastIn .3s,toastOut .3s 2.7s forwards}
.toast.success{border-color:var(--success);color:var(--success)}
.toast.error{border-color:var(--error);color:var(--error)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-20px)}}

.minimap-btn{position:fixed;top:6px;right:10px;width:30px;height:30px;border-radius:6px;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.06);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:200;font-size:13px}
#minimap-container{position:fixed;top:40px;right:10px;width:110px;height:110px;background:rgba(0,0,0,0.85);border:1px solid rgba(255,215,0,0.12);border-radius:6px;padding:3px;display:none;z-index:200}
#minimap{display:block;width:100%;height:100%;border-radius:4px}
</style>
</head>
<body>

<!-- START -->
<div id="start-screen">
  <div class="start-logo">🎮 ناردو 3D</div>
  <div class="start-subtitle">شخصيتك ثلاثية الأبعاد<br>اختر مظهرك من القناة</div>
  <div class="user-info" id="userInfoDisplay">🔄 جاري التحميل...</div>
  <button class="start-btn" id="start-btn" onclick="enterGame()" style="display:none;">🚀 دخول</button>
  <div class="version-tag">v6.0 | My 3D Character</div>
</div>

<!-- GAME -->
<div id="game-container">
  <canvas id="game-canvas"></canvas>

  <!-- HUD -->
  <div class="hud">
    <div class="player-bar">
      <div class="label"><span>⚔️ البطل</span><span id="player-lvl">Lv.1</span></div>
      <div class="bar-track"><div class="bar-fill hp-fill" id="player-hp-bar" style="width:100%"></div></div>
      <div class="bar-track"><div class="bar-fill xp-fill" id="player-xp-bar" style="width:0%"></div></div>
    </div>
    <div class="level-badge" id="wave-badge">الموجة 1</div>
    <div class="score-badge">⭐ <span id="score">0</span></div>
  </div>

  <!-- Minimap -->
  <button class="minimap-btn" onclick="toggleMinimap()">🗺️</button>
  <div id="minimap-container"><canvas id="minimap" width="110" height="110"></canvas></div>

  <!-- Controls -->
  <div class="dpad" id="dpad">
    <div class="dpad-btn dpad-up" data-dir="up">▲</div>
    <div class="dpad-btn dpad-down" data-dir="down">▼</div>
    <div class="dpad-btn dpad-left" data-dir="left">◀</div>
    <div class="dpad-btn dpad-right" data-dir="right">▶</div>
  </div>
  <div class="action-btns">
    <button class="action-btn btn-jump" onclick="playerJump()">⬆️</button>
    <button class="action-btn btn-attack" onclick="playerAttack()">⚔️</button>
  </div>

  <!-- TG -->
  <button class="tg-toggle" id="tg-toggle" onclick="toggleTG()">📡 القناة</button>
  <div class="tg-dropdown" id="tg-dropdown">
    <div class="row">
      <input type="text" id="bot-token" placeholder="Bot Token">
      <input type="text" id="chat-id" placeholder="Channel ID">
    </div>
    <div class="row">
      <button class="btn btn-accent" onclick="testTelegram()">🔗 اتصال</button>
      <button class="btn btn-gold" onclick="fetchCharacters()">📥 صور</button>
      <button class="btn btn-gltf" onclick="fetchGLTF()">🎨 GLTF</button>
      <button class="btn btn-red" onclick="toggleTG()">✖</button>
    </div>
    <div style="font-size:10px;color:#888;" id="tg-status">⭕ غير متصل</div>
  </div>

  <!-- Skin Selector -->
  <div class="skin-selector" id="skin-selector">
    <h4>🎨 اختر شخصيتك</h4>
    <div class="skin-grid" id="skin-grid"></div>
  </div>

  <!-- Characters Grid -->
  <div class="char-grid-panel" id="char-grid-panel">
    <div class="char-grid" id="char-grid"></div>
  </div>

  <!-- Skin Toggle Button -->
  <button class="minimap-btn" style="top:44px;right:10px;font-size:11px;width:auto;padding:0 8px;" onclick="toggleSkinSelector()">👤 شخصيتي</button>
</div>

<!-- TOAST -->
<div class="toast-container" id="toast-container"></div>

<script>
// ============================================================
//  ناردو 3D v6.0 — شخصيتي ثلاثية الأبعاد
// ============================================================

// ============================================================
//  TELEGRAM
// ============================================================

const tg = window.Telegram?.WebApp;
let userData = null;

function initTelegram() {
  try {
    if (tg) {
      tg.ready(); tg.expand();
      if (tg.initDataUnsafe?.user) {
        userData = tg.initDataUnsafe.user;
        document.getElementById('userInfoDisplay').innerHTML = '👤 ' + (userData.first_name || 'بطل');
      } else {
        userData = { id: Math.floor(Math.random()*100000), first_name: 'بطل' };
        document.getElementById('userInfoDisplay').innerHTML = '👤 بطل';
      }
    } else {
      userData = { id: Math.floor(Math.random()*100000), first_name: 'بطل' };
      document.getElementById('userInfoDisplay').innerHTML = '👤 بطل';
    }
  } catch(e) {
    userData = { id: Math.floor(Math.random()*100000), first_name: 'بطل' };
    document.getElementById('userInfoDisplay').innerHTML = '👤 بطل';
  }
}

let botToken = '', channelId = '', connected = false, lastUpdateId = 0;
let fetchedCharacters = [];
let loadedImages = {};
let loadedModels = {};

// Player skin
let playerSkin = null; // { imageUrl, modelUrl, isGLTF, name }

// ============================================================
//  TELEGRAM FUNCTIONS
// ============================================================

function toggleTG() {
  document.getElementById('tg-dropdown').classList.toggle('show');
}

function toggleSkinSelector() {
  document.getElementById('skin-selector').classList.toggle('show');
  renderSkinSelector();
}

function renderSkinSelector() {
  const grid = document.getElementById('skin-grid');
  grid.innerHTML = '';

  // Default option
  const defaultOpt = document.createElement('div');
  defaultOpt.className = 'skin-option' + (!playerSkin ? ' active' : '');
  defaultOpt.innerHTML = `
    <div class="preview" style="font-size:24px;">🧑</div>
    <div class="sname">افتراضي</div>
  `;
  defaultOpt.onclick = function() { selectSkin(null); };
  grid.appendChild(defaultOpt);

  // Fetched characters
  for (const char of fetchedCharacters) {
    const opt = document.createElement('div');
    opt.className = 'skin-option' + (playerSkin && playerSkin.id === char.id ? ' active' : '');
    const avatar = char.isGLTF ? '🎨' : (char.imageUrl ? `<img src="${char.imageUrl}" alt="">` : '🖼️');
    opt.innerHTML = `
      <div class="preview">${avatar}</div>
      <div class="sname">${char.name}</div>
    `;
    opt.onclick = function() { selectSkin(char); };
    grid.appendChild(opt);
  }
}

function selectSkin(char) {
  if (char) {
    playerSkin = {
      id: char.id,
      name: char.name,
      imageUrl: char.imageUrl,
      modelUrl: char.modelUrl,
      isGLTF: char.isGLTF || false,
      attack: char.attack || 80,
      defense: char.defense || 70
    };
    showToast('✅ تم اختيار ' + char.name + ' كشخصيتك!', 'success');
  } else {
    playerSkin = null;
    showToast('🧑 تم اختيار المظهر الافتراضي', 'info');
  }

  // Update player appearance in 3D
  updatePlayer3DAppearance();

  renderSkinSelector();
  document.getElementById('skin-selector').classList.remove('show');
}

function setTGStatus(msg, type) {
  const el = document.getElementById('tg-status');
  el.textContent = msg;
  el.style.color = type === 'success' ? 'var(--success)' : type === 'error' ? 'var(--error)' : '#888';
}

async function testTelegram() {
  botToken = document.getElementById('bot-token').value.trim();
  channelId = document.getElementById('chat-id').value.trim();
  if (!botToken || !channelId) { setTGStatus('❌ ادخل البيانات', 'error'); return; }

  setTGStatus('🔄 جاري...', '');
  try {
    const res = await fetch('https://api.telegram.org/bot' + botToken + '/getMe');
    const data = await res.json();
    if (data.ok) {
      connected = true;
      setTGStatus('✅ متصل بـ @' + data.result.username, 'success');
      localStorage.setItem('nardo_bot_token', botToken);
      localStorage.setItem('nardo_chat_id', channelId);
      showToast('✅ تم الاتصال!', 'success');
    } else {
      setTGStatus('❌ ' + data.description, 'error');
    }
  } catch(e) { setTGStatus('❌ فشل الاتصال', 'error'); }
}

async function fetchCharacters() {
  if (!connected) { setTGStatus('⚠️ اتصل أولاً', 'error'); return; }
  setTGStatus('📥 جاري الجلب...', '');

  try {
    const res = await fetch('https://api.telegram.org/bot' + botToken + '/getUpdates?limit=50&offset=' + (lastUpdateId + 1));
    const data = await res.json();
    if (!data.ok) { setTGStatus('❌ ' + data.description, 'error'); return; }

    let newChars = 0;
    for (const update of data.result || []) {
      lastUpdateId = Math.max(lastUpdateId, update.update_id);
      const msg = update.channel_post || update.message;
      if (!msg) continue;

      let fileId = null, imageUrl = '';
      if (msg.photo && msg.photo.length > 0) {
        fileId = msg.photo[msg.photo.length - 1].file_id;
      } else if (msg.document && msg.document.mime_type?.startsWith('image/')) {
        fileId = msg.document.file_id;
      }
      if (!fileId) continue;
      if (fetchedCharacters.some(c => c.fileId === fileId)) continue;

      const fileRes = await fetch('https://api.telegram.org/bot' + botToken + '/getFile?file_id=' + fileId);
      const fileData = await fileRes.json();
      if (fileData.ok && fileData.result.file_path) {
        imageUrl = 'https://api.telegram.org/file/bot' + botToken + '/' + fileData.result.file_path;
      }

      const caption = msg.caption || '';
      const nameMatch = caption.match(/(?:اسم|name|Name)[\s:]*([^\n]+)/i);
      const atkMatch = caption.match(/(?:هجوم|atk|Atk|attack)[\s:]*(\d+)/i);
      const defMatch = caption.match(/(?:دفاع|def|Def|defense)[\s:]*(\d+)/i);

      const char = {
        id: 'char_' + fileId,
        fileId: fileId,
        name: nameMatch ? nameMatch[1].trim() : 'شخصية #' + (fetchedCharacters.length + 1),
        attack: atkMatch ? parseInt(atkMatch[1]) : Math.floor(Math.random() * 30) + 60,
        defense: defMatch ? parseInt(defMatch[1]) : Math.floor(Math.random() * 30) + 50,
        imageUrl: imageUrl,
        isGLTF: false,
        modelUrl: null
      };

      fetchedCharacters.push(char);
      newChars++;

      if (imageUrl) {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function() { loadedImages[char.id] = img; };
        img.src = imageUrl;
      }
    }

    if (newChars > 0) {
      setTGStatus('✅ جلب ' + newChars + ' شخصية!', 'success');
      showCharGrid();
      renderSkinSelector();
    } else {
      setTGStatus('📭 لا توجد شخصيات جديدة', '');
    }
  } catch(e) { setTGStatus('❌ خطأ', 'error'); }
}

async function fetchGLTF() {
  if (!connected) { setTGStatus('⚠️ اتصل أولاً', 'error'); return; }
  setTGStatus('🎨 جاري جلب GLTF...', '');

  try {
    const res = await fetch('https://api.telegram.org/bot' + botToken + '/getUpdates?limit=50&offset=' + (lastUpdateId + 1));
    const data = await res.json();
    if (!data.ok) { setTGStatus('❌ ' + data.description, 'error'); return; }

    let newChars = 0;
    for (const update of data.result || []) {
      lastUpdateId = Math.max(lastUpdateId, update.update_id);
      const msg = update.channel_post || update.message;
      if (!msg) continue;

      let modelUrl = null;
      if (msg.document) {
        const fn = msg.document.file_name || '';
        if (fn.match(/\.(gltf|glb|zip)$/i)) {
          const fileRes = await fetch('https://api.telegram.org/bot' + botToken + '/getFile?file_id=' + msg.document.file_id);
          const fileData = await fileRes.json();
          if (fileData.ok && fileData.result.file_path) {
            modelUrl = 'https://api.telegram.org/file/bot' + botToken + '/' + fileData.result.file_path;
          }
        }
      }
      if (!modelUrl && msg.text) {
        const urlMatch = msg.text.match(/(https?:\/\/[^\s]+\.(gltf|glb|zip))/i);
        if (urlMatch) modelUrl = urlMatch[1];
      }
      if (!modelUrl) continue;
      if (fetchedCharacters.some(c => c.modelUrl === modelUrl)) continue;

      const caption = msg.caption || msg.text || '';
      const nameMatch = caption.match(/(?:اسم|name|Name)[\s:]*([^\n]+)/i);
      const atkMatch = caption.match(/(?:هجوم|atk|Atk|attack)[\s:]*(\d+)/i);
      const defMatch = caption.match(/(?:دفاع|def|Def|defense)[\s:]*(\d+)/i);

      const char = {
        id: 'gltf_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        name: nameMatch ? nameMatch[1].trim() : 'GLTF #' + (fetchedCharacters.length + 1),
        attack: atkMatch ? parseInt(atkMatch[1]) : Math.floor(Math.random() * 30) + 70,
        defense: defMatch ? parseInt(defMatch[1]) : Math.floor(Math.random() * 30) + 60,
        imageUrl: null,
        isGLTF: true,
        modelUrl: modelUrl
      };

      // Pre-load model
      try {
        const r = await fetch(modelUrl);
        const blob = await r.blob();
        const reader = new FileReader();
        reader.onload = function(e) {
          loadedModels[char.id] = e.target.result;
        };
        reader.readAsArrayBuffer(blob);
      } catch(e) {}

      fetchedCharacters.push(char);
      newChars++;
    }

    if (newChars > 0) {
      setTGStatus('✅ جلب ' + newChars + ' GLTF!', 'success');
      showCharGrid();
      renderSkinSelector();
    } else {
      setTGStatus('📭 لا توجد نماذج جديدة', '');
    }
  } catch(e) { setTGStatus('❌ خطأ', 'error'); }
}

function showCharGrid() {
  const panel = document.getElementById('char-grid-panel');
  const grid = document.getElementById('char-grid');
  grid.innerHTML = '';

  for (const char of fetchedCharacters) {
    const div = document.createElement('div');

}

function animateThree() {
  if (!renderer) return;
  requestAnimationFrame(animateThree);

  const delta = clock.getDelta();

  if (playerMixer) playerMixer.update(delta);

  // Rotate player slowly
  if (player3D) {
    player3D.rotation.y += delta * 0.3;
  }

  // Follow player position from 2D game
  if (player3D) {
    const px = (player.x - MAP_SIZE/2) * 0.8;
    const pz = (player.y - MAP_SIZE/2) * 0.8;
    player3D.position.x += (px - player3D.position.x) * 0.05;
    player3D.position.z += (pz - player3D.position.z) * 0.05;

    // Camera follows player
    camera.position.x = player3D.position.x;
    camera.position.z = player3D.position.z + 6;
    camera.lookAt(player3D.position.x, 0, player3D.position.z);
  }

  renderer.render(scene, camera);
}

// ============================================================
//  GAME ENGINE (2D)
// ============================================================

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const minimapCanvas = document.getElementById('minimap');
const minimapCtx = minimapCanvas ? minimapCanvas.getContext('2d') : null;

let gameState = 'playing';
let map = [];
const MAP_SIZE = 20;
let time = 0;
let lastTime = performance.now();

let player = {
  x: 2.5, y: 2.5, angle: 0,
  speed: 0.05, rotSpeed: 0.04,
  jumping: false, jumpHeight: 0, jumpVelocity: 0,
  hp: 100, maxHp: 100,
  xp: 0, maxXp: 100, level: 1,
  attack: 25, defense: 10,
  isAttacking: false, attackTimer: 0, attackCooldown: 0,
  kills: 0, score: 0
};

let enemies = [];
let particles = [];
let damageTexts = [];
let wave = 1, waveTimer = 0, spawnTimer = 0;
let keys = {};
let touchDirs = { up: false, down: false, left: false, right: false };

// ============================================================
//  MAP
// ============================================================

function generateMap() {
  map = [];
  for (let y = 0; y < MAP_SIZE; y++) {
    const row = [];
    for (let x = 0; x < MAP_SIZE; x++) {
      if (x === 0 || x === MAP_SIZE-1 || y === 0 || y === MAP_SIZE-1) row.push(1);
      else if (Math.random() < 0.1 && !(x <= 4 && y <= 4)) row.push(Math.floor(Math.random()*3)+1);
      else row.push(0);
    }
    map.push(row);
  }
  for (let y = 1; y <= 4; y++) {
    for (let x = 1; x <= 4; x++) map[y][x] = 0;
  }
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

// ============================================================
//  ENEMIES
// ============================================================

function spawnEnemy() {
  let ex, ey, attempts = 0;
  do {
    ex = Math.floor(Math.random() * (MAP_SIZE - 2)) + 1;
    ey = Math.floor(Math.random() * (MAP_SIZE - 2)) + 1;
    attempts++;
  } while ((map[ey][ex] !== 0 || Math.hypot(ex - player.x, ey - player.y) < 6) && attempts < 50);
  if (attempts >= 50) return;

  const types = ['goblin', 'orc', 'skeleton'];
  const type = types[Math.floor(Math.random() * types.length)];
  const stats = {
    goblin: { hp: 40, atk: 10, spd: 0.03, color: '#4ade80', size: 0.4, xp: 15, score: 10 },
    orc: { hp: 80, atk: 20, spd: 0.02, color: '#ef4444', size: 0.55, xp: 30, score: 25 },
    skeleton: { hp: 50, atk: 15, spd: 0.025, color: '#e5e7eb', size: 0.45, xp: 20, score: 15 }
  };
  const s = stats[type];

  enemies.push({
    x: ex + 0.5, y: ey + 0.5,
    type: type,
    hp: s.hp * (1 + (wave-1)*0.15),
    maxHp: s.hp * (1 + (wave-1)*0.15),
    atk: s.atk * (1 + (wave-1)*0.1),
    speed: s.spd,
    color: s.color,
    size: s.size,
    xp: s.xp,
    score: s.score,
    attackTimer: 0, attackCooldown: 1.5 + Math.random(),
    hitFlash: 0, dead: false, deadTimer: 0, animFrame: 0,
    id: 'enemy_' + Date.now()
  });
}

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.dead) { e.deadTimer += dt; if (e.deadTimer > 1.5) enemies.splice(i, 1); continue; }

    e.animFrame += dt * 3;
    e.hitFlash = Math.max(0, e.hitFlash - dt * 5);

    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);

    e.attackTimer -= dt;
    if (dist < 1.2 && e.attackTimer <= 0) {
      e.attackTimer = e.attackCooldown;
      damagePlayer(e.atk);
    }

    if (dist > 0.8) {
      const moveX = (dx / dist) * e.speed;
      const moveY = (dy / dist) * e.speed;
      const nx = e.x + moveX, ny = e.y + moveY;
      if (map[Math.floor(ny)] && map[Math.floor(ny)][Math.floor(e.x)] === 0) e.y = ny;
      if (map[Math.floor(e.y)] && map[Math.floor(e.y)][Math.floor(nx)] === 0) e.x = nx;
    }
  }
}

function damageEnemy(enemy, damage, isCrit) {
  if (enemy.dead) return;
  const actual = Math.floor(damage * (1 + Math.random() * 0.3));
  enemy.hp -= actual;
  enemy.hitFlash = 1;

  damageTexts.push({
    x: enemy.x, y: enemy.y - 0.5,
    text: actual.toString(),
    color: isCrit ? '#ffd700' : '#fff',
    life: 1
  });

  createParticles(enemy.x, enemy.y, 10, enemy.color);

  if (enemy.hp <= 0) {
    enemy.dead = true;
    player.kills++;
    player.score += enemy.score || 10;
    gainXp(enemy.xp || 20);
    createParticles(enemy.x, enemy.y, 25, enemy.color);
  }
}

function damagePlayer(amount) {
  const actual = Math.max(1, amount - player.defense * 0.3);
  player.hp -= actual;
  if (player.hp <= 0) { player.hp = 0; gameOver(); }
}

function playerAttack() {
  if (player.isAttacking || player.attackCooldown > 0) return;
  player.isAttacking = true;
  player.attackTimer = 0.25;
  player.attackCooldown = 0.4;

  const range = 2.5, angle = Math.PI / 3;
  for (const e of enemies) {
    if (e.dead) continue;
    const dx = e.x - player.x, dy = e.y - player.y;
    const dist = Math.hypot(dx, dy);
    const a = Math.atan2(dy, dx);
    let diff = a - player.angle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    if (dist < range && Math.abs(diff) < angle) {
      const isCrit = Math.random() < 0.15;
      damageEnemy(e, player.attack * (isCrit ? 2 : 1), isCrit);
    }
  }
  createParticles(player.x + Math.cos(player.angle)*1.2, player.y + Math.sin(player.angle)*1.2, 6, '#00f2ff');
}

function playerJump() {
  if (!player.jumping) { player.jumping = true; player.jumpVelocity = 0.1; }
}

function gainXp(amount) {
  player.xp += amount;
  if (player.xp >= player.maxXp) {
    player.xp -= player.maxXp;
    player.level++;
    player.maxXp = Math.floor(player.maxXp * 1.3);
    player.maxHp += 15;
    player.hp = player.maxHp;
    player.attack += 5;
    player.defense += 3;
    showToast('🎉 مستوى جديد! Lv.' + player.level, 'success');
  }
}

// ============================================================
//  PARTICLES
// ============================================================

function createParticles(x, y, count, color) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 0.08 + 0.02;
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 0.03,
      life: 1, decay: 0.02 + Math.random() * 0.02,
      size: 2 + Math.random() * 4,
      color: color, gravity: 0.001
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.gravity;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ============================================================
//  WAVES
// ============================================================

function updateWave(dt) {
  waveTimer += dt;
  spawnTimer -= dt;
  const maxEnemies = 3 + wave * 2;
  const living = enemies.filter(e => !e.dead).length;
  if (living < maxEnemies && spawnTimer <= 0) {
    spawnEnemy();
    spawnTimer = 2;
  }
  if (living === 0 && enemies.length > 0 && waveTimer > 5) {
    wave++;
    waveTimer = 0;
    spawnTimer = 1;
    document.getElementById('wave-badge').textContent = 'الموجة ' + wave;
    showToast('🌊 الموجة ' + wave + '!', 'warning');
    player.hp = Math.min(player.maxHp, player.hp + 15);
  }
}

// ============================================================
//  RENDER
// ============================================================

function castRay(rayAngle) {
  let rayX = Math.cos(rayAngle), rayY = Math.sin(rayAngle);
  let mapX = Math.floor(player.x), mapY = Math.floor(player.y);
  let deltaDistX = Math.abs(1 / (rayX || 0.001));
  let deltaDistY = Math.abs(1 / (rayY || 0.001));
  let stepX, stepY, sideDistX, sideDistY;
  if (rayX < 0) { stepX = -1; sideDistX = (player.x - mapX) * deltaDistX; }
  else { stepX = 1; sideDistX = (mapX + 1 - player.x) * deltaDistX; }
  if (rayY < 0) { stepY = -1; sideDistY = (player.y - mapY) * deltaDistY; }
  else { stepY = 1; sideDistY = (mapY + 1 - player.y) * deltaDistY; }

  let hit = 0, side = 0, dist = 0, wallType = 0;
  while (hit === 0 && dist < 30) {
    if (sideDistX < sideDistY) {
      sideDistX += deltaDistX; mapX += stepX; side = 0;
    } else {
      sideDistY += deltaDistY; mapY += stepY; side = 1;
    }
    if (mapX < 0 || mapX >= MAP_SIZE || mapY < 0 || mapY >= MAP_SIZE) {
      hit = 1; dist = 30;
    } else if (map[mapY][mapX] !== 0) {
      hit = 1;
      wallType = map[mapY][mapX];
      dist = side === 0 ? (mapX - player.x + (1-stepX)/2) / rayX : (mapY - player.y + (1-stepY)/2) / rayY;
    }
  }
  return { dist: Math.abs(dist), side, wallType };
}

function draw() {
  const w = canvas.width, h = canvas.height, fov = Math.PI / 3;

  // Sky
  const skyGrad = ctx.createLinearGradient(0, 0, 0, h/2);
  skyGrad.addColorStop(0, '#02020a');
  skyGrad.addColorStop(0.5, '#0a0a1a');
  skyGrad.addColorStop(1, '#12122a');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, w, h/2);

  // Stars
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 60; i++) {
    const sx = (i * 137.5) % w, sy = (i * 73.3) % (h/2);
    const b = 0.3 + Math.sin(time * 0.5 + i) * 0.3;
    ctx.globalAlpha = b;
    ctx.fillRect(sx, sy, 1.5, 1.5);
  }
  ctx.globalAlpha = 1;

  // Floor
  const floorGrad = ctx.createLinearGradient(0, h/2, 0, h);
  floorGrad.addColorStop(0, '#0a0a15');
  floorGrad.addColorStop(1, '#151520');
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0, h/2, w, h/2);

  // Walls
  const stripWidth = Math.max(2, Math.floor(w / 160));
  for (let x = 0; x < w; x += stripWidth) {
    const rayAngle = player.angle - fov/2 + (x/w) * fov;
    const hit = castRay(rayAngle);
    let dist = hit.dist * Math.cos(rayAngle - player.angle);
    if (dist < 0.1) dist = 0.1;
    const wallH = Math.min(h, h / dist * 0.8);
    const wallTop = Math.max(0, (h - wallH) / 2);
    const wallBot = Math.min(h, (h + wallH) / 2);
    const fog = Math.min(1, dist * 0.04);
    const colors = { 1: [35,35,55], 2: [55,30,30], 3: [30,45,55] };
    const c = colors[hit.wallType] || colors[1];
    const shade = hit.side === 0 ? 1 : 0.65;
    const f = 1 - fog;
    ctx.fillStyle = 'rgb(' + Math.floor(c[0]*shade*f+8*(1-f)) + ',' + 
                              Math.floor(c[1]*shade*f+8*(1-f)) + ',' + 
                              Math.floor(c[2]*shade*f+12*(1-f)) + ')';
    ctx.fillRect(x, wallTop, stripWidth + 1, wallBot - wallTop);
  }

  // Draw enemies
  for (const e of enemies) {
    if (e.dead && e.deadTimer > 1) continue;
    const dx = e.x - player.x, dy = e.y - player.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 28) continue;
    const angle = Math.atan2(dy, dx) - player.angle;
    let a = angle;
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    if (Math.abs(a) > fov / 2 + 0.3) continue;
    const screenX = w / 2 + a / (fov / 2) * (w / 2);
    const size = Math.min(200, h / dist * 0.7) * (e.size || 0.4);
    const alpha = e.dead ? Math.max(0, 1 - e.deadTimer) : 1;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(screenX, h/2 + Math.sin(e.animFrame) * 4);

    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(0, size * 0.55, size * 0.4, size * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();

    if (e.hitFlash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (e.hitFlash * 0.5) + ')';
      ctx.fillRect(-size, -size, size * 2, size * 2);
    }

    ctx.fillStyle = e.color;
    ctx.shadowColor = e.color;
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.ellipse(0, size * 0.1, size * 0.35, size * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, -size * 0.3, size * 0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    if (e.type === 'goblin') {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-size * 0.1, -size * 0.35, size * 0.06, 0, Math.PI * 2);
      ctx.arc(size * 0.1, -size * 0.35, size * 0.06, 0, Math.PI * 2);
      ctx.fill();
    }

    if (!e.dead) {
      const barW = size * 0.8, barH = size * 0.06, barY = -size * 0.7;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(-barW/2, barY, barW, barH);
      ctx.fillStyle = e.hp > e.maxHp * 0.5 ? '#4ade80' : e.hp > e.maxHp * 0.25 ? '#fbbf24' : '#ef4444';
      ctx.fillRect(-barW/2, barY, barW * (e.hp / e.maxHp), barH);
    }

    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.floor(size * 0.12) + 'px Cairo';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 6;
    ctx.fillText(e.type.toUpperCase(), 0, -size * 0.75);
    ctx.shadowBlur = 0;

    ctx.restore();
  }

  // Particles
  for (const p of particles) {
    const dx = p.x - player.x, dy = p.y - player.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 20) continue;
    const angle = Math.atan2(dy, dx) - player.angle;
    let a = angle;
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    if (Math.abs(a) > fov / 2) continue;
    const screenX = w / 2 + a / (fov / 2) * (w / 2);
    const screenY = h/2 - (p.y - player.y) * (h / dist) * 0.5;
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(screenX, screenY, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  // Damage texts
  for (let i = 0; i < damageTexts.length; i++) {
    const d = damageTexts[i];
    const dx = d.x - player.x, dy = d.y - player.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 20) continue;
    const angle = Math.atan2(dy, dx) - player.angle;
    let a = angle;
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    if (Math.abs(a) > fov / 2) continue;
    const screenX = w / 2 + a / (fov / 2) * (w / 2);
    const screenY = h/2 - (d.y - player.y) * (h / dist) * 0.5;
    ctx.fillStyle = d.color;
    ctx.font = 'bold 24px Cairo';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 8;
    ctx.globalAlpha = d.life;
    ctx.fillText(d.text, screenX, screenY);
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  // Location
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(10, 10, 120, 25);
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 12px Cairo';
  ctx.textAlign = 'left';
  ctx.fillText('⭐ ' + player.score + ' pts', 18, 28);

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(10, 38, 120, 18);
  ctx.fillStyle = '#aaa';
  ctx.font = '11px Cairo';
  ctx.fillText('💀 ' + player.kills + ' kills', 18, 52);

  updateHUD();
}

function updateHUD() {
  document.getElementById('player-hp-bar').style.width = (player.hp / player.maxHp * 100) + '%';
  document.getElementById('player-xp-bar').style.width = (player.xp / player.maxXp * 100) + '%';
  document.getElementById('player-lvl').textContent = 'Lv.' + player.level;
  document.getElementById('score').textContent = player.score;
}

// ============================================================
//  MINIMAP
// ============================================================

function drawMinimap() {
  if (!minimapCtx) return;
  const s = minimapCanvas.width / MAP_SIZE;
  minimapCtx.fillStyle = '#0a0a1a';
  minimapCtx.fillRect(0, 0, 110, 110);

  for (let y = 0; y < MAP_SIZE; y++) {
    for (let x = 0; x < MAP_SIZE; x++) {
      if (map[y][x] !== 0) {
        const colors = { 1: '#333', 2: '#442222', 3: '#222244' };
        minimapCtx.fillStyle = colors[map[y][x]] || '#333';
        minimapCtx.fillRect(x * s, y * s, s, s);
      }
    }
  }

  for (const e of enemies) {
    if (e.dead) continue;
    minimapCtx.fillStyle = e.color || '#ff4444';
    minimapCtx.beginPath();
    minimapCtx.arc(e.x * s, e.y * s, 3, 0, Math.PI * 2);
    minimapCtx.fill();
  }

  minimapCtx.fillStyle = '#00f2ff';
  minimapCtx.beginPath();
  minimapCtx.arc(player.x * s, player.y * s, 3, 0, Math.PI * 2);
  minimapCtx.fill();
  minimapCtx.strokeStyle = '#00f2ff';
  minimapCtx.beginPath();
  minimapCtx.moveTo(player.x * s, player.y * s);
  minimapCtx.lineTo((player.x + Math.cos(player.angle) * 0.6) * s, (player.y + Math.sin(player.angle) * 0.6) * s);
  minimapCtx.stroke();
}

// ============================================================
//  GAME LOOP
// ============================================================

function gameLoop() {
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  time += dt;

  // Update player
  if (player.jumping) {
    player.jumpHeight += player.jumpVelocity;
    player.jumpVelocity -= 0.004;
    if (player.jumpHeight <= 0) { player.jumpHeight = 0; player.jumping = false; }
  }

  player.attackCooldown = Math.max(0, player.attackCooldown - dt);

  let moveX = 0, moveY = 0;
  const speed = player.speed * (1 + player.jumpHeight * 0.3);
  if (keys['w'] || keys['arrowup'] || touchDirs.up) {
    moveX += Math.cos(player.angle) * speed;
    moveY += Math.sin(player.angle) * speed;
  }
  if (keys['s'] || keys['arrowdown'] || touchDirs.down) {
    moveX -= Math.cos(player.angle) * speed;
    moveY -= Math.sin(player.angle) * speed;
  }
  if (keys['a'] || keys['arrowleft'] || touchDirs.left) player.angle -= player.rotSpeed;
  if (keys['d'] || keys['arrowright'] || touchDirs.right) player.angle += player.rotSpeed;

  const newX = player.x + moveX, newY = player.y + moveY;
  if (map[Math.floor(newY)] && map[Math.floor(newY)][Math.floor(player.x)] === 0) player.y = newY;
  if (map[Math.floor(player.y)] && map[Math.floor(player.y)][Math.floor(newX)] === 0) player.x = newX;

  if (player.isAttacking) {
    player.attackTimer -= dt;
    if (player.attackTimer <= 0) player.isAttacking = false;
  }

  // Update game
  updateEnemies(dt);
  updateParticles(dt);
  updateWave(dt);

  // Update damage texts
  for (let i = damageTexts.length - 1; i >= 0; i--) {
    damageTexts[i].life -= dt;
    if (damageTexts[i].life <= 0) damageTexts.splice(i, 1);
  }

  draw();

  if (document.getElementById('minimap-container').style.display === 'block') {
    drawMinimap();
  }

  requestAnimationFrame(gameLoop);
}

// ============================================================
//  CONTROLS
// ============================================================

function setupTouchControls() {
  document.querySelectorAll('.dpad-btn').forEach(function(btn) {
    const dir = btn.getAttribute('data-dir');
    btn.addEventListener('touchstart', function(e) {
      e.preventDefault();
      touchDirs[dir] = true;
      btn.style.background = 'rgba(0,242,255,0.12)';
      btn.style.borderColor = 'var(--accent)';
    }, { passive: false });
    btn.addEventListener('touchend', function(e) {
      e.preventDefault();
      touchDirs[dir] = false;
      btn.style.background = '';
      btn.style.borderColor = '';
    }, { passive: false });
    btn.addEventListener('touchcancel', function() {
      touchDirs[dir] = false;
      btn.style.background = '';
      btn.style.borderColor = '';
    });
    btn.addEventListener('mousedown', function() { touchDirs[dir] = true; });
    btn.addEventListener('mouseup', function() { touchDirs[dir] = false; });
    btn.addEventListener('mouseleave', function() { touchDirs[dir] = false; });
  });
}

window.addEventListener('keydown', function(e) {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); playerJump(); }
  if (e.key.toLowerCase() === 'e' || e.key === 'Enter') playerAttack();
});
window.addEventListener('keyup', function(e) { keys[e.key.toLowerCase()] = false; });

// ============================================================
//  GAME FLOW
// ============================================================

function toggleMinimap() {
  const el = document.getElementById('minimap-container');
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

function gameOver() {
  showToast('💀 انتهت المعركة!', 'error');
  restartGame();
}

function restartGame() {
  player.hp = player.maxHp;
  player.x = 2.5; player.y = 2.5;
  enemies = [];
  particles = [];
  damageTexts = [];
  wave = 1;
  waveTimer = 0;
  spawnTimer = 1;
  document.getElementById('wave-badge').textContent = 'الموجة 1';
  showToast('🔄 تم إعادة البدء', 'info');
}

function showToast(message, type) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(function() { toast.remove(); }, 3000);
}

function enterGame() {
  document.getElementById('start-screen').style.opacity = '0';
  setTimeout(function() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-container').style.display = 'block';
    document.getElementById('tg-toggle').style.display = 'block';
    resize();
    generateMap();
    initThreeJS();
    gameLoop();
  }, 500);

  const savedToken = localStorage.getItem('nardo_bot_token');
  const savedChat = localStorage.getItem('nardo_chat_id');
  if (savedToken) document.getElementById('bot-token').value = savedToken;
  if (savedChat) document.getElementById('chat-id').value = savedChat;
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}

// ============================================================
//  INIT
// ============================================================

initTelegram();
setupTouchControls();
resize();
window.addEventListener('resize', resize);

setTimeout(function() {
  document.getElementById('start-btn').style.display = 'block';
}, 500);

console.log('🎮 ناردو 3D v6.0 — شخصيتي ثلاثية الأبعاد جاهزة!');

<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎬 عالم فيديو 360 - أرضية + سماء + جوانب</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Cairo',sans-serif; background:#050510; color:#fff; overflow:hidden; }

#start-screen {
  position:fixed; inset:0; z-index:2000;
  background:linear-gradient(135deg,#0a0a2a,#000);
  display:flex; flex-direction:column; justify-content:center; align-items:center; gap:20px;
}
.start-logo { font-size:42px; font-weight:900; color:#ffd700; }
.start-btn {
  border:2px solid #00f2ff; color:#00f2ff; padding:16px 50px;
  background:rgba(0,242,255,0.08); border-radius:60px; font-size:20px;
  cursor:pointer; transition:all .3s; font-weight:700; font-family:inherit;
}
.start-btn:hover { transform:scale(1.05); background:#00f2ff; color:#000; }
.version-tag { position:absolute; bottom:15px; font-size:11px; color:#444; }

#game-container { position:fixed; inset:0; display:none; background:#0a0a1a; }
#game-canvas { display:block; width:100%; height:100%; }

.hud {
  position:fixed; top:0; left:0; right:0; padding:6px 12px;
  display:flex; justify-content:space-between; align-items:center;
  pointer-events:none; z-index:100;
  background:rgba(0,0,0,0.6); backdrop-filter:blur(8px);
}
.hud .title { color:#ffd700; font-size:13px; font-weight:700; }
.hud .info { color:#aaa; font-size:11px; }

.dpad {
  position:fixed; bottom:20px; left:16px;
  width:120px; height:120px; z-index:200;
}
.dpad-btn {
  position:absolute; width:40px; height:40px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; color:rgba(255,255,255,0.4);
  cursor:pointer; transition:all .1s;
}
.dpad-btn:active { background:rgba(139,92,246,0.2); border-color:#8b5cf6; color:#8b5cf6; transform:scale(0.88); }
.dpad-up { top:0; left:40px; }
.dpad-down { bottom:0; left:40px; }
.dpad-left { top:40px; left:0; }
.dpad-right { top:40px; right:0; }

#controls {
  position:fixed; bottom:160px; left:50%; transform:translateX(-50%);
  display:flex; gap:8px; z-index:210; flex-wrap:wrap; justify-content:center;
}
#controls button {
  background:rgba(139,92,246,0.15); color:#fff; border:1px solid rgba(139,92,246,0.2);
  padding:6px 14px; border-radius:15px; cursor:pointer; font-size:11px; font-family:inherit;
  transition:all 0.3s;
}
#controls button:hover { background:rgba(139,92,246,0.3); border-color:#8b5cf6; }

#minimap-frame {
  position:fixed; top:50px; left:10px;
  width:120px; height:120px;
  border:2px solid #ffd700; border-radius:12px;
  overflow:hidden; pointer-events:none; z-index:90;
  background:rgba(5,5,16,0.6);
  display:none;
}
#minimap-label {
  position:fixed; top:52px; left:12px; z-index:91;
  font-size:8px; color:#ffd700; background:rgba(0,0,0,0.6);
  padding:1px 6px; border-radius:4px; pointer-events:none; display:none;
}

.toast-container {
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
  z-index:700; display:flex; flex-direction:column; gap:5px; pointer-events:none;
  align-items:center;
}
.toast {
  background:rgba(0,0,0,0.9); padding:6px 16px; border-radius:30px;
  font-size:11px; border:1px solid rgba(255,255,255,0.06);
  animation:toastIn .3s,toastOut .3s 2.7s forwards;
}
.toast.success { border-color:#4ade80; color:#4ade80; }
.toast.error { border-color:#f87171; color:#f87171; }
.toast.info { border-color:#60a5fa; color:#60a5fa; }
@keyframes toastIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
@keyframes toastOut { from { opacity:1; transform:translateY(0); } to { opacity:0; transform:translateY(-20px); } }

#local-video-input { display:none; }

#status-bar {
  position:fixed; bottom:140px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.7); padding:4px 16px;
  border-radius:12px; font-size:10px; color:#4ade80;
  z-index:95; border:1px solid rgba(74,222,128,0.2);
  display:none;
  text-align:center;
}
</style>
</head>
<body>

<!-- شاشة البداية -->
<div id="start-screen">
  <div class="start-logo">🌍 عالم فيديو 360</div>
  <button class="start-btn" onclick="enterApp()">🚀 دخول</button>
  <div class="version-tag">v49.0 | عالم متكامل</div>
</div>

<!-- اللعبة -->
<div id="game-container">
  <canvas id="game-canvas"></canvas>

  <div id="minimap-frame"></div>
  <div id="minimap-label">🗺️</div>

  <div id="status-bar">🌍 جاري تحميل العالم...</div>

  <div class="hud">
    <div class="title">🌍 عالم 360</div>
    <div class="info" id="char-name">جاري التحميل...</div>
  </div>

  <div id="controls">
    <button onclick="loadTestWorld()">🧪 عالم تجريبي</button>
    <button onclick="document.getElementById('local-video-input').click()">📁 رفع فيديوهات</button>
    <button onclick="resetCamera()">🔄 إعادة الكاميرا</button>
  </div>

  <div class="dpad" id="dpad">
    <div class="dpad-btn dpad-up" data-dir="up">▲</div>
    <div class="dpad-btn dpad-down" data-dir="down">▼</div>
    <div class="dpad-btn dpad-left" data-dir="left">◀</div>
    <div class="dpad-btn dpad-right" data-dir="right">▶</div>
  </div>

  <input type="file" id="local-video-input" accept="video/*,.webm,.mp4,.mov" multiple onchange="handleLocalVideos(event)">
</div>

<div class="toast-container" id="toast-container"></div>

<script>
// ============================================================
//  🌍 عالم فيديو 360 - أرضية + سماء + جوانب
// ============================================================

// ============================================================
//  1. Three.js - المحرك الأساسي
// ============================================================

let scene, camera, renderer;
let playerGroup;
let worldMeshes = {};
let videoElements = {};
let videoTextures = {};
let isWorldReady = false;

const WORLD_SIZE = 30;
const PLAYER_SPEED = 0.08;
let touchDirs = { up: false, down: false, left: false, right: false };

function initThree() {
  const canvas = document.getElementById('game-canvas');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a1a);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 2, 5);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  // إضاءة
  const ambient = new THREE.AmbientLight(0x8b5cf6, 0.6);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5, 10, 5);
  scene.add(dirLight);

  // لاعب
  playerGroup = new THREE.Group();
  scene.add(playerGroup);

  // كرة
  const bodyGeo = new THREE.SphereGeometry(0.4, 16, 16);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0x8b5cf6, emissive: 0x6d28d9, emissiveIntensity: 0.3
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.4;
  playerGroup.add(body);

  // تاج
  const crownGeo = new THREE.ConeGeometry(0.2, 0.25, 6);
  const crownMat = new THREE.MeshStandardMaterial({
    color: 0xffd700, emissive: 0xffa500, emissiveIntensity: 0.2, metalness: 0.9
  });
  const crown = new THREE.Mesh(crownGeo, crownMat);
  crown.position.y = 0.8;
  playerGroup.add(crown);

  // توهج
  const glowGeo = new THREE.PlaneGeometry(1.5, 1.5);
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0x8b5cf6, transparent: true, opacity: 0.1
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.rotation.x = -Math.PI / 2;
  glow.position.y = 0.02;
  playerGroup.add(glow);

  playerGroup.position.set(0, 0, 0);

  setupMinimap();
  animate();

  document.getElementById('status-bar').style.display = 'block';
  document.getElementById('status-bar').textContent = '🌍 انتظر تحميل العالم...';
}

// ============================================================
//  2. بناء العالم من الفيديو (قبة 360)
// ============================================================

function buildWorldFromVideos(videos) {
  // تنظيف العالم القديم
  Object.values(worldMeshes).forEach(mesh => {
    if (mesh.parent) mesh.parent.remove(mesh);
    if (mesh.material) {
      if (mesh.material.map) mesh.material.map.dispose();
      mesh.material.dispose();
    }
    if (mesh.geometry) mesh.geometry.dispose();
  });
  worldMeshes = {};

  const half = WORLD_SIZE / 2;

  // ===== 1. الأرضية (Floor) =====
  if (videos.floor) {
    const floorMat = new THREE.MeshStandardMaterial({
      map: videos.floor,
      side: THREE.DoubleSide,
      roughness: 0.3,
      metalness: 0.1
    });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.1;
    floor.receiveShadow = true;
    scene.add(floor);
    worldMeshes.floor = floor;
  }

  // ===== 2. السماء (Sky) =====
  if (videos.sky) {
    const skyMat = new THREE.MeshStandardMaterial({
      map: videos.sky,
      side: THREE.DoubleSide,
      roughness: 0.1,
      metalness: 0.0,
      transparent: true,
      opacity: 0.9
    });
    const sky = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_SIZE * 1.2, WORLD_SIZE * 0.8), skyMat);
    sky.position.set(0, half * 0.7, -half * 0.3);
    scene.add(sky);
    worldMeshes.sky = sky;
  }

  // ===== 3. الجانب الأيمن =====
  if (videos.right) {
    const rightMat = new THREE.MeshStandardMaterial({
      map: videos.right,
      side: THREE.DoubleSide,
      roughness: 0.4,
      metalness: 0.1
    });
    const right = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_SIZE * 0.8, WORLD_SIZE * 0.7), rightMat);
    right.position.set(half * 0.9, half * 0.2, 0);
    right.rotation.y = -Math.PI / 2;
    scene.add(right);
    worldMeshes.right = right;
  }

  // ===== 4. الجانب الأيسر =====
  if (videos.left) {
    const leftMat = new THREE.MeshStandardMaterial({
      map: videos.left,
      side: THREE.DoubleSide,
      roughness: 0.4,
      metalness: 0.1
    });
    const left = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_SIZE * 0.8, WORLD_SIZE * 0.7), leftMat);
    left.position.set(-half * 0.9, half * 0.2, 0);
    left.rotation.y = Math.PI / 2;
    scene.add(left);
    worldMeshes.left = left;
  }

  // ===== 5. الجانب الأمامي =====
  if (videos.front) {
    const frontMat = new THREE.MeshStandardMaterial({
      map: videos.front,
      side: THREE.DoubleSide,
      roughness: 0.4,
      metalness: 0.1
    });
    const front = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_SIZE * 0.8, WORLD_SIZE * 0.7), frontMat);
    front.position.set(0, half * 0.2, -half * 0.9);
    scene.add(front);
    worldMeshes.front = front;
  }

  // ===== 6. الجانب الخلفي =====
  if (videos.back) {
    const backMat = new THREE.MeshStandardMaterial({
      map: videos.back,
      side: THREE.DoubleSide,
      roughness: 0.4,
      metalness: 0.1
    });
    const back = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_SIZE * 0.8, WORLD_SIZE * 0.7), backMat);
    back.position.set(0, half * 0.2, half * 0.9);
    back.rotation.y = Math.PI;
    scene.add(back);
    worldMeshes.back = back;
  }

  // إزالة الشبكة
  scene.children.forEach(child => {
    if (child.name === 'gridHelper') scene.remove(child);
  });

  isWorldReady = true;
  document.getElementById('status-bar').style.display = 'none';
  document.getElementById('char-name').textContent = '🌍 عالم جاهز!';
  showToast('✅ العالم جاهز! تحرك بحرية', 'success');
}

// ============================================================
//  3. تحميل الفيديوهات وإنشاء Textures
// ============================================================

function createVideoTexture(src) {
  return new Promise((resolve, reject) => {
    const video = document.createElement('video');
    video.muted = true;
    video.loop = true;
    video.playsInline = true;
    video.crossOrigin = 'anonymous';
    video.src = src;

    video.onloadeddata = function() {
      video.play().catch(() => {});
      const texture = new THREE.VideoTexture(video);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      resolve({ video, texture });
    };

    video.onerror = function() {
      reject(new Error('فشل تحميل الفيديو'));
    };

    video.load();
  });
}

// ============================================================
//  4. تحميل عالم كامل
// ============================================================

async function loadWorld(videoSources) {
  try {
    document.getElementById('status-bar').style.display = 'block';
    document.getElementById('status-bar').textContent = '📥 جاري تحميل الفيديوهات...';

    const textures = {};

    // تحميل كل فيديو
    for (const [key, src] of Object.entries(videoSources)) {
      if (!src) continue;
      document.getElementById('status-bar').textContent = `📥 تحميل: ${key}...`;
      const result = await createVideoTexture(src);
      textures[key] = result.texture;
      videoElements[key] = result.video;
      videoTextures[key] = result.texture;
    }

    // بناء العالم
    buildWorldFromVideos(textures);
    document.getElementById('status-bar').style.display = 'none';

  } catch (err) {
    console.error(err);
    document.getElementById('status-bar').textContent = '❌ فشل التحميل';
    showToast('❌ ' + err.message, 'error');
  }
}

// ============================================================
//  5. عالم تجريبي (فيديوهات وهمية)
// ============================================================

function loadTestWorld() {
  // إنشاء فيديوهات وهمية لكل اتجاه
  const videos = {};

  const directions = ['floor', 'sky', 'right', 'left', 'front', 'back'];
  const patterns = [
    { name: 'floor', colors: ['#0a2e0a', '#1a4a1a'], pattern: 'grid' },
    { name: 'sky', colors: ['#0a0a3e', '#1a1a6a'], pattern: 'stars' },
    { name: 'right', colors: ['#2a1a2a', '#4a3a4a'], pattern: 'stripes' },
    { name: 'left', colors: ['#1a2a3a', '#3a4a5a'], pattern: 'waves' },
    { name: 'front', colors: ['#3a2a1a', '#5a4a3a'], pattern: 'circles' },
    { name: 'back', colors: ['#2a0a1a', '#4a1a3a'], pattern: 'dots' }
  ];

  patterns.forEach((p, i) => {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    let frame = 0;

    function draw() {
      frame++;
      ctx.clearRect(0, 0, 512, 512);

      const grad = ctx.createLinearGradient(0, 0, 512, 512);
      grad.addColorStop(0, p.colors[0]);
      grad.addColorStop(1, p.colors[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      // نمط حسب النوع
      switch(p.pattern) {
        case 'grid':
          ctx.strokeStyle = `rgba(255,255,255,0.1)`;
          ctx.lineWidth = 1;
          for (let i = 0; i < 512; i += 30) {
            const offset = (frame * 0.2) % 30;
            ctx.beginPath(); ctx.moveTo(i + offset, 0); ctx.lineTo(i + offset, 512); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i + offset); ctx.lineTo(512, i + offset); ctx.stroke();
          }
          break;
        case 'stars':
          for (let i = 0; i < 80; i++) {
            const x = (i * 17 + frame * 0.5) % 512;
            const y = (i * 13 + frame * 0.3) % 512;
            const size = 1 + Math.sin(frame * 0.05 + i) * 2;
            ctx.fillStyle = `rgba(255,255,255,${0.2 + Math.sin(frame * 0.03 + i) * 0.2})`;
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fill();
          }
          break;
        case 'stripes':
          for (let i = 0; i < 15; i++) {
            const x = (i * 40 + frame * 0.5) % 560 - 20;
            ctx.fillStyle = `hsla(${i * 30 + frame * 0.3}, 80%, 50%, 0.15)`;
            ctx.fillRect(x, 0, 20, 512);
          }
          break;
        case 'waves':
          ctx.strokeStyle = `rgba(255,255,255,0.1)`;
          ctx.lineWidth = 2;
          for (let y = 0; y < 512; y += 20) {
            const offset = Math.sin(y * 0.05 + frame * 0.04) * 30;
            ctx.beginPath();
            ctx.moveTo(0, y + offset);
            for (let x = 0; x < 512; x += 5) {
              const wave = Math.sin(x * 0.05 + y * 0.02 + frame * 0.03) * 20;
              ctx.lineTo(x, y + wave + offset);
            }
            ctx.stroke();
          }
          break;
        case 'circles':
          for (let i = 0; i < 30; i++) {
            const x = 256 + Math.sin(i * 1.7 + frame * 0.02) * 200;
            const y = 256 + Math.cos(i * 2.3 + frame * 0.015) * 200;
            const r = 10 + Math.sin(frame * 0.03 + i) * 5;
            ctx.fillStyle = `hsla(${i * 20 + frame % 360}, 80%, 60%, 0.15)`;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
          }
          break;
        case 'dots':
          for (let i = 0; i < 40; i++) {
            const x = (i * 19 + frame * 0.3) % 512;
            const y = (i * 23 + frame * 0.2) % 512;
            ctx.fillStyle = `hsla(${i * 15 + frame % 360}, 80%, 60%, 0.2)`;
            ctx.beginPath();
            ctx.arc(x, y, 3 + Math.sin(frame * 0.02 + i) * 2, 0, Math.PI * 2);
            ctx.fill();
          }
          break;
      }

      requestAnimationFrame(draw);
    }
    draw();

    const stream = canvas.captureStream(30);
    const video = document.createElement('video');
    video.muted = true;
    video.loop = true;
    video.playsInline = true;
    video.srcObject = stream;
    video.onloadeddata = function() {
      video.play().catch(() => {});
    };
    video.load();

    // تخزين الفيديو مؤقتاً
    const url = URL.createObjectURL(stream);
    videos[p.name] = url;
    videoElements[p.name] = video;
  });

  // انتظر قليلاً ثم قم بتحميل العالم
  setTimeout(() => {
    const sources = {};
    Object.keys(videos).forEach(key => {
      sources[key] = videos[key];
    });
    loadWorld(sources);
  }, 500);
}

// ============================================================
//  6. رفع فيديوهات محلية
// ============================================================

function handleLocalVideos(event) {
  const files = event.target.files;
  if (files.length === 0) return;

  const sources = {};
  const names = ['floor', 'sky', 'right', 'left', 'front', 'back'];
  let index = 0;

  for (const file of files) {
    if (index >= names.length) break;
    if (!file.type.startsWith('video/')) continue;
    const url = URL.createObjectURL(file);
    const key = names[index];
    sources[key] = url;
    index++;
    showToast(`📁 تم رفع: ${key} (${file.name})`, 'info');
  }

  if (Object.keys(sources).length > 0) {
    loadWorld(sources);
  } else {
    showToast('❌ لم يتم رفع أي فيديو صالح', 'error');
  }
  event.target.value = '';
}

// ============================================================
//  7. تحديث اللاعب
// ============================================================

function updatePlayer() {
  let dx = 0, dz = 0;
  if (touchDirs.up) dz = -PLAYER_SPEED;
  if (touchDirs.down) dz = PLAYER_SPEED;
  if (touchDirs.left) dx = -PLAYER_SPEED;
  if (touchDirs.right) dx = PLAYER_SPEED;

  const newX = playerGroup.position.x + dx;
  const newZ = playerGroup.position.z + dz;
  const limit = WORLD_SIZE / 2 - 1;

  playerGroup.position.x = Math.max(-limit, Math.min(limit, newX));
  playerGroup.position.z = Math.max(-limit, Math.min(limit, newZ));

  // تدوير الشخصية
  if (dx !== 0 || dz !== 0) {
    playerGroup.rotation.y = Math.atan2(dx, dz);
  }

  // تحديث سرعة الفيديو
  const speed = Math.sqrt(dx*dx + dz*dz);
  Object.values(videoElements).forEach(video => {
    if (video) {
      const videoSpeed = 0.3 + speed * 2;
      video.playbackRate = Math.min(videoSpeed, 3);
    }
  });
}

// ============================================================
//  8. خريطة مصغرة
// ============================================================

let minimapCtx;

function setupMinimap() {
  const minimapFrame = document.getElementById('minimap-frame');
  const canvas = document.createElement('canvas');
  canvas.width = 120; canvas.height = 120;
  minimapFrame.appendChild(canvas);
  minimapCtx = canvas.getContext('2d');
}

function updateMinimap() {
  if (!minimapCtx) return;
  const ctx = minimapCtx;
  const w = 120, h = 120;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(10,10,26,0.9)';
  ctx.fillRect(0, 0, w, h);

  // محيط العالم
  const scale = w / WORLD_SIZE;
  ctx.strokeStyle = 'rgba(255,215,0,0.2)';
  ctx.lineWidth = 1;
  ctx.strokeRect(0, 0, w, h);

  // اللاعب
  const px = (playerGroup.position.x + WORLD_SIZE/2) * scale;
  const py = (playerGroup.position.z + WORLD_SIZE/2) * scale;

  ctx.fillStyle = '#8b5cf6';
  ctx.shadowColor = '#8b5cf6';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.arc(px, py, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // اتجاه اللاعب
  const angle = playerGroup.rotation.y;
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px + Math.sin(angle) * 10, py - Math.cos(angle) * 10);
  ctx.stroke();
}

// ============================================================
//  9. كاميرا تتبع اللاعب
// ============================================================

function updateCamera() {
  const target = playerGroup.position.clone();
  camera.position.x += (target.x - camera.position.x) * 0.05;
  camera.position.z += (target.z + 4 - camera.position.z) * 0.05;
  camera.position.y += (2.5 - camera.position.y) * 0.05;
  camera.lookAt(target.x, 0.5, target.z);
}

function resetCamera() {
  camera.position.set(0, 2.5, 5);
  camera.lookAt(0, 0, 0);
}

// ============================================================
//  10. حلقة الرسم
// ============================================================

function animate() {
  requestAnimationFrame(animate);

  updatePlayer();
  updateCamera();
  updateMinimap();

  // تحديث textures
  Object.values(videoTextures).forEach(texture => {
    if (texture) texture.needsUpdate = true;
  });

  renderer.render(scene, camera);
}

// ============================================================
//  11. تحكم
// ============================================================

function setupTouchControls() {
  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const dir = btn.getAttribute('data-dir');
    btn.addEventListener('touchstart', e => {
      e.preventDefault();
      touchDirs[dir] = true;
      btn.style.background = 'rgba(139,92,246,0.2)';
      btn.style.borderColor = '#8b5cf6';
    }, { passive: false });
    btn.addEventListener('touchend', e => {
      e.preventDefault();
      touchDirs[dir] = false;
      btn.style.background = '';
      btn.style.borderColor = '';
    }, { passive: false });
    btn.addEventListener('touchcancel', () => {
      touchDirs[dir] = false;
      btn.style.background = '';
      btn.style.borderColor = '';
    });
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') touchDirs.up = true;
  if (e.key === 'ArrowDown') touchDirs.down = true;
  if (e.key === 'ArrowLeft') touchDirs.left = true;
  if (e.key === 'ArrowRight') touchDirs.right = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowUp') touchDirs.up = false;
  if (e.key === 'ArrowDown') touchDirs.down = false;
  if (e.key === 'ArrowLeft') touchDirs.left = false;
  if (e.key === 'ArrowRight') touchDirs.right = false;
});

function showToast(message, type) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast ' + (type || '');
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

// ============================================================
//  12. الدخول
// ============================================================

function enterApp() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game-container').style.display = 'block';
  document.getElementById('minimap-frame').style.display = 'block';
  document.getElementById('minimap-label').style.display = 'block';

  initThree();

  window.addEventListener('resize', () => {
    if (camera) {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  });

  showToast('🌍 اضغط "عالم تجريبي" أو ارفع فيديوهات', 'info');
}

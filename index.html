<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎬 أرضية فيديو + شخصية</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Cairo',sans-serif; background:#050510; color:#fff; overflow:hidden; }

#start-screen {
  position:fixed; inset:0; z-index:2000;
  background:linear-gradient(135deg,#0a0a2a,#000);
  display:flex; flex-direction:column; justify-content:center; align-items:center; gap:20px;
}
.start-logo { font-size:42px; font-weight:900; color:#ffd700; }
.start-btn {
  border:2px solid #00f2ff; color:#00f2ff; padding:16px 50px;
  background:rgba(0,242,255,0.08); border-radius:60px; font-size:20px;
  cursor:pointer; transition:all .3s; font-weight:700; font-family:inherit;
}
.start-btn:hover { transform:scale(1.05); background:#00f2ff; color:#000; }
.version-tag { position:absolute; bottom:15px; font-size:11px; color:#444; }

#game-container { position:fixed; inset:0; display:none; background:#0a0a1a; }
#game-canvas { display:block; width:100%; height:100%; }

.hud {
  position:fixed; top:0; left:0; right:0; padding:6px 12px;
  display:flex; justify-content:space-between; align-items:center;
  pointer-events:none; z-index:100;
  background:rgba(0,0,0,0.6); backdrop-filter:blur(8px);
}
.hud .title { color:#ffd700; font-size:13px; font-weight:700; }
.hud .info { color:#aaa; font-size:11px; }

.dpad {
  position:fixed; bottom:20px; left:16px;
  width:120px; height:120px; z-index:200;
}
.dpad-btn {
  position:absolute; width:40px; height:40px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; color:rgba(255,255,255,0.4);
  cursor:pointer; transition:all .1s;
}
.dpad-btn:active { background:rgba(139,92,246,0.2); border-color:#8b5cf6; color:#8b5cf6; transform:scale(0.88); }
.dpad-up { top:0; left:40px; }
.dpad-down { bottom:0; left:40px; }
.dpad-left { top:40px; left:0; }
.dpad-right { top:40px; right:0; }

#controls {
  position:fixed; bottom:160px; left:50%; transform:translateX(-50%);
  display:flex; gap:8px; z-index:210; flex-wrap:wrap; justify-content:center;
}
#controls button {
  background:rgba(139,92,246,0.15); color:#fff; border:1px solid rgba(139,92,246,0.2);
  padding:6px 14px; border-radius:15px; cursor:pointer; font-size:11px; font-family:inherit;
  transition:all 0.3s;
}
#controls button:hover { background:rgba(139,92,246,0.3); border-color:#8b5cf6; }

#minimap-frame {
  position:fixed; top:50px; left:10px;
  width:120px; height:120px;
  border:2px solid #ffd700; border-radius:12px;
  overflow:hidden; pointer-events:none; z-index:90;
  background:rgba(5,5,16,0.6);
  display:none;
}
#minimap-label {
  position:fixed; top:52px; left:12px; z-index:91;
  font-size:8px; color:#ffd700; background:rgba(0,0,0,0.6);
  padding:1px 6px; border-radius:4px; pointer-events:none; display:none;
}

.toast-container {
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
  z-index:700; display:flex; flex-direction:column; gap:5px; pointer-events:none;
  align-items:center;
}
.toast {
  background:rgba(0,0,0,0.9); padding:6px 16px; border-radius:30px;
  font-size:11px; border:1px solid rgba(255,255,255,0.06);
  animation:toastIn .3s,toastOut .3s 2.7s forwards;
}
.toast.success { border-color:#4ade80; color:#4ade80; }
.toast.error { border-color:#f87171; color:#f87171; }
.toast.info { border-color:#60a5fa; color:#60a5fa; }
@keyframes toastIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
@keyframes toastOut { from { opacity:1; transform:translateY(0); } to { opacity:0; transform:translateY(-20px); } }

#local-video-input { display:none; }
</style>
</head>
<body>

<!-- شاشة البداية -->
<div id="start-screen">
  <div class="start-logo">🎬 أرضية متحركة 3D</div>
  <button class="start-btn" onclick="enterApp()">🚀 دخول</button>
  <div class="version-tag">v48.0 | عملي</div>
</div>

<!-- اللعبة -->
<div id="game-container">
  <canvas id="game-canvas"></canvas>

  <div id="minimap-frame"></div>
  <div id="minimap-label">🗺️</div>

  <div class="hud">
    <div class="title">🎮 العالم 3D</div>
    <div class="info" id="char-name">لا يوجد فيديو</div>
  </div>

  <div id="controls">
    <button onclick="loadTestVideo()">🧪 فيديو تجريبي</button>
    <button onclick="loadSampleFloor()">🏗️ أرضية نموذج</button>
    <button onclick="document.getElementById('local-video-input').click()">📁 رفع فيديو</button>
    <button onclick="stopVideo()">⏹️ إيقاف</button>
  </div>

  <div class="dpad" id="dpad">
    <div class="dpad-btn dpad-up" data-dir="up">▲</div>
    <div class="dpad-btn dpad-down" data-dir="down">▼</div>
    <div class="dpad-btn dpad-left" data-dir="left">◀</div>
    <div class="dpad-btn dpad-right" data-dir="right">▶</div>
  </div>

  <input type="file" id="local-video-input" accept="video/*,.webm,.mp4,.mov" onchange="handleLocalVideo(event)">
</div>

<div class="toast-container" id="toast-container"></div>

<script>
// ============================================================
//  🎬 الملف العملي - أرضية فيديو + شخصية + تفاعل
// ============================================================

// ============================================================
//  1. Three.js - المحرك الأساسي
// ============================================================

let scene, camera, renderer;
let playerGroup, floorMesh, shadowPlane;
let videoElement = null, videoTexture = null;
let isVideoReady = false;
let playerLight;
let frameCount = 0;

const MAP_SIZE = 16;
const TILE_SIZE = 4;
const WORLD_SIZE = MAP_SIZE * TILE_SIZE;
const OFFSET = WORLD_SIZE / 2;
const PLAYER_SPEED = 0.12;
let mapData = [];
let touchDirs = { up: false, down: false, left: false, right: false };

function initThree() {
  const canvas = document.getElementById('game-canvas');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a1a);

  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 12, 12);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  // إضاءة
  const ambient = new THREE.AmbientLight(0x8b5cf6, 0.4);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
  dirLight.position.set(10, 20, 10);
  dirLight.castShadow = true;
  scene.add(dirLight);

  const fillLight = new THREE.DirectionalLight(0x4466ff, 0.3);
  fillLight.position.set(-10, 10, -10);
  scene.add(fillLight);

  // لاعب
  playerGroup = new THREE.Group();
  scene.add(playerGroup);

  // كرة
  const bodyGeo = new THREE.SphereGeometry(0.5, 32, 32);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0x8b5cf6, emissive: 0x6d28d9, emissiveIntensity: 0.3,
    roughness: 0.3, metalness: 0.6
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.5;
  body.castShadow = true;
  body.receiveShadow = true;
  playerGroup.add(body);

  // تاج
  const crownGeo = new THREE.ConeGeometry(0.3, 0.3, 6);
  const crownMat = new THREE.MeshStandardMaterial({
    color: 0xffd700, emissive: 0xffa500, emissiveIntensity: 0.3, metalness: 0.9
  });
  const crown = new THREE.Mesh(crownGeo, crownMat);
  crown.position.y = 1.0;
  crown.castShadow = true;
  playerGroup.add(crown);

  // إضاءة تتبع اللاعب
  playerLight = new THREE.PointLight(0x00f2ff, 0.8, 12, 2);
  playerLight.position.set(0, 2, 0);
  playerGroup.add(playerLight);

  // ظلال
  const shadowMat = new THREE.ShadowMaterial({ opacity: 0.35 });
  shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_SIZE * 1.5, WORLD_SIZE * 1.5), shadowMat);
  shadowPlane.rotation.x = -Math.PI / 2;
  shadowPlane.position.y = 0.03;
  shadowPlane.receiveShadow = true;
  scene.add(shadowPlane);

  // جدران
  buildWalls();

  // شبكة
  const gridHelper = new THREE.GridHelper(WORLD_SIZE, MAP_SIZE, 0x333366, 0x1a1a3e);
  gridHelper.name = 'gridHelper';
  scene.add(gridHelper);

  playerGroup.position.set(
    1.5 * TILE_SIZE - OFFSET + TILE_SIZE/2,
    0,
    1.5 * TILE_SIZE - OFFSET + TILE_SIZE/2
  );

  setupMinimap();
  animate();
}

function buildWalls() {
  mapData = [];
  const wallGeo = new THREE.BoxGeometry(TILE_SIZE * 0.92, TILE_SIZE * 0.8, TILE_SIZE * 0.92);
  const wallMat = new THREE.MeshStandardMaterial({
    color: 0x2a2a4a, roughness: 0.4, metalness: 0.5, transparent: true, opacity: 0.8
  });

  for (let z = 0; z < MAP_SIZE; z++) {
    const row = [];
    for (let x = 0; x < MAP_SIZE; x++) {
      let isWall = false;
      if (x === 0 || x === MAP_SIZE - 1 || z === 0 || z === MAP_SIZE - 1) isWall = true;
      else if (Math.random() < 0.08 && !(x <= 3 && z <= 3)) isWall = true;

      row.push(isWall ? 1 : 0);

      if (isWall) {
        const wall = new THREE.Mesh(wallGeo, wallMat);
        wall.position.set(
          x * TILE_SIZE - OFFSET + TILE_SIZE/2,
          TILE_SIZE * 0.4,
          z * TILE_SIZE - OFFSET + TILE_SIZE/2
        );
        wall.castShadow = true;
        wall.receiveShadow = true;
        scene.add(wall);
      }
    }
    mapData.push(row);
  }
}

// ============================================================
//  2. خريطة مصغرة
// ============================================================

let minimapCtx;

function setupMinimap() {
  const minimapFrame = document.getElementById('minimap-frame');
  const canvas = document.createElement('canvas');
  canvas.width = 120; canvas.height = 120;
  minimapFrame.appendChild(canvas);
  minimapCtx = canvas.getContext('2d');
}

function updateMinimap() {
  if (!minimapCtx) return;
  const ctx = minimapCtx;
  const w = 120, h = 120;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(10,10,26,0.9)';
  ctx.fillRect(0, 0, w, h);

  const scale = w / (MAP_SIZE * TILE_SIZE);

  for (let z = 0; z < mapData.length; z++) {
    for (let x = 0; x < mapData[z].length; x++) {
      const px = x * TILE_SIZE * scale;
      const py = z * TILE_SIZE * scale;
      const size = TILE_SIZE * scale * 0.8;
      ctx.fillStyle = mapData[z][x] === 1 ? '#3a3a6a' : '#1a1a2e';
      ctx.fillRect(px, py, size, size);
    }
  }

  const px = (playerGroup.position.x + OFFSET) * scale;
  const py = (playerGroup.position.z + OFFSET) * scale;

  ctx.fillStyle = '#8b5cf6';
  ctx.shadowColor = '#8b5cf6';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.arc(px, py, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(0, 0, w, h);
}

// ============================================================
//  3. عرض الفيديو كأرضية
// ============================================================

function cleanupVideo() {
  if (floorMesh) {
    if (floorMesh.material) {
      if (floorMesh.material.map) floorMesh.material.map.dispose();
      floorMesh.material.dispose();
    }
    floorMesh.geometry.dispose();
    scene.remove(floorMesh);
    floorMesh = null;
  }
  if (videoElement) {
    try { videoElement.pause(); } catch(e) {}
    videoElement = null;
  }
  if (videoTexture) {
    try { videoTexture.dispose(); } catch(e) {}
    videoTexture = null;
  }
  isVideoReady = false;

  let hasGrid = false;
  scene.children.forEach(child => { if (child.name === 'gridHelper') hasGrid = true; });
  if (!hasGrid) {
    const gridHelper = new THREE.GridHelper(WORLD_SIZE, MAP_SIZE, 0x333366, 0x1a1a3e);
    gridHelper.name = 'gridHelper';
    scene.add(gridHelper);
  }
}

function showVideoAsFloor(src, name) {
  cleanupVideo();

  showToast('📥 جاري تحميل: ' + name, 'info');
  document.getElementById('char-name').textContent = '🎬 ' + name;

  videoElement = document.createElement('video');
  videoElement.muted = true;
  videoElement.loop = true;
  videoElement.playsInline = true;
  videoElement.crossOrigin = 'anonymous';
  videoElement.src = src;

  videoElement.onloadeddata = function() {
    if (isVideoReady) return;
    isVideoReady = true;

    videoTexture = new THREE.VideoTexture(videoElement);
    videoTexture.minFilter = THREE.LinearFilter;
    videoTexture.magFilter = THREE.LinearFilter;

    const aspect = videoElement.videoWidth && videoElement.videoHeight
      ? videoElement.videoWidth / videoElement.videoHeight : 1;

    const floorWidth = WORLD_SIZE;
    const floorHeight = WORLD_SIZE / aspect;

    const geometry = new THREE.PlaneGeometry(floorWidth, floorHeight);
    const material = new THREE.MeshStandardMaterial({
      map: videoTexture,
      side: THREE.DoubleSide,
      transparent: true,
      roughness: 0.15,
      metalness: 0.4,
      envMapIntensity: 1.0
    });

    floorMesh = new THREE.Mesh(geometry, material);
    floorMesh.rotation.x = -Math.PI / 2;
    floorMesh.position.y = 0.02;
    floorMesh.receiveShadow = true;
    scene.add(floorMesh);

    scene.children.forEach(child => {
      if (child.name === 'gridHelper') scene.remove(child);
    });

    videoElement.play().catch(() => {});
    document.getElementById('char-name').textContent = '🎬 أرضية: ' + name;
    showToast('✅ الأرضية جاهزة!', 'success');
  };

  videoElement.onerror = function() {
    showToast('❌ فشل تحميل الفيديو', 'error');
  };

  videoElement.load();
}

// ============================================================
//  4. مصادر الفيديو
// ============================================================

function handleLocalVideo(event) {
  const file = event.target.files[0];
  if (!file || !file.type.startsWith('video/')) {
    showToast('❌ ملف غير صالح', 'error');
    return;
  }
  const blobUrl = URL.createObjectURL(file);
  showVideoAsFloor(blobUrl, file.name.replace(/\.[^/.]+$/, '') || 'فيديو محلي');
  event.target.value = '';
}

function loadTestVideo() {
  showVideoAsFloor('https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm', 'زهرة متحركة 🌸');
}

function loadSampleFloor() {
  cleanupVideo();

  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 512;
  const ctx = canvas.getContext('2d');
  let frame = 0;

  function draw() {
    frame++;
    const grad = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
    grad.addColorStop(0, `hsl(${frame % 360}, 80%, 50%)`);
    grad.addColorStop(0.5, `hsl(${(frame + 120) % 360}, 80%, 30%)`);
    grad.addColorStop(1, `hsl(${(frame + 240) % 360}, 80%, 20%)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 512, 512);

    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 2;
    const offset = frame % 50;
    for (let i = 0; i < 512; i += 50) {
      ctx.beginPath(); ctx.moveTo(i + offset, 0); ctx.lineTo(i + offset, 512); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i + offset); ctx.lineTo(512, i + offset); ctx.stroke();
    }

    ctx.fillStyle = 'rgba(139,92,246,0.3)';
    for (let i = 0; i < 20; i++) {
      const x = (Math.sin(i * 1.7 + frame * 0.02) * 0.4 + 0.5) * 512;
      const y = (Math.cos(i * 2.3 + frame * 0.015) * 0.4 + 0.5) * 512;
      ctx.beginPath();
      ctx.arc(x, y, 5 + Math.sin(frame * 0.05 + i) * 3, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();

  const stream = canvas.captureStream(30);
  const video = document.createElement('video');
  video.muted = true;
  video.loop = true;
  video.playsInline = true;
  video.srcObject = stream;
  video.onloadeddata = function() {
    video.play().catch(() => {});
    const url = URL.createObjectURL(stream);
    showVideoAsFloor(url, 'أرضية نموذجية ✨');
  };
  video.load();
}

function stopVideo() {
  cleanupVideo();
  document.getElementById('char-name').textContent = 'لا يوجد فيديو';
  showToast('⏹️ تم الإيقاف', 'info');
}

// ============================================================
//  5. تحديث اللاعب
// ============================================================

function updatePlayer() {
  let dx = 0, dz = 0;
  if (touchDirs.up) dz = -PLAYER_SPEED;
  if (touchDirs.down) dz = PLAYER_SPEED;
  if (touchDirs.left) dx = -PLAYER_SPEED;
  if (touchDirs.right) dx = PLAYER_SPEED;

  if (dx === 0 && dz === 0) {
    playerLight.intensity += (0.5 - playerLight.intensity) * 0.1;
    return;
  }

  const newX = playerGroup.position.x + dx;
  const newZ = playerGroup.position.z + dz;
  const gridX = Math.floor((newX + OFFSET) / TILE_SIZE);
  const gridZ = Math.floor((newZ + OFFSET) / TILE_SIZE);

  if (gridX >= 0 && gridX < MAP_SIZE && gridZ >= 0 && gridZ < MAP_SIZE && mapData[gridZ][gridX] !== 1) {
    playerGroup.position.x = newX;
  }
  if (gridX >= 0 && gridX < MAP_SIZE && gridZ >= 0 && gridZ < MAP_SIZE && mapData[gridZ][gridX] !== 1) {
    playerGroup.position.z = newZ;
  }

  const speed = Math.sqrt(dx*dx + dz*dz);
  playerLight.intensity += ((0.8 + speed * 15) - playerLight.intensity) * 0.2;

  if (speed > 0.05) {
    const hue = 0.55 + speed * 2;
    playerLight.color.setHSL(hue % 1, 1, 0.5);
  }

  // 🔥 سرعة الفيديو تتغير مع الحركة!
  if (videoElement && isVideoReady) {
    const videoSpeed = 0.3 + speed * 3;
    videoElement.playbackRate = Math.min(videoSpeed, 4);
  }
}

// ============================================================
//  6. حلقة الرسم
// ============================================================

function animate() {
  requestAnimationFrame(animate);
  frameCount++;

  updatePlayer();

  if (videoTexture && isVideoReady) {
    videoTexture.needsUpdate = true;
  }

  const target = playerGroup.position.clone();
  camera.position.x += (target.x - camera.position.x) * 0.05;
  camera.position.z += (target.z + 10 - camera.position.z) * 0.05;
  camera.position.y += (12 - camera.position.y) * 0.05;
  camera.lookAt(target.x, 0, target.z);

  updateMinimap();
  renderer.render(scene, camera);
}

// ============================================================
//  7. تحكم
// ============================================================

function setupTouchControls() {
  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const dir = btn.getAttribute('data-dir');
    btn.addEventListener('touchstart', e => {
      e.preventDefault();
      touchDirs[dir] = true;
      btn.style.background = 'rgba(139,92,246,0.2)';
      btn.style.borderColor = '#8b5cf6';
    }, { passive: false });
    btn.addEventListener('touchend', e => {
      e.preventDefault();
      touchDirs[dir] = false;
      btn.style.background = '';
      btn.style.borderColor = '';
    }, { passive: false });
    btn.addEventListener('touchcancel', () => {
      touchDirs[dir] = false;
      btn.style.background = '';
      btn.style.borderColor = '';
    });
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') touchDirs.up = true;
  if (e.key === 'ArrowDown') touchDirs.down = true;
  if (e.key === 'ArrowLeft') touchDirs.left = true;
  if (e.key === 'ArrowRight') touchDirs.right = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowUp') touchDirs.up = false;
  if (e.key === 'ArrowDown') touchDirs.down = false;
  if (e.key === 'ArrowLeft') touchDirs.left = false;
  if (e.key === 'ArrowRight') touchDirs.right = false;
});

function showToast(message, type) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast ' + (type || '');
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

// ============================================================
//  8. الدخول
// ============================================================

function enterApp() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game-container').style.display = 'block';
  document.getElementById('minimap-frame').style.display = 'block';
  document.getElementById('minimap-label').style.display = 'block';

  initThree();

  window.addEventListener('resize', () => {
    if (camera) {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  });

  showToast('📁 اختر فيديو أو اضغط "فيديو تجريبي"', 'info');
}

// ============================================================
//  9. بدء التشغيل
// ============================================================

setupTouchControls();

console.log('🎬 v48.0 — الملف العملي النهائي');
console.log('📌 المميزات المطبقة:');
console.log('  ✅ أرضية فيديو 3D');
console.log('  ✅ شخصية تتحرك (D-Pad + مفاتيح)');
console.log('  ✅ سرعة الفيديو تتغير مع الحركة');
console.log('  ✅ خريطة مصغرة');
console.log('  ✅ ظلال وانعكاس');
console.log('  ✅ إضاءة ديناميكية');
console.log('  ✅ رفع فيديو محلي');
console.log('  ✅ فيديو تجريبي');
console.log('  ✅ أرضية نموذجية');
</script>
</body>
</html>

<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎬 عالم فيديو 360°</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Cairo',sans-serif; background:#050510; color:#fff; overflow:hidden; }

#start-screen {
  position:fixed; inset:0; z-index:2000;
  background:linear-gradient(135deg,#0a0a2a,#000);
  display:flex; flex-direction:column; justify-content:center; align-items:center; gap:20px;
}
.start-logo { font-size:42px; font-weight:900; color:#ffd700; animation:float 3s ease-in-out infinite; }
.start-subtitle { font-size:15px; color:#666; text-align:center; max-width:380px; line-height:1.6; }
.start-btn {
  border:2px solid #00f2ff; color:#00f2ff; padding:16px 50px;
  background:rgba(0,242,255,0.08); border-radius:60px; font-size:20px;
  cursor:pointer; transition:all .3s; font-weight:700; font-family:inherit;
}
.start-btn:hover { transform:scale(1.05); background:#00f2ff; color:#000; box-shadow:0 0 50px rgba(0,242,255,0.4); }
.version-tag { position:absolute; bottom:15px; font-size:11px; color:#444; }
@keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }

#game-container { position:fixed; inset:0; display:none; background:#0a0a1a; }
#game-canvas { display:block; width:100%; height:100%; }

.hud {
  position:fixed; top:0; left:0; right:0; padding:6px 12px;
  display:flex; justify-content:space-between; align-items:center;
  pointer-events:none; z-index:100;
  background:rgba(0,0,0,0.6); backdrop-filter:blur(8px);
}
.hud .title { color:#ffd700; font-size:13px; font-weight:700; }
.hud .info { color:#aaa; font-size:11px; }

.dpad {
  position:fixed; bottom:20px; left:16px;
  width:120px; height:120px; z-index:200;
}
.dpad-btn {
  position:absolute; width:40px; height:40px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; color:rgba(255,255,255,0.4);
  cursor:pointer; transition:all .1s;
}
.dpad-btn:active { background:rgba(139,92,246,0.2); border-color:#8b5cf6; color:#8b5cf6; transform:scale(0.88); }
.dpad-up { top:0; left:40px; }
.dpad-down { bottom:0; left:40px; }
.dpad-left { top:40px; left:0; }
.dpad-right { top:40px; right:0; }

#controls {
  position:fixed; bottom:160px; left:50%; transform:translateX(-50%);
  display:flex; gap:8px; z-index:210; flex-wrap:wrap; justify-content:center;
}
#controls button {
  background:rgba(139,92,246,0.15); color:#fff; border:1px solid rgba(139,92,246,0.2);
  padding:6px 14px; border-radius:15px; cursor:pointer; font-size:11px; font-family:inherit;
  transition:all 0.3s;
}
#controls button:hover { background:rgba(139,92,246,0.3); border-color:#8b5cf6; }

.toast-container {
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
  z-index:700; display:flex; flex-direction:column; gap:5px; pointer-events:none;
  align-items:center;
}
.toast {
  background:rgba(0,0,0,0.9); padding:6px 16px; border-radius:30px;
  font-size:11px; border:1px solid rgba(255,255,255,0.06);
  animation:toastIn .3s,toastOut .3s 2.7s forwards;
}
.toast.success { border-color:#4ade80; color:#4ade80; }
.toast.error { border-color:#f87171; color:#f87171; }
.toast.info { border-color:#60a5fa; color:#60a5fa; }
@keyframes toastIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
@keyframes toastOut { from { opacity:1; transform:translateY(0); } to { opacity:0; transform:translateY(-20px); } }

#local-video-input { display:none; }

#status-bar {
  position:fixed; bottom:140px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.7); padding:4px 16px;
  border-radius:12px; font-size:10px; color:#4ade80;
  z-index:95; border:1px solid rgba(74,222,128,0.2);
  display:none; text-align:center;
}
</style>
</head>
<body>

<!-- شاشة البداية -->
<div id="start-screen">
  <div class="start-logo">🌍 عالم 360°</div>
  <div class="start-subtitle">قبة فيديو 360 درجة · تحرك بحرية</div>
  <button class="start-btn" onclick="enterApp()">🚀 دخول</button>
  <div class="version-tag">v50.0 | 360° Dome</div>
</div>

<!-- اللعبة -->
<div id="game-container">
  <canvas id="game-canvas"></canvas>

  <div id="status-bar">🌍 جاري تحميل العالم 360°...</div>

  <div class="hud">
    <div class="title">🌍 360°</div>
    <div class="info" id="char-name">جاري التحميل...</div>
  </div>

  <div id="controls">
    <button onclick="loadTestWorld()">🧪 عالم 360 تجريبي</button>
    <button onclick="document.getElementById('local-video-input').click()">📁 رفع فيديو 360</button>
    <button onclick="toggleMouseControl()">🖱️ تحكم بالماوس</button>
    <button onclick="resetCamera()">🔄 إعادة</button>
  </div>

  <div class="dpad" id="dpad">
    <div class="dpad-btn dpad-up" data-dir="up">▲</div>
    <div class="dpad-btn dpad-down" data-dir="down">▼</div>
    <div class="dpad-btn dpad-left" data-dir="left">◀</div>
    <div class="dpad-btn dpad-right" data-dir="right">▶</div>
  </div>

  <input type="file" id="local-video-input" accept="video/*,.webm,.mp4,.mov" onchange="handleLocalVideo(event)">
</div>

<div class="toast-container" id="toast-container"></div>

<script>
// ============================================================
//  🌍 قبة فيديو 360 درجة
// ============================================================

// ============================================================
//  1. Three.js - المحرك الأساسي
// ============================================================

let scene, camera, renderer;
let sphereMesh, playerGroup, playerLight;
let videoElement = null, videoTexture = null;
let isReady = false;
let mouseControl = false;

const PLAYER_SPEED = 0.08;
let touchDirs = { up: false, down: false, left: false, right: false };
let mouseX = 0, mouseY = 0;

function initThree() {
  const canvas = document.getElementById('game-canvas');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a1a);

  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 1.6, 0.1);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;

  // لاعب (كرة صغيرة للإشارة)
  playerGroup = new THREE.Group();
  scene.add(playerGroup);

  // كرة صغيرة تحت اللاعب
  const dotGeo = new THREE.SphereGeometry(0.1, 8, 8);
  const dotMat = new THREE.MeshBasicMaterial({ color: 0x8b5cf6 });
  const dot = new THREE.Mesh(dotGeo, dotMat);
  dot.position.y = 0.05;
  playerGroup.add(dot);

  // نقطة ضوئية صغيرة
  playerLight = new THREE.PointLight(0x8b5cf6, 0.5, 2);
  playerLight.position.y = 0.1;
  playerGroup.add(playerLight);

  playerGroup.position.set(0, 0, 0);

  // تحكم بالماوس
  setupMouseControls();

  animate();
}

// ============================================================
//  2. قبة 360 درجة (Sphere)
// ============================================================

function createDome(texture) {
  // تنظيف القبة القديمة
  if (sphereMesh) {
    if (sphereMesh.material) {
      if (sphereMesh.material.map) sphereMesh.material.map.dispose();
      sphereMesh.material.dispose();
    }
    if (sphereMesh.geometry) sphereMesh.geometry.dispose();
    scene.remove(sphereMesh);
  }

  // إنشاء كرة كبيرة (قبة 360)
  const geometry = new THREE.SphereGeometry(30, 64, 64);
  const material = new THREE.MeshBasicMaterial({
    map: texture,
    side: THREE.BackSide, // نعرض من الداخل
    transparent: true
  });

  sphereMesh = new THREE.Mesh(geometry, material);
  sphereMesh.position.set(0, 0, 0);
  scene.add(sphereMesh);

  // إزالة الشبكة إن وجدت
  scene.children.forEach(child => {
    if (child.name === 'gridHelper') scene.remove(child);
  });

  isReady = true;
  document.getElementById('status-bar').style.display = 'none';
  document.getElementById('char-name').textContent = '🌍 عالم 360 جاهز!';
  showToast('✅ عالم 360° جاهز! تحرك بحرية', 'success');
}

// ============================================================
//  3. تحميل فيديو 360
// ============================================================

function loadVideo360(src, name) {
  showToast('📥 جاري تحميل فيديو 360...', 'info');
  document.getElementById('status-bar').style.display = 'block';
  document.getElementById('status-bar').textContent = '📥 تحميل فيديو 360...';

  // تنظيف الفيديو القديم
  if (videoElement) {
    try { videoElement.pause(); } catch(e) {}
    videoElement = null;
  }
  if (videoTexture) {
    try { videoTexture.dispose(); } catch(e) {}
    videoTexture = null;
  }

  videoElement = document.createElement('video');
  videoElement.muted = true;
  videoElement.loop = true;
  videoElement.playsInline = true;
  videoElement.preload = 'auto';
  videoElement.crossOrigin = 'anonymous';
  videoElement.src = src;

  videoElement.onloadeddata = function() {
    videoElement.play().catch(() => {});
    videoTexture = new THREE.VideoTexture(videoElement);
    videoTexture.minFilter = THREE.LinearFilter;
    videoTexture.magFilter = THREE.LinearFilter;
    videoTexture.format = THREE.RGBAFormat;

    createDome(videoTexture);
    document.getElementById('char-name').textContent = '🎬 ' + (name || 'فيديو 360');
  };

  videoElement.onerror = function() {
    showToast('❌ فشل تحميل الفيديو', 'error');
    document.getElementById('status-bar').style.display = 'none';
  };

  videoElement.load();
}

// ============================================================
//  4. عالم 360 تجريبي
// ============================================================

function loadTestWorld() {
  showToast('🌍 جاري إنشاء عالم 360...', 'info');
  document.getElementById('status-bar').style.display = 'block';
  document.getElementById('status-bar').textContent = '🎨 إنشاء عالم 360...';

  // إنشاء Canvas فيديو 360
  const canvas = document.createElement('canvas');
  canvas.width = 1024;
  canvas.height = 512;
  const ctx = canvas.getContext('2d');

  let frame = 0;

  function draw() {
    frame++;
    ctx.clearRect(0, 0, 1024, 512);

    // سماء متحركة
    const skyGrad = ctx.createLinearGradient(0, 0, 0, 512);
    skyGrad.addColorStop(0, `hsl(${200 + frame * 0.1 % 360}, 80%, 30%)`);
    skyGrad.addColorStop(0.5, `hsl(${220 + frame * 0.05 % 360}, 70%, 20%)`);
    skyGrad.addColorStop(1, `hsl(${240 + frame * 0.02 % 360}, 60%, 15%)`);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, 1024, 512);

    // أرضية
    const groundY = 400;
    const groundGrad = ctx.createLinearGradient(0, groundY, 0, 512);
    groundGrad.addColorStop(0, `hsl(${120 + frame * 0.05 % 360}, 70%, 25%)`);
    groundGrad.addColorStop(0.3, `hsl(${110 + frame * 0.03 % 360}, 60%, 20%)`);
    groundGrad.addColorStop(1, `hsl(${100 + frame * 0.02 % 360}, 50%, 15%)`);
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, groundY, 1024, 512 - groundY);

    // خط الأفق
    ctx.strokeStyle = `rgba(139,92,246,0.2)`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(1024, groundY);
    ctx.stroke();

    // غيوم متحركة
    for (let i = 0; i < 8; i++) {
      const x = (i * 150 + frame * 0.5) % 1100 - 50;
      const y = 50 + Math.sin(i * 1.3 + frame * 0.01) * 30;
      const w = 80 + Math.sin(i * 0.7) * 30;
      const h = 20 + Math.sin(i * 0.5) * 8;
      ctx.fillStyle = `rgba(255,255,255,${0.05 + Math.sin(frame * 0.01 + i) * 0.02})`;
      ctx.beginPath();
      ctx.ellipse(x, y, w, h, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // أشجار على الأفق
    for (let i = 0; i < 20; i++) {
      const x = (i * 55 + frame * 0.2) % 1100 - 50;
      const h = 20 + Math.sin(i * 0.7 + frame * 0.01) * 10;
      ctx.fillStyle = `hsl(${120 + Math.sin(i * 0.5) * 20}, 60%, ${20 + Math.sin(i + frame * 0.02) * 5}%)`;
      ctx.fillRect(x, groundY - h, 4, h);
      // تاج الشجرة
      ctx.beginPath();
      ctx.arc(x + 2, groundY - h - 5, 8 + Math.sin(i + frame * 0.02) * 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // نجوم متلألئة في السماء
    for (let i = 0; i < 40; i++) {
      const x = (i * 37 + frame * 0.1) % 1024;
      const y = (i * 53 + frame * 0.05) % 350;
      const size = 1 + Math.sin(frame * 0.03 + i * 2) * 1.5;
      ctx.fillStyle = `rgba(255,255,255,${0.2 + Math.sin(frame * 0.02 + i) * 0.2})`;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    }

    // نقاط ضوئية متحركة (أضواء)
    for (let i = 0; i < 6; i++) {
      const x = 200 + i * 120 + Math.sin(frame * 0.02 + i * 1.2) * 30;
      const y = groundY - 10 + Math.sin(frame * 0.03 + i * 0.8) * 5;
      const r = 3 + Math.sin(frame * 0.04 + i) * 2;
      ctx.fillStyle = `hsla(${i * 60 + frame % 360}, 100%, 60%, 0.3)`;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(draw);
  }
  draw();

  // تحويل Canvas إلى فيديو
  const stream = canvas.captureStream(30);
  const video = document.createElement('video');
  video.muted = true;
  video.loop = true;
  video.playsInline = true;
  video.srcObject = stream;

  video.onloadeddata = function() {
    video.play().catch(() => {});
    const url = URL.createObjectURL(stream);
    loadVideo360(url, 'عالم 360 تجريبي');
    document.getElementById('status-bar').style.display = 'none';
  };
  video.load();
}

// ============================================================
//  5. رفع فيديو 360 محلي
// ============================================================

function handleLocalVideo(event) {
  const file = event.target.files[0];
  if (!file || !file.type.startsWith('video/')) {
    showToast('❌ ملف غير صالح', 'error');
    return;
  }
  const blobUrl = URL.createObjectURL(file);
  loadVideo360(blobUrl, file.name.replace(/\.[^/.]+$/, '') || 'فيديو 360');
  event.target.value = '';
}

// ============================================================
//  6. تحكم بالماوس (360)
// ============================================================

function setupMouseControls() {
  const canvas = document.getElementById('game-canvas');

  canvas.addEventListener('mousedown', (e) => {
    mouseControl = true;
    mouseX = e.clientX;
    mouseY = e.clientY;
  });

  document.addEventListener('mousemove', (e) => {
    if (!mouseControl) return;
    const dx = e.clientX - mouseX;
    const dy = e.clientY - mouseY;
    mouseX = e.clientX;
    mouseY = e.clientY;

    // تدوير القبة (وليس الكاميرا)
    if (sphereMesh) {
      sphereMesh.rotation.y += dx * 0.005;
      sphereMesh.rotation.x += dy * 0.005;
      sphereMesh.rotation.x = Math.max(-0.5, Math.min(0.5, sphereMesh.rotation.x));
    }
  });

  document.addEventListener('mouseup', () => {
    mouseControl = false;
  });

  // تحكم باللمس للسحب (360)
  let touchStartX = 0, touchStartY = 0;
  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }
  });

  canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;

    if (sphereMesh) {
      sphereMesh.rotation.y += dx * 0.005;
      sphereMesh.rotation.x += dy * 0.005;
      sphereMesh.rotation.x = Math.max(-0.5, Math.min(0.5, sphereMesh.rotation.x));
    }
  });
}

function toggleMouseControl() {
  mouseControl = !mouseControl;
  showToast(mouseControl ? '🖱️ تحكم بالماوس مفعل' : '🖱️ تحكم بالماوس معطل', 'info');
}

// ============================================================
//  7. تحديث اللاعب
// ============================================================

function updatePlayer() {
  let dx = 0, dz = 0;
  if (touchDirs.up) dz = -PLAYER_SPEED;
  if (touchDirs.down) dz = PLAYER_SPEED;
  if (touchDirs.left) dx = -PLAYER_SPEED;
  if (touchDirs.right) dx = PLAYER_SPEED;

  const newX = playerGroup.position.x + dx;
  const newZ = playerGroup.position.z + dz;
  const limit = 4;

  playerGroup.position.x = Math.max(-limit, Math.min(limit, newX));
  playerGroup.position.z = Math.max(-limit, Math.min(limit, newZ));

  // تحديث سرعة الفيديو
  const speed = Math.sqrt(dx*dx + dz*dz);
  if (videoElement && isReady) {
    const videoSpeed = 0.3 + speed * 2;
    videoElement.playbackRate = Math.min(videoSpeed, 3);
  }
}

// ============================================================
//  8. الكاميرا
// ============================================================

function updateCamera() {
  const target = playerGroup.position.clone();
  camera.position.x += (target.x - camera.position.x) * 0.05;
  camera.position.z += (target.z + 0.1 - camera.position.z) * 0.05;
  camera.position.y += (1.6 - camera.position.y) * 0.05;
  camera.lookAt(target.x, 0.5, target.z);
}

function resetCamera() {
  camera.position.set(0, 1.6, 0.1);
  camera.lookAt(0, 0.5, 0);
  if (sphereMesh) {
    sphereMesh.rotation.set(0, 0, 0);
  }
  playerGroup.position.set(0, 0, 0);
}

// ============================================================
//  9. حلقة الرسم
// ============================================================

function animate() {
  requestAnimationFrame(animate);

  updatePlayer();
  updateCamera();

  if (videoTexture && isReady) {
    videoTexture.needsUpdate = true;
  }

  renderer.render(scene, camera);
}

// ============================================================
//  10. تحكم
// ============================================================

function setupTouchControls() {
  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const dir = btn.getAttribute('data-dir');
    btn.addEventListener('touchstart', e => {
      e.preventDefault();
      touchDirs[dir] = true;
      btn.style.background = 'rgba(139,92,246,0.2)';
      btn.style.borderColor = '#8b5cf6';
    }, { passive: false });
    btn.addEventListener('touchend', e => {
      e.preventDefault();
      touchDirs[dir] = false;
      btn.style.background = '';
      btn.style.borderColor = '';
    }, { passive: false });
    btn.addEventListener('touchcancel', () => {
      touchDirs[dir] = false;
      btn.style.background = '';
      btn.style.borderColor = '';
    });
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') touchDirs.up = true;
  if (e.key === 'ArrowDown') touchDirs.down = true;
  if (e.key === 'ArrowLeft') touchDirs.left = true;
  if (e.key === 'ArrowRight') touchDirs.right = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowUp') touchDirs.up = false;
  if (e.key === 'ArrowDown') touchDirs.down = false;
  if (e.key === 'ArrowLeft') touchDirs.left = false;
  if (e.key === 'ArrowRight') touchDirs.right = false;
});

function showToast(message, type) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast ' + (type || '');
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

// ============================================================
//  11. الدخول
// ============================================================

function enterApp() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game-container').style.display = 'block';
  document.getElementById('status-bar').style.display = 'block';

  initThree();

  window.addEventListener('resize', () => {
    if (camera) {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  });

  showToast('🌍 اضغط "عالم 360 تجريبي" أو ارفع فيديو', 'info');
}

// ============================================================
//  12. بدء التشغيل
// ============================================================

setupTouchControls();

console.log('🌍 v50.0 — قبة فيديو 360 درجة');
console.log('📌 المميزات:');
console.log('  ✅ قبة 360 درجة (كرة عملاقة)');
console.log('  ✅ فيديو يحيط بالمستخدم من كل الاتجاهات');
console.log('  ✅ تحكم بالماوس لتدوير المنظر');
console.log('  ✅ شخصية تتحرك');
console.log('  ✅ سرعة الفيديو تتغير مع الحركة');
console.log('  ✅ رفع فيديو 360 محلي');
console.log('  ✅ عالم 360 تجريبي');
</script>
</body>
</html>

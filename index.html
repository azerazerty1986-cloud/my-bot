<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوبيرات ريان | النظام الشامل</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root { --nardo-grey: #6c7c7c; --dark-nardo: #545e5e; }
        body { background-color: var(--nardo-grey); font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        .app-container { background: #fdfdfd; min-height: 100vh; max-width: 500px; margin: 0 auto; position: relative; padding-bottom: 80px; }
        .app-header { background: var(--dark-nardo); color: white; padding: 18px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        
        /* الأقسام */
        .page-section { display: none; padding: 15px; animation: fadeIn 0.3s; }
        .active-page { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* شبكة التقارير */
        .reports-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: #e1e5e5; padding: 15px; }
        .report-card { background: white; border-radius: 12px; padding: 22px; text-align: center; border: none; }
        .report-card i { font-size: 32px; color: var(--nardo-grey); margin-bottom: 8px; display: block; }

        /* القائمة السفلية */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 500px; background: white; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #ddd; z-index: 1000; }
        .nav-item { text-align: center; color: #888; text-decoration: none; font-size: 11px; flex: 1; cursor: pointer; }
        .nav-item i { display: block; font-size: 26px; }
        .nav-item.active { color: var(--dark-nardo); }
        .nav-add-btn { background: var(--dark-nardo); color: white !important; width: 50px; height: 50px; border-radius: 50%; line-height: 50px; margin-top: -30px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        /* أدوات الإدخال */
        #scanner-view { width: 100%; height: 200px; background: #000; border-radius: 15px; display: none; margin-bottom: 15px; }
        .mic-active { color: red !important; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header shadow">
        <i class="material-icons-round">menu</i>
        <span id="page-title">سوبيرات ريان</span>
        <i class="material-icons-round" onclick="location.reload()">refresh</i>
    </div>

    <div id="page-reports" class="page-section active-page">
        <div class="reports-grid">
            <div class="report-card"><i class="material-icons-round">bar_chart</i><span>المبيعات</span></div>
            <div class="report-card"><i class="material-icons-round">trending_up</i><span>الأرباح</span></div>
            <div class="report-card" onclick="showPage('inventory')"><i class="material-icons-round">warehouse</i><span>إجمالي المخزن</span></div>
            <div class="report-card"><i class="material-icons-round">people</i><span>العملاء</span></div>
        </div>
    </div>

    <div id="page-add" class="page-section">
        <h5 class="mb-3">إضافة سلعة جديدة</h5>
        <div id="scanner-view"></div>
        <div class="card p-3 shadow-sm border-0">
            <div class="input-group mb-2">
                <input type="text" id="p-name" class="form-control" placeholder="اسم السلعة">
                <button class="btn btn-outline-secondary" onclick="startVoice()"><i class="material-icons-round" id="mic-icon">mic</i></button>
                <button class="btn btn-outline-secondary" onclick="toggleScanner()"><i class="material-icons-round">qr_code_scanner</i></button>
            </div>
            <input type="number" id="p-qty" class="form-control mb-2" placeholder="الكمية">
            <input type="number" id="p-price" class="form-control mb-3" placeholder="سعر البيع">
            <button class="btn btn-success w-100" onclick="addToStorage()">حفظ في المخزن</button>
        </div>
    </div>

    <div id="page-inventory" class="page-section">
        <h5 class="mb-3">قائمة السلع المتاحة</h5>
        <div id="inventory-list"></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item" onclick="showPage('reports')"><i class="material-icons-round">description</i>التقارير</div>
        <div class="nav-item" onclick="showPage('inventory')"><i class="material-icons-round">inventory_2</i>المخزن</div>
        <div class="nav-item" onclick="showPage('add')"><i class="material-icons-round nav-add-btn">add</i></div>
        <div class="nav-item"><i class="material-icons-round">shopping_cart</i>المشتريات</div>
        <div class="nav-item"><i class="material-icons-round">person</i>حسابي</div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<script>
    let db = JSON.parse(localStorage.getItem('ryan_db')) || [];

    // تنقل بين الصفحات
    function showPage(pageId) {
        document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active-page'));
        document.getElementById('page-' + pageId).classList.add('active-page');
        
        if(pageId === 'inventory') renderInventory();
        
        // تحديث حالة الأزرار السفلية
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        event.currentTarget.classList.add('active');
    }

    // حفظ البيانات
    function addToStorage() {
        const name = document.getElementById('p-name').value;
        const qty = document.getElementById('p-qty').value;
        const price = document.getElementById('p-price').value;
        if(name && qty && price) {
            db.push({ name, qty, price });
            localStorage.setItem('ryan_db', JSON.stringify(db));
            alert("تم الحفظ بنجاح!");
            document.getElementById('p-name').value = '';
            showPage('inventory');
        }
    }

    // عرض المخزن
    function renderInventory() {
        const list = document.getElementById('inventory-list');
        list.innerHTML = db.map((item, index) => `
            <div class="card mb-2 p-3 border-0 shadow-sm d-flex flex-row justify-content-between align-items-center">
                <div>
                    <div class="fw-bold">${item.name}</div>
                    <div class="text-muted small">الكمية: ${item.qty} | السعر: ${item.price} دج</div>
                </div>
                <button class="btn btn-sm btn-light text-danger" onclick="deleteItem(${index})"><i class="material-icons-round">delete</i></button>
            </div>
        `).join('');
    }

    function deleteItem(i) { db.splice(i, 1); localStorage.setItem('ryan_db', JSON.stringify(db)); renderInventory(); }

    // وظيفة الصوت
    function startVoice() {
        const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        rec.lang = 'ar-SA';
        rec.onstart = () => document.getElementById('mic-icon').classList.add('mic-active');
        rec.onend = () => document.getElementById('mic-icon').classList.remove('mic-active');
        rec.onresult = (e) => document.getElementById('p-name').value = e.results[0][0].transcript;
        rec.start();
    }

    // وظيفة الباركود
    let sc = false;
    function toggleScanner() {
        const v = document.getElementById('scanner-view');
        if(!sc) {
            v.style.display = 'block';
            Quagga.init({inputStream:{name:"Live",type:"LiveStream",target:v},decoder:{readers:["ean_reader"]}},()=>Quagga.start());
            sc = true;
        } else { Quagga.stop(); v.style.display = 'none'; sc = false; }
    }
    Quagga.onDetected((r) => { document.getElementById('p-name').value = r.codeResult.code; toggleScanner(); });
</script>
</body>
</html>

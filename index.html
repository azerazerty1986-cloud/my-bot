<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام سوبيرات الذكي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background: #1a237e; min-height: 100vh; color: white; position: sticky; top: 0; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .nav-link { color: #c5cae9; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { color: white; background: rgba(255,255,255,0.1); border-radius: 8px; }
        .stat-icon { font-size: 2.5rem; opacity: 0.3; position: absolute; left: 10px; bottom: 10px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-none d-md-block sidebar p-4">
            <div class="text-center mb-5">
                <span class="material-icons-round fs-1">storefront</span>
                <h5 class="mt-2">سوبيرات برو</h5>
            </div>
            <ul class="nav flex-column gap-2">
                <li class="nav-item"><a class="nav-link active" href="#"><span class="material-icons-round align-middle me-2">dashboard</span> الرئيسية</a></li>
                <li class="nav-item"><a class="nav-link" href="#"><span class="material-icons-round align-middle me-2">inventory</span> المخزن</a></li>
                <li class="nav-item"><a class="nav-link" href="#"><span class="material-icons-round align-middle me-2">receipt_long</span> المبيعات</a></li>
                <li class="nav-item"><a class="nav-link" href="#"><span class="material-icons-round align-middle me-2">account_balance</span> الديون</a></li>
            </ul>
        </nav>

        <main class="col-md-10 p-4">
            <header class="d-flex justify-content-between align-items-center mb-4">
                <h4>لوحة التحكم بالمخزن</h4>
                <button class="btn btn-primary d-flex align-items-center" data-bs-toggle="modal" data-bs-target="#addModal">
                    <span class="material-icons-round me-1">add</span> إضافة منتج
                </button>
            </header>

            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="card p-3 bg-white border-start border-primary border-4 position-relative">
                        <div class="text-muted small">إجمالي المخزون</div>
                        <h2 id="total-stock">0</h2>
                        <span class="material-icons-round stat-icon text-primary">inventory_2</span>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card p-3 bg-white border-start border-success border-4 position-relative">
                        <div class="text-muted small">رصيدك الحالي</div>
                        <h2 id="balance-display">0.00 ر.س</h2>
                        <span class="material-icons-round stat-icon text-success">payments</span>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card p-3 bg-white border-start border-danger border-4 position-relative">
                        <div class="text-muted small">تنبيهات النواقص</div>
                        <h2 id="low-stock-count" class="text-danger">0</h2>
                        <span class="material-icons-round stat-icon text-danger">report_problem</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <table class="table align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>المنتج</th>
                                <th>الفئة</th>
                                <th>الكمية</th>
                                <th>السعر</th>
                                <th>الإجراء</th>
                            </tr>
                        </thead>
                        <tbody id="product-list">
                            </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5>إضافة منتج جديد للمخزن</h5></div>
            <div class="modal-body">
                <input type="text" id="p-name" class="form-control mb-2" placeholder="اسم المنتج">
                <input type="text" id="p-cat" class="form-control mb-2" placeholder="الفئة">
                <input type="number" id="p-qty" class="form-control mb-2" placeholder="الكمية">
                <input type="number" id="p-price" class="form-control mb-2" placeholder="سعر البيع">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button class="btn btn-primary" onclick="saveProduct()">حفظ المنتج</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // نظام إدارة البيانات (بديل للـ Python داخل المتصفح)
    let products = JSON.parse(localStorage.getItem('products')) || [];

    function saveProduct() {
        const product = {
            name: document.getElementById('p-name').value,
            category: document.getElementById('p-cat').value,
            qty: parseInt(document.getElementById('p-qty').value),
            price: parseFloat(document.getElementById('p-price').value)
        };
        products.push(product);
        localStorage.setItem('products', JSON.stringify(products));
        location.reload(); 
    }

    function render() {
        const list = document.getElementById('product-list');
        let total = 0;
        products.forEach((p, index) => {
            total += p.qty;
            list.innerHTML += `
                <tr>
                    <td><b>${p.name}</b></td>
                    <td>${p.category}</td>
                    <td>${p.qty}</td>
                    <td>${p.price} ر.س</td>
                    <td><button class="btn btn-sm btn-outline-danger" onclick="deleteItem(${index})">حذف</button></td>
                </tr>
            `;
        });
        document.getElementById('total-stock').innerText = total;
    }

    function deleteItem(index) {
        products.splice(index, 1);
        localStorage.setItem('products', JSON.stringify(products));
        location.reload();
    }

    render();
</script>
</body>
</html>

<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌐 TileCDN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0a0a1a;color:#fff;min-height:100vh;padding:15px;direction:rtl}
.container{max-width:1400px;margin:0 auto}

.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px;background:rgba(255,255,255,0.03);padding:12px 20px;border-radius:12px;border:1px solid rgba(255,255,255,0.06)}
.header h1{font-size:20px;background:linear-gradient(135deg,#a78bfa,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .admin-name{color:#ffd700;font-size:12px}
.header-controls{display:flex;gap:6px;flex-wrap:wrap}
.header-controls button{padding:4px 12px;border:1px solid rgba(139,92,246,0.3);border-radius:6px;background:rgba(139,92,246,0.1);color:#a78bfa;cursor:pointer;font-size:10px;transition:all .3s;font-family:inherit}
.header-controls button:hover{background:rgba(139,92,246,0.25)}
.header-controls .btn-success{border-color:rgba(74,222,128,0.3);color:#4ade80}
.header-controls .btn-success:hover{background:rgba(74,222,128,0.2)}
.header-controls .btn-danger{border-color:rgba(239,68,68,0.3);color:#f87171}
.header-controls .btn-danger:hover{background:rgba(239,68,68,0.2)}
.header-controls .btn-warning{border-color:rgba(251,191,36,0.3);color:#fbbf24}
.header-controls .btn-warning:hover{background:rgba(251,191,36,0.2)}
.header-controls .btn-gold{border-color:rgba(255,215,0,0.3);color:#ffd700}
.header-controls .btn-gold:hover{background:rgba(255,215,0,0.2)}

#auth-overlay{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.95);display:flex;justify-content:center;align-items:center;flex-direction:column;backdrop-filter:blur(20px)}
#auth-overlay .auth-box{background:rgba(10,10,30,0.97);border:2px solid rgba(255,215,0,0.3);border-radius:20px;padding:32px;width:90%;max-width:380px}
#auth-overlay .auth-box h2{color:#ffd700;text-align:center;font-size:22px;margin-bottom:20px}
#auth-overlay .auth-box .field{margin-bottom:14px}
#auth-overlay .auth-box .field label{color:#888;font-size:11px;display:block;margin-bottom:4px;font-weight:600}
#auth-overlay .auth-box .field input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:#fff;font-size:14px;font-family:inherit}
#auth-overlay .auth-box .field input:focus{outline:none;border-color:rgba(255,215,0,0.4)}
#auth-overlay .auth-box .auth-btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;transition:all .3s;margin-top:4px}
#auth-overlay .auth-box .auth-btn.primary{background:linear-gradient(135deg,#ffd700,#f59e0b);color:#111}
#auth-overlay .auth-box .auth-btn.primary:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(255,215,0,0.3)}
#auth-overlay .auth-box .auth-error{color:#ef4444;font-size:11px;text-align:center;margin-top:8px;display:none}
#auth-overlay .auth-box .auth-info{color:#666;font-size:11px;text-align:center;margin-top:12px;padding:8px;background:rgba(255,215,0,0.05);border-radius:8px;border:1px solid rgba(255,215,0,0.08)}

.auto-sync-bar{background:rgba(74,222,128,0.05);border:1px solid rgba(74,222,128,0.15);border-radius:12px;padding:12px 18px;margin-bottom:12px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.sync-dot{width:10px;height:10px;border-radius:50%;background:#666;display:inline-block}
.sync-dot.active{background:#4ade80;box-shadow:0 0 10px rgba(74,222,128,0.5);animation:blink 1.5s infinite}
.sync-dot.error{background:#f87171;box-shadow:0 0 10px rgba(239,68,68,0.5)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.auto-sync-bar .sync-info{font-size:12px;color:#888}
.auto-sync-bar .sync-info strong{color:#4ade80}
.auto-sync-bar button{padding:4px 14px;border-radius:6px;font-size:11px;font-family:inherit;cursor:pointer;transition:all .2s;border:none}
.auto-sync-bar .btn-toggle{background:rgba(74,222,128,0.1);border:1px solid rgba(74,222,128,0.3);color:#4ade80}
.auto-sync-bar .btn-toggle:hover{background:rgba(74,222,128,0.2)}
.auto-sync-bar .btn-toggle.off{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.3);color:#f87171}
.auto-sync-bar .btn-now{background:rgba(96,165,250,0.1);border:1px solid rgba(96,165,250,0.3);color:#60a5fa}
.auto-sync-bar .btn-now:hover{background:rgba(96,165,250,0.2)}

.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px}
.stat-box{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:6px;padding:8px;text-align:center}
.stat-box .num{font-size:18px;font-weight:800;display:block}
.stat-box .num.green{color:#4ade80}
.stat-box .num.purple{color:#a78bfa}
.stat-box .num.blue{color:#60a5fa}
.stat-box .num.yellow{color:#fbbf24}
.stat-box .num.orange{color:#fb923c}
.stat-box .label{font-size:8px;color:#888}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-bottom:12px}
.tile{aspect-ratio:1;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:3px;cursor:pointer;transition:all .3s;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:7px;padding:1px;position:relative;min-height:30px}
.tile:hover{background:rgba(139,92,246,0.15);border-color:rgba(139,92,246,0.4);transform:scale(1.05);z-index:10}
.tile .icon{font-size:14px}
.tile .label{color:#888;font-size:5px}
.tile .status{font-size:5px;margin-top:1px}
.tile .status.online{color:#4ade80}
.tile .status.offline{color:#666}
.tile.has-files{border-color:rgba(139,92,246,0.3);background:rgba(139,92,246,0.08)}
.tile.protected{border-color:rgba(74,222,128,0.4);box-shadow:0 0 10px rgba(74,222,128,0.1)}
.tile .badge{position:absolute;top:-2px;right:-2px;background:#8b5cf6;color:#fff;font-size:5px;padding:1px 3px;border-radius:4px;font-weight:700}
.tile .sync-badge{position:absolute;bottom:-2px;right:-2px;background:rgba(74,222,128,0.8);color:#fff;font-size:4px;padding:1px 3px;border-radius:3px}

.tile-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,10,30,0.97);border:1px solid rgba(139,92,246,0.3);border-radius:12px;padding:16px;width:92%;max-width:520px;max-height:80vh;overflow-y:auto;z-index:9999;backdrop-filter:blur(20px);display:none;box-shadow:0 20px 60px rgba(0,0,0,0.6)}
.tile-panel.open{display:block}
.tile-panel .panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.06);padding-bottom:8px}
.tile-panel .panel-header h3{color:#a78bfa;font-size:14px}
.tile-panel .panel-header h3 .admin-tag{color:#ffd700;font-size:10px}
.tile-panel .panel-header button{background:rgba(239,68,68,0.15);color:#f87171;border:none;padding:2px 10px;border-radius:4px;cursor:pointer;font-size:11px}
.tile-panel .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;margin-bottom:8px}
.tile-panel .info-item{display:flex;justify-content:space-between;padding:2px 0;font-size:10px;color:#888;border-bottom:1px solid rgba(255,255,255,0.03)}
.tile-panel .info-item .value{color:#fff}
.tile-panel .info-item .value.online{color:#4ade80}
.tile-panel .info-item .value.offline{color:#f87171}
.tile-panel .file-list{margin:8px 0;max-height:150px;overflow-y:auto}
.tile-panel .file-item{display:flex;justify-content:space-between;align-items:center;padding:3px 6px;background:rgba(255,255,255,0.03);border-radius:3px;margin-bottom:2px;font-size:9px}
.tile-panel .file-item .name{color:#a78bfa;font-weight:600}
.tile-panel .file-item .size{color:#666;font-size:7px}
.tile-panel .file-item .actions button{background:none;border:none;color:#888;cursor:pointer;font-size:10px;padding:0 2px}
.tile-panel .file-item .actions button:hover{color:#fff}
.tile-panel .file-item .actions .delete:hover{color:#f87171}
.tile-panel .file-item .actions .edit:hover{color:#fbbf24}
.tile-panel .actions{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px}
.tile-panel .actions button{padding:4px 10px;border:none;border-radius:4px;font-size:9px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.tile-panel .actions button:hover{transform:scale(1.03)}
.tile-panel .actions .btn-upload{background:rgba(74,222,128,0.15);color:#4ade80;border:1px solid rgba(74,222,128,0.2)}
.tile-panel .actions .btn-start{background:rgba(96,165,250,0.15);color:#60a5fa;border:1px solid rgba(96,165,250,0.2)}
.tile-panel .actions .btn-protect{background:rgba(251,191,36,0.15);color:#fbbf24;border:1px solid rgba(251,191,36,0.2)}
.tile-panel .actions .btn-delete{background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.2)}
.tile-panel .actions .btn-sync{background:rgba(74,222,128,0.15);color:#4ade80;border:1px solid rgba(74,222,128,0.2);grid-column:span 2}

.file-editor{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,10,30,0.97);border:1px solid rgba(251,191,36,0.3);border-radius:12px;padding:16px;width:92%;max-width:600px;max-height:80vh;z-index:99999;display:none;backdrop-filter:blur(20px)}
.file-editor.open{display:block}
.file-editor .editor-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.file-editor .editor-header h4{color:#fbbf24;font-size:12px}
.file-editor .editor-header button{background:rgba(239,68,68,0.15);color:#f87171;border:none;padding:2px 10px;border-radius:4px;cursor:pointer;font-size:11px}
.file-editor textarea{width:100%;height:200px;background:rgba(0,0,0,0.5);color:#fff;border:1px solid rgba(255,255,255,0.08);border-radius:4px;padding:8px;font-family:'Courier New',monospace;font-size:10px;resize:vertical;direction:ltr;text-align:left}
.file-editor .editor-actions{display:flex;gap:6px;margin-top:8px}
.file-editor .editor-actions button{padding:4px 12px;border:none;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;flex:1}
.file-editor .editor-actions .btn-save{background:rgba(74,222,128,0.15);color:#4ade80;border:1px solid rgba(74,222,128,0.2)}
.file-editor .editor-actions .btn-close{background:rgba(255,255,255,0.06);color:#888;border:none}

.telegram-settings{background:rgba(255,255,255,0.03);border:1px solid rgba(139,92,246,0.15);border-radius:8px;padding:10px 14px;margin-bottom:12px;display:none}
.telegram-settings.open{display:block}
.telegram-settings .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.telegram-settings input{flex:1;min-width:120px;padding:4px 10px;border-radius:4px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:#fff;font-size:11px;font-family:inherit}
.telegram-settings input:focus{outline:none;border-color:rgba(139,92,246,0.4)}
.telegram-settings .status{font-size:10px;padding:3px 10px;border-radius:4px}
.telegram-settings .status.online{background:rgba(74,222,128,0.2);color:#4ade80}
.telegram-settings .status.offline{background:rgba(239,68,68,0.2);color:#f87171}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(10,10,30,0.95);color:#fff;padding:6px 16px;border-radius:6px;border:1px solid rgba(139,92,246,0.2);z-index:999999;font-size:11px;display:none;animation:fadeIn .3s ease;max-width:90%;text-align:center}
.toast.success{border-color:rgba(74,222,128,0.3)}
.toast.error{border-color:rgba(239,68,68,0.3)}
.toast.warning{border-color:rgba(251,191,36,0.3)}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2a4a;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#3a3a6a}

@media(max-width:768px){.grid{gap:1px}.tile{min-height:25px;font-size:6px}.tile .icon{font-size:10px}.stats{grid-template-columns:repeat(3,1fr)}.header h1{font-size:16px}.header-controls button{font-size:8px;padding:3px 8px}.auto-sync-bar{flex-direction:column;align-items:flex-start}}
@media(max-width:480px){.grid{gap:1px}.tile{min-height:20px;border-radius:2px}.tile .icon{font-size:8px}.tile .label{font-size:4px}.header{padding:6px 10px}.header h1{font-size:14px}}
</style>
</head>
<body>

<!-- المصادقة -->
<div id="auth-overlay">
    <div class="auth-box">
        <h2>👑 دخول المدير</h2>
        <div class="field"><label>👤 اسم المستخدم</label><input type="text" id="admin-username" value="admin"></div>
        <div class="field"><label>🔑 كلمة المرور</label><input type="password" id="admin-password" value="admin123" onkeydown="if(event.key==='Enter')adminLogin()"></div>
        <div class="auth-error" id="auth-error"></div>
        <button class="auth-btn primary" onclick="adminLogin()">🚀 دخول</button>
        <div class="auth-info">🔐 admin / admin123</div>
    </div>
</div>

<!-- لوحة التحكم -->
<div id="admin-container" style="display:none;">
    <div class="container">
        <div class="header">
            <div><h1>🌐 TileCDN</h1><span class="admin-name">المدير: <span id="admin-name-display">مدير</span></span></div>
            <div class="header-controls">
                <button class="btn-warning" onclick="toggleTelegramSettings()">📡 القناة</button>
                <button class="btn-success" onclick="syncAllFromChannel()">🔄 مزامنة</button>
                <button onclick="exportAllTiles()">📤 تصدير</button>
                <button onclick="document.getElementById('importFile').click()">📥 استيراد</button>
                <button class="btn-danger" onclick="resetAll()">🔄 إعادة تعيين</button>
                <button class="btn-danger" onclick="logoutAdmin()">🚪 خروج</button>
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="importAllTiles(event)">
            </div>
        </div>

        <div class="auto-sync-bar">
            <div style="display:flex;align-items:center;gap:8px;">
                <div class="sync-dot" id="syncDot"></div>
                <div class="sync-info"><strong id="syncStatusText">⏸️ متوقف</strong><span id="syncLastTime" style="color:#666;"></span></div>
            </div>
            <button class="btn-toggle off" id="btnToggleAutoSync" onclick="toggleAutoSync()">▶️ تشغيل</button>
            <button class="btn-now" onclick="forceSyncNow()">⚡ فوري</button>
            <button class="btn-now" onclick="uploadTestFile()">📤 اختبار</button>
        </div>

        <div class="telegram-settings" id="telegramSettings">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <span style="color:#a78bfa;font-size:12px;font-weight:600;">📡 إعدادات القناة</span>
                <span class="status offline" id="tgStatus">🔴 غير متصل</span>
            </div>
            <div class="row">
                <input type="text" id="tgBotToken" placeholder="Bot Token">
                <input type="text" id="tgChatId" placeholder="Chat ID">
                <button onclick="saveTelegramSettings()" style="padding:4px 12px;background:rgba(74,222,128,0.15);color:#4ade80;border:1px solid rgba(74,222,128,0.2);border-radius:4px;cursor:pointer;font-family:inherit;font-size:10px;">💾 حفظ</button>
                <button onclick="testTelegramConnection()" style="padding:4px 12px;background:rgba(96,165,250,0.15);color:#60a5fa;border:1px solid rgba(96,165,250,0.2);border-radius:4px;cursor:pointer;font-family:inherit;font-size:10px;">🧪 اختبار</button>
            </div>
            <div style="margin-top:6px;font-size:9px;color:#666;">
                💡 أرسل ملفاً إلى القناة باسم: <code style="color:#a78bfa;">tile_5_3_index.html</code>
            </div>
        </div>

        <div class="stats" id="stats">
            <div class="stat-box"><span class="num purple" id="totalTiles">0</span><span class="label">📦 إجمالي</span></div>
            <div class="stat-box"><span class="num green" id="onlineTiles">0</span><span class="label">🟢 نشطة</span></div>
            <div class="stat-box"><span class="num blue" id="filesCount">0</span><span class="label">📄 ملفات</span></div>
            <div class="stat-box"><span class="num yellow" id="protectedCount">0</span><span class="label">🛡️ محمية</span></div>
            <div class="stat-box"><span class="num green" id="syncedCount">0</span><span class="label">🔄 مزامنة</span></div>
            <div class="stat-box"><span class="num orange" id="cdnFilesCount">0</span><span class="label">🌐 CDN</span></div>
        </div>

        <div class="grid" id="grid"></div>
    </div>
</div>

<!-- لوحة المربع -->
<div class="tile-panel" id="tilePanel">
    <div class="panel-header"><h3 id="panelTitle">📦 المربع</h3><button onclick="closePanel()">✖</button></div>
    <div class="info-grid">
        <div class="info-item"><span>📍 الموقع</span><span class="value" id="panelLocation">(0,0)</span></div>
        <div class="info-item"><span>🔄 الحالة</span><span class="value offline" id="panelStatus">⚪ غير نشط</span></div>
        <div class="info-item"><span>🛡️ الحماية</span><span class="value" id="panelProtected">❌</span></div>
        <div class="info-item"><span>📄 الملفات</span><span class="value" id="panelFileCount">0</span></div>
        <div class="info-item"><span>🔄 المزامنة</span><span class="value" id="panelSync">❌</span></div>
    </div>
    <div class="file-list" id="panelFiles"></div>
    <div class="actions">
        <button class="btn-upload" onclick="uploadFile()">📤 رفع</button>
        <button class="btn-start" onclick="toggleServer()" id="panelStartBtn">▶️ تشغيل</button>
        <button class="btn-protect" onclick="toggleProtect()" id="panelProtectBtn">🛡️ حماية</button>
        <button class="btn-delete" onclick="clearTile()">🗑️ تفريغ</button>
        <button class="btn-sync" onclick="syncTileToChannel()">🔄 مزامنة</button>
    </div>
</div>

<!-- محرر الملفات -->
<div class="file-editor" id="fileEditor">
    <div class="editor-header"><h4 id="editorTitle">📝 تحرير</h4><button onclick="closeEditor()">✖</button></div>
    <textarea id="editorContent" spellcheck="false"></textarea>
    <div class="editor-actions"><button class="btn-save" onclick="saveFile()">💾 حفظ</button><button class="btn-close" onclick="closeEditor()">✖ إلغاء</button></div>
</div>

<!-- توست -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
// 🔐 المصادقة
// ============================================================
const ADMIN = { username: 'admin', password: 'admin123' };
let isAdmin = false;

function adminLogin() {
    const u = document.getElementById('admin-username').value.trim();
    const p = document.getElementById('admin-password').value.trim();
    if (u === ADMIN.username && p === ADMIN.password) {
        isAdmin = true;
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('admin-container').style.display = 'block';
        document.getElementById('admin-name-display').textContent = u;
        showToast('👑 مرحباً!', 'admin');
        setTimeout(() => ServerManager.init(), 100);
    } else {
        document.getElementById('auth-error').textContent = '❌ خطأ';
        document.getElementById('auth-error').style.display = 'block';
    }
}

function logoutAdmin() {
    if (confirm('🚪 خروج؟')) {
        isAdmin = false;
        if (AutoReceiver) AutoReceiver.stop();
        document.getElementById('admin-container').style.display = 'none';
        document.getElementById('auth-overlay').style.display = 'flex';
    }
}

// ============================================================
// 💬 توست
// ============================================================
function showToast(msg, type = 'info') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + type;
    t.style.display = 'block';
    clearTimeout(t._timeout);
    t._timeout = setTimeout(() => t.style.display = 'none', 4000);
}

// ============================================================
// 🗄️ ServerManager
// ============================================================
const ServerManager = {
    tiles: {},
    protectedTiles: new Set(),
    activeServers: new Set(),
    syncedTiles: new Set(),

    init() {
        this.loadTiles();
        this.loadTelegramSettings();
        this.renderGrid();
        this.updateStats();
        showToast('✅ جاهز', 'success');
    },

    loadTiles() {
        const saved = localStorage.getItem('tiles');
        if (saved) {
            try {
                this.tiles = JSON.parse(saved);
                const p = localStorage.getItem('protected');
                if (p) this.protectedTiles = new Set(JSON.parse(p));
                const s = localStorage.getItem('synced');
                if (s) this.syncedTiles = new Set(JSON.parse(s));
                return;
            } catch(e) {}
        }
        for (let r = 0; r < 12; r++) {
            for (let c = 0; c < 12; c++) {
                const id = r + '_' + c;
                this.tiles[id] = { id, row: r, col: c, files: {}, created: Date.now() };
            }
        }
        this.saveTiles();
    },

    saveTiles() {
        localStorage.setItem('tiles', JSON.stringify(this.tiles));
        localStorage.setItem('protected', JSON.stringify(Array.from(this.protectedTiles)));
        localStorage.setItem('synced', JSON.stringify(Array.from(this.syncedTiles)));
    },

    renderGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        for (let r = 0; r < 12; r++) {
            for (let c = 0; c < 12; c++) {
                const id = r + '_' + c;
                const tile = this.tiles[id];
                if (!tile) continue;
                const isProtected = this.protectedTiles.has(id);
                const isActive = this.activeServers.has(id);
                const isSynced = this.syncedTiles.has(id);
                const fileCount = tile.files ? Object.keys(tile.files).length : 0;
                const div = document.createElement('div');
                div.className = 'tile';
                if (fileCount > 0) div.classList.add('has-files');
                if (isProtected) div.classList.add('protected');
                div.dataset.tile = id;
                let html = `<div class="icon">📦</div>`;
                html += `<div class="label">${r},${c}</div>`;
                html += `<div class="status ${isActive ? 'running' : 'offline'}">${isActive ? '🟢' : '⚪'}</div>`;
                if (fileCount > 0) html += `<div class="badge">${fileCount}</div>`;
                if (isSynced) html += `<div class="sync-badge">🔄</div>`;
                div.innerHTML = html;
                div.onclick = () => this.openPanel(id);
                grid.appendChild(div);
            }
        }
        this.updateStats();
    },

    updateStats() {
        const total = Object.keys(this.tiles).length;
        const online = this.activeServers.size;
        let files = 0;
        for (const t of Object.values(this.tiles)) {
            if (t && t.files) files += Object.keys(t.files).length;
        }
        document.getElementById('totalTiles').textContent = total;
        document.getElementById('onlineTiles').textContent = online;
        document.getElementById('filesCount').textContent = files;
        document.getElementById('protectedCount').textContent = this.protectedTiles.size;
        document.getElementById('syncedCount').textContent = this.syncedTiles.size;
        document.getElementById('cdnFilesCount').textContent = files;
    },

    openPanel(id) {
        if (!isAdmin) return;
        const tile = this.tiles[id];
        if (!tile) return;
        this.currentTile = id;
        const panel = document.getElementById('tilePanel');
        panel.classList.add('open');
        document.getElementById('panelTitle').textContent = `📦 المربع (${tile.row}, ${tile.col})`;
        document.getElementById('panelLocation').textContent = `(${tile.row}, ${tile.col})`;
        const isActive = this.activeServers.has(id);
        const st = document.getElementById('panelStatus');
        st.textContent = isActive ? '🟢 نشط' : '⚪ غير نشط';
        st.className = 'value ' + (isActive ? 'online' : 'offline');
        const isProtected = this.protectedTiles.has(id);
        document.getElementById('panelProtected').textContent = isProtected ? '✅' : '❌';
        document.getElementById('panelProtected').style.color = isProtected ? '#4ade80' : '#f87171';
        const isSynced = this.syncedTiles.has(id);
        document.getElementById('panelSync').textContent = isSynced ? '✅' : '❌';
        document.getElementById('panelSync').style.color = isSynced ? '#4ade80' : '#f87171';
        document.getElementById('panelStartBtn').textContent = isActive ? '⏹️ إيقاف' : '▶️ تشغيل';
        document.getElementById('panelProtectBtn').textContent = isProtected ? '🔓 إزالة' : '🛡️ حماية';
        this.renderFiles(tile);
        document.getElementById('panelFileCount').textContent = tile.files ? Object.keys(tile.files).length : 0;
    },

    renderFiles(tile) {
        const container = document.getElementById('panelFiles');
        container.innerHTML = '';
        if (!tile || !tile.files || Object.keys(tile.files).length === 0) {
            container.innerHTML = '<div style="color:#666;font-size:11px;text-align:center;padding:10px;">📭 لا توجد ملفات</div>';
            return;
        }
        for (const [name, content] of Object.entries(tile.files)) {
            const div = document.createElement('div');
            div.className = 'file-item';
            const isMeta = content && content.trim().startsWith('[METADATA]');
            const size = new Blob([content]).size;
            const sizeStr = size < 1024 ? size + 'B' : (size / 1024).toFixed(1) + 'KB';
            div.innerHTML = `
                <span class="name">${name}${isMeta ? ' ⚠️' : ''}</span>
                <span class="size">${sizeStr}</span>
                <span class="actions">
                    <button class="edit" onclick="ServerManager.editFile('${tile.id}','${name}')">✏️</button>
                    <button class="sync" onclick="ServerManager.syncFile('${tile.id}','${name}')">🔄</button>
                    <button onclick="ServerManager.downloadFile('${tile.id}','${name}')">⬇️</button>
                    <button class="delete" onclick="ServerManager.deleteFile('${tile.id}','${name}')">🗑️</button>
                </span>
            `;
            container.appendChild(div);
        }
    },

    editFile(tileId, fileName) {
        if (!isAdmin) return;
        const tile = this.tiles[tileId];
        if (!tile || !tile.files || !tile.files[fileName]) return;
        this.currentTile = tileId;
        this.currentFile = fileName;
        const editor = document.getElementById('fileEditor');
        editor.classList.add('open');
        document.getElementById('editorTitle').textContent = '📝 ' + fileName;
        document.getElementById('editorContent').value = tile.files[fileName];
    },

    saveFile() {
        if (!this.currentTile || !this.currentFile) return;
        const content = document.getElementById('editorContent').value;
        this.tiles[this.currentTile].files[this.currentFile] = content;
        this.saveTiles();
        this.renderGrid();
        this.updateStats();
        this.closeEditor();
        showToast('✅ تم الحفظ', 'success');
    },

    closeEditor() {
        document.getElementById('fileEditor').classList.remove('open');
        this.currentFile = null;
    },

    downloadFile(tileId, fileName) {
        const tile = this.tiles[tileId];
        if (!tile || !tile.files || !tile.files[fileName]) return;
        const blob = new Blob([tile.files[fileName]], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(url);
    },

    deleteFile(tileId, fileName) {
        if (!confirm('🗑️ حذف ' + fileName + '؟')) return;
        const tile = this.tiles[tileId];
        if (tile && tile.files) {
            delete tile.files[fileName];
            this.saveTiles();
            this.renderGrid();
            this.updateStats();
            this.renderFiles(tile);
            showToast('🗑️ تم الحذف', 'warning');
        }
    },

    uploadFile() {
        if (!this.currentTile) return;
        const input = document.createElement('input');
        input.type = 'file';
        input.multiple = true;
        input.onchange = (e) => {
            const files = e.target.files;
            let count = 0;
            for (const file of files) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const tile = this.tiles[this.currentTile];
                    if (!tile.files) tile.files = {};
                    tile.files[file.name] = ev.target.result;
                    this.saveTiles();
                    this.renderGrid();
                    this.updateStats();
                    this.renderFiles(tile);
                    count++;
                    if (count === files.length) showToast('✅ تم رفع ' + count + ' ملف', 'success');
                };
                reader.readAsText(file);
            }
        };
        input.click();
    },

    toggleServer() {
        if (!this.currentTile) return;
        const id = this.currentTile;
        if (this.activeServers.has(id)) {
            this.activeServers.delete(id);
            showToast('⏹️ تم الإيقاف', 'warning');
        } else {
            this.activeServers.add(id);
            showToast('🟢 تم التشغيل', 'success');
        }
        this.renderGrid();
        this.updateStats();
        this.openPanel(id);
    },

    toggleProtect() {
        if (!this.currentTile) return;
        const id = this.currentTile;
        if (this.protectedTiles.has(id)) {
            this.protectedTiles.delete(id);
            showToast('🔓 تم الإزالة', 'warning');
        } else {
            this.protectedTiles.add(id);
            showToast('🛡️ تم التفعيل', 'success');
        }
        this.saveTiles();
        this.renderGrid();
        this.updateStats();
        this.openPanel(id);
    },

    clearTile() {
        if (!this.currentTile || !confirm('🗑️ تفريغ المربع؟')) return;
        const tile = this.tiles[this.currentTile];
        if (tile) {
            tile.files = {};
            this.activeServers.delete(this.currentTile);
            this.protectedTiles.delete(this.currentTile);
            this.syncedTiles.delete(this.currentTile);
            this.saveTiles();
            this.renderGrid();
            this.updateStats();
            this.openPanel(this.currentTile);
            showToast('🗑️ تم التفريغ', 'warning');
        }
    },

    syncFile: async function(tileId, fileName) {
        const token = localStorage.getItem('bot_token');
        const chatId = localStorage.getItem('chat_id');
        if (!token || !chatId) {
            showToast('⚠️ قم بإعداد القناة', 'warning');
            return;
        }
        const tile = this.tiles[tileId];
        if (!tile || !tile.files || !tile.files[fileName]) {
            showToast('❌ الملف غير موجود', 'error');
            return;
        }
        try {
            const [r, c] = tileId.split('_');
            const name = 'tile_' + r + '_' + c + '_' + fileName;
            const content = tile.files[fileName];
            const blob = new Blob([content], { type: 'text/plain' });
            const file = new File([blob], name);
            const form = new FormData();
            form.append('chat_id', chatId);
            form.append('document', file);
            const resp = await fetch('https://api.telegram.org/bot' + token + '/sendDocument', {
                method: 'POST',
                body: form
            });
            const data = await resp.json();
            if (data.ok) {
                this.syncedTiles.add(tileId);
                this.saveTiles();
                this.renderGrid();
                this.updateStats();
                this.openPanel(tileId);
                showToast('✅ تم المزامنة', 'success');
            } else {
                showToast('❌ فشل: ' + data.description, 'error');
            }
        } catch(e) {
            showToast('❌ خطأ', 'error');
        }
    },

    syncTileToChannel: async function() {
        if (!this.currentTile) return;
        const tile = this.tiles[this.currentTile];
        if (!tile || !tile.files) {
            showToast('❌ لا توجد ملفات', 'error');
            return;
        }
        let synced = 0;
        for (const f of Object.keys(tile.files)) {
            await this.syncFile(this.currentTile, f);
            synced++;
        }
        if (synced > 0) showToast('✅ تم مزامنة ' + synced + ' ملف', 'success');
    },

    syncAllFromChannel: async function() {
        const token = localStorage.getItem('bot_token');
        const chatId = localStorage.getItem('chat_id');
        if (!token || !chatId) {
            showToast('⚠️ قم بإعداد القناة', 'warning');
            return;
        }
        showToast('🔄 جاري...', 'info');
        try {
            const resp = await fetch('https://api.telegram.org/bot' + token + '/getUpdates?limit=100');
            const data = await resp.json();
            if (!data.ok) {
                showToast('❌ فشل', 'error');
                return;
            }
            let count = 0;
            for (const update of data.result) {
                const post = update.channel_post || update.message;
                if (!post || !post.document) continue;
                const fileName = post.document.file_name || '';
                const match = fileName.match(/^tile_(\d+)_(\d+)_(.+)$/);
                if (!match) continue;
                const r = parseInt(match[1]), c = parseInt(match[2]);
                const actual = match[3], id = r + '_' + c;
                const fr = await fetch('https://api.telegram.org/bot' + token + '/getFile?file_id=' + post.document.file_id);
                const fd = await fr.json();
                let content = null;
                if (fd.ok) {
                    try {
                        const cr = await fetch('https://api.telegram.org/file/bot' + token + '/' + fd.result.file_path);
                        content = await cr.text();
                    } catch(e) {}
                }
                if (!this.tiles[id]) {
                    this.tiles[id] = { id, row: r, col: c, files: {}, created: Date.now() };
                }
                if (content !== null) {
                    this.tiles[id].files[actual] = content;
                } else {
                    this.tiles[id].files[actual] = '[METADATA]\nfile_name: ' + fileName + '\nfile_id: ' + post.document.file_id + '\nreceived: ' + new Date().toISOString();
                }
                this.syncedTiles.add(id);
                count++;
            }
            this.saveTiles();
            this.renderGrid();
            this.updateStats();
            showToast('✅ تم جلب ' + count + ' ملف', 'success');
        } catch(e) {
            showToast('❌ فشل', 'error');
        }
    },

    loadTelegramSettings() {
        document.getElementById('tgBotToken').value = localStorage.getItem('bot_token') || '';
        document.getElementById('tgChatId').value = localStorage.getItem('chat_id') || '';
    },

    saveTelegramSettings() {
        const token = document.getElementById('tgBotToken').value.trim();
        const chatId = document.getElementById('tgChatId').value.trim();
        if (!token || !chatId) {
            showToast('⚠️ أكمل الحقول', 'warning');
            return;
        }
        localStorage.setItem('bot_token', token);
        localStorage.setItem('chat_id', chatId);
        showToast('✅ تم الحفظ', 'success');
    },

    testTelegramConnection: async function() {
        const token = document.getElementById('tgBotToken').value.trim();
        if (!token) {
            showToast('⚠️ أدخل Bot Token', 'warning');
            return;
        }
        try {
            const resp = await fetch('https://api.telegram.org/bot' + token + '/getMe');
            const data = await resp.json();
            if (data.ok) {
                showToast('✅ متصل: @' + data.result.username, 'success');
                document.getElementById('tgStatus').className = 'status online';
                document.getElementById('tgStatus').textContent = '🟢 متصل';
            } else {
                showToast('❌ فشل', 'error');
            }
        } catch(e) {
            showToast('❌ خطأ', 'error');
        }
    },

    exportAllTiles() {
        const data = {
            tiles: this.tiles,
            protected: Array.from(this.protectedTiles),
            synced: Array.from(this.syncedTiles)
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'backup_' + Date.now() + '.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast('📤 تم التصدير', 'admin');
    },

    importAllTiles(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                this.tiles = data.tiles || this.tiles;
                this.protectedTiles = new Set(data.protected || []);
                this.syncedTiles = new Set(data.synced || []);
                this.saveTiles();
                this.renderGrid();
                this.updateStats();
                showToast('📥 تم الاستيراد', 'admin');
            } catch(err) {
                showToast('❌ فشل', 'error');
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    },

    resetAll() {
        if (!confirm('⚠️ إعادة تعيين كل شيء؟')) return;
        localStorage.removeItem('tiles');
        localStorage.removeItem('protected');
        localStorage.removeItem('synced');
        localStorage.removeItem('bot_token');
        localStorage.removeItem('chat_id');
        this.tiles = {};
        this.protectedTiles = new Set();
        this.activeServers = new Set();
        this.syncedTiles = new Set();
        this.loadTiles();
        this.saveTiles();
        this.renderGrid();
        this.updateStats();
        this.closePanel();
        showToast('🔄 تم إعادة التعيين', 'warning');
    },

    closePanel() {
        document.getElementById('tilePanel').classList.remove('open');
    }
};

// 🔄 AutoReceiver
// ============================================================
const AutoReceiver = {
    interval: null,
    isRunning: false,
    lastUpdateId: 0,
    seenIds: new Set(),

    init() {
        const saved = localStorage.getItem('receiver_last_id');
        if (saved) this.lastUpdateId = parseInt(saved) || 0;
        const ids = localStorage.getItem('receiver_seen_ids');
        if (ids) this.seenIds = new Set(JSON.parse(ids));
    },

    start() {
        if (this.isRunning) return;
        const token = localStorage.getItem('bot_token');
        const chatId = localStorage.getItem('chat_id');
        if (!token || !chatId) {
            showToast('⚠️ إعدادات القناة مطلوبة', 'warning');
            return;
        }
        this.isRunning = true;
        this.updateUI();
        this.doSync();
        this.interval = setInterval(() => this.doSync(), 30000);
        showToast('▶️ بدأ الاستقبال', 'success');
    },

    stop() {
        this.isRunning = false;
        if (this.interval) { clearInterval(this.interval); this.interval = null; }
        this.updateUI();
        showToast('⏸️ توقف', 'warning');
    },

    toggle() { this.isRunning ? this.stop() : this.start(); },

    async doSync() {
        if (!this.isRunning) return;
        const token = localStorage.getItem('bot_token');
        const chatId = localStorage.getItem('chat_id');
        if (!token || !chatId) return;

        try {
            const url = 'https://api.telegram.org/bot' + token + '/getUpdates?limit=100' +
                        (this.lastUpdateId > 0 ? '&offset=' + (this.lastUpdateId + 1) : '');
            const resp = await fetch(url);
            const data = await resp.json();
            if (!data.ok) { this.setError(true); return; }

            let newFiles = 0;
            for (const update of data.result) {
                if (update.update_id > this.lastUpdateId) this.lastUpdateId = update.update_id;
                const msg = update.channel_post || update.message;
                if (!msg || !msg.document) continue;
                const fileName = msg.document.file_name || '';
                const fileId = msg.document.file_id;
                if (this.seenIds.has(fileId)) continue;
                this.seenIds.add(fileId);
                const match = fileName.match(/^tile_(\d+)_(\d+)_(.+)$/);
                if (!match) continue;
                const r = parseInt(match[1]), c = parseInt(match[2]);
                const actual = match[3], id = r + '_' + c;
                const fr = await fetch('https://api.telegram.org/bot' + token + '/getFile?file_id=' + fileId);
                const fd = await fr.json();
                let content = null;
                if (fd.ok) {
                    try {
                        const cr = await fetch('https://api.telegram.org/file/bot' + token + '/' + fd.result.file_path);
                        content = await cr.text();
                    } catch(e) {}
                }
                if (!ServerManager.tiles[id]) {
                    ServerManager.tiles[id] = { id, row: r, col: c, files: {}, created: Date.now() };
                }
                if (content !== null) {
                    ServerManager.tiles[id].files[actual] = content;
                } else {
                    ServerManager.tiles[id].files[actual] = '[METADATA]\nfile_name: ' + fileName + '\nfile_id: ' + fileId + '\nreceived: ' + new Date().toISOString();
                }
                ServerManager.syncedTiles.add(id);
                newFiles++;
                showToast('📥 ' + actual + ' → (' + r + ',' + c + ')', 'success');
            }
            localStorage.setItem('receiver_last_id', this.lastUpdateId);
            localStorage.setItem('receiver_seen_ids', JSON.stringify(Array.from(this.seenIds)));
            if (newFiles > 0) {
                ServerManager.saveTiles();
                ServerManager.renderGrid();
                ServerManager.updateStats();
                showToast('📥 ' + newFiles + ' ملف جديد', 'success');
            }
            this.setError(false);
            this.updateLastSyncTime();
        } catch(e) {
            this.setError(true);
        }
    },

    setError(err) {
        const dot = document.getElementById('syncDot');
        if (err) { dot.className = 'sync-dot error'; } else { dot.className = 'sync-dot active'; }
    },

    updateUI() {
        const btn = document.getElementById('btnToggleAutoSync');
        const st = document.getElementById('syncStatusText');
        const dot = document.getElementById('syncDot');
        if (this.isRunning) {
            btn.textContent = '⏸️ إيقاف';
            btn.className = 'btn-toggle';
            st.textContent = '🟢 نشط';
            st.style.color = '#4ade80';
            dot.className = 'sync-dot active';
        } else {
            btn.textContent = '▶️ تشغيل';
            btn.className = 'btn-toggle off';
            st.textContent = '⏸️ متوقف';
            st.style.color = '#888';
            dot.className = 'sync-dot';
        }
    },

    updateLastSyncTime() {
        document.getElementById('syncLastTime').textContent = ' | ' + new Date().toLocaleTimeString('ar-SA');
    },

    reset() {
        this.stop();
        this.lastUpdateId = 0;
        this.seenIds.clear();
        localStorage.removeItem('receiver_last_id');
        localStorage.removeItem('receiver_seen_ids');
        this.updateUI();
    }
};

function toggleAutoSync() { AutoReceiver.toggle(); }
function forceSyncNow() { AutoReceiver.doSync(); }

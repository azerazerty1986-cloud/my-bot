<!-- ================== قسم المورد ================== -->
<div id="add-supplier" class="sub-section" style="display: none;">
    <div class="main-card">
        <h6 class="text-center mb-4"><i class="material-icons-round text-success">business</i> إضافة مورد جديد</h6>
        
        <div class="mb-3">
            <label class="form-label">اسم المورد <span class="text-danger">*</span></label>
            <input type="text" id="new-supplier-name" class="form-control" placeholder="اسم المورد">
        </div>
        
        <div class="row">
            <div class="col-6">
                <div class="mb-3">
                    <label class="form-label">رقم الهاتف</label>
                    <input type="tel" id="new-supplier-phone" class="form-control" placeholder="رقم الهاتف">
                </div>
            </div>
            <div class="col-6">
                <div class="mb-3">
                    <label class="form-label">رقم هاتف آخر</label>
                    <input type="tel" id="new-supplier-phone2" class="form-control" placeholder="رقم آخر">
                </div>
            </div>
        </div>
        
        <div class="mb-3">
            <label class="form-label">البريد الإلكتروني</label>
            <input type="email" id="new-supplier-email" class="form-control" placeholder="email@example.com">
        </div>
        
        <div class="row">
            <div class="col-4">
                <div class="mb-3">
                    <label class="form-label">المحافظة</label>
                    <input type="text" id="new-supplier-governorate" class="form-control" placeholder="المحافظة">
                </div>
            </div>
            <div class="col-4">
                <div class="mb-3">
                    <label class="form-label">المدينة</label>
                    <input type="text" id="new-supplier-city" class="form-control" placeholder="المدينة">
                </div>
            </div>
            <div class="col-4">
                <div class="mb-3">
                    <label class="form-label">الشارع</label>
                    <input type="text" id="new-supplier-street" class="form-control" placeholder="الشارع">
                </div>
            </div>
        </div>
        
        <div class="mb-3">
            <label class="form-label">العنوان بالكامل</label>
            <textarea id="new-supplier-address" class="form-control" rows="2" placeholder="العنوان بالتفصيل"></textarea>
        </div>
        
        <div class="row">
            <div class="col-6">
                <div class="mb-3">
                    <label class="form-label">الرقم الضريبي</label>
                    <input type="text" id="new-supplier-tax" class="form-control" placeholder="الرقم الضريبي">
                </div>
            </div>
            <div class="col-6">
                <div class="mb-3">
                    <label class="form-label">السجل التجاري</label>
                    <input type="text" id="new-supplier-commercial" class="form-control" placeholder="السجل التجاري">
                </div>
            </div>
        </div>
        
        <div class="mb-3">
            <label class="form-label">ملاحظات</label>
            <textarea id="new-supplier-notes" class="form-control" rows="3" placeholder="ملاحظات إضافية"></textarea>
        </div>
        
        <button class="btn btn-success w-100 py-3" onclick="supplierModule.saveNewSupplier()">
            <i class="material-icons-round">save</i> حفظ المورد
        </button>
    </div>
</div>

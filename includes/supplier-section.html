<!-- ================== قسم الموردين ================== -->
<div id="supplier" class="section">
    <div class="main-card">
        <h5 class="text-center mb-4">🤝 إدارة الموردين</h5>
        
        <div class="row g-2 mb-3">
            <div class="col-8">
                <input type="text" id="supplier-name" class="form-control" placeholder="اسم المورد">
            </div>
            <div class="col-4">
                <input type="text" id="supplier-phone" class="form-control" placeholder="رقم الهاتف">
            </div>
        </div>
        
        <div class="row g-2 mb-3">
            <div class="col-6">
                <input type="email" id="supplier-email" class="form-control" placeholder="البريد الإلكتروني">
            </div>
            <div class="col-6">
                <input type="text" id="supplier-address" class="form-control" placeholder="العنوان">
            </div>
        </div>
        
        <div class="row g-2 mb-3">
            <div class="col-12">
                <textarea id="supplier-notes" class="form-control" rows="2" placeholder="ملاحظات"></textarea>
            </div>
        </div>
        
        <button class="btn btn-success w-100 mb-4" onclick="supplierModule.addSupplierFromForm()">
            <i class="material-icons-round">person_add</i> إضافة مورد
        </button>
        
        <div class="input-group mb-3">
            <span class="input-group-text"><i class="material-icons-round">search</i></span>
            <input type="text" id="supplier-search" class="form-control" 
                   placeholder="بحث عن مورد..." 
                   oninput="supplierModule.searchSuppliers()">
        </div>
        
        <div class="table-responsive">
            <table class="table-custom">
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>الهاتف</th>
                        <th>البريد</th>
                        <th>المبيعات</th>
                        <th>ديون</th>
                        <th>عمليات</th>
                    </tr>
                </thead>
                <tbody id="suppliers-full-tbody">
                    <tr>
                        <td colspan="6" class="text-center p-4">
                            <i class="material-icons-round" style="font-size:48px;">business</i>
                            <br>لا يوجد موردين
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

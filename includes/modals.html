<!-- ================== النوافذ المنبثقة ================== -->
<!-- تعديل فاتورة المبيعات -->
<div class="modal fade" id="editInvoiceModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5>تعديل الفاتورة <span id="edit-invoice-number"></span></h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="edit-invoice-items-container"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button class="btn btn-primary" onclick="salesModule.updateInvoice()">حفظ</button>
            </div>
        </div>
    </div>
</div>

<!-- تعديل فاتورة الشراء -->
<div class="modal fade" id="editPurchaseInvoiceModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5>تعديل فاتورة شراء <span id="edit-purchase-invoice-number"></span></h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="edit-purchase-invoice-items-container"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button class="btn btn-primary" onclick="purchasesModule.updatePurchaseInvoice()">حفظ</button>
            </div>
        </div>
    </div>
</div>

<!-- ماسح الباركود -->
<div class="modal fade" id="barcodeScannerModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5>مسح الباركود</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="barcode-video" style="width:100%; height:300px; background:#000;"></div>
                <p class="text-center" id="barcode-result"></p>
            </div>
        </div>
    </div>
</div>

<!-- عرض الصورة المكبرة -->
<div class="modal fade" id="imageModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-body text-center">
                <img id="modal-image" src="#" style="max-width:100%">
            </div>
        </div>
    </div>
</div>

<!-- إضافة منتج سريع -->
<div class="modal fade" id="quickAddProductModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5>إضافة منتج سريع</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="text" id="quick-product-name" class="form-control mb-2" readonly>
                <div class="row">
                    <div class="col-6"><input type="number" id="quick-sell-price" class="form-control" placeholder="سعر البيع"></div>
                    <div class="col-6"><input type="number" id="quick-buy-price" class="form-control" placeholder="سعر الشراء"></div>
                </div>
                <select id="quick-unit" class="form-select my-2">
                    <option>قطعة</option>
                </select>
                <div class="row">
                    <div class="col-6"><input type="number" id="quick-cart-qty" class="form-control" value="1"></div>
                    <div class="col-6"><input type="number" id="quick-discount" class="form-control" value="0"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button class="btn btn-primary" onclick="inventoryModule.saveQuickProduct()">حفظ</button>
            </div>
        </div>
    </div>
</div>

<!-- تعديل المنتج -->
<div class="modal fade" id="editProductModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5>تعديل المنتج</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-product-idx">
                <input type="text" id="edit-product-name" class="form-control mb-2">
                <input type="number" id="edit-product-sell" class="form-control mb-2">
                <input type="number" id="edit-product-buy" class="form-control mb-2">
                <input type="number" id="edit-product-qty" class="form-control mb-2">
                <select id="edit-product-unit" class="form-select mb-2">
                    <option>قطعة</option>
                </select>
                <div id="edit-current-image"></div>
                <input type="file" id="edit-product-image" class="form-control">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button class="btn btn-primary" onclick="inventoryModule.updateProduct()">حفظ</button>
            </div>
        </div>
    </div>
</div>

<!-- نافذة عرض تفاصيل الفاتورة -->
<div class="modal fade" id="invoiceDetailsModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title"><i class="material-icons-round">receipt</i> تفاصيل الفاتورة</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="invoice-details-content"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إغلاق</button>
                <button type="button" class="btn btn-primary" onclick="printInvoiceDetails()">
                    <i class="material-icons-round">print</i> طباعة
                </button>
            </div>
        </div>
    </div>
</div>

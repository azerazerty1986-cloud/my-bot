<!-- ================== النوافذ المنبثقة ================== -->

<!-- ماسح الباركود -->
<div class="modal fade" id="barcodeScannerModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5>🔍 مسح الباركود</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="barcode-video" style="width:100%; height:300px; background:#000; border-radius: 10px;"></div>
                <p class="text-center mt-3" id="barcode-result">بانتظار المسح...</p>
            </div>
        </div>
    </div>
</div>

<!-- عرض الصورة المكبرة -->
<div class="modal fade" id="imageModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-body text-center">
                <img id="modal-image" src="#" style="max-width:100%; border-radius: 10px;">
            </div>
        </div>
    </div>
</div>

<!-- إضافة منتج سريع -->
<div class="modal fade" id="quickAddProductModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5>⚡ إضافة منتج سريع</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="text" id="quick-product-name" class="form-control mb-2" placeholder="اسم المنتج">
                <div class="row g-2 mb-2">
                    <div class="col-6">
                        <input type="number" id="quick-sell-price" class="form-control" placeholder="سعر البيع">
                    </div>
                    <div class="col-6">
                        <input type="number" id="quick-buy-price" class="form-control" placeholder="سعر الشراء">
                    </div>
                </div>
                <div class="row g-2">
                    <div class="col-6">
                        <input type="number" id="quick-qty" class="form-control" value="1" min="1">
                    </div>
                    <div class="col-6">
                        <select id="quick-unit" class="form-select">
                            <option value="قطعة">قطعة</option>
                            <option value="كغ">كغ</option>
                            <option value="لتر">لتر</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button type="button" class="btn btn-primary" onclick="saveQuickProduct()">حفظ</button>
            </div>
        </div>
    </div>
</div>

<!-- تعديل المنتج -->
<div class="modal fade" id="editProductModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5>✏️ تعديل المنتج</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-product-id">
                <input type="text" id="edit-product-name" class="form-control mb-2" placeholder="اسم المنتج">
                <div class="row g-2 mb-2">
                    <div class="col-6">
                        <input type="number" id="edit-product-sell" class="form-control" placeholder="سعر البيع">
                    </div>
                    <div class="col-6">
                        <input type="number" id="edit-product-buy" class="form-control" placeholder="سعر الشراء">
                    </div>
                </div>
                <input type="number" id="edit-product-qty" class="form-control mb-2" placeholder="الكمية">
                <select id="edit-product-unit" class="form-select mb-2">
                    <option value="قطعة">قطعة</option>
                    <option value="كغ">كغ</option>
                    <option value="لتر">لتر</option>
                </select>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button type="button" class="btn btn-primary" onclick="updateProduct()">حفظ</button>
            </div>
        </div>
    </div>
</div>

<!-- تأكيد الحذف -->
<div class="modal fade" id="confirmDeleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5>⚠️ تأكيد الحذف</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>هل أنت متأكد من حذف هذا العنصر؟</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button type="button" class="btn btn-danger" id="confirm-delete-btn">نعم، احذف</button>
            </div>
        </div>
    </div>
</div>

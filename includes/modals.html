<!-- ================== النوافذ المنبثقة المتقدمة ================== -->

<!-- ===== نافذة ماسح الباركود ===== -->
<div class="modal fade" id="barcodeScannerModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="material-icons-round">qr_code_scanner</i> مسح الباركود
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="barcode-scanner-container" style="width:100%; height:300px; background:#000; border-radius:10px; position:relative; overflow:hidden;">
                    <video id="barcode-video" style="width:100%; height:100%; object-fit:cover;"></video>
                    <div style="position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.7); color:white; padding:8px 15px; border-radius:20px; font-size:14px;">
                        <span id="barcode-status">بانتظار المسح...</span>
                    </div>
                    <div style="position:absolute; bottom:20px; left:50%; transform:translateX(-50%); width:80%; height:2px; background:rgba(255,0,0,0.5); box-shadow:0 0 10px red;"></div>
                </div>
                
                <div class="mt-3 text-center">
                    <div class="btn-group" role="group">
                        <button class="btn btn-primary" onclick="startBarcodeScanner()">
                            <i class="material-icons-round">play_arrow</i> بدء المسح
                        </button>
                        <button class="btn btn-secondary" onclick="stopBarcodeScanner()">
                            <i class="material-icons-round">stop</i> إيقاف
                        </button>
                    </div>
                </div>
                
                <div class="mt-3">
                    <label class="form-label">الباركود المقروء:</label>
                    <div class="input-group">
                        <input type="text" id="scanned-barcode" class="form-control" readonly placeholder="سيظهر هنا الباركود">
                        <button class="btn btn-success" onclick="useScannedBarcode()">
                            <i class="material-icons-round">check</i> استخدام
                        </button>
                        <button class="btn btn-outline-secondary" onclick="copyScannedBarcode()">
                            <i class="material-icons-round">content_copy</i>
                        </button>
                    </div>
                </div>
                
                <div class="mt-2 text-muted small">
                    <i class="material-icons-round" style="font-size:14px;">info</i> وجه الكاميرا نحو الباركود لمسحه تلقائياً
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ===== نافذة إضافة منتج سريع ===== -->
<div class="modal fade" id="quickAddProductModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="material-icons-round">flash_on</i> إضافة منتج سريع
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="quick-product-form">
                    <div class="mb-3">
                        <label class="form-label">اسم المنتج <span class="text-danger">*</span></label>
                        <input type="text" id="quick-product-name" class="form-control" required>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label">سعر الشراء</label>
                            <input type="number" id="quick-buy-price" class="form-control" step="0.01">
                        </div>
                        <div class="col-6">
                            <label class="form-label">سعر البيع</label>
                            <input type="number" id="quick-sell-price" class="form-control" step="0.01">
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label">الكمية</label>
                            <input type="number" id="quick-quantity" class="form-control" value="0">
                        </div>
                        <div class="col-6">
                            <label class="form-label">الوحدة</label>
                            <select id="quick-unit" class="form-select">
                                <option value="قطعة">قطعة</option>
                                <option value="كغ">كغ</option>
                                <option value="لتر">لتر</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">الباركود</label>
                        <div class="input-group">
                            <input type="text" id="quick-barcode" class="form-control" placeholder="اختياري">
                            <button class="btn btn-outline-primary" type="button" onclick="openBarcodeScanner('quick-barcode')">
                                <i class="material-icons-round">qr_code_scanner</i>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button type="button" class="btn btn-primary" onclick="saveQuickProduct()">حفظ المنتج</button>
            </div>
        </div>
    </div>
</div>

<!-- ===== نافذة عرض الصورة المكبرة ===== -->
<div class="modal fade" id="imageModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="material-icons-round">image</i> عرض الصورة
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <img id="modal-image" src="#" style="max-width:100%; max-height:500px; border-radius:10px;">
            </div>
        </div>
    </div>
</div>

<!-- ===== نافذة تأكيد الحذف ===== -->
<div class="modal fade" id="confirmDeleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title text-danger">
                    <i class="material-icons-round">warning</i> تأكيد الحذف
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p id="delete-message">هل أنت متأكد من حذف هذا العنصر؟</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button type="button" class="btn btn-danger" id="confirm-delete-btn">نعم، احذف</button>
            </div>
        </div>
    </div>
</div>

<!-- ===== نافذة إشعار ===== -->
<div class="modal fade" id="notificationModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-body text-center p-4">
                <i class="material-icons-round" id="notification-icon" style="font-size:48px;"></i>
                <h5 id="notification-title" class="mt-2"></h5>
                <p id="notification-message"></p>
                <button class="btn btn-primary mt-2" data-bs-dismiss="modal">حسناً</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ================== دوال ماسح الباركود ==================
    let barcodeScannerActive = false;
    let lastScannedBarcode = '';
    let currentBarcodeInput = null;
    
    // فتح ماسح الباركود
    function openBarcodeScanner(inputId) {
        currentBarcodeInput = inputId;
        const modal = new bootstrap.Modal(document.getElementById('barcodeScannerModal'));
        modal.show();
    }
    
    // بدء المسح
    function startBarcodeScanner() {
        if (typeof Quagga === 'undefined') {
            Swal.fire('خطأ', 'مكتبة مسح الباركود غير متوفرة', 'error');
            return;
        }
        
        Quagga.init({
            inputStream: {
                name: "Live",
                type: "LiveStream",
                target: document.querySelector('#barcode-scanner-container'),
                constraints: {
                    width: 640,
                    height: 480,
                    facingMode: "environment"
                },
            },
            decoder: {
                readers: ["ean_reader", "ean_8_reader", "code_128_reader", "code_39_reader", "upc_reader"]
            },
            locate: true
        }, function(err) {
            if (err) {
                console.error(err);
                Swal.fire('خطأ', 'فشل تشغيل الكاميرا. تأكد من منح الصلاحيات', 'error');
                return;
            }
            Quagga.start();
            barcodeScannerActive = true;
            document.getElementById('barcode-status').textContent = 'المسح نشط...';
        });
        
        Quagga.onDetected(function(data) {
            const code = data.codeResult.code;
            if (code && code !== lastScannedBarcode) {
                lastScannedBarcode = code;
                document.getElementById('scanned-barcode').value = code;
                document.getElementById('barcode-status').textContent = `تم المسح: ${code}`;
                
                // اهتزاز خفيف
                if (navigator.vibrate) navigator.vibrate(200);
                
                // إطلاق حدث
                window.dispatchEvent(new CustomEvent('barcode-scanned', { 
                    detail: { barcode: code }
                }));
                
                // إيقاف المسح بعد 3 ثوان
                setTimeout(() => {
                    if (barcodeScannerActive) {
                        stopBarcodeScanner();
                    }
                }, 3000);
            }
        });
    }
    
    // إيقاف المسح
    function stopBarcodeScanner() {
        if (barcodeScannerActive) {
            Quagga.stop();
            barcodeScannerActive = false;
            document.getElementById('barcode-status').textContent = 'المسح متوقف';
        }
    }
    
    // استخدام الباركود الممسوح
    function useScannedBarcode() {
        if (lastScannedBarcode && currentBarcodeInput) {
            const input = document.getElementById(currentBarcodeInput);
            if (input) {
                input.value = lastScannedBarcode;
            }
        }
        
        // إغلاق النافذة
        bootstrap.Modal.getInstance(document.getElementById('barcodeScannerModal'))?.hide();
        stopBarcodeScanner();
    }
    
    // نسخ الباركود
    function copyScannedBarcode() {
        if (lastScannedBarcode) {
            navigator.clipboard.writeText(lastScannedBarcode);
            Swal.fire('تم', 'تم نسخ الباركود', 'success');
        }
    }
    
    // إيقاف المسح عند إغلاق النافذة
    document.getElementById('barcodeScannerModal')?.addEventListener('hidden.bs.modal', function() {
        stopBarcodeScanner();
    });
    
    // ================== دوال المنتج السريع ==================
    function saveQuickProduct() {
        const name = document.getElementById('quick-product-name').value;
        if (!name) {
            Swal.fire('تنبيه', 'اسم المنتج مطلوب', 'warning');
            return;
        }
        
        const product = {
            name: name,
            buyPrice: document.getElementById('quick-buy-price').value,
            sellPrice: document.getElementById('quick-sell-price').value,
            quantity: document.getElementById('quick-quantity').value,
            unit: document.getElementById('quick-unit').value,
            barcode: document.getElementById('quick-barcode').value
        };
        
        if (window.productModule) {
            productModule.addProduct(product);
            bootstrap.Modal.getInstance(document.getElementById('quickAddProductModal')).hide();
            document.getElementById('quick-product-form').reset();
        }
    }
    
    // ================== دوال الصورة ==================
    function showImage(src) {
        document.getElementById('modal-image').src = src;
        new bootstrap.Modal(document.getElementById('imageModal')).show();
    }
    
    // ================== دوال الحذف ==================
    let deleteCallback = null;
    
    function confirmDelete(message, callback) {
        document.getElementById('delete-message').textContent = message;
        deleteCallback = callback;
        new bootstrap.Modal(document.getElementById('confirmDeleteModal')).show();
    }
    
    document.getElementById('confirm-delete-btn')?.addEventListener('click', function() {
        if (deleteCallback) {
            deleteCallback();
            deleteCallback = null;
        }
        bootstrap.Modal.getInstance(document.getElementById('confirmDeleteModal')).hide();
    });
    
    // ================== دوال الإشعارات ==================
    function showNotificationModal(title, message, type = 'info') {
        const icon = document.getElementById('notification-icon');
        const titleEl = document.getElementById('notification-title');
        const messageEl = document.getElementById('notification-message');
        
        icon.textContent = type === 'success' ? 'check_circle' : 
                          type === 'error' ? 'error' : 
                          type === 'warning' ? 'warning' : 'info';
        icon.style.color = type === 'success' ? '#28a745' :
                          type === 'error' ? '#dc3545' :
                          type === 'warning' ? '#ffc107' : '#17a2b8';
        
        titleEl.textContent = title;
        messageEl.textContent = message;
        
        new bootstrap.Modal(document.getElementById('notificationModal')).show();
    }
    
    // ================== توليد باركود عشوائي ==================
    function generateRandomBarcode(prefix = '2') {
        return prefix + Math.floor(Math.random() * 1000000000).toString().padStart(9, '0');
    }
    
    function generateRandomBarcodeForProduct() {
        const barcode = generateRandomBarcode();
        document.getElementById('product-barcode').value = barcode;
    }
</script>

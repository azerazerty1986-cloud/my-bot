<!-- ================== قسم العملاء ================== -->
<div id="customer" class="section">
    <div class="main-card">
        <h5 class="text-center mb-4">👥 إدارة العملاء</h5>
        
        <div class="row g-2 mb-3">
            <div class="col-8">
                <input type="text" id="customer-name" class="form-control" placeholder="اسم العميل">
            </div>
            <div class="col-4">
                <input type="text" id="customer-phone" class="form-control" placeholder="رقم الهاتف">
            </div>
        </div>
        
        <div class="row g-2 mb-3">
            <div class="col-6">
                <input type="email" id="customer-email" class="form-control" placeholder="البريد الإلكتروني">
            </div>
            <div class="col-6">
                <input type="text" id="customer-address" class="form-control" placeholder="العنوان">
            </div>
        </div>
        
        <div class="row g-2 mb-3">
            <div class="col-12">
                <textarea id="customer-notes" class="form-control" rows="2" placeholder="ملاحظات"></textarea>
            </div>
        </div>
        
        <button class="btn btn-primary w-100 mb-4" onclick="customerModule.addCustomerFromForm()">
            <i class="material-icons-round">person_add</i> إضافة عميل
        </button>
        
        <div class="input-group mb-3">
            <span class="input-group-text"><i class="material-icons-round">search</i></span>
            <input type="text" id="customer-search" class="form-control" 
                   placeholder="بحث عن عميل..." 
                   oninput="customerModule.searchCustomers()">
        </div>
        
        <div class="table-responsive">
            <table class="table-custom">
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>الهاتف</th>
                        <th>البريد</th>
                        <th>المشتريات</th>
                        <th>ديون</th>
                        <th>عمليات</th>
                    </tr>
                </thead>
                <tbody id="customers-full-tbody">
                    <tr>
                        <td colspan="6" class="text-center p-4">
                            <i class="material-icons-round" style="font-size:48px;">people</i>
                            <br>لا يوجد عملاء
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

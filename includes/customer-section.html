<!-- ================== قسم العميل ================== -->
<div id="add-customer" class="sub-section" style="display: none;">
    <div class="main-card">
        <h6 class="text-center mb-4"><i class="material-icons-round text-primary">person_add</i> إضافة عميل جديد</h6>
        
        <div class="mb-3">
            <label class="form-label">اسم العميل <span class="text-danger">*</span></label>
            <input type="text" id="new-customer-name" class="form-control" placeholder="اسم العميل">
        </div>
        
        <div class="row">
            <div class="col-6">
                <div class="mb-3">
                    <label class="form-label">رقم الهاتف</label>
                    <input type="tel" id="new-customer-phone" class="form-control" placeholder="رقم الهاتف">
                </div>
            </div>
            <div class="col-6">
                <div class="mb-3">
                    <label class="form-label">رقم هاتف آخر</label>
                    <input type="tel" id="new-customer-phone2" class="form-control" placeholder="رقم آخر">
                </div>
            </div>
        </div>
        
        <div class="mb-3">
            <label class="form-label">البريد الإلكتروني</label>
            <input type="email" id="new-customer-email" class="form-control" placeholder="email@example.com">
        </div>
        
        <div class="row">
            <div class="col-4">
                <div class="mb-3">
                    <label class="form-label">المحافظة</label>
                    <input type="text" id="new-customer-governorate" class="form-control" placeholder="المحافظة">
                </div>
            </div>
            <div class="col-4">
                <div class="mb-3">
                    <label class="form-label">المدينة</label>
                    <input type="text" id="new-customer-city" class="form-control" placeholder="المدينة">
                </div>
            </div>
            <div class="col-4">
                <div class="mb-3">
                    <label class="form-label">الشارع</label>
                    <input type="text" id="new-customer-street" class="form-control" placeholder="الشارع">
                </div>
            </div>
        </div>
        
        <div class="mb-3">
            <label class="form-label">العنوان بالكامل</label>
            <textarea id="new-customer-address" class="form-control" rows="2" placeholder="العنوان بالتفصيل"></textarea>
        </div>
        
        <div class="row">
            <div class="col-6">
                <div class="mb-3">
                    <label class="form-label">الحد الأقصى للمديونية</label>
                    <div class="input-group">
                        <input type="number" id="new-customer-max-debt" class="form-control" value="0">
                        <span class="input-group-text">دج</span>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="mb-3">
                    <label class="form-label">أيام التنبيه</label>
                    <input type="number" id="new-customer-alert-days" class="form-control" value="0">
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-6">
                <div class="mb-3">
                    <label class="form-label">الرقم الضريبي</label>
                    <input type="text" id="new-customer-tax" class="form-control" placeholder="الرقم الضريبي">
                </div>
            </div>
            <div class="col-6">
                <div class="mb-3">
                    <label class="form-label">السجل التجاري</label>
                    <input type="text" id="new-customer-commercial" class="form-control" placeholder="السجل التجاري">
                </div>
            </div>
        </div>
        
        <div class="mb-3">
            <label class="form-label">ملاحظات</label>
            <textarea id="new-customer-notes" class="form-control" rows="3" placeholder="ملاحظات إضافية"></textarea>
        </div>
        
        <button class="btn btn-primary w-100 py-3" onclick="customerModule.saveNewCustomer()">
            <i class="material-icons-round">save</i> حفظ العميل
        </button>
    </div>
</div>

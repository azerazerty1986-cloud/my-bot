<!-- ================== قسم الإضافة ================== -->
<div id="add" class="section">
    <div class="nav-tabs-custom no-print">
        <div class="tab-item active-nardo" onclick="utils.showSubSection('add-product')">منتج</div>
        <div class="tab-item" onclick="utils.showSubSection('add-customer')">عميل</div>
        <div class="tab-item" onclick="utils.showSubSection('add-supplier')">مورد</div>
    </div>

    <!-- ===== إضافة منتج ===== -->
    <div id="add-product" class="sub-section">
        <div class="main-card">
            <h6 class="text-center mb-4"><i class="material-icons-round text-primary">inventory</i> إضافة منتج جديد</h6>
            
            <div class="mb-3">
                <label class="form-label">اسم المنتج <span class="text-danger">*</span></label>
                <input type="text" id="new-name" class="form-control" maxlength="60" placeholder="اسم المنتج">
                <small class="text-muted" id="name-counter">0/60</small>
            </div>
            
            <div class="mb-3">
                <label class="form-label">الصنف</label>
                <select id="new-category" class="form-select">
                    <option>عام</option>
                    <option>مواد غذائية</option>
                    <option>مشروبات</option>
                    <option>منظفات</option>
                    <option>الكترونيات</option>
                </select>
            </div>
            
            <div class="row g-2 mb-3">
                <div class="col-4">
                    <label class="form-label">سعر الشراء *</label>
                    <div class="input-group">
                        <input type="number" id="new-buy" class="form-control" step="0.01" placeholder="سعر الشراء">
                        <span class="input-group-text">دج</span>
                    </div>
                </div>
                <div class="col-4">
                    <label class="form-label">سعر البيع *</label>
                    <div class="input-group">
                        <input type="number" id="new-sell" class="form-control" step="0.01" placeholder="سعر البيع">
                        <span class="input-group-text">دج</span>
                    </div>
                </div>
                <div class="col-4">
                    <label class="form-label">سعر الجملة</label>
                    <div class="input-group">
                        <input type="number" id="new-wholesale" class="form-control" step="0.01" placeholder="سعر الجملة">
                        <span class="input-group-text">دج</span>
                    </div>
                </div>
            </div>
            
            <div class="row g-2 mb-3">
                <div class="col-4">
                    <label class="form-label">الكمية</label>
                    <input type="number" id="new-qty" class="form-control" value="0">
                </div>
                <div class="col-4">
                    <label class="form-label">الوحدة</label>
                    <select id="new-unit" class="form-select">
                        <option>قطعة</option>
                        <option>كغ</option>
                        <option>لتر</option>
                        <option>علبة</option>
                    </select>
                </div>
                <div class="col-4">
                    <label class="form-label">الحد الأدنى</label>
                    <input type="number" id="new-min-stock" class="form-control" value="5">
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">الباركود</label>
                <div class="input-group">
                    <input type="text" id="new-barcode" class="form-control" placeholder="باركود المنتج">
                    <button class="btn btn-outline-secondary" type="button" onclick="utils.openBarcodeScanner()">
                        <i class="material-icons-round">camera_alt</i>
                    </button>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">موقع التخزين</label>
                <input type="text" id="new-location" class="form-control" placeholder="رف - صف - مخزن">
            </div>
            
            <div class="mb-3">
                <label class="form-label">صورة المنتج</label>
                <input type="file" id="product-image" class="form-control" accept="image/*" onchange="utils.previewImage(event)">
                <div id="image-preview" class="mt-2" style="display:none;">
                    <img id="preview-img" src="#" alt="معاينة" style="max-width:150px;">
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">ملاحظات</label>
                <textarea id="new-notes" class="form-control" rows="2"></textarea>
            </div>
            
            <button class="btn btn-dark w-100 py-3" onclick="inventoryModule.saveNewProduct()">
                <i class="material-icons-round">save</i> حفظ المنتج
            </button>
        </div>
    </div>

    <!-- ===== إضافة عميل ===== -->
    <div id="add-customer" class="sub-section" style="display: none;">
        <div class="main-card">
            <h6 class="text-center mb-4"><i class="material-icons-round text-primary">person_add</i> إضافة عميل جديد</h6>
            
            <div class="mb-3">
                <label class="form-label">اسم العميل <span class="text-danger">*</span></label>
                <input type="text" id="new-customer-name" class="form-control" placeholder="اسم العميل">
            </div>
            
            <div class="row">
                <div class="col-6">
                    <div class="mb-3">
                        <label class="form-label">رقم الهاتف</label>
                        <input type="tel" id="new-customer-phone" class="form-control" placeholder="رقم الهاتف">
                    </div>
                </div>
                <div class="col-6">
                    <div class="mb-3">
                        <label class="form-label">رقم هاتف آخر</label>
                        <input type="tel" id="new-customer-phone2" class="form-control" placeholder="رقم آخر">
                    </div>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">البريد الإلكتروني</label>
                <input type="email" id="new-customer-email" class="form-control" placeholder="email@example.com">
            </div>
            
            <div class="row">
                <div class="col-4">
                    <div class="mb-3">
                        <label class="form-label">المحافظة</label>
                        <input type="text" id="new-customer-governorate" class="form-control" placeholder="المحافظة">
                    </div>
                </div>
                <div class="col-4">
                    <div class="mb-3">
                        <label class="form-label">المدينة</label>
                        <input type="text" id="new-customer-city" class="form-control" placeholder="المدينة">
                    </div>
                </div>
                <div class="col-4">
                    <div class="mb-3">
                        <label class="form-label">الشارع</label>
                        <input type="text" id="new-customer-street" class="form-control" placeholder="الشارع">
                    </div>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">العنوان بالكامل</label>
                <textarea id="new-customer-address" class="form-control" rows="2" placeholder="العنوان بالتفصيل"></textarea>
            </div>
            
            <div class="row">
                <div class="col-6">
                    <div class="mb-3">
                        <label class="form-label">الحد الأقصى للمديونية</label>
                        <div class="input-group">
                            <input type="number" id="new-customer-max-debt" class="form-control" value="0">
                            <span class="input-group-text">دج</span>
                        </div>
                    </div>
                </div>
                <div class="col-6">
                    <div class="mb-3">
                        <label class="form-label">أيام التنبيه</label>
                        <input type="number" id="new-customer-alert-days" class="form-control" value="0">
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-6">
                    <div class="mb-3">
                        <label class="form-label">الرقم الضريبي</label>
                        <input type="text" id="new-customer-tax" class="form-control" placeholder="الرقم الضريبي">
                    </div>
                </div>
                <div class="col-6">
                    <div class="mb-3">
                        <label class="form-label">السجل التجاري</label>
                        <input type="text" id="new-customer-commercial" class="form-control" placeholder="السجل التجاري">
                    </div>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">ملاحظات</label>
                <textarea id="new-customer-notes" class="form-control" rows="3" placeholder="ملاحظات إضافية"></textarea>
            </div>
            
            <button class="btn btn-primary w-100 py-3" onclick="customerModule.saveNewCustomer()">
                <i class="material-icons-round">save</i> حفظ العميل
            </button>
        </div>
    </div>

    <!-- ===== إضافة مورد ===== -->
    <div id="add-supplier" class="sub-section" style="display: none;">
        <div class="main-card">
            <h6 class="text-center mb-4"><i class="material-icons-round text-success">business</i> إضافة مورد جديد</h6>
            
            <div class="mb-3">
                <label class="form-label">اسم المورد <span class="text-danger">*</span></label>
                <input type="text" id="new-supplier-name" class

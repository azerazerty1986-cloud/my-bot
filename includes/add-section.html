<!-- ================== قسم الإضافة الشامل ================== -->
<div id="add" class="section">
    <div class="nav-tabs-custom no-print">
        <div class="tab-item active-nardo" onclick="showSubSection('add-product')">
            <i class="material-icons-round">inventory</i> منتج
        </div>
        <div class="tab-item" onclick="showSubSection('add-customer')">
            <i class="material-icons-round">person</i> عميل
        </div>
        <div class="tab-item" onclick="showSubSection('add-supplier')">
            <i class="material-icons-round">business</i> مورد
        </div>
    </div>

    <!-- ===== إضافة منتج ===== -->
    <div id="add-product" class="sub-section">
        <div class="main-card">
            <h6 class="text-center mb-4"><i class="material-icons-round text-primary">inventory</i> إضافة منتج جديد</h6>
            
            <div class="mb-3">
                <label class="form-label">اسم المنتج <span class="text-danger">*</span></label>
                <input type="text" id="new-product-name" class="form-control" maxlength="100" placeholder="أدخل اسم المنتج">
            </div>
            
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label">الصنف</label>
                    <select id="new-product-category" class="form-select">
                        <option value="عام">عام</option>
                        <option value="مواد غذائية">مواد غذائية</option>
                        <option value="مشروبات">مشروبات</option>
                        <option value="منظفات">منظفات</option>
                        <option value="الكترونيات">الكترونيات</option>
                        <option value="ملابس">ملابس</option>
                        <option value="أدوات منزلية">أدوات منزلية</option>
                    </select>
                </div>
                <div class="col-6">
                    <label class="form-label">الوحدة</label>
                    <select id="new-product-unit" class="form-select">
                        <option value="قطعة">قطعة</option>
                        <option value="كغ">كغ</option>
                        <option value="لتر">لتر</option>
                        <option value="علبة">علبة</option>
                        <option value="كرتونة">كرتونة</option>
                    </select>
                </div>
            </div>
            
            <div class="row g-2 mb-3">
                <div class="col-4">
                    <label class="form-label">سعر الشراء</label>
                    <input type="number" id="new-product-buy" class="form-control" step="0.01" placeholder="0.00">
                </div>
                <div class="col-4">
                    <label class="form-label">سعر البيع</label>
                    <input type="number" id="new-product-sell" class="form-control" step="0.01" placeholder="0.00">
                </div>
                <div class="col-4">
                    <label class="form-label">الكمية</label>
                    <input type="number" id="new-product-qty" class="form-control" value="0" min="0">
                </div>
            </div>
            
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label">الحد الأدنى</label>
                    <input type="number" id="new-product-min-stock" class="form-control" value="5" min="0">
                </div>
                <div class="col-6">
                    <label class="form-label">الباركود</label>
                    <input type="text" id="new-product-barcode" class="form-control" placeholder="اختياري">
                </div>
            </div>
            
            <button class="btn btn-dark w-100 py-3" onclick="productModule.addNewProduct()">
                <i class="material-icons-round">save</i> حفظ المنتج
            </button>
        </div>
    </div>

    <!-- ===== إضافة عميل ===== -->
    <div id="add-customer" class="sub-section" style="display: none;">
        <div class="main-card">
            <h6 class="text-center mb-4"><i class="material-icons-round text-primary">person_add</i> إضافة عميل جديد</h6>
            
            <div class="mb-3">
                <label class="form-label">اسم العميل <span class="text-danger">*</span></label>
                <input type="text" id="new-customer-name" class="form-control" maxlength="100" placeholder="الاسم الكامل">
            </div>
            
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label">رقم الهاتف</label>
                    <input type="tel" id="new-customer-phone" class="form-control" placeholder="05XX XXX XXX">
                </div>
                <div class="col-6">
                    <label class="form-label">البريد الإلكتروني</label>
                    <input type="email" id="new-customer-email" class="form-control" placeholder="email@example.com">
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">العنوان</label>
                <textarea id="new-customer-address" class="form-control" rows="2" placeholder="العنوان"></textarea>
            </div>
            
            <div class="mb-3">
                <label class="form-label">ملاحظات</label>
                <textarea id="new-customer-notes" class="form-control" rows="2" placeholder="ملاحظات"></textarea>
            </div>
            
            <button class="btn btn-primary w-100 py-3" onclick="customerModule.addNewCustomer()">
                <i class="material-icons-round">save</i> حفظ العميل
            </button>
        </div>
    </div>

    <!-- ===== إضافة مورد ===== -->
    <div id="add-supplier" class="sub-section" style="display: none;">
        <div class="main-card">
            <h6 class="text-center mb-4"><i class="material-icons-round text-success">business</i> إضافة مورد جديد</h6>
            
            <div class="mb-3">
                <label class="form-label">اسم المورد <span class="text-danger">*</span></label>
                <input type="text" id="new-supplier-name" class="form-control" maxlength="100" placeholder="اسم المورد">
            </div>
            
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label">رقم الهاتف</label>
                    <input type="tel" id="new-supplier-phone" class="form-control" placeholder="05XX XXX XXX">
                </div>
                <div class="col-6">
                    <label class="form-label">البريد الإلكتروني</label>
                    <input type="email" id="new-supplier-email" class="form-control" placeholder="email@company.com">
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">العنوان</label>
                <textarea id="new-supplier-address" class="form-control" rows="2" placeholder="العنوان"></textarea>
            </div>
            
            <div class="mb-3">
                <label class="form-label">ملاحظات</label>
                <textarea id="new-supplier-notes" class="form-control" rows="2" placeholder="ملاحظات"></textarea>
            </div>
            
            <button class="btn btn-success w-100 py-3" onclick="supplierModule.addNewSupplier()">
                <i class="material-icons-round">save</i> حفظ المورد
            </button>
        </div>
    </div>
</div>

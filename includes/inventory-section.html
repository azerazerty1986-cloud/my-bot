<!-- ================== قسم المخزن ================== -->
<div id="inventory" class="section">
    <div class="main-card">
        <h5 class="text-center mb-4"><i class="material-icons-round">inventory</i> المخزن الحالي</h5>
        
        <div class="row g-2 mb-3">
            <div class="col-8">
                <div class="input-group">
                    <span class="input-group-text"><i class="material-icons-round">search</i></span>
                    <input type="text" id="search-product" class="form-control" placeholder="ابحث عن منتج..." onkeyup="inventoryModule.searchProducts()">
                    <button class="btn btn-outline-secondary" type="button" onclick="document.getElementById('search-product').value=''; inventoryModule.searchProducts()">
                        <i class="material-icons-round">refresh</i>
                    </button>
                </div>
            </div>
            <div class="col-4">
                <select id="filter-category" class="form-select" onchange="inventoryModule.filterByCategory()">
                    <option value="all">كل الأصناف</option>
                    <option value="مواد غذائية">مواد غذائية</option>
                    <option value="مشروبات">مشروبات</option>
                    <option value="منظفات">منظفات</option>
                    <option value="الكترونيات">الكترونيات</option>
                </select>
            </div>
        </div>
        
        <div class="row g-2 mb-3">
            <div class="col-6">
                <button class="btn btn-outline-primary w-100" onclick="inventoryModule.showLowStock()">
                    <i class="material-icons-round">warning</i> المنتجات الناقصة
                </button>
            </div>
            <div class="col-6">
                <button class="btn btn-outline-success w-100" onclick="inventoryModule.exportToExcel()">
                    <i class="material-icons-round">download</i> تصدير Excel
                </button>
            </div>
        </div>
        
        <button class="btn btn-success w-100 mb-3" onclick="inventoryModule.uploadExcelWithMapping()">
            <i class="material-icons-round">upload_file</i> رفع ملف Excel
        </button>
        
        <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
            <table class="table-custom">
                <thead class="sticky-top bg-light">
                    <tr>
                        <th>الصورة</th>
                        <th>المنتج</th>
                        <th>الصنف</th>
                        <th>الكمية</th>
                        <th>سعر البيع</th>
                        <th>سعر الشراء</th>
                        <th>عمليات</th>
                    </tr>
                </thead>
                <tbody id="stock-tbody">
                    <tr>
                        <td colspan="7" class="text-center p-4 text-muted">
                            <i class="material-icons-round" style="font-size:48px;">inventory</i>
                            <p>لا توجد منتجات</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="row g-2 mt-3">
            <div class="col-4">
                <div class="card bg-light p-2 text-center">
                    <small>إجمالي المنتجات</small>
                    <strong id="total-products">0</strong>
                </div>
            </div>
            <div class="col-4">
                <div class="card bg-light p-2 text-center">
                    <small>قيمة المخزون</small>
                    <strong id="total-stock-value">0 دج</strong>
                </div>
            </div>
            <div class="col-4">
                <div class="card bg-light p-2 text-center">
                    <small>منتجات ناقصة</small>
                    <strong id="low-stock-count">0</strong>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ================== قسم المخزن ================== -->
<div id="inventory" class="section">
    <div class="main-card">
        <h5 class="text-center mb-4">📦 المخزن الحالي</h5>
        
        <div class="row g-2 mb-3">
            <div class="col-6">
                <button class="btn btn-success w-100" onclick="uploadExcel()">
                    <i class="material-icons-round">upload_file</i> رفع Excel
                </button>
            </div>
            <div class="col-6">
                <button class="btn btn-primary w-100" onclick="exportInventory()">
                    <i class="material-icons-round">download</i> تصدير Excel
                </button>
            </div>
        </div>
        
        <div class="input-group mb-3">
            <span class="input-group-text"><i class="material-icons-round">search</i></span>
            <input type="text" id="inventory-search" class="form-control" 
                   placeholder="بحث في المخزن..." 
                   oninput="productModule.searchProducts(this.value)">
        </div>
        
        <div class="table-responsive">
            <table class="table-custom">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>المنتج</th>
                        <th>الصنف</th>
                        <th>الكمية</th>
                        <th>الوحدة</th>
                        <th>سعر البيع</th>
                        <th>سعر الشراء</th>
                        <th>الحالة</th>
                        <th>تعديل</th>
                    </tr>
                </thead>
                <tbody id="inventory-tbody">
                    <tr>
                        <td colspan="9" class="text-center p-4">
                            <i class="material-icons-round" style="font-size:48px;">inventory</i>
                            <br>لا توجد منتجات
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <!-- إحصائيات سريعة -->
        <div class="row g-2 mt-3">
            <div class="col-3">
                <div class="summary-box" style="background: var(--primary-blue); padding: 10px;">
                    <div>إجمالي المنتجات</div>
                    <b id="total-products-count">0</b>
                </div>
            </div>
            <div class="col-3">
                <div class="summary-box" style="background: var(--main-green); padding: 10px;">
                    <div>إجمالي الكميات</div>
                    <b id="total-quantity">0</b>
                </div>
            </div>
            <div class="col-3">
                <div class="summary-box" style="background: var(--warning-yellow); padding: 10px;">
                    <div>قيمة المخزون</div>
                    <b id="total-stock-value">0</b>
                </div>
            </div>
            <div class="col-3">
                <div class="summary-box" style="background: var(--main-red); padding: 10px;">
                    <div>منتجات ناقصة</div>
                    <b id="low-stock-count">0</b>
                </div>
            </div>
        </div>
    </div>
</div>

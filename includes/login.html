<!-- ================== شاشة تسجيل الدخول ================== -->
<div id="login-screen" class="login-screen">
    <div class="login-container">
        <div class="login-icon">
            <i class="material-icons-round">lock</i>
        </div>
        <h1 class="login-title">تطبيق سوبر</h1>
        <p class="login-subtitle">الرجاء إدخال كلمة السر للدخول</p>
        <div class="password-field">
            <input type="password" id="password-input" class="password-input" placeholder="كلمة السر" maxlength="20" value="">
            <i class="material-icons-round toggle-password" onclick="togglePasswordVisibility()">visibility_off</i>
        </div>
        <button class="login-button" onclick="checkPassword()">
            <i class="material-icons-round">login</i> تسجيل الدخول
        </button>
        <div id="error-message" class="error-message" style="display: none;">
            <i class="material-icons-round">error</i> كلمة السر غير صحيحة
        </div>
        <div class="forgot-password" onclick="showResetPassword()">
            نسيت كلمة السر؟
        </div>
        <div class="login-version">الإصدار 1.0.0</div>
    </div>
</div>

<!-- ================== نافذة استعادة كلمة السر ================== -->
<div id="reset-password-screen" class="login-screen" style="display: none;">
    <div class="reset-password-container">
        <div class="reset-icon">
            <i class="material-icons-round">lock_reset</i>
        </div>
        <h2 class="reset-title">استعادة كلمة السر</h2>
        <p class="reset-subtitle">كلمة السر الافتراضية هي <strong>123456</strong></p>
        <p class="text-muted small mb-3">يمكنك تغييرها من ملف utils.js</p>
        <div class="d-flex gap-2">
            <button class="btn btn-primary flex-grow-1" onclick="useDefaultPassword()">
                <i class="material-icons-round">check</i> استخدام 123456
            </button>
            <button class="btn btn-secondary" onclick="backToLogin()">
                <i class="material-icons-round">arrow_back</i> رجوع
            </button>
        </div>
    </div>
</div>

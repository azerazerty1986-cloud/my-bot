
<!-- ================== مناطق الطباعة ================== -->
<div id="print-area" style="display: none;">
    <div class="text-center">
        <h5>فاتورة بيع</h5>
        <small id="print-date-time"></small><br>
        رقم: <b id="print-invoice-no"></b><br>
        العميل: <b id="print-customer"></b>
    </div>
    <table style="width:100%">
        <thead>
            <tr>
                <th>الصنف</th>
                <th>الكمية</th>
                <th>السعر</th>
                <th>الخصم</th>
                <th>الإجمالي</th>
            </tr>
        </thead>
        <tbody id="print-cart-items"></tbody>
    </table>
    <div>الخصم: <span id="print-total-discount"></span> | الإجمالي: <span id="print-grand-total"></span></div>
</div>

<div id="purchase-print-area" style="display: none;">
    <div class="text-center">
        <h5>فاتورة شراء</h5>
        <small id="purchase-print-date-time"></small><br>
        رقم: <b id="purchase-print-invoice-no"></b><br>
        المورد: <b id="print-supplier"></b>
    </div>
    <table style="width:100%">
        <thead>
            <tr>
                <th>الصنف</th>
                <th>الكمية</th>
                <th>السعر</th>
                <th>الإجمالي</th>
            </tr>
        </thead>
        <tbody id="purchase-print-cart-items"></tbody>
    </table>
    <div>الإجمالي: <span id="purchase-print-grand-total"></span></div>
</div>

<!-- ================== ملفات JavaScript الإضافية ================== -->

<!-- Chart.js للرسوم البيانية -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- إعدادات إضافية -->
<script>
    // إعدادات عامة
    const APP_CONFIG = {
        version: '2.0.0',
        companyName: 'سوبر ماركت',
        currency: 'دج',
        defaultPassword: '123456'
    };

    // التحقق من حالة تسجيل الدخول
    document.addEventListener('DOMContentLoaded', function() {
        if (!localStorage.getItem('isLoggedIn')) {
            // إظهار شاشة الدخول
            document.getElementById('login-screen').style.display = 'flex';
        }
    });

    // دوال تسجيل الدخول
    window.checkPassword = function() {
        const password = document.getElementById('password-input').value;
        if (password === APP_CONFIG.defaultPassword) {
            localStorage.setItem('isLoggedIn', 'true');
            document.getElementById('login-screen').style.display = 'none';
            Swal.fire('مرحباً بك', 'تم تسجيل الدخول بنجاح', 'success');
        } else {
            document.getElementById('error-message').style.display = 'flex';
        }
    };

    window.togglePasswordVisibility = function() {
        const input = document.getElementById('password-input');
        const icon = document.querySelector('.toggle-password');
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = 'visibility';
        } else {
            input.type = 'password';
            icon.textContent = 'visibility_off';
        }
    };

    window.showResetPassword = function() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('reset-password-screen').style.display = 'flex';
    };

    window.backToLogin = function() {
        document.getElementById('reset-password-screen').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
    };

    window.useDefaultPassword = function() {
        document.getElementById('password-input').value = APP_CONFIG.defaultPassword;
        backToLogin();
        Swal.fire('تم', 'تم تعيين كلمة السر الافتراضية', 'info');
    };

    // دوال إضافية
    window.saveQuickProduct = function() {
        const name = document.getElementById('quick-product-name').value;
        const sellPrice = document.getElementById('quick-sell-price').value;
        const buyPrice = document.getElementById('quick-buy-price').value;
        const qty = document.getElementById('quick-qty').value;
        
        if (name && sellPrice && buyPrice) {
            productModule.addProduct({
                name: name,
                sellPrice: parseFloat(sellPrice),
                buyPrice: parseFloat(buyPrice),
                quantity: parseInt(qty) || 0,
                unit: document.getElementById('quick-unit').value
            });
            $('#quickAddProductModal').modal('hide');
        }
    };

    // تهيئة Bootstrap modals
    document.querySelectorAll('[data-bs-toggle="modal"]').forEach(button => {
        button.addEventListener('click', function() {
            const target = this.getAttribute('data-bs-target');
            if (target) {
                const modal = new bootstrap.Modal(document.querySelector(target));
                modal.show();
            }
        });
    });
</script>

<!-- ================== قسم التقارير ================== -->
<div id="reports" class="section">
    <div class="main-card">
        <h5 class="text-center mb-4">📊 التقارير والإحصائيات</h5>
        
        <div class="report-tabs no-print d-flex gap-2 mb-3">
            <button class="btn btn-outline-primary flex-grow-1 active" onclick="showReportTab('report-summary')">
                <i class="material-icons-round">dashboard</i> ملخص
            </button>
            <button class="btn btn-outline-warning flex-grow-1" onclick="showReportTab('report-lowstock')">
                <i class="material-icons-round">warning</i> النواقص
            </button>
            <button class="btn btn-outline-success flex-grow-1" onclick="showReportTab('report-top')">
                <i class="material-icons-round">trending_up</i> الأكثر مبيعاً
            </button>
            <button class="btn btn-outline-info flex-grow-1" onclick="showReportTab('report-customers')">
                <i class="material-icons-round">people</i> أفضل العملاء
            </button>
        </div>

        <!-- ملخص -->
        <div id="report-summary" class="report-content">
            <div class="row g-2">
                <div class="col-6">
                    <div class="summary-box" style="background: var(--main-red);">
                        <div>إجمالي المبيعات</div>
                        <b id="total-sales">0</b> دج
                    </div>
                </div>
                <div class="col-6">
                    <div class="summary-box" style="background: var(--main-green);">
                        <div>إجمالي المشتريات</div>
                        <b id="total-purchases">0</b> دج
                    </div>
                </div>
            </div>
            
            <div class="row g-2 mt-2">
                <div class="col-6">
                    <div class="summary-box" style="background: var(--primary-blue);">
                        <div>عدد الفواتير</div>
                        <b id="total-invoices">0</b>
                    </div>
                </div>
                <div class="col-6">
                    <div class="summary-box" style="background: var(--warning-yellow);">
                        <div>عدد المنتجات</div>
                        <b id="total-products">0</b>
                    </div>
                </div>
            </div>
            
            <div class="row g-2 mt-2">
                <div class="col-6">
                    <div class="summary-box" style="background: var(--nardo-grey);">
                        <div>مبيعات اليوم</div>
                        <b id="today-sales">0</b> دج
                    </div>
                </div>
                <div class="col-6">
                    <div class="summary-box" style="background: var(--nardo-grey);">
                        <div>مبيعات الشهر</div>
                        <b id="month-sales">0</b> دج
                    </div>
                </div>
            </div>
        </div>
        
        <!-- المنتجات الناقصة -->
        <div id="report-lowstock" class="report-content" style="display: none;">
            <h6 class="mb-3">⚠️ المنتجات الناقصة (أقل من الحد الأدنى)</h6>
            <div id="low-stock-list" class="table-responsive">
                <p class="text-center text-muted">لا توجد منتجات ناقصة</p>
            </div>
        </div>
        
        <!-- الأكثر مبيعاً -->
        <div id="report-top" class="report-content" style="display: none;">
            <h6 class="mb-3">🔥 أفضل 10 منتجات مبيعاً</h6>
            <div id="top-products-list" class="table-responsive">
                <p class="text-center text-muted">لا توجد مبيعات كافية</p>
            </div>
        </div>
        
        <!-- أفضل العملاء -->
        <div id="report-customers" class="report-content" style="display: none;">
            <h6 class="mb-3">👑 أفضل العملاء</h6>
            <div id="top-customers-list" class="table-responsive">
                <p class="text-center text-muted">لا يوجد عملاء</p>
            </div>
        </div>
    </div>
</div>

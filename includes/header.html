<!-- ================== رأس التطبيق ================== -->
<div class="app-header no-print">
    <i class="material-icons-round" onclick="toggleSidebar()">menu</i>
    <span class="fw-bold">سوبر</span>
    <div style="display: flex; gap: 10px;">
        <i class="material-icons-round" onclick="exportBackup()" title="تحميل نسخة احتياطية">cloud_download</i>
        <i class="material-icons-round" onclick="document.getElementById('backup-file-input').click()" title="استيراد نسخة احتياطية">cloud_upload</i>
        <i class="material-icons-round" onclick="openUserMenu()" title="القائمة">account_circle</i>
    </div>
</div>

<!-- مخفي لاختيار ملف الاستيراد -->
<input type="file" id="backup-file-input" accept=".json" style="display: none;">

<!-- القائمة الجانبية -->
<div class="sidebar no-print" id="sidebar">
    <div class="sidebar-header">
        <h5>القائمة</h5>
        <i class="material-icons-round" onclick="toggleSidebar()">close</i>
    </div>
    <div class="sidebar-item" onclick="app.showSection('sales')">
        <i class="material-icons-round">payments</i> المبيعات
    </div>
    <div class="sidebar-item" onclick="app.showSection('purchases')">
        <i class="material-icons-round">shopping_cart</i> المشتريات
    </div>
    <div class="sidebar-item" onclick="app.showSection('inventory')">
        <i class="material-icons-round">inventory</i> المخزن
    </div>
    <div class="sidebar-item" onclick="app.showSection('reports')">
        <i class="material-icons-round">dashboard</i> التقارير
    </div>
    <div class="sidebar-item" onclick="app.showSection('invoices')">
        <i class="material-icons-round">receipt</i> الفواتير
    </div>
    <div class="sidebar-item" onclick="toggleSidebar()">
        <i class="material-icons-round">settings</i> الإعدادات
    </div>
    <div class="sidebar-item" onclick="logout()">
        <i class="material-icons-round">exit_to_app</i> تسجيل الخروج
    </div>
</div>

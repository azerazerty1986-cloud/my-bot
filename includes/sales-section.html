<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>نظام مبيعات – مدمج ومحسن مع بحث داخل الجدول</title>

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet"/>

  <style>
    body { font-family: 'Tajawal', system-ui, sans-serif; background: #f8f9fa; padding: 15px; }
    .card-header { font-weight: 600; }
    .table th { background: #e9ecef; text-align: center; padding: 8px; font-size: 0.9rem; }
    .table td { vertical-align: middle; text-align: center; padding: 6px; }
    .total-field { font-weight: bold; background: #e6fffa !important; color: #0c5460; }
    .search-results {
      position: absolute; z-index: 1050; background: white; border: 1px solid #ced4da;
      border-radius: 6px; max-height: 340px; overflow-y: auto; width: 100%;
      box-shadow: 0 6px 16px rgba(0,0,0,0.18);
    }
    .search-result-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
    .search-result-item:hover, .search-result-item.selected { background: #0d6efd; color: white; }
    .customer-chip {
      padding: 6px 14px; margin: 4px 6px 4px 0; border-radius: 30px; font-size: 0.9rem;
      cursor: pointer; transition: all 0.2s;
    }
    .customer-chip:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    .active { background: #198754 !important; color: white !important; }
  </style>
</head>
<body>

<div class="container-fluid">

  <!-- العملاء النشطون -->
  <div id="active-customers-area" class="mb-3 d-flex flex-wrap gap-2" style="display:none;"></div>

  <div class="card shadow">

    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
      <h5 class="mb-0"><i class="material-icons-round me-2">point_of_sale</i>سلة المبيعات</h5>
      <div>
        <span class="badge bg-light text-dark px-3 py-2 fs-6" id="cart-count">0</span>
        <button class="btn btn-sm btn-light ms-2" onclick="salesModule.clearCart()">
          <i class="material-icons-round">delete_sweep</i> تفريغ
        </button>
      </div>
    </div>

    <div class="card-body">

      <!-- اختيار طريقة الدفع + العميل -->
      <div class="row g-3 mb-4">
        <div class="col-lg-3">
          <label class="form-label fw-bold">طريقة الدفع</label>
          <select id="sale-payment-method" class="form-select">
            <option value="cash">نقدي</option>
            <option value="card">بطاقة</option>
            <option value="credit">آجل</option>
          </select>
        </div>

        <div class="col-lg-6">
          <label class="form-label fw-bold">العميل</label>
          <div class="input-group">
            <input type="text" id="customer-search" class="form-control" placeholder="ابحث بالاسم أو الهاتف..." oninput="salesModule.searchCustomers(this.value)">
            <button class="btn btn-outline-success" type="button" onclick="salesModule.openAddCustomerModal()">
              <i class="material-icons-round">person_add</i>
            </button>
          </div>
          <div id="customer-results" class="search-results mt-1" style="display:none;"></div>
        </div>

        <div class="col-lg-3 d-flex align-items-end">
          <div id="selected-customer-badge" class="badge bg-success w-100 p-2 d-none">
            <strong>العميل: </strong><span id="selected-customer-name"></span>
            <i class="material-icons-round float-end" style="cursor:pointer" onclick="salesModule.clearSelectedCustomer()">close</i>
          </div>
        </div>
      </div>

      <!-- الجدول الرئيسي -->
      <div class="table-responsive" style="max-height:520px; border:1px solid #dee2e6; border-radius:6px;">
        <table class="table table-bordered table-hover mb-0" id="cart-table">
          <thead class="table-light sticky-top">
            <tr>
              <th style="width:45px">#</th>
              <th>المنتج</th>
              <th style="width:110px">الكمية</th>
              <th style="width:110px">القطع</th>
              <th style="width:110px">الوحدة</th>
              <th style="width:110px">السعر</th>
              <th style="width:130px">الإجمالي</th>
              <th style="width:80px">المخزون</th>
              <th style="width:90px">خصم %</th>
              <th style="width:50px"></th>
            </tr>
          </thead>
          <tbody>
            <tr id="product-search-row" class="table-primary">
              <td colspan="10" class="p-2">
                <div class="input-group">
                  <span class="input-group-text"><i class="material-icons-round">search</i></span>
                  <input type="text" id="product-search-input" class="form-control" placeholder="ابحث عن منتج بالاسم أو الباركود..." oninput="salesModule.searchProducts(this.value)">
                  <button class="btn btn-success" type="button" onclick="salesModule.addFromSearchInput()">
                    <i class="material-icons-round">add</i> إضافة
                  </button>
                </div>
                <div id="product-search-results" class="search-results mt-1" style="display:none;"></div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- الملخص والدفع -->
      <div class="row g-3 mt-4">
        <div class="col-6 col-sm-3">
          <div class="p-3 bg-light rounded text-center border">
            <small class="d-block text-muted mb-1">الخصم</small>
            <strong id="total-discount" class="text-danger fs-5">0.00</strong>
          </div>
        </div>
        <div class="col-6 col-sm-3">
          <div class="p-3 bg-light rounded text-center border">
            <small class="d-block text-muted mb-1">القطع</small>
            <strong id="total-pieces" class="text-primary fs-5">0</strong>
          </div>
        </div>
        <div class="col-6 col-sm-3">
          <div class="p-3 bg-light rounded text-center border">
            <small class="d-block text-muted mb-1">المجموع</small>
            <strong id="grand-total" class="fs-5">0.00</strong>
          </div>
        </div>
        <div class="col-6 col-sm-3">
          <div class="p-3 bg-danger text-white rounded text-center border">
            <small class="d-block text-white-50 mb-1">النهائي</small>
            <strong id="final-grand-total" class="fs-5">0.00</strong>
          </div>
        </div>

        <div class="col-md-5 mt-3">
          <div class="input-group input-group-lg">
            <span class="input-group-text fw-bold">المدفوع</span>
            <input type="number" id="paid-amount" class="form-control text-center" value="0" min="0" step="0.01" oninput="salesModule.updateRemainingAmount()">
            <button class="btn btn-outline-secondary" type="button" onclick="salesModule.setPaidFull()">كامل</button>
          </div>
        </div>

        <div class="col-md-4 mt-3 d-flex align-items-center">
          <div class="w-100 p-3 bg-light rounded border text-center">
            المتبقي : <strong id="remaining-amount" class="fs-5 text-success">0.00 دج</strong>
          </div>
        </div>

        <div class="col-md-3 mt-3">
          <div class="d-grid gap-2">
            <button class="btn btn-success btn-lg" onclick="salesModule.finishSale()">
              <i class="material-icons-round me-2">save</i>حفظ
            </button>
            <button class="btn btn-primary btn-lg" onclick="salesModule.finishSaleAndPrint()">
              <i class="material-icons-round me-2">print</i>طباعة
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
// الكود الثاني – JavaScript
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📡 مركز التوزيع - Telegram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #fff;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 215, 0, 0.15);
        }
        h1 {
            color: #ffd700;
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
        }
        .section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .section-title {
            color: #a78bfa;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        label {
            display: block;
            color: #888;
            font-size: 12px;
            margin-bottom: 4px;
        }
        input,
        select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 13px;
            margin-bottom: 10px;
        }
        input:focus,
        select:focus {
            outline: none;
            border-color: #8b5cf6;
        }
        .btn {
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: #fff;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
        }
        .btn-success {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: #111;
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(74, 222, 128, 0.3);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }
        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .actions .btn {
            flex: 1;
            min-width: 80px;
            text-align: center;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .status-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 8px;
            font-size: 11px;
            color: #aaa;
            max-height: 150px;
            overflow-y: auto;
            font-family: monospace;
            line-height: 1.7;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .status-box .success {
            color: #4ade80;
        }
        .status-box .error {
            color: #f87171;
        }
        .status-box .info {
            color: #60a5fa;
        }
        .status-box .gold {
            color: #ffd700;
        }
        .file-preview {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            color: #aaa;
            margin-top: 8px;
            border: 1px dashed rgba(139, 92, 246, 0.25);
            text-align: center;
            display: none;
        }
        .file-preview.show {
            display: block;
        }
        .world-select {
            margin-bottom: 10px;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 13px;
            z-index: 1000;
            animation: fadeInUp 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 90%;
            text-align: center;
        }
        .toast.success {
            border-color: #4ade80;
            color: #4ade80;
        }
        .toast.error {
            border-color: #f87171;
            color: #f87171;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📡 مركز التوزيع</h1>

        <!-- إعدادات البوت -->
        <div class="section">
            <div class="section-title">⚙️ إعدادات البوت</div>
            <label>🤖 توكن البوت</label>
            <input type="text" id="bot-token" placeholder="123456789:ABCdefGHIjklMNOpqrSTUvwxyz">
            <label>💬 معرف القناة</label>
            <input type="text" id="chat-id" placeholder="-100123456789 أو @channel">
            <div class="actions">
                <button class="btn btn-primary" onclick="saveSettings()">💾 حفظ</button>
                <button class="btn btn-secondary" onclick="testConnection()">🧪 اختبار</button>
                <button class="btn btn-secondary" onclick="discoverChat()">🔍 اكتشاف</button>
            </div>
            <div id="settings-status" style="color:#888;font-size:11px;margin-top:8px;text-align:center;"></div>
        </div>

        <!-- اختيار العالم والمربع -->
        <div class="section">
            <div class="section-title">🌍 اختيار الوجهة</div>
            <label>🎯 العالم الهدف</label>
            <select id="target-world" class="world-select">
                <option value="">⏳ انتظر تحميل العوالم...</option>
            </select>
            <div class="grid-2">
                <div>
                    <label>📍 الصف (Row)</label>
                    <input type="number" id="target-row" value="3" min="0" max="11">
                </div>
                <div>
                    <label>📍 العمود (Col)</label>
                    <input type="number" id="target-col" value="5" min="0" max="11">
                </div>
            </div>
            <label>🏷️ عنوان المربع</label>
            <input type="text" id="file-title" placeholder="مثال: فيديو تعليمي">
            <div class="grid-2">
                <div>
                    <label>📂 نوع المحتوى</label>
                    <select id="file-type">
                        <option value="image">🖼️ صورة</option>
                        <option value="video" selected>🎬 فيديو</option>
                        <option value="pdf">📄 PDF</option>
                        <option value="audio">🎵 صوت</option>
                        <option value="html">🌐 HTML</option>
                        <option value="text">📝 نص</option>
                    </select>
                </div>
                <div>
                    <label>📁 اختيار ملف</label>
                    <input type="file" id="file-upload" onchange="handleFile(event)">
                </div>
            </div>
            <div class="file-preview" id="file-preview">
                ⏳ لم يتم اختيار ملف
            </div>
            <div class="actions" style="margin-top:12px;">
                <button class="btn btn-success" onclick="publishFile()">📤 إرسال إلى القناة</button>
                <button class="btn btn-secondary" onclick="clearForm()">🗑️ مسح</button>
                <button class="btn btn-secondary" onclick="fetchWorlds()">🔄 تحديث العوالم</button>
            </div>
        </div>

        <!-- سجل العمليات -->
        <div class="section">
            <div class="section-title">📊 سجل العمليات</div>
            <div class="status-box" id="status-box">
                <div class="info">• مركز التوزيع جاهز. أدخل إعدادات البوت للبدء.</div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  📡 مركز التوزيع - نسخة مبسطة
        // ============================================================

        const EMOJIS = {
            image: '🖼️',
            video: '🎬',
            pdf: '📄',
            audio: '🎵',
            text: '📝',
            html: '🌐'
        };

        let config = { botToken: '', chatId: '' };
        let worldsList = [];
        let pendingFileBase64 = null;
        let pendingFileName = null;

        // ─── تحميل الإعدادات المحفوظة ───
        function loadSettings() {
            const token = localStorage.getItem('telegram_bot_token');
            const chat = localStorage.getItem('telegram_chat_id');
            if (token) document.getElementById('bot-token').value = token;
            if (chat) document.getElementById('chat-id').value = chat;
            if (token && chat) {
                config.botToken = token;
                config.chatId = chat;
                addStatus('✅ تم تحميل الإعدادات', 'success');
                fetchWorlds();
            }
        }

        // ─── حفظ الإعدادات ───
        function saveSettings() {
            const token = document.getElementById('bot-token').value.trim();
            const chat = document.getElementById('chat-id').value.trim();

            if (!token || !chat) {
                showToast('⚠️ أدخل التوكن ومعرف القناة', 'error');
                return;
            }

            config.botToken = token;
            config.chatId = chat;
            localStorage.setItem('telegram_bot_token', token);
            localStorage.setItem('telegram_chat_id', chat);

            document.getElementById('settings-status').textContent = '✅ تم الحفظ';
            document.getElementById('settings-status').style.color = '#4ade80';
            showToast('💾 تم حفظ الإعدادات', 'success');
            addStatus('✅ إعدادات محفوظة', 'success');
            fetchWorlds();
        }

        // ─── عرض رسالة ───
        function showToast(msg, type) {
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const div = document.createElement('div');
            div.className = 'toast ' + (type || '');
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        // ─── سجل ───
        function addStatus(msg, type) {
            const box = document.getElementById('status-box');
            const d = document.createElement('div');
            d.className = type || 'info';
            d.textContent = '• ' + msg;
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
            while (box.children.length > 50) box.removeChild(box.firstChild);
        }

        // ─── اختبار الاتصال ───
        async function testConnection() {
            const token = document.getElementById('bot-token').value.trim();
            if (!token) { showToast('⚠️ أدخل التوكن أولاً', 'error'); return; }

            addStatus('⏳ جاري الاختبار...', 'info');
            try {
                const res = await fetch('https://api.telegram.org/bot' + token + '/getMe');
                const data = await res.json();
                if (data.ok) {
                    addStatus('✅ البوت شغّال: @' + data.result.username, 'success');
                    showToast('✅ البوت يعمل!', 'success');
                } else {
                    addStatus('❌ ' + data.description, 'error');
                }
            } catch (e) {
                addStatus('❌ فشل الاتصال: ' + e.message, 'error');
            }
        }

        // ─── اكتشاف Chat ID ───
        async function discoverChat() {
            const token = document.getElementById('bot-token').value.trim();
            if (!token) { showToast('⚠️ أدخل التوكن أولاً', 'error'); return; }

            addStatus('⏳ جاري البحث عن القنوات...', 'info');
            try {
                const res = await fetch('https://api.telegram.org/bot' + token + '/getUpdates?limit=100');
                const data = await res.json();
                if (!data.ok) { addStatus('❌ ' + data.description, 'error'); return; }

                const channels = {};
                data.result.forEach(function(upd) {
                    const msg = upd.channel_post || upd.message;
                    if (!msg || !msg.chat) return;
                    const chat = msg.chat;
                    if (chat.type === 'channel' || chat.type === 'group' || chat.type === 'supergroup') {
                        channels[chat.id] = {
                            id: chat.id,
                            title: chat.title || 'بدون اسم',
                            username: chat.username || null
                        };
                    }
                });

                const keys = Object.keys(channels);
                if (keys.length === 0) {
                    addStatus('⚠️ لم يُعثر على قنوات. تأكد من أن البوت مسؤول.', 'warn');
                    return;
                }

                const first = channels[keys[0]];
                document.getElementById('chat-id').value = first.id;
                addStatus('✅ تم اكتشاف: ' + first.title + ' (' + first.id + ')', 'success');
                showToast('🔍 تم اكتشاف Chat ID', 'success');
            } catch (e) {
                addStatus('❌ خطأ: ' + e.message, 'error');
            }
        }

        // ─── جلب العوالم من القناة ───
        async function fetchWorlds() {
            if (!config.botToken || !config.chatId) {
                showToast('⚠️ أكمل الإعدادات أولاً', 'error');
                return;
            }

            addStatus('⏳ جاري جلب العوالم...', 'info');

            try {
                const url = 'https://api.telegram.org/bot' + config.botToken +
                    '/getUpdates?limit=50';
                const res = await fetch(url);
                const data = await res.json();

                if (!data.ok) {
                    addStatus('❌ ' + data.description, 'error');
                    return;
                }

                let found = false;
                for (const upd of data.result) {
                    const msg = upd.channel_post || upd.message;
                    if (!msg || !msg.text) continue;

                    if (msg.text.includes('SPHERICAL|WORLDS|')) {
                        try {
                            const json = msg.text.split('SPHERICAL|WORLDS|')[1];
                            const payload = JSON.parse(json);
                            if (payload.worlds && payload.worlds.length > 0) {
                                worldsList = payload.worlds;
                                updateWorldSelect();
                                found = true;
                                addStatus('✅ تم جلب ' + worldsList.length + ' عالم', 'success');
                                showToast('✅ تم جلب ' + worldsList.length + ' عالم', 'success');
                            }
                        } catch (e) {}
                    }
                }

                if (!found) {
                    addStatus('⚠️ لا توجد بيانات عوالم. انتظر 30 ثانية ثم حاول.', 'warn');
                }
            } catch (e) {
                addStatus('❌ خطأ: ' + e.message, 'error');
            }
        }

        // ─── تحديث قائمة العوالم ───
        function updateWorldSelect() {
            const select = document.getElementById('target-world');
            const current = select.value;
            select.innerHTML = '<option value="">🎯 اختر عالماً...</option>';
            worldsList.forEach(function(w) {
                const opt = document.createElement('option');
                opt.value = w.id;
                opt.textContent = (w.name || w.id);
                if (w.id === current) opt.selected = true;
                select.appendChild(opt);
            });
        }

        // ─── رفع ملف ───
        function handleFile(e) {
            const f = e.target.files[0];
            if (!f) return;

            pendingFileName = f.name;
            const preview = document.getElementById('file-preview');
            preview.classList.add('show');
            preview.textContent = '⏳ جاري قراءة ' + f.name + '...';

            // تخمين النوع
            const ext = f.name.split('.').pop().toLowerCase();
            const map = {
                jpg: 'image',
                jpeg: 'image',
                png: 'image',
                gif: 'image',
                webp: 'image',
                svg: 'image',
                mp4: 'video',
                webm: 'video',
                mov: 'video',
                avi: 'video',
                mp3: 'audio',
                wav: 'audio',
                ogg: 'audio',
                pdf: 'pdf',
                txt: 'text',
                md: 'text',
                html: 'html',
                htm: 'html'
            };
            if (map[ext]) document.getElementById('file-type').value = map[ext];

            const reader = new FileReader();
            reader.onload = function(ev) {
                pendingFileBase64 = ev.target.result;
                const sizeKB = (pendingFileBase64.length / 1024).toFixed(1);
                preview.innerHTML = '✅ <b>' + f.name + '</b><br>الحجم: ' + sizeKB + ' KB (base64)<br>جاهز للإرسال';
                preview.style.color = '#4ade80';
                addStatus('📁 ملف جاهز: ' + f.name + ' (' + sizeKB + ' KB)', 'info');
            };
            reader.onerror = function() {
                preview.textContent = '❌ فشل قراءة الملف';
                preview.style.color = '#f87171';
                pendingFileBase64 = null;
            };
            reader.readAsDataURL(f);
        }

        // ─── إرسال الملف إلى القناة ───
        async function publishFile() {
            const worldId = document.getElementById('target-world').value;
            const row = parseInt(document.getElementById('target-row').value);
            const col = parseInt(document.getElementById('target-col').value);
            const title = document.getElementById('file-title').value.trim();
            const type = document.getElementById('file-type').value;

            if (!worldId) { showToast('❌ اختر عالماً', 'error'); return; }
            if (isNaN(row) || isNaN(col) || row < 0 || row > 11 || col < 0 || col > 11) {
                showToast('❌ الإحداثيات بين 0 و 11', 'error');
                return;
            }
            if (!title) { showToast('❌ أدخل عنواناً', 'error'); return; }
            if (!pendingFileBase64) { showToast('⚠️ اختر ملفاً أولاً', 'warn'); return; }
            if (!config.botToken || !config.chatId) { showToast('❌ أكمل إعدادات البوت', 'error'); return; }

            // ✅ البيانات الوصفية
            const metadata = {
                action: 'add_file',
                worldId: worldId,
                row: row,
                col: col,
                title: title,
                fileType: type,
                emoji: EMOJIS[type] || '📦'
            };

            addStatus('⏳ جاري الإرسال إلى Telegram...', 'info');

            try {
                // تحويل Base64 إلى Blob
                const response = await fetch(pendingFileBase64);
                const blob = await response.blob();

                // إنشاء FormData للإرسال
                const formData = new FormData();
                formData.append('chat_id', config.chatId);
                formData.append('document', blob, pendingFileName);
                formData.append('caption', '📡 SPHERICAL|CMD|' + JSON.stringify(metadata));
                formData.append('disable_notification', 'true');

                // ✅ إرسال باستخدام sendDocument
                const res = await fetch('https://api.telegram.org/bot' + config.botToken + '/sendDocument', {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();

                if (data.ok) {
                    const fileSize = (blob.size / 1024).toFixed(1);
                    showToast('✅ تم رفع الملف! (' + fileSize + ' KB)', 'success');
                    addStatus('✅ تم رفع: ' + pendingFileName + ' (' + fileSize + ' KB)', 'success');
                    addStatus('📍 الموقع: ' + worldId + ' [' + row + ',' + col + ']', 'gold');

                    // ✅ إرسال البيانات مع file_id للمزامنة
                    if (data.result && data.result.document) {
                        const doc = data.result.document;
                        const fileCmd = {
                            action: 'add_file',
                            worldId: worldId,
                            row: row,
                            col: col,
                            title: title,
                            fileType: type,
                            emoji: EMOJIS[type] || '📦',
                            file_id: doc.file_id,
                            file_unique_id: doc.file_unique_id,
                            filename: pendingFileName,
                            mime_type: doc.mime_type || 'video/mp4',
                            file_size: doc.file_size || blob.size
                        };

                        // ✅ إرسال رسالة ثانية تحتوي على file_id
                        await fetch('https://api.telegram.org/bot' + config.botToken + '/sendMessage', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                chat_id: config.chatId,
                                text: '📡 SPHERICAL|CMD|' + JSON.stringify(fileCmd),
                                disable_notification: true
                            })
                        });

                        addStatus('📤 تم إرسال file_id للمزامنة', 'info');
                    }

                    clearForm();
                } else {
                    showToast('❌ فشل: ' + data.description, 'error');
                    addStatus('❌ فشل الإرسال: ' + data.description, 'error');
                }
            } catch (e) {
                showToast('❌ خطأ في الاتصال', 'error');
                addStatus('❌ خطأ: ' + e.message, 'error');
            }
        }

        // ─── مسح النموذج ───
        function clearForm() {
            document.getElementById('file-upload').value = '';
            document.getElementById('file-title').value = '';
            document.getElementById('target-row').value = '3';
            document.getElementById('target-col').value = '5';
            document.getElementById('file-type').value = 'video';
            document.getElementById('file-preview').classList.remove('show');
            pendingFileBase64 = null;
            pendingFileName = null;
            showToast('🗑️ تم مسح النموذج', 'info');
        }

        // ─── التهيئة ───
        loadSettings();

        // جلب العوالم كل 30 ثانية
        setInterval(fetchWorlds, 30000);

        console.log('📡 مركز التوزيع جاهز!');
        console.log('💡 استخدم الزر "📤 إرسال إلى القناة" لنشر الملفات');
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📡 مركز التوزيع - النهائي</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#0a0a1a;color:#fff;padding:16px;direction:rtl}
.container{max-width:520px;margin:0 auto;background:rgba(255,255,255,0.05);border-radius:16px;padding:20px;border:1px solid rgba(255,215,0,0.15)}
h1{color:#ffd700;text-align:center;font-size:20px;margin-bottom:16px}
.section{background:rgba(0,0,0,0.3);border-radius:12px;padding:14px;margin-bottom:14px;border:1px solid rgba(255,255,255,0.06)}
.section-title{color:#a78bfa;font-size:13px;font-weight:700;margin-bottom:10px}
label{display:block;color:#888;font-size:11px;margin-bottom:4px}
input,select{width:100%;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:#fff;font-size:13px;margin-bottom:8px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:#8b5cf6}
.btn{padding:10px 16px;border-radius:10px;border:none;font-weight:700;font-size:12px;cursor:pointer;transition:all .3s;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(139,92,246,0.3)}
.btn-success{background:linear-gradient(135deg,#4ade80,#22c55e);color:#111}
.btn-success:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(74,222,128,0.3)}
.btn-secondary{background:rgba(255,255,255,0.06);color:#aaa;border:1px solid rgba(255,255,255,0.08)}
.btn-secondary:hover{background:rgba(255,255,255,0.12);color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:70px;text-align:center}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status-box{background:rgba(0,0,0,0.4);border-radius:8px;padding:8px;font-size:11px;color:#aaa;max-height:180px;overflow-y:auto;font-family:monospace;line-height:1.7;border:1px solid rgba(255,255,255,0.04)}
.status-box .success{color:#4ade80}
.status-box .error{color:#f87171}
.status-box .info{color:#60a5fa}
.status-box .gold{color:#ffd700}
.file-preview{background:rgba(0,0,0,0.3);border-radius:8px;padding:10px;font-size:12px;color:#aaa;margin-top:8px;border:1px dashed rgba(139,92,246,0.25);text-align:center;display:none}
.file-preview.show{display:block}
.icon-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.icon-btn{padding:8px;border-radius:8px;border:2px solid transparent;background:rgba(255,255,255,0.04);cursor:pointer;font-size:20px;transition:all .2s}
.icon-btn:hover{transform:scale(1.1);background:rgba(139,92,246,0.15)}
.icon-btn.active{border-color:#ffd700;background:rgba(255,215,0,0.15)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#fff;padding:10px 20px;border-radius:12px;font-size:13px;z-index:1000;animation:fadeInUp .3s ease;border:1px solid rgba(255,255,255,0.1);max-width:90%;text-align:center}
.toast.success{border-color:#4ade80;color:#4ade80}
.toast.error{border-color:#f87171;color:#f87171}
@keyframes fadeInUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.auto-sync-badge{display:inline-block;background:rgba(74,222,128,0.15);color:#4ade80;padding:2px 8px;border-radius:10px;font-size:10px;margin-right:6px}
</style>
</head>
<body>

<div class="container">
  <h1>📡 مركز التوزيع <span class="auto-sync-badge">🔄 تلقائي</span></h1>

  <div class="section">
    <div class="section-title">⚙️ إعدادات البوت</div>
    <label>🤖 توكن البوت</label>
    <input type="text" id="bot-token" placeholder="123456789:ABC...">
    <label>💬 معرف القناة</label>
    <input type="text" id="chat-id" placeholder="-100123456789 أو @channel">
    <div class="actions">
      <button class="btn btn-primary" onclick="saveSettings()">💾 حفظ</button>
      <button class="btn btn-secondary" onclick="testConnection()">🧪 اختبار</button>
      <button class="btn btn-secondary" onclick="discoverChat()">🔍 اكتشاف</button>
    </div>
    <div id="settings-status" style="color:#888;font-size:11px;margin-top:8px;text-align:center;"></div>
  </div>

  <div class="section">
    <div class="section-title">🎯 اختيار الوجهة</div>
    <label>🌍 العالم الهدف</label>
    <select id="target-world" class="world-select"></select>
    <label>🎨 اختيار الأيقونة (للعوالم الجديدة)</label>
    <div class="icon-grid" id="icon-grid"></div>
    <input type="hidden" id="selected-icon-index" value="">
    <div class="grid-2">
      <div><label>📍 الصف (0-11)</label><input type="number" id="target-row" value="3" min="0" max="11"></div>
      <div><label>📍 العمود (0-11)</label><input type="number" id="target-col" value="5" min="0" max="11"></div>
    </div>
    <label>🏷️ عنوان المربع</label>
    <input type="text" id="file-title" placeholder="مثال: فيديو تعليمي">
    <div class="grid-2">
      <div>
        <label>📂 نوع المحتوى</label>
        <select id="file-type">
          <option value="image">🖼️ صورة</option>
          <option value="video" selected>🎬 فيديو</option>
          <option value="pdf">📄 PDF</option>
          <option value="audio">🎵 صوت</option>
          <option value="html">🌐 HTML</option>
          <option value="text">📝 نص</option>
        </select>
      </div>
      <div>
        <label>📁 اختيار ملف</label>
        <input type="file" id="file-upload" onchange="handleFile(event)">
      </div>
    </div>
    <div class="file-preview" id="file-preview">⏳ لم يتم اختيار ملف</div>
    <div class="actions" style="margin-top:12px;">
      <button class="btn btn-success" onclick="publishFile()">📤 إرسال إلى القناة</button>
      <button class="btn btn-secondary" onclick="clearForm()">🗑️ مسح</button>
      <button class="btn btn-secondary" onclick="fetchWorldsFromChannel()">🔄 تحديث الآن</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">📊 سجل العمليات <span id="sync-status" style="color:#666;font-size:10px;"></span></div>
    <div class="status-box" id="status-box">
      <div class="info">• مركز التوزيع جاهز. أدخل إعدادات البوت للبدء.</div>
    </div>
  </div>
</div>

<script>
// ============================================================
//  📡 مركز التوزيع - النسخة النهائية v81
// ============================================================

const EMOJIS = { image:'🖼️', video:'🎬', pdf:'📄', audio:'🎵', text:'📝', html:'🌐' };

const WORLD_ICONS = [
  { name:'⚔️ القتال', emoji:'⚔️', color:'#ef4444' },
  { name:'🌐 360', emoji:'🌐', color:'#00f2ff' },
  { name:'🖼️ المعرض', emoji:'🖼️', color:'#a78bfa' },
  { name:'🌲 الغابة', emoji:'🌲', color:'#4ade80' },
  { name:'🏰 القلعة', emoji:'🏰', color:'#fbbf24' },
  { name:'🌊 المحيط', emoji:'🌊', color:'#60a5fa' },
  { name:'🔥 النار', emoji:'🔥', color:'#f97316' },
  { name:'❄️ الجليد', emoji:'❄️', color:'#22d3ee' },
  { name:'🌈 قوس قزح', emoji:'🌈', color:'#f472b6' },
  { name:'⭐ النجوم', emoji:'⭐', color:'#ffd700' },
  { name:'🌙 القمر', emoji:'🌙', color:'#c084fc' },
  { name:'☀️ الشمس', emoji:'☀️', color:'#facc15' },
  { name:'🌺 الزهور', emoji:'🌺', color:'#fb7185' },
  { name:'🍄 الفطر', emoji:'🍄', color:'#a3e635' },
  { name:'🦋 الفراشات', emoji:'🦋', color:'#38bdf8' },
  { name:'🐉 التنين', emoji:'🐉', color:'#ef4444' },
  { name:'🧙 السحر', emoji:'🧙', color:'#a855f7' },
  { name:'🏹 الصيد', emoji:'🏹', color:'#d97706' },
  { name:'⚡ البرق', emoji:'⚡', color:'#fde047' },
  { name:'💎 الماس', emoji:'💎', color:'#22d3ee' }
];

let config = { botToken:'', chatId:'' };
let pendingFile = null;
let pendingFileName = null;
let knownWorlds = [];
let lastUpdateId = parseInt(localStorage.getItem('hub_last_id') || '0');

// ─── تحميل الإعدادات ───
function loadSettings() {
  const token = localStorage.getItem('telegram_bot_token');
  const chat = localStorage.getItem('telegram_chat_id');
  if (token) document.getElementById('bot-token').value = token;
  if (chat) document.getElementById('chat-id').value = chat;
  if (token && chat) {
    config.botToken = token;
    config.chatId = chat;
    addStatus('✅ تم تحميل الإعدادات', 'success');
    fetchWorldsFromChannel();
  }
  renderIconGrid();
  initWorldSelect();
}

// ─── عرض شبكة الأيقونات ───
function renderIconGrid() {
  const grid = document.getElementById('icon-grid');
  grid.innerHTML = '';
  WORLD_ICONS.forEach(function(icon, index) {
    const btn = document.createElement('button');
    btn.className = 'icon-btn';
    btn.textContent = icon.emoji;
    btn.title = icon.name;
    btn.onclick = function() {
      document.querySelectorAll('.icon-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('selected-icon-index').value = index;
      const worldId = 'world_icon_' + index;
      addWorldOption(worldId, icon.emoji + ' ' + icon.name);
      document.getElementById('target-world').value = worldId;
      addStatus('🎨 تم اختيار: ' + icon.name + ' [' + worldId + ']', 'info');
    };
    grid.appendChild(btn);
  });
}

// ─── قائمة العوالم ───
function initWorldSelect() {
  const select = document.getElementById('target-world');
  select.innerHTML = '';
  const defaults = [
    {id:'main', name:'🌐 الخريطة الرئيسية'},
    {id:'world_fight', name:'⚔️ ساحة القتال'},
    {id:'world_360', name:'🌐 فيديو 360'},
    {id:'world_gallery', name:'🖼️ معرض الصور'},
    {id:'world_forest', name:'🌲 الغابة المظلمة'}
  ];
  defaults.forEach(function(w){ addWorldOption(w.id, w.name); });
}

function addWorldOption(id, name) {
  const select = document.getElementById('target-world');
  for (let i = 0; i < select.options.length; i++) {
    if (select.options[i].value === id) return;
  }
  const opt = document.createElement('option');
  opt.value = id;
  opt.textContent = name;
  select.appendChild(opt);
}

// ─── حفظ الإعدادات ───
function saveSettings() {
  const token = document.getElementById('bot-token').value.trim();
  const chat = document.getElementById('chat-id').value.trim();
  if (!token || !chat) { showToast('⚠️ أدخل التوكن ومعرف القناة', 'error'); return; }
  config.botToken = token;
  config.chatId = chat;
  localStorage.setItem('telegram_bot_token', token);
  localStorage.setItem('telegram_chat_id', chat);
  document.getElementById('settings-status').textContent = '✅ تم الحفظ';
  document.getElementById('settings-status').style.color = '#4ade80';
  showToast('💾 تم حفظ الإعدادات', 'success');
  addStatus('✅ إعدادات محفوظة', 'success');
  fetchWorldsFromChannel();
}

// ─── رسالة سريعة ───
function showToast(msg, type) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const div = document.createElement('div');
  div.className = 'toast ' + (type || '');
  div.textContent = msg;
  document.body.appendChild(div);
  setTimeout(function(){ div.remove(); }, 3000);
}

// ─── سجل ───
function addStatus(msg, type) {
  const box = document.getElementById('status-box');
  const d = document.createElement('div');
  d.className = type || 'info';
  d.textContent = '• ' + msg;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  while (box.children.length > 50) box.removeChild(box.firstChild);
}

// ─── اختبار الاتصال ───
async function testConnection() {
  const token = document.getElementById('bot-token').value.trim();
  if (!token) { showToast('⚠️ أدخل التوكن أولاً', 'error'); return; }
  addStatus('⏳ جاري الاختبار...', 'info');
  try {
    const res = await fetch('https://api.telegram.org/bot' + token + '/getMe');
    const data = await res.json();
    if (data.ok) {
      addStatus('✅ البوت شغّال: @' + data.result.username, 'success');
      showToast('✅ البوت يعمل!', 'success');
    } else {
      addStatus('❌ ' + data.description, 'error');
    }
  } catch (e) {
    addStatus('❌ فشل الاتصال: ' + e.message, 'error');
  }
}

// ─── اكتشاف Chat ID ───
async function discoverChat() {
  const token = document.getElementById('bot-token').value.trim();
  if (!token) { showToast('⚠️ أدخل التوكن أولاً', 'error'); return; }
  addStatus('⏳ جاري البحث عن القنوات...', 'info');
  try {
    const res = await fetch('https://api.telegram.org/bot' + token + '/getUpdates?limit=100');
    const data = await res.json();
    if (!data.ok) { addStatus('❌ ' + data.description, 'error'); return; }
    const channels = {};
    data.result.forEach(function(upd) {
      const msg = upd.channel_post || upd.message;
      if (!msg || !msg.chat) return;
      const chat = msg.chat;
      if (chat.type === 'channel' || chat.type === 'group' || chat.type === 'supergroup') {
        channels[chat.id] = { id: chat.id, title: chat.title || 'بدون اسم', username: chat.username || null };
      }
    });
    const keys = Object.keys(channels);
    if (keys.length === 0) {
      addStatus('⚠️ لم يُعثر على قنوات. تأكد من أن البوت مسؤول.', 'warn');
      return;
    }
    const first = channels[keys[0]];
    document.getElementById('chat-id').value = first.id;
    addStatus('✅ تم اكتشاف: ' + first.title + ' (' + first.id + ')', 'success');
    showToast('🔍 تم اكتشاف Chat ID', 'success');
  } catch (e) {
    addStatus('❌ خطأ: ' + e.message, 'error');
  }
}

// ─── رفع ملف ───
function handleFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  pendingFile = f;
  pendingFileName = f.name;
  const preview = document.getElementById('file-preview');
  preview.classList.add('show');
  preview.innerHTML = '✅ <b>' + f.name + '</b><br>الحجم: ' + (f.size / 1024).toFixed(1) + ' KB<br>جاهز للإرسال';
  preview.style.color = '#4ade80';
  addStatus('📁 ملف جاهز: ' + f.name, 'info');
  const ext = f.name.split('.').pop().toLowerCase();
  const map = { jpg:'image', jpeg:'image', png:'image', gif:'image', webp:'image', svg:'image', mp4:'video', webm:'video', mov:'video', avi:'video', mp3:'audio', wav:'audio', ogg:'audio', pdf:'pdf', txt:'text', md:'text', html:'html', htm:'html' };
  if (map[ext]) document.getElementById('file-type').value = map[ext];
}

// ─── إرسال الملف ───
async function publishFile() {
  const worldId = document.getElementById('target-world').value;
  const row = parseInt(document.getElementById('target-row').value);
  const col = parseInt(document.getElementById('target-col').value);
  const title = document.getElementById('file-title').value.trim();
  const type = document.getElementById('file-type').value;

  if (!worldId) { showToast('❌ اختر عالماً', 'error'); return; }
  if (isNaN(row) || isNaN(col) || row < 0 || row > 11 || col < 0 || col > 11) {
    showToast('❌ الإحداثيات بين 0 و 11', 'error'); return;
  }
  if (!title) { showToast('❌ أدخل عنواناً', 'error'); return; }
  if (!pendingFile) { showToast('⚠️ اختر ملفاً أولاً', 'warn'); return; }
  if (!config.botToken || !config.chatId) { showToast('❌ أكمل إعدادات البوت', 'error'); return; }

  addStatus('⏳ جاري الإرسال...', 'info');

  try {
    // ✅ الخطوة 1: sendDocument
    const formData = new FormData();
    formData.append('chat_id', config.chatId);
    formData.append('document', pendingFile, pendingFileName);
    formData.append('disable_notification', 'true');

    const res = await fetch('https://api.telegram.org/bot' + config.botToken + '/sendDocument', {
      method: 'POST', body: formData
    });
    const data = await res.json();

    if (!data.ok) {
      showToast('❌ فشل: ' + data.description, 'error');
      addStatus('❌ فشل الإرسال: ' + data.description, 'error');
      return;
    }

    const fileSize = (pendingFile.size / 1024).toFixed(1);
    showToast('✅ تم رفع الملف! (' + fileSize + ' KB)', 'success');
    addStatus('✅ تم رفع: ' + pendingFileName, 'success');

    // ✅ الخطوة 2: إرسال البيانات الوصفية + file_id
    if (data.result && data.result.document) {
      const doc = data.result.document;
      const fileCmd = {
        action: 'add_file',
        worldId: worldId,
        row: row,
        col: col,
        title: title,
        fileType: type,
        emoji: EMOJIS[type] || '📦',
        file_id: doc.file_id,
        file_unique_id: doc.file_unique_id,
        filename: pendingFileName,
        mime_type: doc.mime_type || pendingFile.type || 'application/octet-stream',
        file_size: doc.file_size || pendingFile.size
      };

      const msgRes = await fetch('https://api.telegram.org/bot' + config.botToken + '/sendMessage', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: config.chatId,
          text: '📡 SPHERICAL|CMD|' + JSON.stringify(fileCmd),
          disable_notification: true
        })
      });

      const msgData = await msgRes.json();
      if (msgData.ok) {
        addStatus('📤 تم إرسال file_id للمزامنة', 'success');
        addStatus('📍 الموقع: ' + worldId + ' [' + row + ',' + col + ']', 'gold');
      } else {
        addStatus('⚠️ فشل إرسال البيانات: ' + msgData.description, 'warn');
      }
    }
    clearForm();
  } catch (e) {
    showToast('❌ خطأ في الاتصال', 'error');
    addStatus('❌ خطأ: ' + e.message, 'error');
  }
}

// ─── مسح النموذج ───
function clearForm() {
  document.getElementById('file-upload').value = '';
  document.getElementById('file-title').value = '';
  document.getElementById('target-row').value = '3';
  document.getElementById('target-col').value = '5';
  document.getElementById('file-type').value = 'video';
  document.getElementById('file-preview').classList.remove('show');
  document.querySelectorAll('.icon-btn').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('selected-icon-index').value = '';
  pendingFile = null;
  pendingFileName = null;
  showToast('🗑️ تم المسح', 'info');
}

// ============================================================
//  🔄 التحديث الدوري - جلب العوالم من القناة
// ============================================================

async function fetchWorldsFromChannel() {
  if (!config.botToken || !config.chatId) return;
  document.getElementById('sync-status').textContent = '⏳ جاري المزامنة...';

  try {
    const res = await fetch('https://api.telegram.org/bot' + config.botToken + 
      '/getUpdates?offset=' + (lastUpdateId + 1) + '&limit=100');
    const data = await res.json();
    if (!data.ok) {
      document.getElementById('sync-status').textContent = '';
      return;
    }

    let newWorlds = 0;
    let newFiles = 0;

    data.result.forEach(function(upd) {
      if (upd.update_id > lastUpdateId) {
        lastUpdateId = upd.update_id;
        localStorage.setItem('hub_last_id', lastUpdateId);
      }

      const msg = upd.channel_post || upd.message;
      if (!msg || !msg.text) return;
      const text = msg.text;

      // ✅ جلب العوالم (SPHERICAL|WORLDS|)
      if (text.includes('SPHERICAL|WORLDS|')) {
        try {
          const json = text.split('SPHERICAL|WORLDS|')[1];
          const payload = JSON.parse(json);
          if (payload.worlds) {
            payload.worlds.forEach(function(w) {
              if (!w.worldId && w.id) w.worldId = w.id;
              if (w.worldId) {
                addWorldOption(w.worldId, (w.name || w.worldId));
                newWorlds++;
              }
            });
          }
        } catch(e) {}
      }

      // ✅ جلب الملفات (SPHERICAL|CMD|)
      if (text.includes('SPHERICAL|CMD|')) {
        try {
          const json = text.split('SPHERICAL|CMD|')[1];
          const cmd = JSON.parse(json);
          if (cmd.action === 'add_file' && cmd.worldId) {
            addWorldOption(cmd.worldId, cmd.worldId);
            newFiles++;
          }
        } catch(e) {}
      }
    });

    const status = [];
    if (newWorlds > 0) status.push('+' + newWorlds + ' عالم');
    if (newFiles > 0) status.push('+' + newFiles + ' ملف');
    document.getElementById('sync-status').textContent = status.length > 0 
      ? '✅ ' + status.join(' | ') + ' • ' + new Date().toLocaleTimeString('ar') 
      : '🔄 محدّث • ' + new Date().toLocaleTimeString('ar');

  } catch (e) {
    document.getElementById('sync-status').textContent = '';
  }
}
